     "TODAY'S CLASSES" measured 1.01:1, which is no contrast at all. On
     this ground things recede by being smaller and more spaced, not by
     being dimmer, so both step toward white and hierarchy moves into
     size and letterspacing. */
  --ink-2:rgba(255,255,255,.88);   /* supporting prose */
  --ink-3:rgba(255,255,255,.66);   /* labels, captions, things that recede */
  --rule:rgba(255,255,255,.18);
  --rule-soft:rgba(255,255,255,.09);

  /* the hero gradient, and the only colour in the system */
  --sage:#A0E0AB; --amber:#FFAC2E; --oxblood:#A52D25; --oxblood-lit:#E0655A;

  --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,system-ui,sans-serif;

  /* 11 -> 15 -> 48. Nothing between, so the jump always reads. */
  --t-label:11px; --t-body:15px; --t-lead:17px; --t-statement:48px;

  --pill:999px;
  --ease:cubic-bezier(.19,1,.22,1);
  /* These came off a marketing site, where a half-second press is part of
     the atmosphere because you look at the page rather than use it. This
     is an app opened for ten seconds between classes: at .5s a tap does
     not feel considered, it feels late. Feedback is immediate, arrivals
     still glide, and the curve never changes. */
  --t-quick:.19s; --t-mid:.34s; --t-long:.58s;

  --pad:20px;
  --gap:14px; --gap-block:28px; --gap-section:44px;
  --tabh:56px;
}
[data-theme="light"]{
  color-scheme:light;
  --bg:#fff; --ink:#000; --ink-2:#6d6d6d; --ink-3:#9a9a9a;
  --rule:rgba(0,0,0,.20); --rule-soft:rgba(0,0,0,.10);
  --oxblood-lit:#A52D25;
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{
  background:var(--bg);color:var(--ink);
  font-family:var(--font);font-size:var(--t-body);font-weight:400;line-height:1.5;
  -webkit-font-smoothing:antialiased;
  padding-bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px) + 40px);
  overflow-x:hidden;
}
button,input,select,textarea{font:inherit;color:inherit;background:none;border:none;outline:none}
button{cursor:pointer;text-align:left}
a{color:inherit;text-decoration:none}
/* Controls never offer the iOS copy bubble; real prose still selects. */
button,.item,.tap,.pill,#tabs,#tabs button,.eyebrow,.chip{
  -webkit-touch-callout:none;-webkit-user-select:none;user-select:none}

/* ── type roles ───────────────────────────────────────────────────────
   Four, and no more. Everything on screen is one of these.            */
.eyebrow{
  display:flex;align-items:center;gap:12px;
  font-size:var(--t-label);font-weight:400;letter-spacing:.16em;
  text-transform:uppercase;color:var(--ink-3);
}
.eyebrow::after{content:'';flex:1;height:1px;background:var(--rule-soft)}
.eyebrow.bare::after{display:none}
.statement{
  font-size:var(--t-statement);font-weight:300;letter-spacing:-.04em;
  line-height:.86;
}
/* No escape hatch: a statement is 48px or it is body text. A 34px
   step is exactly the dead zone the ramp exists to avoid. */
.body{font-size:var(--t-body);color:var(--ink-2);line-height:1.55}
.body b,.body strong{color:var(--ink);font-weight:400}
.cap{font-size:12px;color:var(--ink-3);line-height:1.5;letter-spacing:.01em}
.num{font-variant-numeric:tabular-nums;font-feature-settings:'tnum' 1}

/* ── the one interactive shape ────────────────────────────────────────
   Measured off the reference: transparent, hairline, full radius,
   21px by 44px of padding, label at 400.                              */
.pill{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:15px 30px;border:1px solid var(--rule);border-radius:var(--pill);
  font-size:13px;font-weight:400;letter-spacing:.02em;color:var(--ink);
  background:none;
  transition:border-color var(--t-quick) var(--ease),
             color var(--t-quick) var(--ease),opacity var(--t-quick) var(--ease);
}
.pill:active{opacity:.5}
.pill.wide{width:100%}
.pill.sm{padding:11px 22px;font-size:12px}
.pill[disabled]{color:var(--ink-3);border-color:var(--rule-soft)}

/* ── structure ────────────────────────────────────────────────────────
   A screen is a stack of blocks. A block is a label, some content, and
   space beneath it. Nothing is boxed.                                  */
.pad{padding-left:var(--pad);padding-right:var(--pad)}
.block{margin-bottom:var(--gap-section)}
.block>.eyebrow{margin-bottom:18px}
.rule{height:1px;background:var(--rule-soft);border:0}

/* a row: hairline above, nothing else */
.item{
  display:flex;align-items:baseline;gap:16px;width:100%;
  padding:18px 0;border-top:1px solid var(--rule-soft);
  transition:opacity var(--t-quick) var(--ease);
}
.item:first-of-type{border-top:0}
.item:active{opacity:.5}
.item .grow{flex:1;min-width:0}
.item .lead{font-size:var(--t-body);color:var(--ink);font-weight:400}
.item .sub{font-size:12px;color:var(--ink-3);margin-top:5px;line-height:1.5}
.item .val{font-size:var(--t-body);color:var(--ink-2);flex-shrink:0;text-align:right}
.item .time{
  font-size:12px;color:var(--ink-3);width:52px;flex-shrink:0;
  font-variant-numeric:tabular-nums;letter-spacing:.02em;
}
.item .chev{color:var(--ink-3);flex-shrink:0;font-size:15px}

/* the one statement figure a screen is allowed */
.figure{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.figure .n{font-size:var(--t-statement);font-weight:300;letter-spacing:-.05em;
  line-height:.86;font-variant-numeric:tabular-nums}
.figure .of{font-size:var(--t-body);color:var(--ink-3)}

/* verdict — the only colour, and only on a figure that reports state */
.v-ok{color:var(--sage)} .v-mid{color:var(--amber)} .v-no{color:var(--oxblood-lit)}

/* ── the margin: classes you can still miss, counted ─────────────────── */
.margin{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.margin i{width:7px;height:1px;background:currentColor;display:block;opacity:.9}
.margin i.spent{opacity:.25}
.margin .n{font-size:11px;color:var(--ink-3);margin-left:8px;letter-spacing:.04em}



/* ── shell ────────────────────────────────────────────────────────────
   The header is invisible until content passes behind it.              */
#top{
  position:fixed;top:0;left:0;right:0;z-index:60;
  height:calc(62px + env(safe-area-inset-top,0px));
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:16px;
  display:flex;align-items:center;justify-content:space-between;
  padding-left:var(--pad);padding-right:12px;
  background:transparent;border-bottom:1px solid transparent;
  transition:background var(--t-quick) var(--ease),border-color var(--t-quick) var(--ease);
}
/* A fade, never a fill. Filling this put a hard horizontal edge straight
   across the sphere the moment you scrolled, which is what stopped it
   reading as one continuous object. The reference never fills its header
   either — it stays invisible and lets content pass behind it. */
#top.solid{
  background:linear-gradient(180deg,rgba(0,0,0,.78) 0%,rgba(0,0,0,.44) 52%,
    rgba(0,0,0,0) 100%);
  border-bottom-color:transparent;
}
#brand{font-size:var(--t-label);letter-spacing:.24em;text-transform:uppercase;color:var(--ink-3)}
#topR{display:flex;align-items:center;gap:2px}
.iconbtn{width:40px;height:40px;display:flex;align-items:center;justify-content:center;
  color:var(--ink-2);transition:opacity var(--t-quick) var(--ease)}
.iconbtn:active{opacity:.5}
.iconbtn svg{width:20px;height:20px;display:block}

main{padding-top:calc(46px + env(safe-area-inset-top,0px))}
section{display:none}
section.on{display:block}

/* the screen title: the largest thing, always */
.head{padding:34px var(--pad) 0}
.head h1{font-size:var(--t-statement);font-weight:300;letter-spacing:-.04em;line-height:.9}
.head .when{margin-top:14px;font-size:var(--t-label);letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink-3)}
.head+.block,.head+*{margin-top:var(--gap-section)}

/* ── tab bar ──────────────────────────────────────────────────────────
   No fill, no pill, no icons doing decoration. Five words and a rule.  */
#tabs{
  /* The one sanctioned exception to "no containers", kept because you asked
     for it and because it earns its place here: floating over a live field,
     a pill that picks up what is behind it is the only chrome that can sit
     on this ground without cutting a hole in it. Radius is a full pill, so
     it still obeys the shape rule. */
  position:fixed;z-index:70;display:flex;align-items:center;
  left:max(12px,env(safe-area-inset-left,0px));
  right:max(12px,env(safe-area-inset-right,0px));
  bottom:calc(10px + env(safe-area-inset-bottom,0px));
  height:54px;padding:5px;gap:2px;
  border-radius:var(--pill);
  background:rgba(18,16,18,.52);
  -webkit-backdrop-filter:blur(14px) saturate(170%);
  backdrop-filter:blur(14px) saturate(170%);
  border:1px solid rgba(255,255,255,.14);
  /* Its own layer, and kept there: re-sampling a backdrop filter on the
     main thread during momentum scroll is what makes this stutter on iOS. */
  transform:translateZ(0);backface-visibility:hidden;
  transition:opacity var(--t-quick) var(--ease);
}
/* Settings rides in the menu markup for wide screens; the pill is a
   two-up thumb control and does not show it. */
#tabs button.wide{display:none}

@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  #tabs{background:rgba(14,12,14,.94)}
}
#tabs button{
  flex:1;height:100%;border-radius:var(--pill);min-width:0;
  display:flex;align-items:center;justify-content:center;
  font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;
  white-space:nowrap;overflow:hidden;
  color:var(--ink-3);font-weight:400;
  transition:color var(--t-quick) var(--ease),background var(--t-mid) var(--ease);
}
#tabs button.on{color:var(--ink);background:rgba(255,255,255,.10)}
@media(max-width:389px){ #tabs button{font-size:8.5px;letter-spacing:.02em} }

/* ── the iridescent field ─────────────────────────────────────────────
   The reference's one moving surface: sage dissolving through amber into
   oxblood. Four fields drift on prime-numbered loops so they never
   resynchronise; the blur is applied once to the container rather than
   per field, which is one composite layer instead of four.            */
#field{
  /* No filter here. A filter on a full-bleed element that is animating
     forces the whole screen through a filter pass every frame, and with a
     blurred pill sitting on top of it the browser re-samples that blur
     every frame too. Between them, that was the app feeling slow: not the
     work it was doing, but the work it was redoing sixty times a second.

     The gradients carry their own colour, the layers only ever translate,
     and nothing here needs repainting once it has been composited. */
  position:fixed;inset:0;z-index:0;
  overflow:hidden;pointer-events:none;opacity:1;
  transition:opacity var(--t-long) var(--ease);
}
/* The canvas IS the field when WebGL is available. It sits under
   everything, never scrolls (position:fixed on #field), and is the only
   thing painting the background. */
#glfield{
  position:absolute;inset:0;width:100%;height:100%;
  display:block;pointer-events:none;
}
/* Once the canvas has a frame, the gradient stand-ins come down. Both at
   once would be two backgrounds stacked, which is how the old field got
   so bright. */
html.glfield #field .lay{display:none}
html:not(.glfield) #glfield{display:none}

/* The dot that follows the pointer and arrives late. It is not attached
   to the cursor — the damping in the field loop puts it behind you, and
   it settles when you stop. Hidden entirely on a touch screen, where
   there is no pointer to trail. */
#dot{
  position:fixed;left:0;top:0;z-index:95;
  width:8px;height:8px;border-radius:var(--pill);
  background:var(--paper);
  pointer-events:none;opacity:0;
  transform:translate3d(-50px,-50px,0);
  transition:opacity var(--t-mid) var(--ease),
             width var(--t-quick) var(--ease),
             height var(--t-quick) var(--ease);
}
/* Over something you can click it opens up — the reference does this at
   about 150px with an arrow inside it, which is a studio showing off. At
   this size it reads as the pointer noticing, not as a second cursor. */
#dot.hot{ width:34px;height:34px; }
html.haspointer #dot.on{opacity:1}
@media (hover:none),(pointer:coarse){ #dot{display:none} }

#field b{position:absolute;display:block;will-change:transform}
/* Clustered so they read as one body with a lit edge, not five lights in
   a row. The deep green is the mass; the amber is the rim catching light
   along one side of it; the oxblood is the shadow it sits in. */
/* ── the sphere ───────────────────────────────────────────────────────
   You described it exactly: a sphere in the corner, and the rest is
   depth. That is a body with light on one side and shadow on the other,
   sitting in near-black — not a wash across the top, which is what a
   mask anchored to the top edge was always going to produce.

   A radial gradient offset from centre reads as a lit sphere on its own,
   because that is literally how a sphere shades: bright where it faces
   the light, dark where it turns away, black at the terminator. The
   liquid filter then warps its edge so it moves like the reference's
   render rather than sitting there like a ball.                       */
#field .orb{
  /* No filter. The SVG one generated its own noise — that was the grain —
     and re-ran a displacement map and an animated specular light over a
     full-screen element on every repaint, which was the stall. A radial
     gradient shades a sphere just as convincingly and costs nothing: the
     browser composites it once and then only moves it. */
  position:absolute;
  width:152vmin;height:152vmin;
  right:-56vmin;top:-40vmin;
  border-radius:50%;
  background:
    radial-gradient(circle at 33% 25%,
      #F6E0A4 0%, #E9B252 7%, #B9822A 15%, #7C7A2E 24%,
      #3E6236 36%, #26452A 48%, #16291C 60%, #0C1611 72%,
      #060B09 84%, #000 100%);
  animation:orbBreathe 52s ease-in-out infinite;
}
#field .orb2{
  /* Sized and placed so its arc actually crosses the bottom-left corner
     rather than stopping short of it and leaving a visible edge. */
  position:absolute;
  width:128vmin;height:128vmin;
  left:-62vmin;bottom:-56vmin;
  border-radius:50%;
  background:
    radial-gradient(circle at 62% 34%,
      #8A3A22 0%, #5A1F14 22%, #331410 42%, #16090A 62%, #000 82%);
  animation:orbBreathe 67s ease-in-out infinite reverse;
}
#field .haze{
  position:absolute;inset:-20%;
  background:
    radial-gradient(58% 42% at 76% 14%, rgba(233,178,82,.16) 0%, rgba(233,178,82,0) 72%),
    radial-gradient(50% 38% at 14% 90%, rgba(180,105,58,.13) 0%, rgba(180,105,58,0) 74%);
  animation:hazeDrift 44s linear infinite;
}
/* Translation only. Rotating or scaling a layer this size forces the
   browser to re-rasterise the gradient every frame; moving it just
   repositions a texture it already has. */
@keyframes orbBreathe{
  0%  {transform:translate3d(0,0,0)}
  50% {transform:translate3d(-4vmin,3vmin,0)}
  100%{transform:translate3d(0,0,0)}}
@keyframes hazeDrift{
  0%  {transform:translate3d(0,0,0)}
  45% {transform:translate3d(4%,-3%,0)}
  100%{transform:translate3d(0,0,0)}}
}
}
@keyframes d1{0%{transform:translate3d(0,0,0) scale(1)}33%{transform:translate3d(14vw,6vw,0) scale(1.14)}
  66%{transform:translate3d(-8vw,12vw,0) scale(.94)}100%{transform:translate3d(0,0,0) scale(1)}}
@keyframes d2{0%{transform:translate3d(0,0,0) scale(1.06)}40%{transform:translate3d(-18vw,10vw,0) scale(.9)}
  70%{transform:translate3d(10vw,-6vw,0) scale(1.18)}100%{transform:translate3d(0,0,0) scale(1.06)}}
@keyframes d3{0%{transform:translate3d(0,0,0) scale(.96)}50%{transform:translate3d(12vw,-10vw,0) scale(1.2)}
  100%{transform:translate3d(0,0,0) scale(.96)}}
@keyframes d4{0%{transform:translate3d(0,0,0) scale(1)}45%{transform:translate3d(-14vw,-8vw,0) scale(1.22)}
  100%{transform:translate3d(0,0,0) scale(1)}}
/* A soft vignette under the content so type never has to fight the field,
   without going back to boxes: it is one gradient across the whole page,
   not a panel behind each thing. */
/* Enough shade for type to sit on, applied where the type is rather than
   over the whole form — a flat wash across everything would undo the depth
   the contrast pass just created. */
/* Just enough shade under the type, kept off the sphere itself. */
/* The floor exists to keep type off the field. It was written for a CSS
   gradient that had no falloff of its own, so it starts at 34% black
   across the whole frame. The shader has its own falloff and its own
   scroll dim, and stacking the two is what made a canvas measuring 0.42
   at the top read as near-black on the page. On the GL path the floor
   only does the bottom, where the dense rows are. */
#floor{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(0,0,0,.34) 0%,rgba(0,0,0,.46) 40%,
    rgba(0,0,0,.72) 76%,rgba(0,0,0,.88) 100%)}
html.glfield #floor{
  background:linear-gradient(180deg,rgba(0,0,0,0) 0%,rgba(0,0,0,0) 56%,
    rgba(0,0,0,.20) 78%,rgba(0,0,0,.46) 100%)}
/* Only main needs lifting off the field. Setting position on the two bars
   here overrode the fixed positioning declared above them, which is what
   made the header and the pill scroll away with the page instead of
   staying on the screen. */
main{position:relative;z-index:1}
body.still #field b{animation-play-state:paused}


/* Parallax and drift have to compose, so they live on different elements:
   the layer leans toward you, the field inside it keeps drifting. Nesting
   is what lets both run without one overwriting the other's transform. */
#field .lay{
  /* The transform is owned by the parallax loop, which writes it directly
     rather than through a custom property — a variable write invalidates
     style for everything downstream of it, a transform write does not. */
  position:absolute;inset:0;display:block;overflow:hidden;
  transform:translate3d(0,0,0);
  will-change:transform;
}
/* ── the cold open ────────────────────────────────────────────────────
   The reference holds a black screen with its wordmark while it loads,
   then dissolves into the hero. Ours does the same, once per session:
   the name, then the field blooming behind it, then the app. Anyone who
   opens this app twice in a morning should not sit through it twice. */
/* The reference opens on near-black with a single soft crescent of warm
   light behind a centred wordmark, and then the site arrives. The
   crescent is two radials, not one: a warm bloom with a black bloom
   sitting over it and offset, which is what carves the arc — a plain
   radial is a blob, and a blob was what this had. */
/* ── the cold open ─────────────────────────────────────────────────────
   Not a picture of the app's colours — the app itself, seen through a
   gap. The plate is black and carries a hole in it, and the hole sits on
   the orb's limb, which is computed from the same numbers the shader
   uses. Because the field is near-black everywhere except along that
   edge, a soft round hole over it shows exactly one thing: the swoosh.

   Then it is yours to open. Every bit of pointer movement widens the
   hole, the curve gives way to the whole field, and when the gap has
   swallowed the screen there is nothing left of the plate to remove. A
   fog made of CSS was always going to be a different room from the one
   it was introducing; this is the same room, through a keyhole. */
/* ── the cold open ─────────────────────────────────────────────────────
   There is no plate. The field itself is held small and centred while
   the app waits — a soft body of light on black with the wordmark on it
   — and opening is that same light growing out to fill the screen. One
   material the whole way through, so nothing has to be matched to
   anything and nothing can look bolted on.

   It reacts because the field reacts: the shader pushes the material
   away from the pointer before it samples it, so moving through it
   disturbs the flow where your hand is and leaves the rest running. */
#cold{
  position:fixed;inset:0;z-index:200;background:transparent;
  display:flex;align-items:center;justify-content:center;
  pointer-events:none;
}
/* The interface waits until the light has opened out. */
body.opening main,body.opening #top,body.opening #tabs,body.opening #cmdOpen{
  opacity:0;
}
body.opened main,body.opened #top,body.opened #tabs,body.opened #cmdOpen{
  opacity:1;transition:opacity var(--t-long) var(--ease);
}

#cold span:not(.fog){
  position:relative;z-index:3;
  font-size:clamp(26px,5.2vw,44px);letter-spacing:.02em;font-weight:300;
  text-transform:none;color:var(--paper);
  animation:coldWord 1.05s var(--ease) forwards;
}
/* the wordmark thins out as the gap widens — by the time the field is
   open it has already gone, rather than being cut off by the plate */
#cold.waiting span:not(.fog){opacity:calc(1 - var(--openness,0)*1.15)}

#cold.go{animation:coldOut .78s var(--ease) forwards}
@keyframes coldOut{
  0%{opacity:1}
  100%{opacity:0;visibility:hidden}
}
@keyframes coldWord{
  0%{opacity:0;transform:translateY(14px)}
  40%{opacity:1;transform:none}
  100%{opacity:1;transform:none}
}
/* the title lines lift out from behind a mask as the cold open clears */
.head h1,.head .when{overflow:hidden}
body.opening .head h1,body.opening .head .when{opacity:0}
body.opened .head h1,body.opened .head .when{
  opacity:1;animation:maskUp var(--t-long) var(--ease) backwards}
body.opened .head h1{animation-delay:.08s}
body.opened .head .when{animation-delay:.18s}
@keyframes maskUp{from{opacity:0;transform:translateY(1.1em)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){
  #cold span:not(.fog){animation:none;opacity:0}
  #cold{display:none}
  body.opening .head h1,body.opening .head .when{animation:none}
  #field .lay{transform:none}
}


/* ═══ DESKTOP ═════════════════════════════════════════════════════════
   Not the phone layout stretched. A wide screen has room to answer more
   than one question at once, which is the whole point of using this at a
   desk: where you stand, what is happening today, and what is coming, all
   without scrolling.

   The reference's own chrome moves the same way — a wordmark top left, a
   menu stacked top right, content in a 1078px column — so the tab pill
   becomes that menu rather than staying a thumb control on a screen with
   no thumbs.                                                           */
@media (min-width:900px){
  :root{ --pad:0px; --t-body:16px; --t-statement:78px; }

  body{ padding-bottom:120px; }
  main{ max-width:1078px; margin:0 auto; padding:0 40px; }
  #top{
    height:auto;padding:26px 40px 0;background:none;border-bottom:0;
    max-width:1078px;left:50%;transform:translateX(-50%);
  }
  #top.solid{ background:none;border-bottom-color:transparent; }
  #brand{ font-size:12px;letter-spacing:.26em; }

  /* The menu, in the corner, the way the reference sets it. It was a
     bottom pill for a while because the old field put a 0.40-luminance
     rim exactly here and grey 11px type on that is a 1.6:1 contrast —
     invisible. The answer to that was never to move the menu, it was to
     stop setting it in grey: white reads on this material at any point
     in its range, which is what the reference does with its own. */
  #tabs{
    position:fixed;top:30px;right:max(28px,calc(50vw - 519px));
    left:auto;bottom:auto;width:auto;height:auto;
    flex-direction:column;align-items:flex-end;gap:11px;
    padding:0;border:0;border-radius:0;background:none;
    -webkit-backdrop-filter:none;backdrop-filter:none;
    z-index:80;
  }
  #tabs button{
    flex:none;width:auto;height:auto;padding:0;border-radius:0;
    font-size:11px;letter-spacing:.2em;text-align:right;
    background:none;color:rgba(255,255,255,.62);
  }
  #tabs button.on{ background:none;color:var(--paper); }
  #tabs button:not(.on):hover{ color:var(--paper); }
  #tabs button.wide{ display:block; }
  /* the gear is redundant once Settings is a row in the menu */
  #btnSettings{ display:none; }

  /* The wordmark is fixed, so every line of the page slid underneath it
     and sat on top of it. It belongs to the first screen: once you have
     left that, it goes. */
  #brand{ transition:opacity var(--t-mid) var(--ease); }
  #top.solid #brand{ opacity:0;pointer-events:none; }

  .head{ padding:96px 0 0; }
  .head h1{ line-height:.88; }
  .head .when{ margin-top:20px;font-size:12px; }

  /* Two columns — but only for the surface that is actually showing.
     Without .on this sets display:grid on every section and overrides the
     display:none that hides the others, so all of them render at once,
     stacked down the page. That was the desktop behaving strangely. */
  #home.on,#term.on,#settings.on{
    display:grid;grid-template-columns:1.08fr .92fr;
    column-gap:72px;align-items:start;
  }
  #home>.head,#term>.head,#settings>.head{ grid-column:1/-1; }
  /* Rows are pinned rather than left to auto-placement: flowing, the
     right-hand column starts on the row after the last left-hand block
     and lands halfway down the page instead of level with the top. */
  #vHero      { grid-column:1;grid-row:2 }
  #vNow       { grid-column:1;grid-row:3 }
  #vStanding  { grid-column:1;grid-row:4 }
  #vQuestions { grid-column:2;grid-row:2 }
  #vDay       { grid-column:2;grid-row:3 }
  #vDue       { grid-column:2;grid-row:4 }
  #vWeek      { grid-column:2;grid-row:5 }

  #vOverall   { grid-column:1;grid-row:2 }
  #vGoal      { grid-column:1;grid-row:3 }
  #vSubjects  { grid-column:2;grid-row:2 }
  #vMonths    { grid-column:2;grid-row:3 }
  #vAttMore   { grid-column:2;grid-row:4 }

  #vRail      { grid-column:1/-1;grid-row:2 }
  #vClasses   { grid-column:1;grid-row:3 }

  #vDueFilter { grid-column:1;grid-row:2 }
  #vDueList   { grid-column:1;grid-row:3 }

  #vCalBar    { grid-column:1;grid-row:2 }
  #vCalGrid   { grid-column:1;grid-row:3 }
  #vCalDay    { grid-column:2;grid-row:2/span 2 }
  /* Settings reads as one column of groups — two would make it a form. */
  #settings.on{ grid-template-columns:1fr; }
  #vSettings{ grid-column:1;max-width:620px; }

  .block{ margin-bottom:52px; }
  .block>.eyebrow{ margin-bottom:22px; }

  /* The desktop override used to shrink the sphere and pull it INTO the
     frame (104vmin at -26/-24). On a phone the lit core sits just off the
     top edge and only the shaded flank crosses the screen; that override
     dragged the core to (905,18) — on canvas, directly behind the right
     column. Measured over the 1078px content band, that put text on a
     ground averaging 0.145 luminance and peaking at 0.86, against the
     reference's 0.049-0.078. Half the screen was brighter than the
     reference ever gets.

     So the desktop sphere is bigger and pushed further out, not smaller
     and pulled in: the core goes off-canvas past the top-right, and what
     crosses the content is the dark outer flank. Same gradient, same
     colour, same breathe — only the framing changed.
       content band  0.145 -> 0.028 mean, 0.86 -> 0.43 max
       whole frame   0.144 -> 0.048 mean, 53% -> 82% of pixels under 0.10 */
  #field .orb{ width:140vmin;height:140vmin;right:-105vmin;top:-70vmin; }
  #field .orb2{ width:110vmin;height:110vmin;left:-75vmin;bottom:-60vmin; }

  /* a pointer means hover states are worth having */
  .item{ padding:20px 0; }
  .item:hover .lead{ color:var(--ink); }
  .pill:hover{ border-color:var(--ink);letter-spacing:.08em; }
  .iconbtn:hover{ opacity:1; }

  #toast{ left:50%;right:auto;transform:translate(-50%,8px);min-width:280px; }
  #toast.on{ transform:translate(-50%,0); }
}

/* Between a phone and a laptop: one column, but with the room a tablet
   actually has rather than phone margins. */
@media (min-width:640px) and (max-width:899px){
  :root{ --pad:40px; --t-statement:62px; }
  main{ max-width:720px;margin:0 auto; }
  #top{ padding-left:40px; }
}


/* ═══ THE COMMAND BAR ══════════════════════════════════════════════════
   The point of collapsing five tabs into two is that navigation stops
   being how you reach things. You type what you want. Marking a class,
   jumping to a subject, planning a day off, adding a deadline — all of it
   is one surface away from anywhere, on a keyboard or a thumb.          */
#cmdScrim{position:fixed;inset:0;z-index:120;background:rgba(0,0,0,.55);
  opacity:0;pointer-events:none;transition:opacity var(--t-quick) var(--ease)}
#cmdScrim.on{opacity:1;pointer-events:auto}
#cmd{
  position:fixed;z-index:130;left:50%;top:14vh;width:min(620px,92vw);
  transform:translate(-50%,-12px);opacity:0;pointer-events:none;
  background:rgba(16,15,16,.82);
  -webkit-backdrop-filter:blur(16px) saturate(170%);
  backdrop-filter:blur(16px) saturate(170%);
  border:1px solid rgba(255,255,255,.16);border-radius:0;overflow:hidden;
  transition:opacity var(--t-quick) var(--ease),transform var(--t-mid) var(--ease);
}
#cmd.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#cmdInput{
  width:100%;padding:22px 24px;font-size:17px;color:var(--ink);
  background:none;border:0;border-bottom:1px solid rgba(255,255,255,.12);
  border-radius:0;
}
#cmdInput::placeholder{color:var(--ink-3)}
#cmdList{max-height:52vh;overflow-y:auto;padding:8px 0}
.cmdRow{
  display:flex;align-items:baseline;gap:14px;width:100%;
  padding:13px 24px;text-align:left;
  transition:background var(--t-quick) var(--ease);
}
.cmdRow .t{flex:1;font-size:15px;color:var(--ink)}
.cmdRow .k{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.cmdRow.sel{background:rgba(255,255,255,.09)}
.cmdEmpty{padding:26px 24px;color:var(--ink-3);font-size:14px}
#cmdOpen{
  position:fixed;z-index:71;right:max(14px,env(safe-area-inset-right,0px));
  bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px) + 22px);
  width:48px;height:48px;border-radius:var(--pill);
  display:flex;align-items:center;justify-content:center;
  font-size:11px;letter-spacing:.02em;color:var(--ink-2);
  background:rgba(18,16,18,.62);
  -webkit-backdrop-filter:blur(14px) saturate(170%);
  backdrop-filter:blur(14px) saturate(170%);
  border:1px solid rgba(255,255,255,.14);
  transition:opacity var(--t-quick) var(--ease);
}
#cmdOpen:active{opacity:.55}

/* the switch between the term's four views */
#vTermSwitch .switch{display:flex;gap:0;border-bottom:1px solid var(--rule-soft)}
#vTermSwitch .switch button{
  padding:14px 0;margin-right:26px;font-size:12px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink-3);
  border-bottom:1px solid transparent;margin-bottom:-1px;
  transition:color var(--t-quick) var(--ease),border-color var(--t-quick) var(--ease);
}
#vTermSwitch .switch button.on{color:var(--ink);border-bottom-color:var(--ink)}

@media (min-width:900px){
  #cmdOpen{display:none}            /* the keyboard is the way in */
  #term.on{ grid-template-columns:1.08fr .92fr; }
  #vTermSwitch{ grid-column:1/-1;grid-row:2 }
  #vTermBody { grid-column:1;grid-row:3 }
  #vTermSide { grid-column:2;grid-row:3 }
}

/* ── the panel ────────────────────────────────────────────────────────
   Detail arrives as a full sheet of black, not a floating card. It has
   no corners, no border and no shadow — it is simply the next screen.  */
#scrim{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.55);
  opacity:0;pointer-events:none;transition:opacity var(--t-quick) var(--ease)}
#scrim.on{opacity:1;pointer-events:auto}
#panel{
  position:fixed;left:0;right:0;bottom:0;z-index:100;
  max-height:92dvh;display:flex;flex-direction:column;
  /* Not solid. A flat slab of #000 is the one thing on screen the field
     does not reach, which is what made every sheet look bolted on from a
     different app. At this alpha the material still reads underneath and
     the sheet belongs to the same room, while the text on it measures
     around 0.12 — darker ground than the page it came from. */
  background:rgba(3,4,3,.90);
  border-top:1px solid var(--rule);
  transform:translateY(101%);
  transition:transform var(--t-mid) var(--ease);
}
#panel.on{transform:none}
#panelBar{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:22px var(--pad) 16px;flex-shrink:0;
}
#panelTitle{font-size:var(--t-label);letter-spacing:.16em;text-transform:uppercase;
  color:var(--ink-3)}
#panelBar button{font-size:12px;letter-spacing:.06em;color:var(--ink-2);
  text-transform:uppercase;padding:6px 0}
#panelBody{
  overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1;
  padding:6px var(--pad) calc(40px + env(safe-area-inset-bottom,0px));
}
.intro{font-size:var(--t-body);color:var(--ink-2);line-height:1.6;margin-bottom:var(--gap-block)}

/* ── inputs: a line, not a box ────────────────────────────────────────── */
input[type=text],input[type=number],input[type=date],input[type=time],select,textarea{
  border-bottom:1px solid var(--rule);border-radius:0;padding:8px 0;
  font-size:var(--t-body);color:var(--ink);width:100%;
  transition:border-color var(--t-quick) var(--ease);
}
input:focus,select:focus,textarea:focus{border-bottom-color:var(--ink)}
input::placeholder,textarea::placeholder{color:var(--ink-3)}
select{-webkit-appearance:none;appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--ink-3) 50%),
                   linear-gradient(135deg,var(--ink-3) 50%,transparent 50%);
  background-position:calc(100% - 9px) 55%,calc(100% - 4px) 55%;
  background-size:5px 5px;background-repeat:no-repeat;padding-right:22px}
.field-row{display:flex;align-items:baseline;gap:18px;padding:16px 0;
  border-top:1px solid var(--rule-soft)}
.field-row .lab{flex:1;font-size:var(--t-body)}
.field-row .in{width:44%;flex-shrink:0}
.field-row .in input,.field-row .in select{text-align:right}

/* ── the panel, on a wide screen ──────────────────────────────────────
   These used to live in the desktop block further up the sheet, above
   the base #panel rules — so "left:0;right:0" won on source order and a
   680px sheet sat hard against the left edge of the screen with its own
   vertical seam down the middle of the page. Same specificity, later
   wins; the fix is where they are, not what they say.

   It is also no longer a card. Detail arrives as the next screen: the
   plate covers the window, the field carries on behind it, and the
   content sits in one column rather than inside a bordered box. */
@media (min-width:900px){
  #panel{
    left:0;right:0;top:0;bottom:0;
    max-height:none;width:auto;
    border:0;border-top:0;
    background:rgba(3,4,3,.88);
    transform:translateY(2.5%);opacity:0;pointer-events:none;
    transition:transform var(--t-long) var(--ease),opacity var(--t-mid) var(--ease);
  }
  #panel.on{ transform:none;opacity:1;pointer-events:auto; }
  #panelBar{
    width:min(760px,84vw);margin:0 auto;
    padding:64px 0 26px;
    border-bottom:1px solid var(--rule-soft);
  }
  /* 48 rather than something in the thirties: the system has three sizes
     and nothing between 20 and 40, so a "comfortable" title size is
     exactly the drift the rule exists to stop. */
  #panelTitle{ font-size:48px;letter-spacing:-0.01em;text-transform:none;
               font-weight:300;color:var(--paper);line-height:1; }
  #panelBody{ width:min(760px,84vw);margin:0 auto;padding:34px 0 96px; }
  /* the scrim has nothing left to do once the plate covers the window */
  #scrim{ display:none; }
}

/* ── choice: three words on a rule, the chosen one lit ────────────────── */
/* ── settings, as a list ──────────────────────────────────────────────
   Nine groups used to be nine .blocks. A .block is a unit of content and
   carries a section's worth of margin under it, so nine one-line rows sat
   119px apart with nothing between them — a ribbon you scrolled rather
   than a list you read. They are rows now, in one block, separated by the
   same hairline every other list in this app uses. */
#setList .item{padding:20px 0}
#setList .item.open{padding-bottom:12px}
#setList .ginner{padding:0 0 30px}
#setList>.item:first-of-type{border-top:0}

.choice{display:flex;gap:0;border-top:1px solid var(--rule-soft)}
.choice button{
  flex:1;padding:16px 4px;font-size:12px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--ink-3);text-align:center;
  border-right:1px solid var(--rule-soft);
  transition:color var(--t-quick) var(--ease),opacity var(--t-quick) var(--ease);
}
.choice button:last-child{border-right:0}
.choice button.on{color:var(--ink)}
.choice button:active{opacity:.5}

/* ── empty ─────────────────────────────────────────────────────────────── */
.empty{padding:64px var(--pad);text-align:center}
.empty .t{font-size:var(--t-statement);font-weight:300;letter-spacing:-.04em;line-height:.9}
.empty .s{font-size:var(--t-body);color:var(--ink-3);margin-top:16px;line-height:1.6}

/* ── toast ─────────────────────────────────────────────────────────────── */
#toast{
  position:fixed;left:var(--pad);right:var(--pad);
  bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px) + 20px);
  z-index:110;padding:16px 20px;background:var(--bg);
  border:1px solid var(--rule);border-radius:var(--pill);
  font-size:13px;text-align:center;color:var(--ink);
  opacity:0;pointer-events:none;transform:translateY(8px);
  transition:opacity var(--t-quick) var(--ease),transform var(--t-quick) var(--ease);
}
#toast.on{opacity:1;transform:none}
#toast.bad{border-color:var(--oxblood-lit);color:var(--oxblood-lit)}

/* ── motion ────────────────────────────────────────────────────────────
   One curve, nothing under half a second, and everything glides in the
   order you read it.                                                   */
@media (prefers-reduced-motion: no-preference){
  /* ── reveal on scroll ─────────────────────────────────────────────────
     The reference's content arrives as you move through it, not once when
     the page loads. Everything below starts a little low and a little
     transparent and resolves as it comes into view — always upward, always
     on the one curve, never faster than the tempo the rest of the system
     runs at. */
  /* Hidden only once the script has said it will do the revealing. Left
     hidden by default, any hiccup in the observer — or a script that never
     runs at all — leaves a blank page, and a blank page is a far worse
     failure than a missing animation. */
  html.revealing .block{opacity:0;transform:translateY(26px);
    transition:opacity var(--t-mid) var(--ease),transform var(--t-mid) var(--ease)}
  html.revealing .block.in{opacity:1;transform:none}
  html.revealing .block.now{transition:none}   /* a re-render, not an arrival */

  /* Statements come out from behind a mask, line by line, the way a
     headline does on the reference rather than simply fading. */
  .reveal{display:block;overflow:hidden}
  html.revealing .reveal>span{display:block;transform:translateY(105%);
    transition:transform var(--t-long) var(--ease)}
  /* These must outrank the rule that hides them. "html.revealing
     .reveal>span" is (0,2,2); ".in .reveal>span" and ".reveal.in>span"
     are both (0,2,1), so the hiding rule won every time and no masked
     line ever came up — the titles and every statement in the app stayed
     translated 105% behind their own overflow:hidden. Qualifying these
     with html.revealing takes them to (0,3,2), which is the whole fix. */
  html.revealing .in .reveal>span,
  html.revealing .reveal.in>span{transform:none}
  .block.in .reveal:nth-child(2)>span{transition-delay:.06s}

  /* No per-row stagger. Rows arriving one after another as you scroll past
     reads as a stepped sequence — a tick — rather than as movement. The
     block resolves as one thing, which is what the reference does. */

  /* The title holds while the field moves behind it, then lifts away as
     you scroll past — the same relationship their hero has. */
  .head{will-change:transform,opacity}

  /* The pill answers a press the way theirs does: the border lights and
     the label opens up, rather than the whole thing shrinking. */
  .pill{transition:border-color var(--t-mid) var(--ease),
        letter-spacing var(--t-mid) var(--ease),color var(--t-quick) var(--ease)}
  .pill:active{border-color:var(--ink);letter-spacing:.10em;opacity:1}

  /* A tab change wipes rather than cuts. */
  section.on{animation:wipe var(--t-mid) var(--ease)}
  @keyframes wipe{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

  #panel.on #panelBody>*{animation:rise var(--t-mid) var(--ease) backwards}
  #panel.on #panelBody>*:nth-child(1){animation-delay:.14s}
  #panel.on #panelBody>*:nth-child(2){animation-delay:.20s}
  #panel.on #panelBody>*:nth-child(3){animation-delay:.26s}
  #panel.on #panelBody>*:nth-child(n+4){animation-delay:.32s}
  @keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
}
@media (prefers-reduced-motion: reduce){
  .block,.block .item{opacity:1;transform:none}
  .reveal>span{transform:none}
  section.on{animation:none}
  #panel.on #panelBody>*{animation:none}
  #field b{animation:none}
  #field{opacity:.5}
  .item:active,.pill:active,button:active{opacity:1}
}


</style>
</head>
<body>

<div id="field" aria-hidden="true">
  <!-- The real field. The CSS layers below stay as the fallback for a
       browser without WebGL; boot hides them the moment the canvas is
       drawing, so what you see is one or the other, never both. -->
  <canvas id="glfield"></canvas>
  <span class="lay" style="--amp:120px"><b class="orb"></b></span>
  <span class="lay" style="--amp:70px"><b class="orb2"></b></span>
  <span class="lay" style="--amp:200px"><b class="haze"></b></span>
</div>
<div id="dot" aria-hidden="true"></div>
<div id="floor" aria-hidden="true"></div>
<div id="cold" aria-hidden="true"><span>Eleventh Hour</span></div>

<!-- ══════════════ SHELL ══════════════
     A header that is invisible until content passes behind it, five words
     for navigation, and one full-width panel for anything that needs more
     room. No chrome anywhere else. -->
<div id="top">
  <span id="brand">Eleventh Hour</span>
  <div id="topR"></div>
</div>

<main>
  <section id="home" class="on">
    <div class="head"><h1 class="reveal"><span>Today</span></h1>
      <div class="when reveal" id="todayWhen"><span></span></div>
</div>
    <div id="vHero"></div>
    <div id="vNow"></div>
    <div id="vStanding"></div>
    <div id="vQuestions"></div>
    <div id="vDay"></div>
    <div id="vNext"></div>
    <div id="vDue"></div>
    <div id="vWeek"></div>
  </section>

  <!-- Everything you review rather than do. Four tabs collapsed into one
       surface with a switch, because they are four views of the same term
       and none of them is a daily errand. -->
  <section id="term">
    <div class="head"><h1 class="reveal"><span>Term</span></h1>
      <div class="when reveal" id="termWhen"><span></span></div></div>
    <div id="vTermSwitch"></div>
    <div id="vTermBody"></div>
    <div id="vTermSide"></div>
  </section>

  <section id="settings">
    <div class="head"><h1>Settings</h1><div class="when" id="setWhen"></div></div>
    <div id="vSettings"></div>
  </section>
</main>

<nav id="tabs"></nav>

<div id="scrim"></div>
<div id="panel" role="dialog" aria-modal="true">
  <div id="panelBar">
    <span id="panelTitle"></span>
    <div style="display:flex;gap:20px">
      <button id="panelCancel">Close</button>
      <button id="panelDone" hidden>Save</button>
    </div>
  </div>
  <div id="panelBody"></div>
</div>

<input type="file" id="impFile" accept="application/json" hidden>
<div id="cmdScrim"></div>
<div id="cmd" role="dialog" aria-modal="true" aria-label="Command">
  <input id="cmdInput" type="text" autocomplete="off" spellcheck="false"
         placeholder="Type a class, a subject, or what you want to do">
  <div id="cmdList"></div>
</div>
<button id="cmdOpen" aria-label="Command">⌘K</button>
<div id="toast"></div>

<script>
/* ══════════════════════════════════════════════════════════════
   11:59 — college companion.  Single file, offline, no account.
   ══════════════════════════════════════════════════════════════ */
'use strict';
const $  = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
/* time + a monotonic counter + randomness. The counter makes collisions
   impossible within a session (the old version relied on 4 random chars,
   which can repeat when ids are minted in the same millisecond); the
   random tail keeps ids distinct across devices when backups are merged. */
let _uidSeq = 0;
const uid = () => Date.now().toString(36) + '-' +
  (_uidSeq = (_uidSeq + 1) % 1679616).toString(36) + '-' +
  Math.random().toString(36).slice(2, 8);
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));

const DAYS  = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const DAYSL = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];

/* class kinds — theory / tutorial / practical. "online" is a separate flag,
   so any kind can also be an online class. */
const KINDS = [['th','Theory'],['tu','Tutorial'],['pr','Practical']];
const KIND_NAME = {th:'Theory', tu:'Tutorial', pr:'Practical'};
const KIND_TAG  = {th:'', tu:'Tut', pr:'Prac'};
const kindOf = sl => (sl && KIND_NAME[sl.kind]) ? sl.kind : 'th';
/* the little badges on a class card */
const kindTag = sl => KIND_TAG[kindOf(sl)]
  ? ' <span class="tag '+kindOf(sl)+'">'+KIND_TAG[kindOf(sl)]+'</span>' : '';
const onlineTag = sl => sl.online ? ' <span class="tag online">Online</span>' : '';
/* where the class happens — a room, or "Online" */
const placeOf = sl => sl.online ? 'Online' : (sl.room||'');

const pad2 = n => String(n).padStart(2,'0');

const KEY='sem5plan';
/* One place that knows every field. Wipe, import and first run all go
   through here, so adding a setting can't leave one path with `undefined`. */
function blankState(keep){
  keep=keep||{};
  return {subs:[],slots:[],marks:{},att:{},dls:[],cats:[],tab:'home',
          thr:67, goal:0, goalBy:'',   /* 0 = no goal; goalBy defaults to term end */
          name:'', roll:'', course:'', college:'',
          termEnd:'',   /* semester end — powers the runway maths */
          /* morning planner — off until you switch it on in Settings */

          commute:'self', plans:{}, enroute:null, openGroups:[],   /* per-day 'which classes I'll actually attend' */
          travelAM:40, travelMid:60, travelPM:50,
          theme:keep.theme||'auto', tone:keep.tone||'friendly'};
}
/* Repair anything missing or the wrong shape — old saves, hand-edited
   backups, a file from a previous version. */
function normalise(st){
  st=Object.assign({},st||{});
  /* migrate the old single ready/travel pair FIRST — if defaults land
     first, readyMax is already 30 and the saved value is lost */
  if(st.ready  && st.readyMax===undefined)  st.readyMax=st.ready;
  if(st.travel && st.travelAM===undefined){ st.travelAM=st.travelMid=st.travelPM=st.travel; }
  /* they'd already set these before the toggle existed — keep it working */
  if((st.ready||st.travel) && st.planner===undefined) st.planner=true;
  st=Object.assign(blankState(st),st);
  if(!['light','dark','auto'].includes(st.theme)) st.theme='auto';
  if(!['pro','plain','friendly','snark'].includes(st.tone)) st.tone='friendly';
  ['subs','slots','dls','cats','openGroups'].forEach(k=>{ if(!Array.isArray(st[k])) st[k]=[]; });
  ['marks','att'].forEach(k=>{ if(!st[k]||typeof st[k]!=='object') st[k]={}; });
  st.subs.forEach((s,i)=>{
    if(typeof s.ci!=='number') s.ci=i%8;
    if(!s.code) s.code=String(s.name||'?').slice(0,3).toUpperCase();
  });
  st.thr   =clamp(+st.thr   ||67,1,100);
  st.goal  =clamp(+st.goal  ||0,  0,100);   /* 0 means none set */
  if(!/^\d{4}-\d{2}-\d{2}$/.test(st.goalBy||'')) st.goalBy='';
  ['name','roll','course','college'].forEach(k=>{ st[k]=String(st[k]||'').slice(0,80); });
  delete st.ready; delete st.travel; delete st.driverHr; delete st.remindAt;   /* migrated above */
  st.planner  = !!st.planner;
  st.readyMin =clamp(+st.readyMin ||0,0,240);
  st.readyMax =clamp(+st.readyMax ||0,0,240);
  if(st.readyMax<st.readyMin) st.readyMax=st.readyMin;
  ['travelAM','travelMid','travelPM'].forEach(k=>{ st[k]=clamp(+st[k]||0,0,300); });
  if(!COMMUTE[st.commute]) st.commute='self';
  /* plans are intentions for a specific day — drop them once the day is gone */
  /* "on my way" only means anything for today */
  if(!st.enroute || st.enroute.iso!==todayISO() || typeof st.enroute.at!=='number')
    st.enroute=null;
  if(!st.plans||typeof st.plans!=='object') st.plans={};
  else { const today=todayISO();
    Object.keys(st.plans).forEach(k=>{
      if(!/^\d{4}-\d{2}-\d{2}$/.test(k) || k<today || !Array.isArray(st.plans[k]))
        delete st.plans[k]; }); }
  st.termEnd  = /^\d{4}-\d{2}-\d{2}$/.test(st.termEnd||'') ? st.termEnd : '';
  st.name  =typeof st.name==='string' ? st.name.slice(0,80) : '';
  return st;
}
let S=blankState();
try{ const raw=localStorage.getItem(KEY); if(raw) S=Object.assign(S,JSON.parse(raw)||{}); }catch(e){}
S=normalise(S);

/* A term of marking is real work and there is no server copy of it, so
   saving refuses to be the thing that loses it.

   Two guards. An empty state never overwrites a populated one — if the app
   has somehow ended up with no subjects and no marks while the stored copy
   has plenty, that is a fault, not an edit, and the write is dropped. And
   every healthy save leaves a rollback copy behind, so even a bad write
   that gets past the first guard can be undone. */
const BAK=KEY+'.bak';
function stateWeight(o){
  if(!o) return 0;
  return (o.subs||[]).length + (o.slots||[]).length + Object.keys(o.marks||{}).length;
}
function save(){
  try{
    const now=stateWeight(S);
    let prev=null;
    try{ prev=JSON.parse(localStorage.getItem(KEY)||'null'); }catch(e){}
    const had=stateWeight(prev);
    if(had>0 && now===0) return;            /* refuse to erase */
    if(had>=6 && now<had*0.5){              /* a big loss — keep the old copy */
      try{ localStorage.setItem(BAK,JSON.stringify(prev)); }catch(e){}
    } else if(now>=6){
      try{ localStorage.setItem(BAK,JSON.stringify(S)); }catch(e){}
    }
    localStorage.setItem(KEY,JSON.stringify(S));
  }catch(e){}
}
/* what the rollback copy holds, if anything */
function backupInfo(){
  try{
    const b=JSON.parse(localStorage.getItem(BAK)||'null');
    if(!b) return null;
    return {subs:(b.subs||[]).length, marks:Object.keys(b.marks||{}).length,
            weight:stateWeight(b), raw:b};
  }catch(e){ return null; }
}
function restoreBackup(){
  const b=backupInfo();
  if(!b) return false;
  S=normalise(b.raw);
  try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){}
  renderAll();
  toast('Restored '+b.subs+' subjects and '+b.marks+' marks.');
  return true;
}

/* ══════════════ DOMAIN ══════════════ */
const subById = id => S.subs.find(s=>s.id===id);
const scCls = sub => 'sc'+((sub&&typeof sub.ci==='number'?sub.ci:0)%8);

/* classes on a given weekday / date. One-offs live only on their date. */
function slotsOn(dayIx, iso){
  return S.slots
    .filter(s => s.once ? s.date===iso : s.day===dayIx)
    .sort((a,b)=>t2m(a.start)-t2m(b.start));
}
const markKey=(iso,sl)=> iso+'|'+sl.id+'|'+sl.subId+'|'+(sl.kind||'th');

/* marks made on the timetable only (used to protect manual backfill) */
function marksOnly(subId){
  const th={p:0,a:0}, tu={p:0,a:0}, pr={p:0,a:0};
  for(const k in S.marks){
    const p=k.split('|'); if(p[2]!==subId) continue;
    const c = p[3]==='tu' ? tu : p[3]==='pr' ? pr : th;
    if(S.marks[k]==='p') c.p++; else if(S.marks[k]==='a') c.a++;
  }
  return {th,tu,pr};
}
/* backfilled counters + everything marked = the real numbers */
function attFor(subId){
  const m=S.att[subId]||{};
  const th={p:(m.thp??m.p)||0, a:(m.tha??m.a)||0};
  const tu={p:m.tup||0, a:m.tua||0};
  const pr={p:m.prp||0, a:m.pra||0};
  const d=marksOnly(subId);
  th.p+=d.th.p; th.a+=d.th.a;
  tu.p+=d.tu.p; tu.a+=d.tu.a;
  pr.p+=d.pr.p; pr.a+=d.pr.a;
  th.t=th.p+th.a; tu.t=tu.p+tu.a; pr.t=pr.p+pr.a;
  return {th,tu,pr,
    p:th.p+tu.p+pr.p, a:th.a+tu.a+pr.a, t:th.t+tu.t+pr.t};
}
const pctOf=(p,t)=> t? p/t*100 : 0;
/* Two decimals, because that is what the college portal prints and the two
   numbers have to be reconcilable at a glance — 76.92% here and 76.92%
   there. A whole number keeps its clean form: 80%, not 80.00%. */
const pctFmt=n=>{ const r=Math.round(n*100)/100; return r%1===0?String(Math.round(r)):r.toFixed(2); };

/* DU / SBSC attendance-marks slab, out of 5 */
function attMarks(p,t){
  if(!t) return null;
  const q=pctOf(p,t);
  return q>85?5:q>80?4:q>75?3:q>70?2:q>67?1:0;
}
/* how many more can be missed / must be attended */
function canMiss(p,t){ const T=S.thr/100; return t? Math.floor(p/T - t) : 0; }
function mustAttend(p,t){
  const T=S.thr/100;
  if(T>=1) return Infinity;      /* 100% required — one absence can never be undone */
  return Math.ceil((T*t-p)/(1-T));
}

function bunkLine(p,t){
  if(!t) return T('No classes recorded.','No classes recorded yet.','Nothing recorded yet — mark a few classes.','No data. A blank slate, for now.');
  if(pctOf(p,t)>=S.thr){
    const m=canMiss(p,t);
    if(m>0) return T(
      m+' class'+(m===1?'':'es')+' may be missed while staying at or above '+S.thr+'%.',
      'You can miss '+m+' more and stay above '+S.thr+'%.',
      'You’ve got '+m+' free skip'+(m===1?'':'s')+' before you drop below '+S.thr+'%.',
      m+' skip'+(m===1?'':'s')+' in the bank. Spend '+(m===1?'it':'them')+' wisely.');
    return T('At the minimum threshold. No further absences permitted.',
      'Right on the line — don’t miss the next one.',
      'You’re exactly on the line. Next one is compulsory.',
      'Dead on the line. One more and the maths turns on you.');
  }
  const n=mustAttend(p,t);
  if(!isFinite(n)) return T(
    'Below the required 100%. Once a class is missed, the requirement cannot be met again.',
    'You need 100% — a missed class can’t be made up.',
    'At a 100% requirement, a missed class can’t be recovered. Worth double-checking that number.',
    'You set the bar at 100%. There is no recovering from this. Bold choice.');
  return T(
    'Below the required '+S.thr+'%. '+n+' consecutive class'+(n===1?'':'es')+' required to recover.',
    'Below '+S.thr+'% — attend the next '+n+' to get back.',
    'Below '+S.thr+'%. Attend the next '+n+' in a row and you’re clear.',
    'Below '+S.thr+'%. '+n+' straight classes to dig out. No pressure.');
}

/* what happens to this subject's % if today's class is skipped */
function skipImpact(subId){
  const A=attFor(subId);
  const now=pctOf(A.p,A.t), after=pctOf(A.p,A.t+1);
  return {now,after,safe:after>=S.thr,has:A.t>0};
}

/* ── "what if I skip the whole day?" ──────────────────────────────
   Costs out skipping every class still unmarked today: what each
   subject drops to, what it would take to climb back, and whether
   it's worth it.                                                   */
function skipDayLabel(iso){
  const n=Math.round((dateOf(iso)-dateOf(todayISO()))/864e5);
  return n===0 ? 'today' : n===1 ? 'tomorrow'
    : dateOf(iso).toLocaleDateString(undefined,{weekday:'long'});
}
function skipDayImpact(iso){
  const dow=dowOf(dateOf(iso));
  const pending=slotsOn(dow,iso).filter(sl=>subById(sl.subId)&&!S.marks[markKey(iso,sl)]);
  if(!pending.length) return null;

  const bySub={};
  pending.forEach(sl=>{ (bySub[sl.subId]=bySub[sl.subId]||[]).push(sl); });

  const rem=remainingBySub(iso);
  const rows=Object.keys(bySub).map(id=>{
    const A=attFor(id), n=bySub[id].length;
    const now=pctOf(A.p,A.t), after=pctOf(A.p,A.t+n);
    const rw=runwayVerdict(id, rem?rem[id]||0:null, n);
    return {sub:subById(id), n, now, after, had:A.t, rw,
            safe: rw.level==='ok'||rw.level==='none',
            wasSafe: A.t ? now>=S.thr : true,
            recover: (A.t && after<S.thr) ? mustAttend(A.p, A.t+n) : 0};
  }).sort((a,b)=>RUNWAY_RANK[b.rw.level]-RUNWAY_RANK[a.rw.level] || a.after-b.after);

  let GP=0,GT=0; S.subs.forEach(s=>{ const a=attFor(s.id); GP+=a.p; GT+=a.t; });
  const n=pending.length;
  /* the ones this skip actually pushes under the line */
  /* judged on whether the threshold stays REACHABLE, not on today's number */
  const breaks  = rows.filter(r=>r.rw.level==='gone');
  const already = rows.filter(r=>r.rw.level==='risk');
  const worst   = rows.reduce((w,r)=>Math.max(w,RUNWAY_RANK[r.rw.level]),0);
  const verdict = worst>=2 ? 'no' : worst===1 ? 'tight' : 'ok';
  return {rows, pending, count:n, breaks, already, verdict, iso, rem,
          weeksLeft:termWeeksLeft(),
          when:skipDayLabel(iso),
          now:pctOf(GP,GT), after:pctOf(GP,GT+n), hasHistory:GT>0};
}
/* Today if there's anything left to skip, otherwise the next day that has
   classes — so the feature is reachable on a Sunday too, not hidden. */
/* ── tomorrow, and when to set the alarm ──────────────────────────
   Travel time is a setting rather than a live Maps lookup: the app has
   no network by design, and your college doesn't move. Online-only days
   skip the commute entirely, so you get a later wake-up.            */
const m2t = m => { m=((Math.round(m)%1440)+1440)%1440;
  return fmtT(pad2(Math.floor(m/60))+':'+pad2(m%60)); };
/* The commute is not one number — an 8am run is nothing like a midday one,
   so travel is banded by when you'd actually be on the road. */
const TRAVEL_BANDS=[
  ['travelAM', 0,       9*60,  'before 9am'],
  ['travelMid',9*60,   15*60,  '9am – 3pm'],
  ['travelPM', 15*60,  24*60,  'after 3pm']
];
function travelFor(startMin){
  const b=TRAVEL_BANDS.find(x=>startMin>=x[1]&&startMin<x[2])||TRAVEL_BANDS[2];
  return clamp(+S[b[0]]||0,0,300);
}
const plannerReady = () => S.planner &&
  ((S.readyMin||0)>0||(S.readyMax||0)>0) &&
  ((S.travelAM||0)>0||(S.travelMid||0)>0||(S.travelPM||0)>0);

/* ── what you actually intend to attend that day ──────────────────
   Picking an option in "Worth going?" stores a plan for that date.
   Everything downstream — pickup time, wake time, the morning
   countdown — keys off the first class you're ACTUALLY going to,
   not the first one on the timetable.                            */
function liveSlots(iso){
  return slotsOn(dowOf(dateOf(iso)),iso)
    .filter(sl=>subById(sl.subId) && S.marks[markKey(iso,sl)]!=='c');
}
const planFor = iso => (S.plans&&Array.isArray(S.plans[iso])) ? S.plans[iso] : null;
/* Resolve a stored plan against what's actually on that day. A plan whose
   classes have since been deleted or cancelled is STALE — fall back to the
   normal day rather than silently claiming you're not going. An empty plan
   is different: that's you deliberately choosing to stay home. */
function resolvePlan(iso){
  const ids=planFor(iso), live=liveSlots(iso);
  if(!ids)        return {going:live, planned:false, stale:false};
  if(!ids.length) return {going:[],   planned:true,  stale:false};
  const kept=live.filter(sl=>ids.indexOf(sl.id)>=0);
  if(!kept.length) return {going:live, planned:false, stale:true};
  return {going:kept, planned:true, stale:false};
}
function setPlan(iso,ids){
  if(!S.plans) S.plans={};
  if(ids===null) delete S.plans[iso]; else S.plans[iso]=ids.slice();
  save();
}
function dayPlan(iso){
  const d=dateOf(iso), dow=dowOf(d);
  const list=liveSlots(iso);
  if(!list.length) return {iso,d,list:[],none:true};
  const rp=resolvePlan(iso);
  const going=rp.going, planned=rp.planned;
  const first=going[0]||null;                /* the class you're actually going to */
  if(!first) return {iso,d,list,going:[],planned,skippingAll:true,
                     none:false,configured:plannerReady(),
                     leaveAt:null,wakeAt:null,travel:0};
  const allOnline=going.every(sl=>sl.online);
  /* Travel is about the first class you have to physically get to. Basing it
     on going[0] when that one is online gives "leave at 4pm for your 4pm
     class" — the leave time collapses onto the class time because there is
     no journey. Departure hangs off the first ON-CAMPUS class, and a day
     with none has no departure at all. */
  const firstOnsite=going.find(sl=>!sl.online)||null;
  const start=t2m(first.start), configured=plannerReady();
  const travelStart = firstOnsite ? t2m(firstOnsite.start) : null;
  const travel   = (configured && firstOnsite) ? travelFor(travelStart) : 0;
  const leaveAt  = (configured && firstOnsite) ? travelStart-travel : null;
  const wakeAt   = (configured && firstOnsite) ? leaveAt-(S.readyMax||0) : null;
  return {iso, d, list, going, planned, skippingAll:false,
          first, firstOnsite, allOnline, travel, start, configured,
          leaveAt, wakeAt,
          wakeRushed: (configured&&firstOnsite) ? leaveAt-(S.readyMin||0) : null,
          dayBefore: configured && wakeAt!=null && wakeAt<0};
}
const tomorrowPlan = () => dayPlan(isoOf(addDays(new Date(),1)));

/* The next day you actually have class — today if classes are still to come,
   otherwise the next one within a fortnight. Weekends and cancelled days are
   skipped, so the card never says "tomorrow: nothing". */
function nextClassDay(){
  const mins=nowMin();
  for(let i=0;i<15;i++){
    const iso=isoOf(addDays(new Date(),i));
    const p=dayPlan(iso);
    if(p.none) continue;
    /* Today only counts while something is genuinely still ahead: not yet
       over AND not already marked. Once you've marked the last one, the day
       is done and the next class day is what you need — no clock involved. */
    if(i===0 && !p.list.some(sl=>t2m(sl.end)>mins && !S.marks[markKey(iso,sl)])) continue;
    return {iso, offset:i, plan:p};
  }
  return null;
}

/* You marked a class present, in a room, on campus. Everything after that
   about "when to leave" and "are you on your way" is answering a question
   you settled by being there — the journey happened. A later class today
   needs no second commute, so the countdown gives way to what's next.   */
function onCampusNow(){
  const iso=todayISO(), now=nowMin();
  return liveSlots(iso).some(sl=>
    !sl.online && S.marks[markKey(iso,sl)]==='p' && t2m(sl.start)<=now);
}

/* ══════════════ THE WAY BACK ══════════════
   Every journey has a return leg, and the app only ever knew about the way
   in. Once the classes you were there for are done, what you want is when
   you'll be home — and, if someone collects you, what time to tell them.
   Only in-person classes count: you don't come home from an online one.   */
function homewardStatus(){
  if(!plannerReady()) return null;
  const iso=todayISO(), now=nowMin();
  const p=dayPlan(iso);
  if(p.none||p.skippingAll) return null;
  /* the classes you were actually on campus for — cancelled and absent
     don't put you there, and online ones never did */
  const onsite=p.going.filter(sl=>{
    const m=S.marks[markKey(iso,sl)];
    return !sl.online && m!=='c' && m!=='a';
  });
  if(!onsite.length) return null;
  /* Still something to sit through? Then you're not going anywhere. Marking
     a class present is you telling the app you're done with it — an hour
     that's marked is over regardless of what the timetable says, which is
     the whole point of marking it. */
  const pending=onsite.filter(sl=>!S.marks[markKey(iso,sl)] && t2m(sl.end)>now);
  if(pending.length) return null;
  const lastEnd=onsite.reduce((e,sl)=>Math.max(e,t2m(sl.end)),0);
  /* out early because you marked it early: the day ended when you said so */
  const endedAt=Math.min(lastEnd, now);
  const travel=travelFor(Math.max(endedAt,now));
  /* and stop saying it once you'd be home anyway */
  if(now>endedAt+travel+45) return null;
  const leaveAt=Math.max(endedAt,now);
  return {lastEnd, endedAt, travel, leaveAt, homeBy:leaveAt+travel,
          early: endedAt<lastEnd,
          waited: now-endedAt, last:onsite[onsite.length-1]};
}

/* ── the morning question: how long have I got, and can I shower? ──
   Recomputed against the clock every minute while Today is open.     */
function morningStatus(){
  if(!plannerReady()) return null;
  const iso=todayISO();
  const p=dayPlan(iso);
  if(p.none||p.skippingAll) return null;
  const now=nowMin();
  /* A class you've already marked is dealt with — present, absent or
     cancelled alike. Travel advice is only about classes you still have
     to physically get to, so telling you you're late for one you've
     already recorded present is worse than saying nothing. */
  const pending=p.going.filter(sl=>!S.marks[markKey(iso,sl)] && t2m(sl.end)>now);
  if(!pending.length) return null;
  /* already there — see onCampusNow. "Next up" takes over from here, which
     is the useful thing to show someone sitting in college with a gap. */
  if(onCampusNow()) return null;
  const first=pending[0];
  const start=t2m(first.start);
  const travel=first.online?0:travelFor(start);
  const leaveAt=start-travel;
  const untilLeave=leaveAt-now, untilClass=start-now;
  /* if you've said you're on your way, stop counting down to a departure
     that already happened and start counting to arrival instead.
     There is nothing to arrive for if the next class is online, so the
     travelling state only applies when you're actually heading somewhere. */
  /* It also expires on its own. Left standing, one tap in the morning has
     you "arriving" all day — including from a seat in the classroom. Once
     you'd have got there (plus a little slack), you have arrived. */
  const er = (S.enroute && S.enroute.iso===iso && !first.online &&
              now < S.enroute.at + travel + 30) ? S.enroute : null;
  const level = er                            ? 'enroute'
              : untilLeave<0                  ? 'late'
              : untilLeave>=(S.readyMax||0)   ? 'relaxed'
              : untilLeave>=(S.readyMin||0)   ? 'quick'
              : 'tight';
  /* hand back a plan-shaped object keyed to the class actually pending */
  const pp=Object.assign({},p,{first,start,travel,leaveAt,
    wakeAt:leaveAt-(S.readyMax||0)});
  const arriveAt = er ? er.at+travel : now+travel;
  return {p:pp, now, untilLeave, untilClass, level, arriveAt, enroute:er,
          atHome: !!first.online,   /* nothing to travel to — you're already there */
          lateBy: Math.max(0, arriveAt-start)};
}
const MORNING_COLOUR={relaxed:'var(--green)',quick:'var(--orange)',tight:'var(--orange)',
                      late:'var(--red)',enroute:'var(--accent)'};

function nextSkipDay(){
  for(let i=0;i<8;i++){
    const x=skipDayImpact(isoOf(addDays(new Date(),i)));
    if(x) return x;
  }
  return null;
}
/* ── runway: how much semester is left to fix things in ───────────
   The whole point. Missing a class in August is cheap because there
   are eighty more; missing the same class in December is not. Given
   the term end date we can count what's actually left and answer the
   real question — is the threshold still REACHABLE — instead of the
   useless one, are you above it today.                              */
/* `toISO` lets a caller ask about a window shorter than the term — the goal
   has its own deadline, while eligibility is still judged at term end. */
function remainingBySub(fromISO,toISO){
  const horizon=toISO||S.termEnd;
  if(!horizon) return null;
  const end=dateOf(horizon), out={};
  let d=dateOf(fromISO);
  for(let i=0;i<400;i++){
    const iso=isoOf(d);
    if(dateOf(iso)>end) break;
    slotsOn(dowOf(d),iso).forEach(sl=>{
      if(!subById(sl.subId)) return;
      if(S.marks[markKey(iso,sl)]) return;     /* already settled */
      out[sl.subId]=(out[sl.subId]||0)+1;
    });
    d=addDays(d,1);
  }
  return out;
}
/* How many of the remaining classes you can still miss and finish at or
   above the threshold. Negative means the threshold is already out of
   reach even attending everything left. */
function slackFor(subId,remaining){
  const A=attFor(subId), T=S.thr/100, k=remaining||0;
  return Math.floor(A.p + k - T*(A.t + k) + 1e-9);
}
const termWeeksLeft=()=>{
  if(!S.termEnd) return null;
  return Math.max(0,Math.ceil(daysTo(S.termEnd)/7));
};
/* verdict for missing `n` classes of one subject, given the runway */
/* ══════════════ WHEN A GOAL CAN LAND ══════════════
   "85% by Friday" is not a goal, it is arithmetic that has already failed.
   From p of t, attending every one of the next k classes gives (p+k)/(t+k),
   and that only reaches g when k >= (g·t − p)/(1 − g). So the soonest the
   goal can possibly land is the day the k-th class falls on — attend all
   of them, miss nothing. Any date before that is not a stretch, it is
   impossible, and the app should say which.

   At g = 100% the divisor is zero and the answer is never: a single absence
   already on the record can't be undone by attending anything.            */
function goalHorizon(){ return S.goalBy || S.termEnd || ''; }
function classesBetween(fromISO,toISO){
  if(!toISO) return null;
  const end=dateOf(toISO); let n=0, d=dateOf(fromISO);
  for(let i=0;i<400 && d<=end;i++){
    const iso=isoOf(d);
    n+=liveSlots(iso).filter(sl=>!S.marks[markKey(iso,sl)]).length;
    d=addDays(d,1);
  }
  return n;
}
function earliestGoalDate(goalPct){
  let P=0,T=0;
  S.subs.forEach(sb=>{ const A=attFor(sb.id); P+=A.p; T+=A.t; });
  const g=(+goalPct||0)/100;
  if(!T) return {iso:null, unknown:true};
  if(pctOf(P,T)>=goalPct) return {iso:todayISO(), already:true, need:0};
  if(g>=1) return {iso:null, never:true, need:null};
  const need=Math.ceil((g*T-P)/(1-g)-1e-9);
  if(need<=0) return {iso:todayISO(), already:true, need:0};
  /* walk forward until that many classes have gone by */
  let n=0, d=dateOf(todayISO());
  for(let i=0;i<400;i++){
    const iso=isoOf(d);
    n+=liveSlots(iso).filter(sl=>!S.marks[markKey(iso,sl)]).length;
    if(n>=need) return {iso, need, byThen:n};
    d=addDays(d,1);
  }
  return {iso:null, need, tooFar:true};
}

/* ══════════════ THE GOAL ══════════════
   Two things people actually want, which turn out to be one thing.

   Climbing: "I want to be at 75%." From p attended of t held, with k classes
   still to come, you must attend x of them where (p+x)/(t+k) >= G. So
   x = ceil(G(t+k) - p), and anything left over — k - x — is slack you may
   spend. Below the goal the slack is what you must NOT spend; at or above it,
   the same number is what you're free to spend.

   Holding: "I'm at 75%, keep me there." Attending lifts the ratio, missing
   drops it, so holding steady means attending a fixed FRACTION of what's
   held: after n more classes, attending a of them leaves (p+a)/(t+n), and
   setting that equal to p/t gives a = n·(p/t). At 75% that is three of every
   four — no budget, just a rhythm.

   So one number, two phases, and the app works out which you're in.        */
function bestFraction(x, maxDen){
  /* the simplest "a of every b" that lands closest to x — 0.75 → 3 of 4 */
  maxDen=maxDen||8;
  let best=null;
  for(let d=1; d<=maxDen; d++){
    const n=Math.round(x*d);
    if(n<=0 || n>=d) continue;               /* 0-of and all-of say nothing */
    const err=Math.abs(n/d - x);
    if(!best || err < best.err - 1e-12) best={n, d, err};
  }
  return best;
}
/* how a single subject stands against the goal */
function goalFor(subId, remaining){
  const G=(+S.goal||0)/100;
  if(!G) return null;
  const A=attFor(subId);
  const k=(remaining===null||remaining===undefined) ? null : (remaining||0);
  const cur=pctOf(A.p,A.t);
  const out={goal:+S.goal, cur, had:A.t, p:A.p,
             phase: (A.t && cur>=+S.goal) ? 'hold' : 'climb'};
  if(k===null){ out.unknown=true; return out; }
  out.remaining=k;
  /* classes of the k you must attend to finish at or above the goal */
  const need=Math.ceil(G*(A.t+k) - A.p - 1e-9);
  out.need  = clamp(need,0,k);
  out.slack = k - out.need;                 /* how many you may miss */
  out.reachable = need<=k;
  if(!out.reachable){
    /* the best you can do is attend every one that's left */
    out.best = pctOf(A.p+k, A.t+k);
  }
  return out;
}
/* and the same question asked of everything at once */
function goalOverall(){
  const G=+S.goal||0;
  if(!G) return null;
  const rem=remainingBySub(todayISO(), goalHorizon());
  let P=0,T=0,K=0, anyUnknown=(rem===null);
  S.subs.forEach(sb=>{ const A=attFor(sb.id); P+=A.p; T+=A.t;
                       if(rem) K+=rem[sb.id]||0; });
  const cur=pctOf(P,T);
  const out={goal:G, cur, p:P, had:T,
             phase:(T && cur>=G) ? 'hold' : 'climb'};
  /* holding steady means attending this fraction of whatever comes */
  if(T){
    const f=bestFraction(P/T, 8);
    if(f) out.rhythm=f;
  }
  if(anyUnknown){ out.unknown=true; return out; }
  out.remaining=K;
  const need=Math.ceil((G/100)*(T+K) - P - 1e-9);
  out.need =clamp(need,0,K);
  out.slack=K-out.need;
  out.reachable = need<=K;
  if(!out.reachable) out.best=pctOf(P+K,T+K);
  /* the subjects standing between you and the goal, worst first */
  out.by=S.goalBy||'';
  out.earliest=earliestGoalDate(G);
  out.blocking=S.subs.map(sb=>({sub:sb, g:goalFor(sb.id, rem?rem[sb.id]||0:null)}))
    .filter(x=>x.g && (!x.g.reachable || x.g.phase==='climb'))
    .sort((a,b)=>(a.g.reachable?1:0)-(b.g.reachable?1:0) || a.g.cur-b.g.cur);
  return out;
}

function runwayVerdict(subId,remaining,n){
  const A=attFor(subId);
  if(!A.t && !remaining) return {level:'none'};
  if(remaining===null||remaining===undefined)      /* no term date set */
    return {level: pctOf(A.p,A.t+n)>=S.thr?'ok':'risk', unknown:true};
  const slack=slackFor(subId,remaining);
  const after=slack-n;
  return {level: after<0 ? 'gone' : after<=2 ? 'tight' : 'ok',
          slack, after, remaining};
}
const RUNWAY_RANK={ok:0,tight:1,risk:2,gone:3,none:0};

/* ── "is the trip even worth it?" ─────────────────────────────────
   Different question from "can I skip one class". Once cancellations
   land you can end up with 8–9 and 12–1 and three dead hours between.
   You arrive once and leave once, so the sensible choices are the
   contiguous runs of class-blocks — plus not going at all.          */
const GAP_MIN=45;                 /* a gap longer than this splits the day */
function dayBlocks(iso){
  /* Only in-person classes make campus blocks. An online class is taken from
     home, so it can never create a gap you'd have to sit through — treating
     it as campus time invents waiting that doesn't exist. */
  const list=liveSlots(iso).filter(sl=>!sl.online);
  const blocks=[];
  list.forEach(sl=>{
    const s=t2m(sl.start), e=t2m(sl.end);
    const last=blocks[blocks.length-1];
    if(last && s-last.end<=GAP_MIN){ last.slots.push(sl); last.end=Math.max(last.end,e); }
    else blocks.push({slots:[sl], start:s, end:e});
  });
  return blocks;
}
/* ══════════════ WHAT A CHOICE COSTS ══════════════
   Given the exact classes you say you're attending — a preset combination,
   or a set you ticked by hand — work out the shape of the day and what it
   does to your attendance. Everything that offers you a choice runs through
   here, so a hand-picked day is judged by exactly the same rules as a
   suggested one. */
function planImpact(iso, ids, rem){
  /* `rem` — remaining classes per subject — is the expensive part, and it is
     identical for every option on a given day. Callers weighing several
     options work it out once and pass it in. */
  const live=liveSlots(iso);
  const inSet={}; (ids||[]).forEach(i=>{ inSet[i]=1; });
  const attend=live.filter(sl=>inSet[sl.id]);
  const onsite=attend.filter(sl=>!sl.online);        /* only these need travel */
  const settled=sl=>{ const m=S.marks[markKey(iso,sl)]; return m==='p'||m==='a'; };
  const skipped=live.filter(sl=>!inSet[sl.id] && !settled(sl));
  if(rem===undefined) rem=remainingBySub(iso);

  const bySub={};
  skipped.forEach(sl=>{ bySub[sl.subId]=(bySub[sl.subId]||0)+1; });
  const rows=Object.keys(bySub).map(id=>{
    const A=attFor(id), n=bySub[id];
    const now=pctOf(A.p,A.t), after=pctOf(A.p,A.t+n);
    const rw=runwayVerdict(id, rem?rem[id]||0:null, n);
    return {sub:subById(id), n, now, after, had:A.t, rw,
            safe: rw.level==='ok'||rw.level==='none'};
  }).sort((a,b)=>RUNWAY_RANK[b.rw.level]-RUNWAY_RANK[a.rw.level] || a.after-b.after);

  /* on campus from the first class you turn up for to the last you stay for */
  const onCampus = onsite.length
    ? t2m(onsite[onsite.length-1].end)-t2m(onsite[0].start) : 0;
  const campusContact = onsite.reduce((n,sl)=>n+(t2m(sl.end)-t2m(sl.start)),0);
  const contact  = attend.reduce((n,sl)=>n+(t2m(sl.end)-t2m(sl.start)),0);
  const first    = onsite[0]||null;
  const travel   = (first && plannerReady()) ? travelFor(t2m(first.start)) : 0;

  return {
    iso, attend, onsite, skipped, rows,
    onlineCount: attend.filter(sl=>sl.online).length,
    count:attend.length, onCampus, contact, dead:onCampus-campusContact,
    allOnline: attend.length ? attend.every(sl=>sl.online) : false,
    first, travel,
    leaveHome: first ? t2m(first.start)-travel : null,
    wakeAt: (first&&plannerReady()) ? t2m(first.start)-travel-(S.readyMax||0) : null,
    worst: rows.reduce((w,r)=>Math.max(w,RUNWAY_RANK[r.rw.level]),0),
    gone:   rows.some(r=>r.rw.level==='gone'),
    unsafe: rows.some(r=>r.rw.level==='gone'||r.rw.level==='risk'),
    ids: attend.map(sl=>sl.id)
  };
}

function dayOptions(iso){
  const live=liveSlots(iso);
  if(!live.length) return null;
  const onlineSlots=live.filter(sl=>sl.online);
  const blocks=dayBlocks(iso);                 /* in-person only */
  const rem=remainingBySub(iso);
  const all=live;
  const settled=sl=>{ const m=S.marks[markKey(iso,sl)]; return m==='p'||m==='a'; };

  /* `run` is a contiguous stretch of campus blocks; online classes ride along
     free unless you explicitly write the whole day off. The judging itself
     lives in planImpact — this only decides which classes are in, and what
     to call the result. */
  const build=(run, withOnline)=>{
    const onsite=[].concat.apply([],run.map(b=>b.slots));
    const ids=onsite.map(sl=>sl.id)
      .concat(withOnline?onlineSlots.map(sl=>sl.id):[]);
    const o=planImpact(iso, ids, rem);

    let label;
    if(!o.count)                        label='Skip everything';
    else if(!o.onsite.length)           label='Stay home — online only';
    else if(run.length===blocks.length) label = o.onlineCount ? 'Everything (online from home)'
                                                             : 'Go for everything';
    else label = fmtT(o.onsite[0].start)+'–'+
                 fmtT(o.onsite[o.onsite.length-1].end)+' on campus';
    return Object.assign(o, {run, label});
  };

  const opts=[];
  for(let i=0;i<blocks.length;i++)
    for(let j=i;j<blocks.length;j++) opts.push(build(blocks.slice(i,j+1),true));
  if(onlineSlots.length) opts.push(build([],true));   /* stay home, still attend online */
  opts.push(build([],false));                          /* write the day off entirely */

  const best=opts.slice().sort((a,b)=>
    (a.worst-b.worst) || (a.dead-b.dead) || (b.count-a.count))[0];
  const full=opts.find(o=>o.run.length===blocks.length && o.onlineCount===onlineSlots.length)
           || opts[0];
  return {iso, blocks, all, onlineSlots, opts, best, rem,
          weeksLeft: termWeeksLeft(), full};
}

/* Re-render without the page jumping under your finger. Marking a class can
   change the content above it (a row appears or disappears), which used to
   shift everything mid-tap. */
function keepScroll(fn){
  const y=(typeof window!=='undefined'&&window.scrollY)||0;
  fn();
  if(y&&typeof window!=='undefined'&&window.scrollTo) window.scrollTo(0,y);
}
function setMark(key,v){

/* ══════════════ TIMETABLE (one day at a time) ══════════════ */
