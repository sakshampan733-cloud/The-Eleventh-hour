/* ── swipe between days ──────────────────────────────────────────
   Attached to the whole Classes screen, so dragging the date strip
   works as well as dragging the list under it. The card follows your
   finger while you drag, so it's obvious the gesture is live.      */
(function(){
  /* The timetable lives inside Term now. Guarded as well, because one
     missing node here throws and takes every line of script after it with
     it — which is what turned the whole app into a black screen. */
  const sec=document.getElementById('term');
  if(!sec) return;
  const body=()=>document.getElementById('vClasses');
  let x0=null, y0=null, drag=false;

  const settle=()=>{ const b=body(); if(b){ b.style.transition=''; b.style.transform=''; } };
  const reset=()=>{ x0=null; drag=false; settle(); };

  sec.addEventListener('touchstart',e=>{
    if(e.touches.length!==1){ reset(); return; }
    /* the date rail scrolls itself — don't also step the day underneath it */
    if(e.target&&e.target.closest&&e.target.closest('#vRail,.switch')){ reset(); return; }
    x0=e.touches[0].clientX; y0=e.touches[0].clientY; drag=false;
  },{passive:true});

  sec.addEventListener('touchmove',e=>{
    if(x0===null||e.touches.length!==1) return;
    const dx=e.touches[0].clientX-x0, dy=e.touches[0].clientY-y0;
    /* commit to a horizontal drag once it clearly beats vertical movement */
    if(!drag && Math.abs(dx)>10 && Math.abs(dx)>Math.abs(dy)) drag=true;
    if(drag){
      const b=body();
      if(b){ b.style.transition='none'; b.style.transform='translateX('+(dx*0.4).toFixed(1)+'px)'; }
    }
  },{passive:true});

  sec.addEventListener('touchend',e=>{
    if(x0===null) return;
    const dx=e.changedTouches[0].clientX-x0, dy=e.changedTouches[0].clientY-y0;
    const wasDrag=drag;
    reset();
    if(!wasDrag) return;
    /* only needs to beat vertical drift, not dominate it — a real thumb
       swipe on a phone always drifts a bit */
    if(Math.abs(dx)<38||Math.abs(dx)<Math.abs(dy)) return;
    lastSwipe=Date.now();                 /* suppress the click a swipe can emit */
    ttDate=addDays(ttDate, dx<0?1:-1);
    renderTT();
    const b=body();
    if(b){ b.classList.remove('slideL','slideR'); void b.offsetWidth;
           b.classList.add(dx<0?'slideL':'slideR'); }
  },{passive:true});

  sec.addEventListener('touchcancel',reset,{passive:true});
})();

/* The card reads differently in each phase, because the question is
   different: climbing you want to know what it takes, holding you want to
   know what you can get away with. */
/* The margin, drawn. `spare` is how many classes you can still miss and
   `total` how many are left in all — filled pips are yours to spend, hollow
   ones are already committed. Capped, because forty pips is a wall, not a
   reading. */

/* ══════════════ WHAT A WEEK HAS TO LOOK LIKE ══════════════
   The goal card gives you a total — "attend 34 of the 51 left" — which is
   true and useless on a Tuesday. What you actually plan in is weeks: this
   many classes on the timetable, this many you have to be at, this many
   you can let go. So the total is spread back over the real weeks left,
   using each week's own class count rather than an average, because a week
   with two classes and a week with twelve are not the same week.

   The misses are handed out proportionally with a running accumulator, so
   they add up to exactly the number you have — no week silently gains or
   loses one to rounding.                                                */
function weekPlan(){
  const horizon=goalHorizon();
  if(!horizon) return null;
  const end=dateOf(horizon);
  let P=0,T=0;
  S.subs.forEach(sb=>{ const A=attFor(sb.id); P+=A.p; T+=A.t; });

  /* every remaining class, grouped into the week it falls in */
  const weeks=[];
  let d=dateOf(todayISO()), guard=0;
  const startOfWeek=x=>{ const c=new Date(x); const w=(c.getDay()+6)%7; return addDays(c,-w); };
  let cur=null;
  while(d<=end && guard++<400){
    const iso=isoOf(d);
    const n=liveSlots(iso).filter(sl=>!S.marks[markKey(iso,sl)]).length;
    const ws=isoOf(startOfWeek(d));
    if(!cur || cur.ws!==ws){ cur={ws, from:iso, to:iso, classes:0, days:[]}; weeks.push(cur); }
    cur.to=iso;
    if(n){ cur.classes+=n; cur.days.push({iso, n}); }
    d=addDays(d,1);
  }
  const K=weeks.reduce((a,w)=>a+w.classes,0);
  if(!K) return {weeks:[], total:0, need:0, misses:0, had:T, p:P};

  const target=(+S.goal||S.thr)/100;
  const rawNeed=Math.ceil(target*(T+K)-P-1e-9);
  const need=clamp(rawNeed,0,K);
  const reachable=rawNeed<=K;
  let misses=K-need;

  /* hand the misses out in proportion to each week's own size */
  let acc=0, given=0;
  weeks.forEach((w,i)=>{
    acc += misses*(w.classes/K);
    let take = (i===weeks.length-1) ? misses-given : Math.floor(acc+1e-9)-given;
    take=clamp(take,0,w.classes);
    w.miss=take; w.attend=w.classes-take; given+=take;
  });

  /* and walk it forward so you can see where the number gets to */
  let p=P,t=T;
  weeks.forEach(w=>{ p+=w.attend; t+=w.classes; w.pct=pctOf(p,t); });

  /* Two different things get called "holding". Spending the surplus drifts
     you down to the goal and buys the most free classes — that is the plan
     above. Staying exactly where you are is a rate, not a budget: attend
     the same fraction you already have and the number does not move. When
     you are above the goal both are true, and only you know which you
     meant, so the sheet shows both. */
  const rate = T? P/T : 0;
  let sp=P, st=T;
  weeks.forEach(w=>{
    w.steady = w.classes ? Math.round(w.classes*rate) : 0;
    sp+=w.steady; st+=w.classes;
    w.steadyPct = pctOf(sp,st);
  });

  const withClasses=weeks.filter(w=>w.classes);
  const avgOf = withClasses.length
    ? Math.round(withClasses.reduce((a,w)=>a+w.classes,0)/withClasses.length) : 0;
  const avgAtt = withClasses.length
    ? Math.round(withClasses.reduce((a,w)=>a+w.attend,0)/withClasses.length) : 0;
  const avgSteady = withClasses.length
    ? Math.round(withClasses.reduce((a,w)=>a+w.steady,0)/withClasses.length) : 0;
  const curPct=pctOf(P,T);   /* `cur` is the week accumulator above */
  return {weeks, total:K, need, misses, reachable, had:T, p:P, cur:curPct,
          target:+S.goal||S.thr, usingGoal:!!S.goal,
          endsAt: t? pctOf(p,t) : 0,
          holding: T>0 && curPct>=(+S.goal||S.thr),
          steady:{classes:avgOf, attend:avgSteady, miss:avgOf-avgSteady,
                  endsAt: st? pctOf(sp,st) : 0},
          typical:{classes:avgOf, attend:avgAtt, miss:avgOf-avgAtt}};
}

/* ══════════════ ATTENDANCE APPEAL ══════════════
   End-of-semester: find every class you were marked absent for, work out
   how many need reversing to clear the threshold, and draft the message
   to the professor. Reversing an absence moves it to present — the total
   held is unchanged — so the maths is ceil(thr*total) - present.        */
function absencesFor(subId){
  const out=[];
  for(const k in S.marks){
    if(S.marks[k]!=='a') continue;
    const p=k.split('|');
    if(p[2]!==subId) continue;
    out.push({key:k, iso:p[0], kind:p[3]||'th',
              slot:S.slots.find(s=>s.id===p[1])||null});
  }
  return out.sort((a,b)=>a.iso.localeCompare(b.iso));
}
/* how many reversals it takes to reach the required percentage */
function reversalsNeeded(p,t){
  if(!t) return 0;
  if(pctOf(p,t)>=S.thr) return 0;
  return Math.max(0, Math.ceil(S.thr/100*t - p - 1e-9));
}

/* ══════════════ OFFLINE READINESS ══════════════
   A real check, not a badge. The file makes no network requests at all, so
   the only things that can actually stop it working offline are storage
   being blocked, or it being served from a URL the browser hasn't cached. */
function offlineReport(){
  let proto='';
  try{ proto=(location&&location.protocol)||''; }catch(e){}
  const local = proto==='file:' || proto==='';
  let storage='blocked', bytes=0;
  try{
    const probe='__eh_probe__';
    localStorage.setItem(probe,'1');
    if(localStorage.getItem(probe)==='1') storage='working';
    localStorage.removeItem(probe);
    bytes=(localStorage.getItem(KEY)||'').length;
  }catch(e){ storage='blocked'; }
  let online=null;
  try{ if(typeof navigator!=='undefined' && 'onLine' in navigator) online=!!navigator.onLine; }catch(e){}
  const standalone = (function(){
    try{ return !!(navigator.standalone ||
      (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches)); }
    catch(e){ return false; }
  })();
  /* Three real states, not a badge:
       blocked  — storage is off, nothing works properly at all
       hosted   — loaded from a URL. Every request the app makes is zero, but
                  the page itself still came off a server, and a browser is
                  free to drop its copy. Offline is likely, not guaranteed.
       local    — the file is on the device. This is the only unconditional yes. */
  /* hosted: is the worker actually in charge, or still settling? */
  let sw='none';
  try{
    if(!local && 'serviceWorker' in navigator)
      sw = navigator.serviceWorker.controller ? 'active' : 'pending';
  }catch(e){}
  const level = storage!=='working' ? 'blocked'
              : local               ? 'local'
              : sw==='active'       ? 'cached'
              : sw==='pending'      ? 'pending'
              : 'hosted';
  return {proto, local, storage, bytes, online, standalone, level, sw,
          ready: storage==='working'};
}

/* ══════════════ LEAVE ══════════════
   "I'm out 4th–15th — what does that cost me, and can I still recover?"
   Counts every class in the window that isn't already settled, then judges
   it against the runway exactly like a single-day skip.                  */
function absenceRange(fromISO,toISO){
  if(!fromISO||!toISO) return null;
  if(dateOf(toISO)<dateOf(fromISO)){ const t=fromISO; fromISO=toISO; toISO=t; }
  const bySub={}, byDay=[];
  let total=0, d=dateOf(fromISO);
  for(let i=0;i<400;i++){
    const iso=isoOf(d);
    if(dateOf(iso)>dateOf(toISO)) break;
    const hits=liveSlots(iso).filter(sl=>!S.marks[markKey(iso,sl)]);
    if(hits.length){
      byDay.push({iso,d:dateOf(iso),slots:hits});
      hits.forEach(sl=>{ bySub[sl.subId]=(bySub[sl.subId]||0)+1; total++; });
    }
    d=addDays(d,1);
  }
  const rem=remainingBySub(todayISO());
  const rows=Object.keys(bySub).map(id=>{
    const A=attFor(id), n=bySub[id];
    const now=pctOf(A.p,A.t), after=pctOf(A.p,A.t+n);
    const rw=runwayVerdict(id, rem?rem[id]||0:null, n);
    return {sub:subById(id), n, now, after, had:A.t, rw};
  }).sort((a,b)=>RUNWAY_RANK[b.rw.level]-RUNWAY_RANK[a.rw.level] || a.after-b.after);
  const worst=rows.reduce((w,r)=>Math.max(w,RUNWAY_RANK[r.rw.level]),0);
  const days=Math.round((dateOf(toISO)-dateOf(fromISO))/864e5)+1;
  /* the headline you actually came for: one number, before and after */
  let GP=0,GT=0;
  S.subs.forEach(sb=>{ const A=attFor(sb.id); GP+=A.p; GT+=A.t; });
  const overallNow=pctOf(GP,GT), overallAfter=pctOf(GP,GT+total);
  return {fromISO,toISO,days,total,byDay,rows,worst,
          overallNow, overallAfter, overallDrop:overallNow-overallAfter,
          overallHad:GT,
          verdict: worst>=2?'gone':worst===1?'tight':'ok',
          weeksLeft:termWeeksLeft()};
}
/* the longest leave you could take starting that day and still recover */
function longestSafeLeave(fromISO,cap){
  cap=cap||45;
  let best=0;
  for(let n=1;n<=cap;n++){
    const r=absenceRange(fromISO, isoOf(addDays(dateOf(fromISO),n-1)));
    if(!r || r.worst>=2) break;
    best=n;
  }
  return best;
}

function fmtLong(iso){

    {day:'numeric',month:'long',year:'numeric'});
}
function leaveApplication(from,to,kind,detail,addressee){
  const K=LEAVE_KINDS.find(x=>x.k===kind)||LEAVE_KINDS[0];
  const r=absenceRange(from,to);
  const d=(detail||'').trim().replace(/[.\s]+$/,'');
  const days=r?r.days:1;
  const who=(addressee||'').trim()||'The Head of Department';
  const me=(S.name||'').trim();
  const sameDay=from===to;

  const L=[];
  L.push('To,');
  L.push(who+',');
  if(S.college && S.college.trim()) L.push(S.college.trim()+',');
  L.push('');
  L.push('Subject: Application for leave '+(sameDay?'on ':'from ')+
         fmtLong(from)+(sameDay?'':' to '+fmtLong(to)));
  L.push('');
  L.push('Respected Sir/Ma’am,');
  L.push('');

  let intro='I am writing to request leave ';
  intro += sameDay ? 'on '+fmtLong(from) : 'from '+fmtLong(from)+' to '+fmtLong(to);
  intro += ' ('+days+' day'+(days===1?'':'s')+'), ';
  intro += (d ? K.line(d) : K.bare)+'.';
  const who_am_i = me
    ? 'I am '+me+(S.course&&S.course.trim()?', a student of '+S.course.trim():'')+
      (S.roll&&S.roll.trim()?' (Roll no. '+S.roll.trim()+')':'')+'. '
    : '';
  L.push(who_am_i+intro);
  L.push('');

  if(r && r.total)
    L.push('I understand this will mean missing '+r.total+' class'+
      (r.total===1?'':'es')+(r.rows.length>1?' across '+r.rows.length+' subjects':'')+
      '. I will cover the syllabus taught in my absence and submit any work due on time.');
  else
    L.push('I will cover any work taught in my absence and submit it on time.');
  if(K.note) L.push(K.note);
  L.push('');
  L.push('I request you to kindly grant me leave for the above period and to consider '+
         'the same while computing my attendance.');
  L.push('');
  L.push('Thanking you,');
  L.push('Yours sincerely,');
  if(me) L.push(me);
  if(S.course && S.course.trim())
    L.push(S.course.trim()+(S.roll&&S.roll.trim()?' · Roll no. '+S.roll.trim():''));
  else if(S.roll && S.roll.trim()) L.push('Roll no. '+S.roll.trim());
  L.push(fmtLong(todayISO()));
  return L.join('\n');
}

function leadHours(d){
  if(!d.done||!d.doneAt) return null;
  return (new Date(d.date+'T23:59:59').getTime()-d.doneAt)/3600000;

function leadTag(h){
  if(h===null||h===undefined) return null;
  if(h<0)  return {k:'late', t:'Missed it'};
  if(h<12) return {k:'wire', t:'Eleventh hour'};
  if(h<48) return {k:'close',t:'Cut it close'};
  return {k:'early',t:'Ahead of it'};
}
function procScore(){
  const done=S.dls.filter(d=>d.done&&d.doneAt);
  if(!done.length) return null;
  const recent=done.slice().sort((a,b)=>b.doneAt-a.doneAt).slice(0,10);
  const avg=recent.reduce((n,d)=>n+clamp(leadHours(d),-24,96),0)/recent.length;
  return {score:Math.round(clamp(100-(avg/72)*100,0,100)), avg, n:done.length};
}
function procLine(score){
  if(score<20) return T('Consistently ahead of deadlines.','You finish early.',
    'You finish things early. Genuinely impressive.','Suspiciously organised. Everything alright?');
  if(score<40) return T('Generally ahead of schedule.','Usually early.',
    'Mostly ahead of things. Keep it up.','Annoyingly on top of things.');
  if(score<60) return T('Completion times are close to due dates.','You finish around the deadline.',
    'You finish near the deadline. Very normal.','Respectably human. Neither hero nor cautionary tale.');
  if(score<80) return T('Completion typically occurs shortly before the deadline.','You cut it fine.',
    'You do cut it a bit fine.','Cutting it fine. Familiar.');
  return T('Completion typically occurs at or past the deadline.','You finish at the last minute.',
    'Last-minute is your default setting.','You are the reason this app is named what it is.');
}

   the URL is the interface. An automation that fires when you leave home

   and you never look at the app at all.

    const tab=get('tab');

/* ── the field ─────────────────────────────────────────────────────────
   The reference's hero is a WebGL canvas, and every attempt to fake it
   with CSS failed for the same reason: a radial-gradient disc sitting on
   a black page has a cut edge by definition. You said "the globe is half

   sphere.

   What the reference actually does, read off the rendered frames: one
   continuous flowing material fills the viewport, and the sphere is a
   BOUNDARY inside that material. The texture carries on outside the

  const loc=gl.getAttribLocation(pr,'p');
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);

  const uRes=gl.getUniformLocation(pr,'uRes'), uT=gl.getUniformLocation(pr,'uT'),
        uM=gl.getUniformLocation(pr,'uM'), uScroll=gl.getUniformLocation(pr,'uScroll'),
        uFade=gl.getUniformLocation(pr,'uFade'),
        uCold=gl.getUniformLocation(pr,'uCold');

  /* A full-screen fragment shader is paid for per pixel, so the pixel
     count is the whole performance story. Capping the ratio is what keeps
     this cheap on a phone. */
  let W=0,H=0;
  function size(){
    const dpr=Math.min(window.devicePixelRatio||1, innerWidth<820?1.25:1.5);
    const w=Math.round(innerWidth*dpr), h=Math.round(innerHeight*dpr);
    if(w===W&&h===H) return;
    W=w;H=h; cv.width=w; cv.height=h;
    cv.style.width=innerWidth+'px'; cv.style.height=innerHeight+'px';
    gl.viewport(0,0,w,h);
  }
  size();
  addEventListener('resize',size);

  /* The pointer is damped here rather than in the shader so the lag is
     real: the uniform genuinely trails the cursor and settles. */
  let mx=0.30,my=-0.12,tx=0.30,ty=-0.12;
  function aimGL(cx,cy){
    const m=Math.min(innerWidth,innerHeight);
    tx=(cx-innerWidth/2)/m; ty=-((cy-innerHeight/2)/m);
  }
  addEventListener('pointermove',e=>aimGL(e.clientX,e.clientY),{passive:true});
  addEventListener('touchmove',e=>{ if(e.touches&&e.touches[0]) aimGL(e.touches[0].clientX,e.touches[0].clientY); },{passive:true});

  let reduce=false;
  try{ reduce=matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(e){}

  let t0=performance.now(), clock=0, raf=0, running=true, fade=0;
  /* The cold open owns this: it starts gathered and is released when the
     door opens. Exposed on window so the opener does not need a handle
     on anything inside here. */
  let coldWant=window.__fieldReleased?0:1, cold=coldWant;
  window.__fieldOpen=function(){ coldWant=0; start(); };
  function frame(now){
    raf=0;
    const dt=Math.min(0.05,(now-t0)/1000); t0=now;
    if(!reduce) clock+=dt;
    mx+=(tx-mx)*Math.min(1,dt*3.2);
    my+=(ty-my)*Math.min(1,dt*3.2);
    fade+=(1-fade)*Math.min(1,dt*1.4);
    gl.uniform2f(uRes,W,H);
    gl.uniform1f(uT,clock);
    gl.uniform2f(uM,mx,my);
    const sy=(window.scrollY||0)/Math.max(1,innerHeight);
    gl.uniform1f(uScroll,sy*0.35);
    /* Past the hero the field steps back. The reference is bright where
       the display type is and near-black where the reading is; this app
       scrolls, so that has to follow the scroll rather than sit at a
       fixed height on the glass. */
    gl.uniform1f(uFade,fade*(1.0-0.80*Math.min(1,sy/0.75)));
    /* eased toward whatever the cold open has set — 1 while it waits,
       0 once it has been opened */
    cold+=(coldWant-cold)*Math.min(1,dt*2.6);
    gl.uniform1f(uCold,cold);
    gl.drawArrays(gl.TRIANGLES,0,3);
    if(running) raf=requestAnimationFrame(frame);
  }
  function start(){ if(!raf&&running){ t0=performance.now(); raf=requestAnimationFrame(frame); } }
  function stop(){ if(raf){ cancelAnimationFrame(raf); raf=0; } }
  /* A stopped loop renders as a black screen, which is the worst failure
     this thing has — worse than any wrong colour, because it looks like
     the app is broken. visibilitychange alone was not enough: if the page
     is hidden mid-load and the matching visible event is missed or
     swallowed, the loop is cancelled and nothing ever asks for another
     frame. So every route back into the page restarts it, and start() is
     a no-op when it is already running. */
  document.addEventListener('visibilitychange',()=>{ document.hidden?stop():start(); });
  addEventListener('focus',start);
  addEventListener('pageshow',start);
  addEventListener('pointerdown',start,{passive:true});
  addEventListener('scroll',start,{passive:true});

  /* Only now is the CSS fallback taken down, and only because the canvas
     has actually produced a frame. If anything above had failed we would
     have returned already and the gradients would still be there. */
  document.documentElement.classList.add('glfield');
  start();
})();

/* ── the dot ───────────────────────────────────────────────────────────
   "There's a little dot that traces my mouse as I move it. It's almost
   trying to catch it." It eases toward the pointer at a fixed rate per
   frame, so it is always behind a fast move and always arrives on a
   slow one. mix-blend-mode:difference keeps it visible over both the
   bright material and the black without giving it a colour of its own. */
(function(){
  const dot=document.getElementById('dot');
  if(!dot) return;
  let fine=false;
  try{ fine=matchMedia('(hover:hover) and (pointer:fine)').matches; }catch(e){}
  if(!fine) return;
  document.documentElement.classList.add('haspointer');
  let x=innerWidth/2,y=innerHeight/2,tx=x,ty=y,raf=0,seen=false;
  addEventListener('pointermove',function(e){
    tx=e.clientX; ty=e.clientY;
    if(!seen){ seen=true; x=tx; y=ty; dot.classList.add('on'); }
    if(!raf) raf=requestAnimationFrame(step);
  },{passive:true});
  function step(){
    raf=0;
    x+=(tx-x)*0.13; y+=(ty-y)*0.13;
    dot.style.transform='translate3d('+x.toFixed(1)+'px,'+y.toFixed(1)+'px,0) translate(-50%,-50%)';
    if(Math.abs(tx-x)>0.4||Math.abs(ty-y)>0.4) raf=requestAnimationFrame(step);
  }
  /* What counts as clickable is asked of the element under the pointer
     rather than kept as a list of selectors, so anything the app grows
     later is included without being registered anywhere. */
  let hot=false;
  function overClickable(e){
    for(let n=e;n&&n!==document.body;n=n.parentElement){
      if(n.tagName==='BUTTON'||n.tagName==='A'||n.tagName==='LABEL') return true;
      if(typeof n.onclick==='function') return true;
      const c=n.className;
      if(typeof c==='string'&&/\b(item|pill|iconbtn)\b/.test(c)) return true;
    }
    return false;
  }
  addEventListener('pointerover',function(e){
    const h=overClickable(e.target);
    if(h!==hot){ hot=h; dot.classList.toggle('hot',h); }
  },{passive:true});
  addEventListener('pointerleave',function(){ dot.classList.remove('on'); seen=false; },{passive:true});
})();


/* No wheel handler. An eased scroll on top of a trackpad that already
   has momentum is not smoother, it is later: every notch waits for a
   lerp to catch up to where the OS had already put you. Native scrolling
   is the faster and the smoother of the two, and what actually made
   scrolling feel heavy was the reveal running at .8s per block, which is
   fixed at the token. */

/* Boot lives at the bottom of the view now — the engine cannot call into
   it from up here, because the view's helpers are still in the temporal
   dead zone at this point in the file. */

/* ── where to open ──────────────────────────────────────────────
   Coming back after a gap, or having last been in Settings, you
   almost always want Today — not wherever you happened to stop.
   Within a few minutes it behaves like a resume instead.        */
const SEEN_KEY='eh-last-seen';
function markSeen(){ try{ localStorage.setItem(SEEN_KEY,String(Date.now())); }catch(e){} }
(function(){
  /* Unless you asked for somewhere. A shortcut naming a tab has just set
     it a few lines above this, and "you probably want Today" is a guess
     about someone arriving cold — it has no business overruling an
     explicit instruction that came in with the URL. */
  if(window.__summoned) return;
  let last=0; try{ last=+localStorage.getItem(SEEN_KEY)||0; }catch(e){}
  const gap=Date.now()-last;
  if(!last || gap>15*60000 || S.tab==='settings') S.tab='home';
})();
markSeen();

/* ── coming back ────────────────────────────────────────────────
   A day rollover matters more than elapsed time: at 00:05 the whole
   app is about a different day, so snap the timetable and calendar
   to the new today rather than leaving yesterday on screen.      */
let hiddenAt=0, renderedFor=todayISO();
document.addEventListener('visibilitychange',()=>{
  /* nothing should be drifting in a screenshot of a backgrounded app */
  try{ document.body.classList.toggle('still', document.hidden); }catch(e){}
  if(document.hidden){ hiddenAt=Date.now(); markSeen(); return; }
  const today=todayISO();
  const rolled = today!==renderedFor;
  const away   = Date.now()-hiddenAt;
  if(rolled){
    renderedFor=today;
    ttDate=new Date(); calSel=today;
    const n=new Date(); calY=n.getFullYear(); calM=n.getMonth();
    if(away>15*60000) showTab('home'); else renderAll();
  } else if(away>15*60000 && S.tab==='settings'){ showTab('home'); }
  else if(away>60000){ renderAll(); }
  markSeen();
});

/* ══════════════ OFFLINE WORKER ══════════════
   Optional, and deliberately so. Opened as a file on your phone the app is
   already fully offline and this does nothing — a file: page cannot register
   a worker, and there would be nothing to cache. Hosted at a web address it
   is what stops the app failing to open with no signal.
   If sw.js isn't there, registration fails quietly and nothing changes. */
let swReg=null;
function swSupported(){
  try{ return 'serviceWorker' in navigator &&
              /^https?:$/.test(location.protocol); }
  catch(e){ return false; }
}
function registerSW(){
  if(!swSupported()) return;
  navigator.serviceWorker.register('sw.js').then(reg=>{
    swReg=reg;
    reg.addEventListener('updatefound',()=>{
      const w=reg.installing; if(!w) return;
      w.addEventListener('statechange',()=>{
        if(w.state==='installed' && navigator.serviceWorker.controller)
          toast('Update ready — reopen the app');
      });
    });
  }).catch(()=>{});     /* no sw.js alongside index.html: that's fine */
  navigator.serviceWorker.addEventListener('message',e=>{
    if(e.data && e.data.type==='CLEARED'){
      toast('Cache cleared — reloading');
      setTimeout(()=>location.reload(),600);
    }
  });
}
registerSW();


/* ══════════════ THE FIELD REACTS ══════════════
   The reference's hero follows the cursor. A phone has no cursor, so the
   equivalents are the inputs it does have: where your finger is, how far
   you have scrolled, and how the device is tilted. Pointer is wired too,
   because this opens on a laptop as often as not.

   The movement is heavily damped — the field arrives at where you are
   about a second late. That lag is the whole effect: it reads as liquid
   with weight rather than a layer glued to your finger.                */
(function(){
  var f=document.getElementById('field');
  if(!f) return;
  var lays=f.querySelectorAll('.lay');
  var amps=[];
  for(var i=0;i<lays.length;i++){
    var a=parseFloat(getComputedStyle(lays[i]).getPropertyValue('--amp'))||40;
    amps.push(a);
  }
  var reduce=false;
  try{ reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(e){}
  if(reduce) return;

  var tx=0,ty=0,cx=0,cy=0,raf=0,idle=true;
  function aim(x,y){
    tx=Math.max(-1,Math.min(1,(x/innerWidth-.5)*2));
    ty=Math.max(-1,Math.min(1,(y/innerHeight-.5)*2));
    wake();
  }
  function wake(){ if(!raf) raf=requestAnimationFrame(tick); idle=false; }
  function tick(){
    /* .045 is slow on purpose: the field trails you rather than tracking */
    cx+=(tx-cx)*.045; cy+=(ty-cy)*.045;
    /* Setting a custom property invalidates style for everything that
       reads it; setting the transform touches only the layer. */
    for(let i=0;i<lays.length;i++){
      const amp=amps[i];
      lays[i].style.transform='translate3d('+(cx*amp).toFixed(1)+'px,'+
                              (cy*amp).toFixed(1)+'px,0)';
    }
    if(Math.abs(tx-cx)<.001 && Math.abs(ty-cy)<.001){ raf=0; idle=true; return; }
    raf=requestAnimationFrame(tick);
  }
  addEventListener('pointermove',function(e){ aim(e.clientX,e.clientY); },{passive:true});
  addEventListener('touchmove',function(e){
    if(e.touches&&e.touches[0]) aim(e.touches[0].clientX,e.touches[0].clientY);
  },{passive:true});
  /* Scrolling is the input a phone always has: the field sinks as you go. */
  addEventListener('scroll',function(){
    var d=Math.min(1,(window.scrollY||0)/600);
    ty=Math.max(-1,Math.min(1,d*1.4-.2)); wake();
  },{passive:true});
  /* Tilt, where the browser gives it up without a permission prompt. */
  if(window.DeviceOrientationEvent && typeof DeviceOrientationEvent.requestPermission!=='function'){
    addEventListener('deviceorientation',function(e){
      if(e.gamma==null) return;
      tx=Math.max(-1,Math.min(1,e.gamma/32));
      ty=Math.max(-1,Math.min(1,((e.beta||0)-40)/40));
      wake();
    },{passive:true});
  }
  document.addEventListener('visibilitychange',function(){
    document.body.classList.toggle('still',document.hidden);
    if(!document.hidden) wake();
  });
})();

/* ── the cold open ─────────────────────────────────────────────────────
   On a desktop this is a door rather than a delay. The plate holds — the
   same palette as the app behind it, so it is already hinting at what is
   coming — and it opens when you move the pointer. Not a click: the
   first movement is enough, which is why it feels like the app noticing
   you rather than a screen you had to dismiss.

   On a phone there is no pointer to notice, so it simply plays and
   clears. And it runs once a session either way — twice in one morning
   is a toll, not an entrance. */
(function(){
  var cold=document.getElementById('cold');
  if(!cold) return;
  var reduce=false;
  try{ reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(e){}
  /* It used to run once a session, on the reasoning that a second one in
     the same morning is a toll. It is not — it is the part you play
     with, and sessionStorage survives a refresh, which is why refreshing
     never brought it back. Every load opens on it now.

     The exception is a Shortcut. "?do=mark&as=p" is someone marking a
     class from their phone in a corridor, not visiting: that is a
     purposeful action arriving with an instruction attached, and putting
     a screen in front of it would be putting a screen in front of the
     thing they actually asked for. */
  /* The shortcut handler runs before this and strips the query as soon as
     it has read it, so by now location.search is empty however the app
     was opened. It leaves a flag instead. */
  var summoned=!!window.__summoned;
  try{ summoned=summoned||(location.search||'').indexOf('do=')>=0; }catch(e){}
  /* Order-proof. If the field has not built itself yet there is nothing
     to call, and the release was being dropped on the floor — which left
     uCold pinned at 1 and the whole field gathered into a dot, reading
     as a black screen with dust on it. The flag is checked by the field
     when it starts, so it no longer matters which of the two runs first. */
  function release(){
    window.__fieldReleased=true;
    if(window.__fieldOpen) window.__fieldOpen();
  }
  if(reduce||summoned){
    release();
    cold.parentNode&&cold.parentNode.removeChild(cold);
    document.body.classList.add('opened');
    return;
  }
  document.body.classList.add('opening');

  var gated=false;
  try{ gated=matchMedia('(hover:hover) and (pointer:fine)').matches; }catch(e){}

  var done=false;
  function open(){
    if(done) return; done=true;
    release();
    cold.classList.remove('waiting');
    cold.classList.add('go');
    document.body.classList.add('opened');
    setTimeout(function(){
      cold.parentNode&&cold.parentNode.removeChild(cold);
      document.body.classList.remove('opening');
    },900);
  }

  if(!gated){ setTimeout(open,1150); return; }

  cold.classList.add('waiting');

  /* Playing with it is not moving it. The field displaces the material
     around the pointer and leaves everything else running, so passing
     through it disturbs the flow the way a hand does in a stream — that
     is already in the shader and needs nothing here. What is here is
     only the question of when it has been played with enough.

     Travel, not a twitch: about two screens of movement, and never
     before a second and a half has passed, so there is time to put a
     hand in it before it opens. */
  var x0=null,y0=null,travel=0,firstMove=0;
  function look(e){
    /* a pointer that has merely entered the window fires once without
       having moved — that first sample is the origin, not a trigger */
    if(x0===null){ x0=e.clientX; y0=e.clientY; return; }
    travel+=Math.abs(e.clientX-x0)+Math.abs(e.clientY-y0);
    x0=e.clientX; y0=e.clientY;
    if(!firstMove) firstMove=performance.now();
    if(travel < innerWidth*2.0) return;
    if(performance.now()-firstMove < 1500) return;
    removeEventListener('pointermove',look);
    open();
  }
  addEventListener('pointermove',look,{passive:true});
  /* a trackpad nobody touches must not be able to lock the app out */
  setTimeout(function(){ removeEventListener('pointermove',look); open(); },9000);
})();

/* keep the countdown and "in class now" honest without a visible redraw */
setInterval(()=>{
  if(el('panel').classList.contains('on')) return;
  if(todayISO()!==renderedFor){        /* midnight passed with the app open */
    renderedFor=todayISO(); ttDate=new Date(); calSel=renderedFor; renderAll(); return;
  }
  if(S.tab==='home') renderHome();
}, 60000);

/* ═══════════════════════════════════════════════════════════════════════
   THE VIEW

   Written against monopo saigon's system (bar.md). The rule that shapes
   every function below is that there are no containers: a block is an
   eyebrow, some content, and space. Nothing is boxed, nothing is filled,
   nothing is bold. The only outlined shape is the pill, and it only ever
   wraps an action.

   Every screen gets one statement-sized figure and no more, because the
   big number is what the screen is for.
   ═══════════════════════════════════════════════════════════════════════ */

const el = id => document.getElementById(id);
function set(id,html){ const n=el(id); if(n) n.innerHTML=html; }
function on(id,fn){ const n=el(id); if(n) n.onclick=fn; }
function onAll(sel,fn){ (document.querySelectorAll(sel)||[]).forEach(n=>{ n.onclick=()=>fn(n); }); }

/* a block: label, content, space */
function block(label,inner,opts){
  opts=opts||{};
  return '<div class="block pad'+(opts.cls?' '+opts.cls:'')+'">'+
    (label?'<div class="eyebrow">'+esc(label)+'</div>':'')+inner+'</div>';
}
/* a statement that comes out from behind a mask rather than fading */
function statement(text,cls){
  return '<div class="statement reveal'+(cls?' '+cls:'')+'"><span>'+text+'</span></div>';
}
function pill(label,id,cls){
  return '<button class="pill'+(cls?' '+cls:'')+'"'+(id?' id="'+id+'"':'')+'>'+label+'</button>';
}
/* the verdict class — the only place colour is allowed */
function vCls(level){
  return level==='gone'||level==='no'||level==='risk' ? 'v-no'
       : level==='tight'||level==='mid'               ? 'v-mid'
       : 'v-ok';
}
function marginBar(spare,total,level){
  if(spare==null) return '';
  const CAP=16, s=Math.max(0,spare), t=Math.max(s,total||s);
  const shown=Math.min(t,CAP), filled=Math.round(shown*(t?s/t:0));
  let h='<div class="margin '+vCls(level)+'">';
  for(let i=0;i<shown;i++) h+='<i'+(i<filled?'':' class="spent"')+'></i>';
  return h+'<span class="n">'+(s?s+' to spare':'none to spare')+'</span></div>';
}

/* ── toast ─────────────────────────────────────────────────────────────── */
let toastT=null;
function toast(msg,kind){
  const n=el('toast'); if(!n) return;
  n.textContent=msg;
  n.classList.toggle('bad',kind==='bad');
  n.classList.add('on');
  clearTimeout(toastT);
  toastT=setTimeout(()=>n.classList.remove('on'), kind==='bad'?2800:2000);
}

/* ── the panel ─────────────────────────────────────────────────────────
   Detail is a full sheet of black that rises from the bottom. It is not a
   card floating over the app; it is the next screen.                    */
let panelSave=null;
function openSheet(o){
  panelSave=o.onSave||null;
  el('panelTitle').textContent=o.title||'';
  el('panelBody').innerHTML=o.body||'';
  const done=el('panelDone'), canc=el('panelCancel');
  done.hidden=!o.onSave;
  done.textContent=o.doneLabel||'Save';
  canc.textContent=o.cancelLabel||(o.onSave?'Cancel':'Close');
  el('scrim').classList.add('on');
  el('panel').classList.add('on');
  document.body.style.overflow='hidden';
  if(o.after) setTimeout(o.after,30);
}
function closeSheet(){
  el('panel').classList.remove('on');
  el('scrim').classList.remove('on');
  document.body.style.overflow='';
  panelSave=null;
}
function sheetError(msg){
  const b=el('panelBody');
  let e=b.querySelector('.sheetErr');
  if(!e){ e=document.createElement('div'); e.className='sheetErr cap';
          e.style.color='var(--oxblood-lit)'; e.style.marginTop='16px'; b.appendChild(e); }
  e.textContent=msg;
}
/* the action list reuses the panel — there is no second overlay style */
function openAct(o){
  const rows=(o.items||[]).map((it,i)=>
    '<button class="item" data-act="'+i+'"><div class="grow"><div class="lead"'+
    (it.destructive?' style="color:var(--oxblood-lit)"':'')+'>'+esc(it.label)+'</div>'+
    (it.sub?'<div class="sub">'+esc(it.sub)+'</div>':'')+'</div></button>').join('');
  openSheet({title:o.title||'', cancelLabel:'Cancel',
    body:(o.note?'<div class="intro">'+esc(o.note)+'</div>':'')+rows,
    after(){ onAll('#panelBody [data-act]',n=>{
      const it=o.items[+n.dataset.act]; closeSheet();
      if(it&&it.run) setTimeout(it.run,120);
    }); }});
}
function closeAct(){ closeSheet(); }

/* ══════════════ COMMAND ══════════════
   Typing is cheaper than navigating. Everything the app can do is listed
   here, matched loosely so "pres" finds "Mark management accounting
   present" and "mgm" finds the subject. Actions that apply to the class
   you are actually in come first, because that is the thing you open this
   for in a corridor.                                                    */
let cmdSel=0, cmdItems=[];
function cmdActions(){
  const out=[], iso=todayISO(), now=nowMin();
  const live=liveSlots(iso).filter(sl=>!S.marks[markKey(iso,sl)]);
  const here=live.find(sl=>now>=t2m(sl.start)&&now<t2m(sl.end))
           || live.find(sl=>t2m(sl.start)>now);
  if(here){
    const nm=subById(here.subId).name;
    [['p','present'],['a','absent'],['c','cancelled']].forEach(m=>{
      out.push({t:'Mark '+nm+' '+m[1], k:fmtT(here.start),
        run(){ setMark(markKey(iso,here),m[0]);
               toast('Marked '+m[1]+'.'); }});
    });
  }
  if(live.length>1) out.push({t:'Mark the whole day present', k:live.length+' classes',
    run(){ live.forEach(sl=>{ S.marks[markKey(iso,sl)]='p'; }); save(); renderAll();
           toast('Whole day marked present.'); }});
  if(plannerReady()) out.push({t:'I’m on my way', k:'travel',
    run(){ S.enroute={iso,at:nowMin()}; save(); renderAll(); toast('On your way.'); }});

  out.push({t:'Can I skip today?', k:'plan', run(){ sheetSkipToday(); }});
  out.push({t:'Is today worth going?', k:'plan',
            run(){ sheetWorthGoing(dayOptions(iso)?iso:isoOf(addDays(new Date(),1))); }});
  out.push({t:'Pick which classes I’m doing', k:'plan', run(){ sheetPickDay(iso); }});
  out.push({t:'Plan time off', k:'plan', run(){ sheetLeave(); }});
  out.push({t:'Attendance goal', k:'plan', run(){ sheetGoal(); }});
  out.push({t:'How my weeks look', k:'plan', run(){ sheetWeekPlan(); }});
  const unm=unmarkedPast(21).length;
  if(unm) out.push({t:'Catch up on '+unm+' unmarked classes', k:'fix',
                    run(){ sheetCatchUp(); }});

  S.subs.forEach(sb=>{
    const A=attFor(sb.id);
    out.push({t:sb.name, k:A.t?pctFmt(pctOf(A.p,A.t))+'%':'no data',
              run(){ sheetSubject(sb); }});
  });

  out.push({t:'Today', k:'go', run(){ showTab('home'); }});
  TERM_VIEWS.forEach(v=>out.push({t:v[1], k:'go', run(){ openTerm(v[0]); }}));
  out.push({t:'Settings', k:'go', run(){ showTab('settings'); }});
  out.push({t:'Add a class', k:'new', run(){ sheetClass(null,iso); }});
  out.push({t:'Add a deadline', k:'new', run(){ sheetDeadline(null); }});
  out.push({t:'Add a subject', k:'new', run(){ sheetSubject(null); }});
  out.push({t:'Attendance appeal', k:'end of term', run(){ sheetAppealPick(); }});
  const bk=backupInfo();
  if(bk && bk.weight>stateWeight(S))
    out.unshift({t:'Restore the last good copy', k:bk.subs+' subjects',
                 run(){ restoreBackup(); }});
  return out;
}

/* ══════════════ MOTION DRIVEN BY THE SCROLL ══════════════
   The reference is alive because it responds to you moving through it.
   Three things do that here.

   Reveal: every block resolves as it comes into view, once. The `once`
   part matters — the sixty-second countdown tick re-renders Today, and
   without a memory of what has already arrived the whole screen would
   replay its entrance every minute, which is exactly the bug that made
   the app look like it was refreshing itself.

   Parallax: the title holds while the field drifts behind it, then lifts
   away as you scroll past — the same relationship their hero has with
   its backdrop.

   The mark: a circle of type turning slowly, their one ornament.        */
let revealIO=null;
const revealed=new WeakSet();
/* Claim the reveal only if this browser can actually deliver it. */
(function(){
  let reduce=false;
  try{ reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(e){}
  if(!reduce && typeof IntersectionObserver!=='undefined')
    document.documentElement.classList.add('revealing');
})();
/* and a backstop: anything still unrevealed after a moment is shown
   regardless, so a missed callback can never hide the app */
setInterval(function(){
  document.querySelectorAll('section.on .block:not(.in)').forEach(function(b){
    const r=b.getBoundingClientRect();
    if(r.top < innerHeight + 200) b.classList.add('in');
  });
}, 1200);
function reveal(fresh){
  /* The head is not a block but it carries masked type, so it opens on
     arrival rather than on scroll — it is already in view. */
  document.querySelectorAll('section.on .head .reveal').forEach(r=>{
    if(fresh){ r.classList.remove('in'); void r.offsetWidth; }
    r.classList.add('in');
  });
  const blocks=[].slice.call(document.querySelectorAll('section.on .block'));
  if(!blocks.length) return;
  let reduce=false;
  try{ reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(e){}
  if(reduce){ blocks.forEach(b=>b.classList.add('in')); return; }

  if(!revealIO && typeof IntersectionObserver!=='undefined'){
    revealIO=new IntersectionObserver(es=>{
      es.forEach(e=>{
        if(!e.isIntersecting) return;
        e.target.classList.remove('now');
        e.target.classList.add('in');
        revealed.add(e.target);
        revealIO.unobserve(e.target);
      });
    },{rootMargin:'0px 0px -8% 0px',threshold:.04});
  }
  blocks.forEach(b=>{
    if(b.classList.contains('in')) return;
    /* a re-render of something already seen must not animate again */
    if(!fresh && b.dataset.seen==='1'){ b.classList.add('now','in'); return; }
    b.dataset.seen='1';
    if(revealIO) revealIO.observe(b);
    else b.classList.add('in');
  });
}
/* Containers keep their identity across re-renders, so "already seen" is
   remembered per screen region rather than per element. */
function markSeenRegions(){
  document.querySelectorAll('section.on .block').forEach(b=>{ b.dataset.seen='1'; });
}

(function(){
  let reduce=false;
  try{ reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(e){}
  if(reduce) return;
  let raf=0;
  function frame(){
    raf=0;
    const y=window.scrollY||0;
    document.querySelectorAll('section.on .head').forEach(h=>{
      /* holds, then leaves — never faster than the page itself */
      const t=Math.min(1,y/420);
      h.style.transform='translate3d(0,'+(y*0.24).toFixed(1)+'px,0)';
      h.style.opacity=String(1-t*0.85);
    });

  }
  addEventListener('scroll',function(){ if(!raf) raf=requestAnimationFrame(frame); },{passive:true});
})();


/* ── TODAY ──────────────────────────────────────────────────────────────
   One statement, then the answers to the three questions this app exists
   for: where do I stand, what is happening now, and can I skip.        */
function renderHome(){
  const now=new Date(), iso=todayISO(), mins=nowMin();
  const d=now.toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long'});
  const w=el('todayWhen'); if(w) w.innerHTML='<span>'+esc(d)+'</span>';


  const rp=resolvePlan(iso), going=rp.going;
  const live=going.find(sl=>mins>=t2m(sl.start)&&mins<t2m(sl.end)&&!S.marks[markKey(iso,sl)]);
  const next=going.find(sl=>t2m(sl.start)>mins&&!S.marks[markKey(iso,sl)]);
  const ms=morningStatus(), hw=(ms&&!ms.atHome)?null:homewardStatus();

  /* the hero: exactly one statement, whichever of these is true now */
  let hero='';
  if(live){
    const sub=subById(live.subId);
    hero=block('In class now',
      statement(esc(sub.name))+
      '<div class="body" style="margin-top:16px">'+fmtT(live.start)+'–'+fmtT(live.end)+
        (placeOf(live)?' · '+esc(placeOf(live)):'')+' · <b>'+
        fmtDur(t2m(live.end)-mins)+' left</b></div>'+
      '<div style="margin-top:22px">'+markChoice(markKey(iso,live))+'</div>');
  } else if(ms && ms.atHome){
    hero=block('From home',
      statement((ms.untilClass<1?'Starting now':'Online in '+fmtDur(ms.untilClass)))+
      '<div class="body" style="margin-top:16px">'+esc(subById(ms.p.first.subId).name)+' at '+
        fmtT(ms.p.first.start)+' — no travel.</div>'+
      '<div style="margin-top:22px">'+markChoice(markKey(iso,ms.p.first))+'</div>');
  } else if(ms){
    const late=ms.level==='late', er=ms.level==='enroute';
    hero=block(er?'On your way':'Getting to college',
      '<div class="statement">'+
        (er?'Arriving '+m2t(ms.arriveAt)
          :late?'Leave now':'Leave in '+fmtDur(ms.untilLeave))+'</div>'+
      '<div class="body" style="margin-top:16px">'+esc(morningLine(ms))+'</div>'+
      '<div class="item" style="margin-top:22px;border-top:0;padding-top:0">'+
        '<div class="grow"><div class="cap">Leave by</div>'+
        '<div class="lead num" style="margin-top:4px">'+m2t(ms.p.leaveAt)+'</div></div>'+
        '<div class="grow"><div class="cap">'+esc(subById(ms.p.first.subId).code)+' starts</div>'+
        '<div class="lead num" style="margin-top:4px">'+fmtT(ms.p.first.start)+'</div></div>'+
        (ms.p.travel?'<div class="grow"><div class="cap">On the road</div>'+
          '<div class="lead num" style="margin-top:4px">'+ms.p.travel+' min</div></div>':'')+
      '</div>'+
      '<div style="margin-top:22px;display:flex;gap:10px;flex-wrap:wrap">'+
        (er?pill('Not on my way','heroArrived','sm'):pill('I’m on my way','heroGo','sm'))+
      '</div>');
  } else if(hw){
    const cm=commute();
    hero=block('Heading home',
      '<div class="statement">Home by '+m2t(hw.homeBy)+'</div>'+
      '<div class="body" style="margin-top:16px">'+
        (hw.waited<5?'That’s you done. ':esc(subById(hw.last.subId).code)+' done '+fmtDur(hw.waited)+' ago. ')+
        (cm.msg?'Tell your '+(S.commute==='driver'?'driver':'cab')+' '+m2t(hw.leaveAt)+' — about '+
          fmtDur(hw.travel)+' back.':'About '+fmtDur(hw.travel)+' back from here.')+'</div>'+
      (cm.msg?'<div style="margin-top:22px">'+pill('Copy message','heroHomeCopy','sm')+'</div>':''));
  } else {
    const nd=nextClassDay();
    if(nd && nd.offset>0 && nd.plan.configured && nd.plan.firstOnsite){
      const p=nd.plan, cm=commute();
      const dayName=nd.offset===1?'Tomorrow':p.d.toLocaleDateString(undefined,{weekday:'long'});
      hero=block(dayName,
        statement(esc(cm.verb)+' '+m2t(p.leaveAt))+
        '<div class="body" style="margin-top:16px">First class '+fmtT(p.firstOnsite.start)+
          ' · '+esc(subById(p.firstOnsite.subId).name)+
          (p.wakeAt!=null&&!p.dayBefore?' · wake by <b>'+m2t(p.wakeAt)+'</b>':'')+'</div>'+
        '<div style="margin-top:22px;display:flex;gap:10px;flex-wrap:wrap">'+
          (cm.msg?pill('Copy message','heroCopy','sm'):'')+
          pill('Worth going?','heroWorth','sm')+'</div>');
    } else if(nd && nd.offset>0){
      const p=nd.plan;
      const dayName=nd.offset===1?'Tomorrow':p.d.toLocaleDateString(undefined,{weekday:'long'});
      hero=block(dayName,'<div class="statement">'+
        (p.skippingAll?'Not going in':'All from home')+'</div>'+
        '<div class="body" style="margin-top:16px">'+
        (p.skippingAll?'You planned to skip all '+p.list.length+' classes.'
         :'First class '+fmtT(p.first.start)+' — nothing to travel to.')+'</div>');
    } else {
      hero=block('','<div class="statement">Free day</div>'+
        '<div class="body" style="margin-top:16px">Nothing scheduled.</div>');

      (imp.has?'<div class="cap" style="margin-top:10px">Skipping puts '+esc(sub.code)+' at '+

  set('vStanding', T? block('Where you stand',

    '<div class="body" style="margin-top:14px">'+bunkLine(P,T)+'</div>') : '');

  /* the questions */
  const sk=nextSkipDay(), unm=unmarkedPast(21).length;
  let q='';
  const wg=dayOptions(iso)||dayOptions(isoOf(addDays(new Date(),1)));
  if(wg) q+='<button class="item" id="qWorth"><div class="grow">'+

  set('vQuestions', q?block('Questions',q):'');

  /* bindings */
  bindMarks('#vHero'); bindMarks('#vDay');
  on('heroGo',()=>{ S.enroute={iso,at:nowMin()}; save(); keepScroll(renderAll);
                    toast('On your way.'); });
  on('heroArrived',()=>{ S.enroute=null; save(); keepScroll(renderAll); });
  on('heroWorth',()=>{ const d=nextClassDay(); if(d) sheetWorthGoing(d.iso); });
  on('qWorth',()=>sheetWorthGoing(dayOptions(iso)?iso:isoOf(addDays(new Date(),1))));
  on('qSkip',()=>sheetSkipToday());
  on('qCatch',()=>sheetCatchUp());
  on('heroCopy',()=>{
    const nd=nextClassDay(), c=commute();
    if(!nd||!c.text) return;
    const p=nd.plan;
    if(!p.firstOnsite) return toast('Every class is online — no pickup needed.');
    copy(c.text(m2t(p.leaveAt), fmtT(p.firstOnsite.start)));
  });

    copy('Please come at '+m2t(w.leaveAt)+' — my classes are done.'); });

  onAll('#vDue [data-dl]',n=>sheetDeadline(S.dls.find(x=>x.id===n.dataset.dl)));

function copy(msg){
  let done=false;
  try{ if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(msg); done=true; } }catch(e){}
  toast(done?'Copied.':msg);
}

/* ── CLASSES ────────────────────────────────────────────────────────────
   A week of dates as words on a rule, then the day itself.            */
let ttDate=new Date();
function renderTT(){
  const iso=isoOf(ttDate), dow=dowOf(ttDate);


  const mon=addDays(ttDate,-((dowOf(ttDate)+6)%7));
  let rail='<div class="choice" style="border-top:0">';
  for(let i=0;i<7;i++){
    const d=addDays(mon,i), di=isoOf(d), sel=di===iso;
    rail+='<button data-d="'+di+'"'+(sel?' class="on"':'')+'>'+
      d.toLocaleDateString(undefined,{weekday:'short'}).slice(0,3)+'<br>'+
      '<span class="num" style="font-size:15px">'+d.getDate()+'</span></button>';
  }
  set('vRail',block('',rail+'</div>',{cls:'railBlock'}));

  const list=slotsOn(dow,iso).filter(sl=>subById(sl.subId));
  const past=dateOf(iso)<=dateOf(todayISO());
  let body='';
  if(!list.length){
    body='<div class="empty"><div class="t">No classes</div>'+
      '<div class="s">Nothing on this day.</div></div>';
  } else {
    body=block('The day', list.map(sl=>{
      const sub=subById(sl.subId), k=markKey(iso,sl), m=S.marks[k];
      return '<div class="item"><span class="time">'+fmtT(sl.start)+'</span>'+
        '<div class="grow"><div class="lead">'+esc(sub.name)+'</div>'+
        '<div class="sub">'+esc(sub.code)+
          (kindOf(sl)!=='th'?' · '+KIND_NAME[kindOf(sl)]:'')+
          (sl.online?' · online':placeOf(sl)?' · '+esc(placeOf(sl)):'')+'</div>'+
        (past?'<div style="margin-top:14px">'+markChoice(k)+'</div>':'')+
        '</div>'+
        (!past&&m==='c'?'<span class="val cap">cancelled</span>':'')+
        '<button class="chev" data-slot="'+sl.id+'" style="padding:0 4px">···</button></div>';
    }).join(''));
    body+=block('', '<div style="display:flex;gap:10px;flex-wrap:wrap">'+
      pill('All present','ttAllP','sm')+pill('All absent','ttAllA','sm')+
      pill('Worth going?','ttWorth','sm')+'</div>');
  }
  body+=block('',pill('Add a class','ttAdd','sm wide'));
  set('vClasses',body);

  bindMarks('#vClasses');
  onAll('#vRail [data-d]',n=>{ ttDate=dateOf(n.dataset.d); renderTT(); });
  onAll('#vClasses [data-slot]',n=>sheetClass(S.slots.find(x=>x.id===n.dataset.slot),iso));
  on('ttAllP',()=>{ list.forEach(sl=>{ if(!S.marks[markKey(iso,sl)]) S.marks[markKey(iso,sl)]='p'; });
                    save(); renderAll(); toast('Whole day marked present.'); });
  on('ttAllA',()=>{ list.forEach(sl=>{ if(!S.marks[markKey(iso,sl)]) S.marks[markKey(iso,sl)]='a'; });
                    save(); renderAll(); toast('Whole day marked absent.'); });
  on('ttWorth',()=>sheetWorthGoing(iso));
  on('ttAdd',()=>sheetClass(null,iso));
}

/* ── ATTENDANCE ─────────────────────────────────────────────────────────
   One figure, then each subject as a line of type.                    */
/* monthEntries(mo) answers "what happened in this month" — it is not a
   list of months. Building that list is a separate job, and calling it
   with no argument was why the month-by-month section rendered nothing
   and its panel opened empty. */
function monthsWithMarks(){
  const seen={};
  Object.keys(S.marks||{}).forEach(k=>{
    const m=k.slice(0,7);
    if(/^\d{4}-\d{2}$/.test(m)) seen[m]=1;
  });
  return Object.keys(seen).sort().reverse().map(mo=>{
    const days=monthEntries(mo);
    let p=0,t=0;
    Object.keys(days).forEach(d=>days[d].forEach(e=>{
      if(e.mark==='c') return;            /* cancelled is not a class held */
      t++; if(e.mark==='p') p++;
    }));
    return {key:mo, days,
      label:new Date(mo+'-01T00:00:00').toLocaleDateString(undefined,
              {month:'long',year:'numeric'}),
      p, t};
  });
}

function renderAtt(){
  let P=0,T=0; S.subs.forEach(s=>{const a=attFor(s.id);P+=a.p;T+=a.t;});
  const pct=pctOf(P,T);
  const lv=!T?'none':pct>=S.thr?'ok':pct>=S.thr-6?'tight':'gone';


  set('vOverall', block('Overall',
    '<div class="figure"><span class="n '+vCls(lv)+'">'+(T?pctFmt(pct)+'%':'—')+'</span>'+
      '<span class="of">'+(T?P+' of '+T+' · minimum '+S.thr+'%':'nothing recorded')+'</span></div>'+
    (T?'<div class="body" style="margin-top:16px">'+bunkLine(P,T)+'</div>':'')));

  /* the goal */
  const g=goalOverall();
  let goal='';
  if(g){
    const hold=g.phase==='hold';
    const glv=!g.reachable&&!g.unknown?'gone':hold?'ok':'tight';
    goal=block('Your goal',
      '<div class="figure"><span class="n '+vCls(glv)+'">'+g.goal+'%</span>'+
        '<span class="of">'+(hold?'holding':'climbing')+
        (g.by?' · by '+dateOf(g.by).toLocaleDateString(undefined,{day:'numeric',month:'short'}):'')+
        '</span></div>'+
      '<div class="body" style="margin-top:16px">'+
        (g.unknown?'Set your term end date and this can count the classes.'
         :!g.reachable?'Even attending every one of the '+g.remaining+' left you finish at '+
            pctFmt(g.best)+'%.'
         :hold?(g.rhythm?'Attend <b>'+g.rhythm.n+' of every '+g.rhythm.d+'</b> to hold this. ':'')+
            'You can miss <b>'+g.slack+'</b> of the '+g.remaining+' left.'
         :'Attend <b>'+g.need+'</b> of the '+g.remaining+' left to get there'+
            (g.slack>0?', leaving '+g.slack+' you can still miss.':' — every one.'))+
      '</div>'+
      (g.reachable&&!g.unknown?marginBar(g.slack,g.remaining,glv):'')+
      '<div style="margin-top:22px;display:flex;gap:10px;flex-wrap:wrap">'+
        pill('How my weeks look','goalWeeks','sm')+pill('Change goal','goalEdit','sm')+
      '</div>');
  } else {
    goal=block('Your goal','<div class="body">No goal set — you are measured against the '+
      S.thr+'% minimum alone.</div><div style="margin-top:22px">'+
      pill('Set a goal','goalEdit','sm')+'</div>');
  }
  set('vGoal',goal);

  const rem=remainingBySub(todayISO());
  set('vSubjects', S.subs.length? block('By subject', S.subs.map(sub=>{
    const A=attFor(sub.id), p=pctOf(A.p,A.t);
    const l=!A.t?'none':p>=S.thr?'ok':p>=S.thr-6?'tight':'gone';
    const k=rem?rem[sub.id]||0:0, sl=rem?slackFor(sub.id,k):null;
    return '<button class="item" data-sub="'+sub.id+'"><div class="grow">'+
      '<div class="lead">'+esc(sub.name)+'</div>'+
      '<div class="sub">'+A.p+' of '+A.t+
        (k?' · '+k+' left this term':'')+
        (sl!=null&&k?(sl<0?' · '+S.thr+'% out of reach':' · miss '+sl+' more and you hold'):'')+
      '</div></div>'+
      '<span class="val num '+vCls(l)+'">'+(A.t?pctFmt(p)+'%':'—')+'</span></button>';
  }).join('')) : '<div class="empty"><div class="t">No subjects</div>'+
      '<div class="s">Add one in Settings to begin.</div></div>');

  const months=monthsWithMarks();
  set('vMonths', months.length? block('Month by month', months.map(m=>{
    const pc=pctOf(m.p,m.t);
    const lv=!m.t?'none':pc>=S.thr?'ok':pc>=S.thr-6?'tight':'gone';
    return '<button class="item" data-mo="'+m.key+'"><div class="grow"><div class="lead">'+
      esc(m.label)+'</div><div class="sub">'+m.p+' of '+m.t+' attended</div></div>'+
      '<span class="val num '+vCls(lv)+'">'+(m.t?pctFmt(pc)+'%':'—')+'</span></button>';
  }).join('')) : '');

  set('vAttMore', block('', 
    '<button class="item" id="attLeave"><div class="grow"><div class="lead">Taking leave?</div>'+
      '<div class="sub">What it costs, and an application to send</div></div>'+
      '<span class="chev">→</span></button>'+
    '<button class="item" id="attMin"><div class="grow"><div class="lead">Minimum required</div>'+
      '<div class="sub">Everything is measured against this</div></div>'+
      '<span class="val num">'+S.thr+'%</span></button>'));

  onAll('#vSubjects [data-sub]',n=>sheetSubject(subById(n.dataset.sub)));
  onAll('#vMonths [data-mo]',n=>sheetMonth(n.dataset.mo));
  on('goalEdit',sheetGoal); on('goalWeeks',sheetWeekPlan);
  on('attLeave',()=>sheetLeave());
  on('attMin',()=>sheetThreshold());
}

/* ── CALENDAR ───────────────────────────────────────────────────────────── */
let calY=new Date().getFullYear(), calM=new Date().getMonth(), calSel=todayISO();
function renderCal(){
  const first=new Date(calY,calM,1), start=(first.getDay()+6)%7;
  const days=new Date(calY,calM+1,0).getDate();

  set('vCalBar','<div class="block pad" style="display:flex;justify-content:space-between;'+
    'align-items:center"><button class="pill sm" id="calPrev">Back</button>'+
    '<button class="pill sm" id="calNext">Next</button></div>');
  let g='<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:2px 0">';
  ['M','T','W','T','F','S','S'].forEach(d=>g+='<div class="cap" style="text-align:center;'+
    'padding-bottom:10px">'+d+'</div>');
  for(let i=0;i<start;i++) g+='<div></div>';
  for(let d=1;d<=days;d++){
    const iso=isoOf(new Date(calY,calM,d));
    const n=slotsOn(dowOf(dateOf(iso)),iso).filter(x=>subById(x.subId)).length;
    const isToday=iso===todayISO(), sel=iso===calSel;
    g+='<button data-cd="'+iso+'" style="padding:11px 0;text-align:center;'+
      'border-top:1px solid '+(sel?'var(--ink)':'transparent')+'">'+
      '<span class="num" style="font-size:15px;color:'+
        (sel||isToday?'var(--ink)':'var(--ink-2)')+'">'+d+'</span>'+
      '<div style="height:3px;margin-top:6px">'+(n?'<span style="display:block;width:3px;'+
        'height:3px;margin:0 auto;background:var(--ink-3)"></span>':'')+'</div></button>';
  }
  set('vCalGrid','<div class="block pad">'+g+'</div></div>');
  const list=slotsOn(dowOf(dateOf(calSel)),calSel).filter(sl=>subById(sl.subId));
  set('vCalDay', block(dateOf(calSel).toLocaleDateString(undefined,
      {weekday:'long',day:'numeric',month:'long'}),
    list.length? list.map(sl=>'<div class="item"><span class="time">'+fmtT(sl.start)+
      '</span><div class="grow"><div class="lead">'+esc(subById(sl.subId).name)+'</div>'+
      '<div class="sub">'+esc(subById(sl.subId).code)+(sl.online?' · online':'')+
      '</div></div></div>').join('')
      : '<div class="body">No classes.</div>'));
  on('calPrev',()=>{ calM--; if(calM<0){calM=11;calY--;} renderCal(); });
  on('calNext',()=>{ calM++; if(calM>11){calM=0;calY++;} renderCal(); });
  onAll('#vCalGrid [data-cd]',n=>{ calSel=n.dataset.cd; renderCal(); });
}

   the time the answer is readable without opening anything.           */

  const w=el('setWhen'); if(w) w.textContent='Everything stays on this device';

     of margin under it. Nine one-line rows spaced like nine paragraphs of
     content made Settings a 1,100px ribbon with the control stranded at
     the far right of an otherwise empty row. They are rows, so they are
     one list now: the hairline between them comes from .item the way it
     does everywhere else in the app, and only an open group gets air. */
  const grp=(key,title,summary,inner)=>{
    const open=(S.openGroups||[]).indexOf(key)>=0;
    return '<button class="item'+(open?' open':'')+'" data-g="'+key+'"><div class="grow">'+
      '<div class="eyebrow bare" style="margin-bottom:8px">'+esc(title)+'</div>'+
      '<div class="sub">'+summary+'</div></div>'+
      '<span class="chev">'+(open?'−':'+')+'</span></button>'+

    (S.theme==='auto'?'Auto':S.theme==='light'?'Light':'Dark')+' · '+

    '<div class="choice">'+[['auto','Auto'],['light','Light'],['dark','Dark']].map(t=>
      '<button data-th="'+t[0]+'"'+(S.theme===t[0]?' class="on"':'')+'>'+t[1]+'</button>').join('')+
    '</div>'+
    TONE_OPTS.map(t=>'<button class="item" data-tone="'+t[0]+'"><div class="grow">'+
      '<div class="lead">'+t[1]+'</div><div class="sub">'+t[2]+'</div></div>'+

  h+=grp('term','Semester', termSummaryLine(),

    '<span class="in"><input type="date" id="setTermEnd" value="'+esc(S.termEnd||'')+'"></span></div>');

  h+=grp('att','Attendance','Minimum '+S.thr+'%'+(S.goal?' · goal '+S.goal+'%':' · no goal'),
    '<div class="field-row"><span class="lab">Minimum required</span>'+
    '<span class="in"><input type="number" id="setThr" min="1" max="100" value="'+S.thr+'"></span></div>'+

  h+=grp('plan','Getting there',

      '<div class="field-row"><span class="lab">Properly</span><span class="in">'+

  h+=grp('shortcuts','Shortcuts',
    'Open a URL from Shortcuts to drive the app',
    '<div class="body">Apple Shortcuts can’t reach inside an app, but it can open a URL. '+
      'Use <b>Open URL</b>, or an automation like leaving home.</div>'+

      '<div class="lead">'+esc(r[1])+'</div><div class="sub">'+esc(r[0])+'</div></div>'+

  h+=grp('data','Data','Backup, restore, erase',

      return b? '<button class="item" id="restoreBtn"><div class="grow">'+

     APP_VERSION+'<br>Everything stays on this device. No account, no cloud.</div></div>';
  set('vSettings',h);

  onAll('#vSettings [data-g]',n=>{
    const k=n.dataset.g, l=(S.openGroups||[]).slice(), i=l.indexOf(k);
    if(i>=0) l.splice(i,1); else l.push(k);
    S.openGroups=l; save(); renderSettings();

function sheetPickDay(iso){
  iso=iso||todayISO();

  const draw=()=>{
    const o=planImpact(iso,Object.keys(sel).filter(k=>sel[k]));
    const lv=o.gone?'gone':o.worst>=1?'tight':'ok';
    let b='<div class="intro">Tick exactly what you are doing. Same maths, your choice.</div>'+
      '<div class="figure"><span class="n '+vCls(lv)+'">'+o.count+'</span>'+
      '<span class="of">of '+live.length+' classes</span></div>'+
      '<div class="body" style="margin-top:14px">'+
        (!o.count?'Staying home entirely.'
         :o.allOnline?'All from home — no travel.'
         :fmtDur(o.onCampus)+' on campus'+(o.dead>0?' · '+fmtDur(o.dead)+' waiting':'')+
          (o.leaveHome!=null&&o.travel?' · leave '+m2t(o.leaveHome):''))+'</div>'+
      (o.rows.length?'<div class="cap" style="margin-top:10px">'+o.rows.map(r=>

function sheetGoal(){
  let P=0,T=0; S.subs.forEach(sb=>{const A=attFor(sb.id);P+=A.p;T+=A.t;});
  const cur=pctOf(P,T);
  const draw=()=>{
    const val=()=>clamp(parseInt((el('glVal')||{}).value)||0,0,100);
    let b='<div class="intro">A goal sits above the '+S.thr+
      '% you have to hold. That minimum never moves.</div>'+
      '<div class="field-row"><span class="lab">Goal</span><span class="in">'+
      '<input type="number" id="glVal" min="0" max="100" value="'+(+S.goal||0)+'"></span></div>'+
      '<div class="field-row"><span class="lab">Reach it by</span><span class="in">'+
      '<input type="date" id="glBy" value="'+esc(S.goalBy||'')+'"></span></div>'+
      '<div id="glWhen"></div>';
    if(T) b+='<div style="margin-top:26px;display:flex;gap:10px;flex-wrap:wrap">'+
      pill('Hold me at '+pctFmt(cur)+'%','glNow','sm')+
      [75,80,85].filter(v=>v>cur).slice(0,2).map(v=>pill('Climb to '+v+'%','glq'+v,'sm')).join('')+
      '</div>';
    el('panelBody').innerHTML=b;
    const verdict=()=>{
      const box=el('glWhen'); if(!box) return;
      const g=val(); if(!g){ box.innerHTML=''; return; }
      const e=earliestGoalDate(g), by=(el('glBy')||{}).value||'';
      let msg,lv='ok';
      if(e.never){ lv='gone'; msg='Not reachable at all — '+g+
        '% allows no absences, and there are already some on the record.'; }
      else if(e.already){ msg='You are already at or above '+g+'%. Setting it holds the line.'; }
      else if(!e.iso){ lv='gone'; msg='Not reachable this term, even attending everything.'; }
      else {
        const soon=dateOf(e.iso).toLocaleDateString(undefined,{day:'numeric',month:'short'});
        if(by && dateOf(by)<dateOf(e.iso)){ lv='tight';
          msg='Not by then. '+g+'% needs '+e.need+' more classes attended, and the last of them '+
              'is not until '+soon+' — with nothing missed in between.'; }
        else msg='Possible from '+soon+' at the earliest: '+e.need+
              ' classes attended with nothing missed.';
      }
      box.innerHTML='<div class="body '+vCls(lv)+'" style="margin-top:22px">'+msg+'</div>'+
        (lv==='tight'?'<div style="margin-top:14px">'+pill('Move it to that date','glFix','sm')+'</div>':'');
      on('glFix',()=>{ const e2=earliestGoalDate(val()); if(e2.iso){ el('glBy').value=e2.iso; verdict(); } });
    };
    verdict();
    const v=el('glVal'); if(v){ v.oninput=verdict; v.onchange=verdict; }
    const bb=el('glBy'); if(bb) bb.onchange=verdict;
    on('glNow',()=>{ el('glVal').value=Math.floor(cur); verdict(); });
    [75,80,85].forEach(n=>on('glq'+n,()=>{ el('glVal').value=n; verdict(); }));
  };
  openSheet({title:'Attendance goal', doneLabel:'Save', body:'', after:draw,
    onSave(){
      S.goal=clamp(parseInt(el('glVal').value)||0,0,100);
      const by=(el('glBy')||{}).value||'';
      S.goalBy=/^\d{4}-\d{2}-\d{2}$/.test(by)?by:'';
      save(); renderAll();
      toast(S.goal?(S.goal<=cur?'Holding at '+S.goal+'%.':'Goal set: '+S.goal+'%.'):'Goal cleared.');
    }});
}

function sheetBackfill(sub){
  const A=attFor(sub.id);
  const row=(lab,id,v)=>'<div class="field-row"><span class="lab">'+lab+'</span>'+
    '<span class="in"><input type="number" min="0" id="'+id+'" value="'+v+'"></span></div>';
  openSheet({title:sub.code+' numbers', doneLabel:'Save',
    body:'<div class="intro">Type what your college portal shows. What you have marked in the '+
      'app is already inside these numbers.</div>'+
      '<div class="eyebrow" style="margin:24px 0 4px">Theory</div>'+
      row('Attended','bThp',A.th.p)+row('Total held','bTht',A.th.t)+
      '<div class="eyebrow" style="margin:24px 0 4px">Tutorial</div>'+
      row('Attended','bTup',A.tu.p)+row('Total held','bTut',A.tu.t)+
      '<div class="eyebrow" style="margin:24px 0 4px">Practical</div>'+
      row('Attended','bPrp',A.pr.p)+row('Total held','bPrt',A.pr.t),
    onSave(){
      const g=id=>Math.max(0,parseInt((el(id)||{}).value)||0);
      const thp=g('bThp'),tht=g('bTht'),tup=g('bTup'),tut=g('bTut'),prp=g('bPrp'),prt=g('bPrt');
      if(tht<thp||tut<tup||prt<prp) return sheetError('Total held can’t be smaller than attended.'),false;
      const d=marksOnly(sub.id);
      if(thp<d.th.p||tht-thp<d.th.a||tup<d.tu.p||tut-tup<d.tu.a||prp<d.pr.p||prt-prp<d.pr.a)
        return sheetError('You have already marked more than that in the app.'),false;
      S.att[sub.id]={thp:thp-d.th.p,tha:(tht-thp)-d.th.a,tup:tup-d.tu.p,tua:(tut-tup)-d.tu.a,
                     prp:prp-d.pr.p,pra:(prt-prp)-d.pr.a};
      save(); renderAll(); toast('Numbers updated.');
    }});
}
function sheetClass(slot,iso){
  const c=slot||{subId:(S.subs[0]||{}).id,kind:'th',start:'09:00',end:'10:00',room:'',
                 day:dowOf(dateOf(iso||todayISO())),online:false};
  if(!S.subs.length) return openSheet({title:'No subjects',
    body:'<div class="empty"><div class="t">Add a subject first</div>'+
      '<div class="s">A class needs something to belong to.</div></div>'});
  const DAYS=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  openSheet({title:slot?'Class':'New class', doneLabel:'Save',
    body:'<div class="field-row"><span class="lab">Subject</span><span class="in">'+
      '<select id="clSub">'+S.subs.map(s=>'<option value="'+s.id+'"'+
        (c.subId===s.id?' selected':'')+'>'+esc(s.name)+'</option>').join('')+'</select></span></div>'+
      '<div class="field-row"><span class="lab">Day</span><span class="in">'+
      '<select id="clDay">'+DAYS.map((d,i)=>'<option value="'+i+'"'+
        (c.day===i?' selected':'')+'>'+d+'</option>').join('')+'</select></span></div>'+
      '<div class="field-row"><span class="lab">Starts</span><span class="in">'+
      '<input type="time" id="clStart" value="'+esc(c.start)+'"></span></div>'+
      '<div class="field-row"><span class="lab">Ends</span><span class="in">'+
      '<input type="time" id="clEnd" value="'+esc(c.end)+'"></span></div>'+
      '<div class="field-row"><span class="lab">Room</span><span class="in">'+
      '<input type="text" id="clRoom" value="'+esc(c.room||'')+'"></span></div>'+
      '<div class="eyebrow" style="margin:24px 0 4px">Kind</div>'+
      '<div class="choice">'+KINDS.map(k=>'<button data-k="'+k[0]+'"'+
        (c.kind===k[0]?' class="on"':'')+'>'+k[1]+'</button>').join('')+'</div>'+
      '<div class="eyebrow" style="margin:24px 0 4px">Where</div>'+
      '<div class="choice"><button data-o="0"'+(c.online?'':' class="on"')+'>In person</button>'+
        '<button data-o="1"'+(c.online?' class="on"':'')+'>Online</button></div>'+
      (slot?'<div style="margin-top:30px">'+pill('Delete class','clDel','sm')+'</div>':''),
    after(){
      let kind=c.kind, online=!!c.online;
      onAll('#panelBody [data-k]',n=>{ kind=n.dataset.k;
        document.querySelectorAll('#panelBody [data-k]').forEach(x=>
          x.classList.toggle('on',x.dataset.k===kind)); });
      onAll('#panelBody [data-o]',n=>{ online=n.dataset.o==='1';
        document.querySelectorAll('#panelBody [data-o]').forEach(x=>
          x.classList.toggle('on',(x.dataset.o==='1')===online)); });
      el('panelDone').onclick=()=>{
        const st=el('clStart').value, en=el('clEnd').value;
        if(!st||!en||t2m(en)<=t2m(st)) return sheetError('The end has to be after the start.');
        const rec={subId:el('clSub').value,day:+el('clDay').value,kind:kind,
                   start:st,end:en,room:(el('clRoom').value||'').trim(),online:online};
        if(slot) Object.assign(slot,rec); else S.slots.push(Object.assign({id:uid()},rec));
        save(); renderAll(); closeSheet(); toast('Saved.');
      };
      on('clDel',()=>openAct({title:'Delete this class?',
        items:[{label:'Delete',destructive:true,run(){
          S.slots=S.slots.filter(x=>x.id!==slot.id); save(); renderAll(); toast('Deleted.');
        }}]}));
    },
    onSave(){ return false; }});
}
function sheetDeadline(dl){
  const c=dl||{title:'',subId:'',date:isoOf(addDays(new Date(),7)),done:false};
  openSheet({title:dl?'Deadline':'New deadline', doneLabel:'Save',
    body:'<div class="field-row"><span class="lab">What</span><span class="in">'+
      '<input type="text" id="dlTitle" value="'+esc(c.title)+'"></span></div>'+
      '<div class="field-row"><span class="lab">Subject</span><span class="in">'+
      '<select id="dlSub"><option value="">None</option>'+S.subs.map(s=>'<option value="'+
        s.id+'"'+(c.subId===s.id?' selected':'')+'>'+esc(s.name)+'</option>').join('')+
      '</select></span></div>'+
      '<div class="field-row"><span class="lab">Due</span><span class="in">'+
      '<input type="date" id="dlDate" value="'+esc(c.date)+'"></span></div>'+
      (dl?'<div style="margin-top:30px">'+
        pill(dl.done?'Mark as not done':'Mark as done','dlDone','sm')+' '+
        pill('Delete','dlDel','sm')+'</div>':''),
    after(){
      on('dlDone',()=>{ dl.done=!dl.done; save(); renderAll(); closeSheet();
                        toast(dl.done?'Done.':'Reopened.'); });
      on('dlDel',()=>openAct({title:'Delete this?',items:[{label:'Delete',destructive:true,
        run(){ S.dls=S.dls.filter(x=>x.id!==dl.id); save(); renderAll(); toast('Deleted.'); }}]}));
    },
    onSave(){
      const t=(el('dlTitle').value||'').trim();
      if(!t) return sheetError('Give it a name.'),false;
      const rec={title:t,subId:el('dlSub').value||'',date:el('dlDate').value};
      if(dl) Object.assign(dl,rec); else S.dls.push(Object.assign({id:uid(),done:false},rec));
      save(); renderAll(); toast('Saved.');
    }});
}
function sheetMonth(mo){
  const draw=()=>{
    const m=monthsWithMarks().filter(x=>x.key===mo)[0];
    let b='';
    if(!m){ b='<div class="empty"><div class="t">Nothing here</div>'+
      '<div class="s">No classes marked in this month.</div></div>'; }
    else {
      const pc=pctOf(m.p,m.t);
      const lv=!m.t?'none':pc>=S.thr?'ok':pc>=S.thr-6?'tight':'gone';
      b='<div class="figure"><span class="n '+vCls(lv)+'">'+
        (m.t?pctFmt(pc)+'%':'—')+'</span><span class="of">'+m.p+' of '+m.t+
        ' attended</span></div>';
      Object.keys(m.days).sort().forEach(iso=>{
        b+='<div class="eyebrow" style="margin:28px 0 4px">'+
          dateOf(iso).toLocaleDateString(undefined,
            {weekday:'long',day:'numeric',month:'short'})+'</div>';
        m.days[iso].forEach(e=>{
          b+='<div class="item" style="display:block">'+
            '<div style="display:flex;gap:16px">'+
            '<span class="time">'+(e.slot?fmtT(e.slot.start):'')+'</span>'+
            '<div class="grow"><div class="lead">'+esc(e.sub.name)+'</div>'+
            '<div class="sub">'+esc(e.sub.code)+
              (e.kind&&e.kind!=='th'?' · '+KIND_NAME[e.kind]:'')+'</div></div></div>'+
            '<div style="margin-top:14px">'+markChoice(e.key)+'</div></div>';
        });
      });
    }
    el('panelBody').innerHTML=b;
    bindMarks('#panelBody');
  };
  /* Name the month you opened. "Month" told you nothing you had not just
     tapped, and with several months listed it read as the wrong one. */
  const m0=monthsWithMarks().filter(x=>x.key===mo)[0];
  openSheet({title:(m0&&m0.label)||'Month', body:'', after:draw});
}

function sheetThreshold(){
  openSheet({title:'Minimum required', doneLabel:'Save',
    body:'<div class="intro">The percentage you must hold. Everything in the app is measured '+
      'against it.</div><div class="field-row"><span class="lab">Minimum</span>'+
      '<span class="in"><input type="number" id="thVal" min="1" max="100" value="'+S.thr+'"></span></div>',
    onSave(){ S.thr=clamp(parseInt(el('thVal').value)||67,1,100); save(); renderAll();
              toast('Minimum set to '+S.thr+'%.'); }});
}
function sheetWhoAmI(back){
  const row=(lab,id,v,ph)=>'<div class="field-row"><span class="lab">'+lab+'</span>'+
    '<span class="in"><input type="text" id="'+id+'" value="'+esc(v||'')+'"'+
    (ph?' placeholder="'+esc(ph)+'"':'')+'></span></div>';
