<!DOCTYPE html>
<html lang="en">
<head>

<meta name="mobile-web-app-capable" content="yes">

<style>
/* ══════════════════════════════════════════════════════════════
   11:59 — iOS-native design tokens
   ══════════════════════════════════════════════════════════════ */
:root{
  color-scheme:light;
  --bg:#F2F2F7;
  --card:#FFFFFF;
  --card-press:#EFEFF2;
  --line:rgba(60,60,67,.16);      /* surfaces are drawn, not floated */
  --line-2:rgba(60,60,67,.30);
  /* A surface reads as lifted when light catches its top edge. Cheap —
     it is a shadow, not a filter, so it can go on every card. Blur is
     reserved for chrome that actually floats over content. */
  --edge:inset 0 1px 0 rgba(255,255,255,.85), 0 1px 2px rgba(0,0,0,.04);
  --edge-lift:inset 0 1px 0 rgba(255,255,255,.9), 0 6px 18px -8px rgba(0,0,0,.16);
  --sep:rgba(60,60,67,.22);
  --sep-soft:rgba(60,60,67,.10);
  --label:#0B0B0C;
  --label2:rgba(60,60,67,.62);
  --label3:rgba(60,60,67,.34);
  --fill:rgba(118,118,128,.10);
  --fill2:rgba(118,118,128,.18);
  /* The action colour, and only that: buttons, the live tab, links, focus.
     Deliberately not green, orange or red — those three mean something
     about your attendance and must never also mean "you can press this". */
  --accent:#4F46E5;
  --green:#1D9E4B; --red:#DC2626; --orange:#C2740A; --yellow:#B58900;
  --purple:#7C3AED; --teal:#0E8C9E; --pink:#DB2777; --indigo:#4F46E5; --brown:#8A6A48;
  --nav:rgba(250,250,252,.82);
  /* liquid-glass pill (carried over from the wallet app) */
  --glass:rgba(255,255,255,.62); --glass-solid:rgba(252,251,249,.95);
  --glass-line:rgba(22,20,20,.11); --glass-hi:rgba(255,255,255,.80);
  --glass-active:rgba(22,20,20,.07);
  --sheet:#FFFFFF;
  --scrim:rgba(0,0,0,.32);
  --ta:.13;                       /* subject tint alpha */
  /* ── the one rule ────────────────────────────────────────────────
     Anything measured is set in mono; anything said is set in sans. A
     percentage, a count, a time and a date are readings — they line up in
     columns and you can tell them from prose without reading either.
     No webfont is loaded: SF Mono and the system sans are already on the
     device, and this file must never fetch anything. */
  --font:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,system-ui,sans-serif;
  --mono:ui-monospace,'SF Mono',SFMono-Regular,Menlo,'Roboto Mono',monospace;
  --r-sm:6px; --r:10px; --r-lg:14px;
  --round:10px;
}
[data-theme="dark"]{
  color-scheme:dark;
  --bg:#000000;
  --card:#151517;
  --card-press:#232326;
  --line:#2A2A2E; --line-2:#3E3E44;
  --edge:inset 0 1px 0 rgba(255,255,255,.06);
  --edge-lift:inset 0 1px 0 rgba(255,255,255,.09), 0 8px 24px -10px rgba(0,0,0,.7);
  --sep:rgba(120,120,128,.34);
  --sep-soft:rgba(120,120,128,.18);
  --label:#FFFFFF;
  --label2:#AEAEB2;
  --label3:#6E6E73;
  --fill:rgba(118,118,128,.20);
  --fill2:rgba(118,118,128,.32);
  --accent:#7A6CFF;
  --green:#30D158; --red:#FF453A; --orange:#FF9F0A; --yellow:#FFD60A;
  --purple:#BF5AF2; --teal:#40C8E0; --pink:#FF375F; --indigo:#7A6CFF; --brown:#AC8E68;
  --nav:rgba(14,14,16,.82);
  --glass:rgba(28,28,31,.58); --glass-solid:rgba(18,18,20,.95);
  --glass-line:rgba(241,239,237,.13); --glass-hi:rgba(255,255,255,.09);
  --glass-active:rgba(241,239,237,.13);
  --sheet:#1C1C1E;
  --scrim:rgba(0,0,0,.5);
  --ta:.22;
}

/* subject palette */
.sc0{--sc:var(--accent)} .sc1{--sc:var(--orange)} .sc2{--sc:var(--green)} .sc3{--sc:var(--purple)}
.sc4{--sc:var(--pink)}   .sc5{--sc:var(--teal)}   .sc6{--sc:var(--indigo)} .sc7{--sc:var(--brown)}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
/* Controls must not offer text selection or the iOS Copy/Look-Up bubble —
   that callout is the giveaway that something is a web page. Real text
   (class names, the appeal message) stays selectable. */
button,.row,.tile,.cls,.dChip,.seg,.mkSeg,#tabbar,#nav,.pill,.tag{
  -webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg); color:var(--label);
  font-family:var(--font); font-size:17px; line-height:1.4;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
  padding-bottom:calc(92px + env(safe-area-inset-bottom,0px));
}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer;font-size:17px}
input,select,textarea{font-family:inherit;font-size:17px;color:var(--label);background:none;border:none;outline:none;border-radius:8px}
input::placeholder,textarea::placeholder{color:var(--label3)}
a{color:var(--accent);text-decoration:none}
/* every reading: mono, tabular, so columns of them line up */
.tnum,.num{font-family:var(--mono);font-variant-numeric:tabular-nums;
  font-feature-settings:'tnum' 1;letter-spacing:-.02em}
/* the small tracked-out label that titles a section or a stat */
.micro{font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.14em;
  text-transform:uppercase;color:var(--label3)}

/* ── nav bar ─────────────────────────────────────────────── */
#nav{
  position:fixed;top:0;left:0;right:0;z-index:60;
  height:calc(48px + env(safe-area-inset-top,0px));
  padding-top:env(safe-area-inset-top,0px);
  display:flex;align-items:center;
  background:transparent;
  transition:background .22s ease, box-shadow .22s ease;
}
#nav.solid{
  background:var(--nav);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
  backdrop-filter:saturate(180%) blur(20px);
  box-shadow:0 .5px 0 var(--sep);
}
#navTitle{
  flex:1;text-align:center;font-size:17px;font-weight:600;letter-spacing:-.01em;
  opacity:0;transform:translateY(4px);transition:opacity .2s,transform .2s;
  padding:0 84px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
#nav.solid #navTitle{opacity:1;transform:none}
#navR{position:absolute;right:6px;display:flex;align-items:center;gap:2px;
  top:env(safe-area-inset-top,0px);height:48px}
.navBtn{
  width:42px;height:42px;display:flex;align-items:center;justify-content:center;
  color:var(--accent);border-radius:50%;
}
.navBtn:active{background:var(--fill)}
.navBtn svg{width:23px;height:23px;display:block}

/* ── layout ──────────────────────────────────────────────── */
main{padding-top:calc(48px + env(safe-area-inset-top,0px))}
section{display:none}
section.on{display:block;animation:fade .26s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.lg{padding:2px 20px 2px}
.lg .brand{font-family:var(--mono);font-size:9.5px;font-weight:600;letter-spacing:.22em;
  text-transform:uppercase;color:var(--label3);margin-bottom:5px;display:block}
.lg .brand b{color:var(--accent);font-weight:600}
.lg h1{font-size:32px;font-weight:700;letter-spacing:-.03em;line-height:1.14}
.lg .sub{font-family:var(--mono);font-size:12px;color:var(--label2);margin-top:4px;
  font-weight:500;letter-spacing:-.01em}
.pad{padding:0 16px}

/* ── grouped list ────────────────────────────────────────── */
.gHead{display:flex;align-items:center;gap:10px;
  font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.14em;
  color:var(--label3);text-transform:uppercase;padding:24px 16px 9px;margin:0}
.gHead::after{content:'';flex:1;height:1px;background:var(--line)}
.gHead.tight{padding-top:15px}
.gNote{font-size:13px;color:var(--label2);padding:7px 16px 0;line-height:1.35}
.list{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  margin:0 0 2px;overflow:hidden;box-shadow:var(--edge)}
.row{
  position:relative;display:flex;align-items:center;gap:12px;
  min-height:48px;padding:11px 16px;width:100%;text-align:left;font-size:17px;
}
.row+.row::before{content:'';position:absolute;top:0;left:16px;right:0;height:.5px;background:var(--sep)}
button.row:active,.tap:active{background:var(--card-press)}
@media (prefers-reduced-motion: reduce){button:active,.row:active{transform:none}}
.row .rMain{flex:1;min-width:0}
.row .rT{font-size:16px;letter-spacing:-.01em}
.row .rS{font-size:12.5px;color:var(--label2);margin-top:3px;line-height:1.35}
.row .rV{color:var(--label2);font-family:var(--mono);font-size:15px;
  font-variant-numeric:tabular-nums;text-align:right;flex-shrink:0}
.row .chev{color:var(--label3);flex-shrink:0;font-size:15px;margin-left:-4px}
.row.danger .rT{color:var(--red)}
.row .ico{width:28px;height:28px;border-radius:var(--r-sm);display:flex;align-items:center;
  justify-content:center;flex-shrink:0;color:#fff;font-size:15px}
.chk{color:var(--accent);font-size:17px;font-weight:700;flex-shrink:0}

/* inline controls inside rows */
.row input[type=text],.row input[type=number]{flex:1;text-align:right;min-width:0}
.row input[type=date],.row input[type=time],.row select{
  background:var(--fill);border-radius:8px;padding:7px 10px;font-size:16px;
  text-align:center;flex-shrink:0;max-width:52%;
}
.row select{text-align:left;-webkit-appearance:none;appearance:none;padding-right:26px;
  background-image:linear-gradient(45deg,transparent 50%,var(--label2) 50%),linear-gradient(135deg,var(--label2) 50%,transparent 50%);
  background-position:calc(100% - 14px) 55%,calc(100% - 9px) 55%;
  background-size:5px 5px,5px 5px;background-repeat:no-repeat}


/* ── settings groups ─────────────────────────────────────
   Glass, because a group is a surface you open rather than a slab of
   page. Nested lists inside must not frost again — blur over blur goes
   milky and you lose the thing you were seeing through. */
.setG{border-radius:var(--r-lg);margin-bottom:9px;overflow:hidden;
  border:1px solid var(--glass-line);background:var(--glass);
  -webkit-backdrop-filter:saturate(185%) blur(30px);
  backdrop-filter:saturate(185%) blur(30px);
  box-shadow:var(--edge);
  transition:border-color .25s ease, box-shadow .25s ease}
.setG.on{box-shadow:var(--edge-lift)}
.setG.on{border-color:var(--line-2,var(--sep))}
.setH{display:flex;align-items:center;gap:12px;width:100%;padding:15px 16px;text-align:left}
.setT{font-size:15.5px;font-weight:600;letter-spacing:-.01em}
.setS{font-family:var(--mono);font-size:11.5px;color:var(--label2);margin-top:4px;
  line-height:1.45;letter-spacing:-.01em}
.setC{flex:none;color:var(--label3);font-size:20px;line-height:1;
  transition:transform .28s cubic-bezier(.22,1,.36,1),color .2s}
.setG.on .setC{transform:rotate(90deg);color:var(--accent)}
.setB{padding:2px 13px 14px;border-top:1px solid var(--line);
  animation:setOpen .3s cubic-bezier(.22,1,.36,1)}
.setB .list{border:0;background:var(--fill);margin-bottom:0}
.setB .list+.gHead{padding-left:3px}
.setB .gHead{padding-left:3px;padding-right:3px}
.setB .gNote{padding-left:3px;padding-right:3px}
.setB .card{background:var(--fill);border-color:transparent}
@keyframes setOpen{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}

/* ── segmented control ───────────────────────────────────── */
.seg{display:flex;background:var(--fill);border-radius:var(--r-sm);padding:2px;gap:2px}
.seg button{
  flex:1;height:32px;border-radius:4px;font-size:13px;font-weight:600;
  color:var(--label);white-space:nowrap;padding:0 6px;transition:background .18s
}
.seg button.on{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.12)}
[data-theme="dark"] .seg button.on{background:#48484A;box-shadow:none}

/* ── buttons ─────────────────────────────────────────────── */
.btn{
  display:flex;align-items:center;justify-content:center;gap:7px;
  width:100%;height:48px;border-radius:var(--r);background:var(--accent);color:#fff;
  font-size:16px;font-weight:600;letter-spacing:-.01em;
}
.btn:active{opacity:.75}
.btn.ghost{background:var(--fill);color:var(--accent)}
.btn.dangerBtn{background:var(--red)}
.btn.sm{height:40px;font-size:15px;border-radius:var(--r-sm)}

/* ── cards ───────────────────────────────────────────────── */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:16px;margin:0 0 12px;box-shadow:var(--edge)}
.card.tinted{background:color-mix(in srgb,var(--sc) calc(var(--ta)*100%),var(--card))}
@supports not (background:color-mix(in srgb,red 10%,blue)){
  .card.tinted{background:var(--card)}
}
.kicker{font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.14em;
  text-transform:uppercase;color:var(--label3)}


/* ═══ THE MARGIN ═══════════════════════════════════════════════════════
   The signature. Everything in this app comes down to one question — how
   many classes can I still miss — and that answer is a whole number, not a
   proportion. So it is drawn as counted things: one pip per class you have
   left to spend, filled while they are yours, hollow once they are gone.
   A bar would imply you can miss two and a half classes. You cannot.     */
.margin{display:flex;align-items:center;gap:4px;flex-wrap:wrap;margin-top:10px}
.margin i{width:9px;height:9px;border-radius:2px;background:var(--mg,var(--green));
  display:block;flex-shrink:0}
.margin i.spent{background:none;box-shadow:inset 0 0 0 1px var(--line)}
.margin .mgN{font-family:var(--mono);font-size:11px;font-weight:600;color:var(--label2);
  margin-left:5px;letter-spacing:-.01em}
.margin.none i{background:var(--red)}

/* ── hero (today) ────────────────────────────────────────── */
#hero{margin:10px 16px 14px;border-radius:var(--r);overflow:hidden;background:var(--card);
  border:1px solid var(--line);border-left:3px solid var(--sc,var(--accent));
  box-shadow:var(--edge-lift)}
#hero .hTop{padding:16px 18px 14px}
#hero .hK{font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.14em;
  text-transform:uppercase;
  color:var(--sc,var(--accent));display:flex;align-items:center;gap:7px}
#hero .hK .dot{width:7px;height:7px;border-radius:50%;background:var(--sc,var(--accent));
  animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.8)}}
/* The headline is a reading — a time, a countdown, a verdict — so it takes
   the mono treatment when it starts with a figure. Prose headlines keep the
   sans, set tight and heavy. */
#hero .hN{font-size:25px;font-weight:700;letter-spacing:-.03em;margin-top:8px;line-height:1.18}
#hero .hN.num{font-family:var(--mono);font-weight:600;letter-spacing:-.045em}
#hero .hM{font-size:14px;color:var(--label2);margin-top:5px;line-height:1.45}
#hero .hM b{color:var(--label);font-weight:600}
#hero .hAct{padding:0 18px 16px}

/* mark control */
.mkSeg{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;background:var(--fill);
  border-radius:11px;padding:3px}
.mkSeg button{height:38px;border-radius:9px;font-size:14px;font-weight:600;color:var(--label2)}
.mkSeg button:active{opacity:.6}
.mkSeg button.on{color:#fff}
.mkSeg button.on[data-m="p"]{background:var(--green)}
.mkSeg button.on[data-m="a"]{background:var(--red)}
.mkSeg button.on[data-m="c"]{background:var(--fill2);color:var(--label)}

/* ── class card ──────────────────────────────────────────── */
.cls{background:var(--card);border-radius:14px;padding:14px 15px;margin-bottom:10px;
  border-left:4px solid var(--sc)}
.cls .cTop{display:flex;align-items:flex-start;gap:12px}
.cls .cTime{font-size:13px;font-weight:600;color:var(--label2);width:78px;flex-shrink:0;
  line-height:1.35;font-variant-numeric:tabular-nums}
.cls .cName{flex:1;min-width:0;font-size:17px;font-weight:600;letter-spacing:-.015em;line-height:1.25}
.cls .cMeta{font-size:13px;color:var(--label2);font-weight:400;margin-top:3px}
.cls .cMore{color:var(--label3);font-size:19px;padding:0 2px;line-height:1;align-self:center}
.cls .cSkip{font-size:13px;color:var(--label2);margin-top:9px;display:flex;align-items:center;gap:6px}
.cls .cSkip b{font-weight:600}
.cls.done{opacity:.62}
.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  padding:2px 7px;border-radius:5px;background:var(--fill);color:var(--label2);vertical-align:2px}
.tag.tu{background:color-mix(in srgb,var(--sc) 18%,transparent);color:var(--sc)}
.tag.pr{background:color-mix(in srgb,var(--purple) 20%,transparent);color:var(--purple)}
.tag.online{background:color-mix(in srgb,var(--teal) 20%,transparent);color:var(--teal)}
.pill{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);
  font-size:11px;font-weight:600;letter-spacing:-.01em;
  padding:3px 9px;border-radius:99px}
.pill.ok{background:color-mix(in srgb,var(--green) 16%,transparent);color:var(--green)}
.pill.no{background:color-mix(in srgb,var(--red) 16%,transparent);color:var(--red)}
.pill.mid{background:color-mix(in srgb,var(--orange) 18%,transparent);color:var(--orange)}
@supports not (background:color-mix(in srgb,red 10%,blue)){
  .pill.ok{background:var(--fill)} .pill.no{background:var(--fill)} .pill.mid{background:var(--fill)}
  .tag.tu{background:var(--fill)}
  .tag.pr{background:var(--fill);color:var(--purple)}
  .tag.online{background:var(--fill);color:var(--teal)}
}

/* ── stat tiles ──────────────────────────────────────────── */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 16px 12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:14px 15px;box-shadow:var(--edge)}
.tile .tV{font-family:var(--mono);font-size:26px;font-weight:600;letter-spacing:-.04em;
  line-height:1.1;font-variant-numeric:tabular-nums}
.tile .tL{font-size:12px;color:var(--label2);margin-top:4px;line-height:1.3}

/* ── ring ────────────────────────────────────────────────── */
.ring{width:112px;height:112px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;flex-shrink:0;position:relative}
.ring .inner{width:88px;height:88px;border-radius:50%;background:var(--card);
  display:flex;flex-direction:column;align-items:center;justify-content:center}
/* Sized for the longest reading it has to hold — "100%" is four characters
   but "76.92%" is six, and at 25px those overflow an 88px circle. */
.ring .rv{font-family:var(--mono);font-size:20px;font-weight:600;letter-spacing:-.045em;
  line-height:1;font-variant-numeric:tabular-nums}
.ring .rl{font-size:10.5px;color:var(--label2);margin-top:3px;letter-spacing:.03em}

/* ── bars ────────────────────────────────────────────────── */
.bar{height:7px;border-radius:99px;background:var(--fill);position:relative;overflow:visible;margin:11px 0 0}
.bar .fl{height:7px;border-radius:99px;transition:width .5s cubic-bezier(.22,1,.36,1)}
.bar .rq{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--label);opacity:.45;border-radius:2px}

/* ── day strip (timetable) ───────────────────────────────── */
/* ── date picker rail ────────────────────────────────────────────
   Behaves like the iPhone clock picker: flick it, it glides, and
   whichever date lands under the centre marker becomes the selected
   day. Scroll-snap does the settling; a scroll-end handler reads the
   centred chip. */
#railWrap{position:relative}
#railWrap::before{                      /* the centre selection band */
  content:'';position:absolute;left:50%;top:6px;bottom:6px;width:58px;
  transform:translateX(-50%);border-radius:14px;background:var(--fill);
  pointer-events:none;z-index:0;
}
#dayStrip{position:relative;z-index:1;display:flex;gap:7px;overflow-x:auto;overflow-y:hidden;
  padding:8px 0 6px;-webkit-overflow-scrolling:touch;scrollbar-width:none;
  overscroll-behavior-x:contain;scroll-snap-type:x mandatory}
#dayStrip::-webkit-scrollbar{display:none}
/* first and last chips must be able to reach the centre */
#dayStrip::before,#dayStrip::after{content:'';flex:0 0 calc(50vw - 25px)}
.dChip{flex:0 0 auto;width:50px;border-radius:12px;padding:5px 2px 6px;text-align:center;
  background:transparent;scroll-snap-align:center;transition:background .18s,transform .18s}
.dChip .dM{font-size:9px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
  color:var(--accent);height:11px;line-height:11px}
.dChip.wknd .dW,.dChip.wknd .dN{opacity:.55}
/* the centred day reads as selected — no fill, the band behind it does that */
.dChip.on{transform:scale(1.06)}
.dChip.on .dW{color:var(--accent)}
.dChip.on .dN{font-weight:800}
.dChip.on.wknd .dW,.dChip.on.wknd .dN{opacity:1}
.dChip .dW{font-size:10.5px;font-weight:700;letter-spacing:.05em;color:var(--label2);text-transform:uppercase}
.dChip .dN{font-size:17px;font-weight:700;margin-top:3px;font-variant-numeric:tabular-nums}
.dChip .dD{width:5px;height:5px;border-radius:50%;background:var(--label3);margin:4px auto 0}
/* today is always marked in red, selected or not (Calendar app convention) */
.dChip.today .dN,.dChip.today .dW{color:var(--red);opacity:1}
#ttHead{display:flex;align-items:center;gap:10px;padding:12px 20px 8px}
#ttHead .h{font-size:20px;font-weight:700;letter-spacing:-.02em;flex:1}
#ttHead .w{font-size:13px;color:var(--label2)}
#ttBody{padding:0 16px;transition:transform .18s ease-out}
#timetable{touch-action:pan-y}
#ttHead{touch-action:pan-y}
/* the rail must own horizontal panning — pan-y here would kill finger scrolling */
#dayStrip{touch-action:pan-x}
#ttBody.slideL{animation:slL .26s ease}
#ttBody.slideR{animation:slR .26s ease}
@keyframes slL{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
@keyframes slR{from{opacity:0;transform:translateX(-26px)}to{opacity:1;transform:none}}

/* ── empty state ─────────────────────────────────────────── */
.empty{text-align:center;padding:44px 30px;color:var(--label2)}
.empty .eE{font-size:38px;margin-bottom:12px;opacity:.85}
.empty .eT{font-size:17px;font-weight:600;color:var(--label);margin-bottom:5px}
.empty .eS{font-size:14.5px;line-height:1.45}

/* ── deadlines ───────────────────────────────────────────── */
.dlChk{width:25px;height:25px;border-radius:50%;border:1.8px solid var(--label3);
  flex-shrink:0;display:flex;align-items:center;justify-content:center;
  font-size:13px;color:transparent;transition:all .18s}
.dlChk.on{background:var(--green);border-color:var(--green);color:#fff}
.dlRow.done .rT{text-decoration:line-through;color:var(--label2)}
.when{font-size:13px;font-weight:600;text-align:right;flex-shrink:0;font-variant-numeric:tabular-nums}
.when.late{color:var(--red)} .when.near{color:var(--orange)} .when.calm{color:var(--label2)}
.subChip{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.03em;
  padding:2px 7px;border-radius:5px;color:var(--sc);
  background:color-mix(in srgb,var(--sc) 16%,transparent)}
@supports not (background:color-mix(in srgb,red 10%,blue)){.subChip{background:var(--fill)}}

/* procrastination meter */
.pmTrack{position:relative;height:7px;border-radius:99px;
  background:linear-gradient(90deg,var(--green),var(--yellow) 55%,var(--red));margin:14px 0 0}
.pmPin{position:absolute;top:50%;width:17px;height:17px;margin:-8.5px 0 0 -8.5px;border-radius:50%;
  background:var(--card);border:3px solid var(--label);transition:left .8s cubic-bezier(.22,1,.36,1)}
.pmEnds{display:flex;justify-content:space-between;margin-top:9px;font-size:11.5px;color:var(--label2)}
.pmStats{display:flex;gap:22px;flex-wrap:wrap;margin-top:14px;padding-top:13px;border-top:.5px solid var(--sep)}
.pmStats span{font-size:11.5px;color:var(--label2);display:flex;flex-direction:column;gap:2px}
.pmStats b{font-size:17px;color:var(--label);font-weight:700}

/* ── calendar ────────────────────────────────────────────── */
#calBar{display:flex;align-items:center;gap:4px;padding:6px 16px 10px}
#calTitle{flex:1;font-size:20px;font-weight:700;letter-spacing:-.02em}
.calNav{width:38px;height:38px;border-radius:50%;color:var(--accent);font-size:19px;
  display:flex;align-items:center;justify-content:center}
.calNav:active{background:var(--fill)}
#calGrid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;padding:0 10px}
.cDow{text-align:center;font-size:11px;font-weight:600;color:var(--label2);padding:2px 0 6px}
.cD{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;border-radius:50%;font-size:16px;font-variant-numeric:tabular-nums;position:relative}
.cD.pad{opacity:0;pointer-events:none}
.cD.today{color:var(--red);font-weight:700}
.cD.sel{background:var(--accent);color:#fff!important;font-weight:700}
.cD .dots{display:flex;gap:2.5px;height:5px;align-items:center}
.cD .dots i{width:5px;height:5px;border-radius:50%;background:var(--sc,var(--label3))}
.cD.sel .dots i{background:rgba(255,255,255,.9)}

/* ── sheet ───────────────────────────────────────────────── */
/* Depth comes from blur and a lit edge, not from blacking the room out.
   A heavy scrim removes everything behind the panel, so there is nothing
   left for the glass to be glass over. */
#scrim{position:fixed;inset:0;z-index:90;background:var(--scrim);opacity:0;
  transition:opacity .28s ease;pointer-events:none;
  -webkit-backdrop-filter:saturate(120%) blur(3px);backdrop-filter:saturate(120%) blur(3px)}
#scrim.on{opacity:1;pointer-events:auto}
/* ── the panel ───────────────────────────────────────────
   A drawer welded to the bottom edge reads as part of the chrome, and it
   is the wrong shape for reading: tall, narrow, and every detail view
   becomes a long scroll up a thin column. Floated clear of the edges and
   closer to square, it reads as an object in front of the app, with the
   whole thing in view and the close where your eye already is. */
#sheet{
  position:fixed;z-index:100;
  left:max(10px,env(safe-area-inset-left,0px));
  right:max(10px,env(safe-area-inset-right,0px));
  top:50%;bottom:auto;transform:translateY(-50%) scale(.94);
  max-width:540px;margin:0 auto;
  max-height:min(78dvh,680px);
  display:flex;flex-direction:column;overflow:hidden;
  border-radius:24px;
  border:1px solid var(--glass-line);
  background:
    linear-gradient(160deg,var(--glass-hi),rgba(255,255,255,0) 44%),
    var(--glass-solid);
  -webkit-backdrop-filter:saturate(200%) blur(40px);
  backdrop-filter:saturate(200%) blur(40px);
  box-shadow:
    inset 0 1px 0 var(--glass-hi),
    0 2px 8px rgba(0,0,0,.22),
    0 32px 80px -28px rgba(0,0,0,.55);
  opacity:0;pointer-events:none;
  transition:opacity .26s ease, transform .42s cubic-bezier(.22,1,.36,1);
}
#sheet.on{opacity:1;transform:translateY(-50%) scale(1);pointer-events:auto}
/* Nested surfaces inside the glass must not frost again — blur on blur
   goes milky and you lose what you were seeing through. */
#sheet .card,#sheet .list,#sheet .setG{
  -webkit-backdrop-filter:none;backdrop-filter:none;
  background:var(--fill);border-color:transparent}
#sheet .grab{width:36px;height:4px;border-radius:99px;background:var(--label3);
  opacity:.45;margin:9px auto 0;flex-shrink:0}
#sheetBar{display:flex;align-items:center;padding:12px 14px 10px;flex-shrink:0;
  border-bottom:1px solid var(--glass-line);margin-bottom:14px}
#sheetBar .sTitle{flex:1;text-align:center;font-size:16px;font-weight:600;letter-spacing:-.01em}
#sheetBar button{font-size:17px;color:var(--accent);min-width:64px;padding:4px 0}
#sheetBar button.done{font-weight:600;text-align:right}
#sheetBar button.cancel{text-align:left}
#sheetBar button:disabled{color:var(--label3)}
#sheetBody{overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:0 18px 20px;flex:1}
#sheetBody .list{margin-bottom:0}
.sheetErr{font-size:13.5px;color:var(--red);padding:10px 4px 0;line-height:1.35}
.sheetIntro{font-size:14px;color:var(--label2);padding:4px 4px 12px;line-height:1.45}

/* action sheet */
#act{position:fixed;left:8px;right:8px;bottom:8px;z-index:100;
  padding-bottom:env(safe-area-inset-bottom,0px);
  transform:translateY(130%);transition:transform .32s cubic-bezier(.32,.72,0,1)}
#act.on{transform:none}
.actGrp{border-radius:var(--r-lg);overflow:hidden;margin-bottom:8px;
  border:1px solid var(--glass-line);
  background:linear-gradient(160deg,var(--glass-hi),rgba(255,255,255,0) 44%),var(--glass-solid);
  -webkit-backdrop-filter:saturate(200%) blur(30px);
  backdrop-filter:saturate(200%) blur(30px);
  box-shadow:var(--edge-lift)}

.actGrp button{width:100%;height:56px;font-size:19px;color:var(--accent);position:relative;display:block}
.actGrp button+button::before{content:'';position:absolute;top:0;left:0;right:0;height:.5px;background:var(--sep)}
.actGrp button:active{background:var(--fill)}
.actGrp button.destructive{color:var(--red)}
.actGrp button.cancelBtn{font-weight:600}
.actHead{padding:16px 20px 14px;text-align:center;position:relative}
.actHead .aT{font-size:15px;font-weight:600}
.actHead .aS{font-size:13px;color:var(--label2);margin-top:3px;line-height:1.35}
.actHead::after{content:'';position:absolute;bottom:0;left:0;right:0;height:.5px;background:var(--sep)}

/* ── colour picker ───────────────────────────────────────── */
.swatches{display:flex;gap:10px;flex-wrap:wrap;padding:14px 16px}
.swatch{width:36px;height:36px;border-radius:50%;background:var(--sc);
  display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;font-weight:700}
.swatch:not(.on){box-shadow:none}
.swatch.on{box-shadow:0 0 0 3px var(--card),0 0 0 5.5px var(--sc)}

/* ── tab bar ─────────────────────────────────────────────── */
/* floating liquid-glass pill — ported from the wallet app */
#tabbar{
  position:fixed;z-index:70;display:flex;align-items:center;gap:4px;
  left:max(12px,env(safe-area-inset-left,0px));
  right:max(12px,env(safe-area-inset-right,0px));
  bottom:calc(11px + env(safe-area-inset-bottom,0px));
  height:60px;padding:6px;border-radius:999px;
  background:var(--glass);
  backdrop-filter:blur(26px) saturate(180%);
  -webkit-backdrop-filter:blur(26px) saturate(180%);
  border:1px solid var(--glass-line);
  box-shadow:0 12px 40px rgba(0,0,0,.26), inset 0 1px 0 var(--glass-hi);
  /* Promote to its own compositing layer and keep it there. Without this the
     blur is re-sampled on the main thread during momentum scroll and visibly
     lags/freezes on iOS. */
  transform:translateZ(0);
  -webkit-transform:translateZ(0);
  backface-visibility:hidden;
  -webkit-backface-visibility:hidden;
  will-change:opacity;
  transition:opacity .28s ease;
}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  #tabbar{background:var(--glass-solid)}
}
/* shrinks out of the way while the page is moving, settles back when it stops */
/* Recedes while the page moves, settles back when it stops. Opacity only —
   scaling a backdrop-filtered element is what made this glitch on iOS. */
#tabbar.scrolling{opacity:.82}
#tabbar button{
  flex:1;height:100%;border-radius:999px;min-width:0;position:relative;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  color:var(--label2);font-family:var(--mono);font-size:8.5px;letter-spacing:.1em;
  text-transform:uppercase;font-weight:600;
  transition:color .25s, background .3s cubic-bezier(.22,1,.36,1);
}
@media(max-width:359px){ #tabbar button{font-size:7.5px;letter-spacing:.02em} }
#tabbar button svg{width:23px;height:23px;display:block;
  transition:transform .3s cubic-bezier(.34,1.56,.64,1)}
#tabbar button.on{color:var(--label);background:var(--glass-active)}
#tabbar button.on svg{transform:translateY(-1px)}
#tabbar button:active svg{transform:scale(.88)}
.badge{position:absolute;top:-3px;left:50%;margin-left:4px;min-width:16px;height:16px;border-radius:99px;
  background:var(--red);color:#fff;font-size:10.5px;font-weight:700;display:flex;
  align-items:center;justify-content:center;padding:0 4px;
  box-shadow:0 0 0 2px var(--glass-solid);pointer-events:none}


/* ═══ MOTION ═══════════════════════════════════════════════════════════
   None of this is decoration. A control that compresses under the finger
   tells you the tap landed — without it a hit and a miss look identical
   until the next screen arrives. A card that rises as it arrives tells you
   the screen has finished drawing. All of it collapses to nothing under
   prefers-reduced-motion.                                               */
@media (prefers-reduced-motion: no-preference){
  button,.row,.tile,.card,.pill,.chip,.dChip,.seg button,.setH,.cls{
    transition:transform .34s cubic-bezier(.34,1.56,.64,1),
               background-color .2s ease, border-color .2s ease, opacity .2s ease;
  }
  /* down fast, back slow — that is the spring */
  button:active,.row:active,.tile:active,.setH:active,.seg button:active,.cls:active{
    transform:scale(var(--press,.965));transition-duration:.09s;
  }
  .tile:active,.card:active{--press:.985}
  .dChip:active,.pill:active{--press:.92}
  .btn:active{--press:.975}

  /* cards arrive rather than appear, and in the order you read them */
  #heroWrap>*,#homeTiles>*,#homeClasses>*,#homeNext>*,#homeDue>*,#homeWeek>*,
  #attTop>*,#attList>*,.setG{
    animation:riseIn .42s cubic-bezier(.22,1,.36,1) backwards;
  }
  #homeTiles>*{animation-delay:.03s}
  #homeClasses>*{animation-delay:.06s}
  #homeNext>*{animation-delay:.09s}
  #homeDue>*{animation-delay:.12s}
  #homeWeek>*{animation-delay:.15s}
  .setG:nth-child(2){animation-delay:.03s}
  .setG:nth-child(3){animation-delay:.06s}
  .setG:nth-child(4){animation-delay:.09s}
  .setG:nth-child(5){animation-delay:.12s}
  .setG:nth-child(n+6){animation-delay:.15s}
  @keyframes riseIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

  /* The panel lands first, then what's inside it arrives — that beat is
     what makes a sheet feel like it opened rather than blinked. */
  #sheet.on #sheetBody>*{
    animation:riseIn .38s cubic-bezier(.22,1,.36,1) backwards;
  }
  #sheet.on #sheetBody>*:nth-child(1){animation-delay:.06s}
  #sheet.on #sheetBody>*:nth-child(2){animation-delay:.10s}
  #sheet.on #sheetBody>*:nth-child(3){animation-delay:.14s}
  #sheet.on #sheetBody>*:nth-child(4){animation-delay:.18s}
  #sheet.on #sheetBody>*:nth-child(5){animation-delay:.22s}
  #sheet.on #sheetBody>*:nth-child(n+6){animation-delay:.25s}
  #act.on .actGrp{animation:riseIn .34s cubic-bezier(.22,1,.36,1) backwards}
  #act.on .actGrp:nth-child(2){animation-delay:.05s}

  /* the margin pips count themselves in, left to right */
  .margin i{animation:pipIn .3s cubic-bezier(.22,1,.36,1) backwards}
  .margin i:nth-child(2){animation-delay:.02s}
  .margin i:nth-child(3){animation-delay:.04s}
  .margin i:nth-child(4){animation-delay:.06s}
  .margin i:nth-child(5){animation-delay:.08s}
  .margin i:nth-child(n+6){animation-delay:.1s}
  @keyframes pipIn{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:none}}

  #scrim.on{animation:scrimIn .24s ease-out}
  @keyframes scrimIn{from{opacity:0}}
}
@media (prefers-reduced-motion: reduce){
  #heroWrap>*,#homeTiles>*,#homeClasses>*,#homeNext>*,#homeDue>*,#homeWeek>*,
  #attTop>*,#attList>*,.setG,.margin i,#sheet.on #sheetBody>*,#act.on .actGrp{animation:none}
  #sheet{transition:opacity .01s}
  .setB{animation:none}
}

/* ── toast ───────────────────────────────────────────────── */
#toast.bad{background:var(--red);color:#fff}
#toast{
  position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));
  transform:translate(-50%,14px);z-index:110;
  background:rgba(30,30,32,.86);color:#fff;font-size:14.5px;font-weight:500;
  border:1px solid rgba(255,255,255,.10);box-shadow:0 8px 28px -10px rgba(0,0,0,.6);
  padding:11px 18px;border-radius:99px;opacity:0;pointer-events:none;
  transition:opacity .24s,transform .24s;max-width:86vw;text-align:center;
  -webkit-backdrop-filter:saturate(180%) blur(18px);backdrop-filter:saturate(180%) blur(18px);
}
[data-theme="dark"] #toast{background:rgba(70,70,74,.95)}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* ── onboarding ──────────────────────────────────────────── */
#intro{position:fixed;inset:0;z-index:200;background:var(--bg);display:flex;
  flex-direction:column;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
#intro[hidden]{display:none}
#introBody{flex:1;overflow-y:auto;padding:0 26px;display:flex;flex-direction:column;
  justify-content:center;text-align:center}
#introBody .iE{font-size:56px;margin-bottom:22px}
#introBody h2{font-size:29px;font-weight:800;letter-spacing:-.03em;line-height:1.2;margin-bottom:12px}
#introBody p{font-size:16.5px;color:var(--label2);line-height:1.5;max-width:340px;margin:0 auto}
#introBody p b{color:var(--label);font-weight:600}
#introBody .iList{text-align:left;margin:20px auto 0;max-width:330px}
#introFoot{padding:16px 22px 22px;flex-shrink:0}
#introDots{display:flex;gap:7px;justify-content:center;margin-bottom:18px}
#introDots i{width:7px;height:7px;border-radius:50%;background:var(--label3);transition:all .3s}
#introDots i.on{background:var(--accent);width:20px}
#introSkip{display:block;width:100%;text-align:center;color:var(--label2);font-size:15px;
  margin-top:12px;padding:8px}

@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>

<!-- ══════════════ NAV ══════════════ -->
<div id="nav"><div id="navTitle">Today</div><div id="navR"></div></div>

<main>

<!-- ══════════════ TODAY ══════════════ -->
<section id="home" class="on">
  <div class="lg"><span class="brand">Eleventh <b>Hour</b></span><h1>Today</h1><div class="sub" id="todayDate"></div></div>
  <div id="heroWrap"></div>
  <div id="homeTiles"></div>
  <div id="homeClasses"></div>
  <div id="homeNext"></div>

</section>

<!-- ══════════════ TIMETABLE ══════════════ -->

  <div id="railWrap"><div id="dayStrip"></div></div>
  <div id="ttHead"></div>
  <div id="ttBody"></div>
  <div style="height:26px"></div>
</section>

<!-- ══════════════ ATTENDANCE ══════════════ -->
<section id="attendance">

</section>

<!-- ══════════════ DUE ══════════════ -->
<section id="deadlines">
  <div class="lg"><h1>Due</h1></div>
  <div id="dueFilter" class="pad" style="padding-top:8px"></div>
  <div id="dueList"></div>
  <div id="procCard"></div>
  <div style="height:26px"></div>
</section>

<!-- ══════════════ CALENDAR ══════════════ -->
<section id="calendar">
  <div class="lg"><h1>Calendar</h1></div>

  <div id="calGrid"></div>
  <div id="calDay"></div>

</section>

<!-- ══════════════ SETTINGS ══════════════ -->
<section id="settings">
  <div class="lg"><h1>Settings</h1></div>
  <div id="setBody"></div>
  <div style="height:26px"></div>
</section>

</main>

<!-- ══════════════ TAB BAR ══════════════ -->
<nav id="tabbar"></nav>

<!-- ══════════════ SHEET ══════════════ -->
<div id="scrim"></div>
<div id="sheet" role="dialog" aria-modal="true">
  <div class="grab"></div>
  <div id="sheetBar">
    <button class="cancel" id="sheetCancel">Cancel</button>

    <button class="done" id="sheetDone">Done</button>
  </div>
  <div id="sheetBody"></div>
</div>

<div id="toast"></div>
<input type="file" id="impFile" accept=".json,application/json" style="display:none">

<!-- ══════════════ ONBOARDING ══════════════ -->
<div id="intro" hidden>
  <div id="introBody"></div>
  <div id="introFoot">
    <div id="introDots"></div>
    <button class="btn" id="introNext">Continue</button>
    <button id="introSkip">Skip</button>
  </div>
</div>

<script>
/* ══════════════════════════════════════════════════════════════
   11:59 — college companion.  Single file, offline, no account.
   ══════════════════════════════════════════════════════════════ */
'use strict';
const $  = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
/* time + a monotonic counter + randomness. The counter makes collisions
   impossible within a session (the old version relied on 4 random chars,
   which can repeat when ids are minted in the same millisecond); the
   random tail keeps ids distinct across devices when backups are merged. */
let _uidSeq = 0;
const uid = () => Date.now().toString(36) + '-' +
  (_uidSeq = (_uidSeq + 1) % 1679616).toString(36) + '-' +
  Math.random().toString(36).slice(2, 8);
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));

const DAYS  = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const DAYSL = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];

/* class kinds — theory / tutorial / practical. "online" is a separate flag,
   so any kind can also be an online class. */
const KINDS = [['th','Theory'],['tu','Tutorial'],['pr','Practical']];
const KIND_NAME = {th:'Theory', tu:'Tutorial', pr:'Practical'};
const KIND_TAG  = {th:'', tu:'Tut', pr:'Prac'};
const kindOf = sl => (sl && KIND_NAME[sl.kind]) ? sl.kind : 'th';
/* the little badges on a class card */
const kindTag = sl => KIND_TAG[kindOf(sl)]

const KEY='sem5plan';
/* One place that knows every field. Wipe, import and first run all go
   through here, so adding a setting can't leave one path with `undefined`. */
function blankState(keep){
  keep=keep||{};
  return {subs:[],slots:[],marks:{},att:{},dls:[],cats:[],tab:'home',
          thr:67, goal:0, goalBy:'',   /* 0 = no goal; goalBy defaults to term end */
          name:'', roll:'', course:'', college:'',
          termEnd:'',   /* semester end — powers the runway maths */
          /* morning planner — off until you switch it on in Settings */
          planner:false, readyMin:15, readyMax:30,
          commute:'self', plans:{}, enroute:null, openGroups:[],   /* per-day 'which classes I'll actually attend' */
          travelAM:40, travelMid:60, travelPM:50,
          theme:keep.theme||'auto', tone:keep.tone||'friendly'};
}
/* Repair anything missing or the wrong shape — old saves, hand-edited
   backups, a file from a previous version. */
function normalise(st){
  st=Object.assign({},st||{});
  /* migrate the old single ready/travel pair FIRST — if defaults land
     first, readyMax is already 30 and the saved value is lost */
  if(st.ready  && st.readyMax===undefined)  st.readyMax=st.ready;
  if(st.travel && st.travelAM===undefined){ st.travelAM=st.travelMid=st.travelPM=st.travel; }
  /* they'd already set these before the toggle existed — keep it working */
  if((st.ready||st.travel) && st.planner===undefined) st.planner=true;
  st=Object.assign(blankState(st),st);
  if(!['light','dark','auto'].includes(st.theme)) st.theme='auto';
  if(!['pro','plain','friendly','snark'].includes(st.tone)) st.tone='friendly';
  ['subs','slots','dls','cats','openGroups'].forEach(k=>{ if(!Array.isArray(st[k])) st[k]=[]; });
  ['marks','att'].forEach(k=>{ if(!st[k]||typeof st[k]!=='object') st[k]={}; });
  st.subs.forEach((s,i)=>{
    if(typeof s.ci!=='number') s.ci=i%8;
    if(!s.code) s.code=String(s.name||'?').slice(0,3).toUpperCase();
  });
  st.thr   =clamp(+st.thr   ||67,1,100);
  st.goal  =clamp(+st.goal  ||0,  0,100);   /* 0 means none set */
  if(!/^\d{4}-\d{2}-\d{2}$/.test(st.goalBy||'')) st.goalBy='';
  ['name','roll','course','college'].forEach(k=>{ st[k]=String(st[k]||'').slice(0,80); });
  delete st.ready; delete st.travel; delete st.driverHr; delete st.remindAt;   /* migrated above */
  st.planner  = !!st.planner;
  st.readyMin =clamp(+st.readyMin ||0,0,240);
  st.readyMax =clamp(+st.readyMax ||0,0,240);
  if(st.readyMax<st.readyMin) st.readyMax=st.readyMin;
  ['travelAM','travelMid','travelPM'].forEach(k=>{ st[k]=clamp(+st[k]||0,0,300); });
  if(!COMMUTE[st.commute]) st.commute='self';
  /* plans are intentions for a specific day — drop them once the day is gone */
  /* "on my way" only means anything for today */
  if(!st.enroute || st.enroute.iso!==todayISO() || typeof st.enroute.at!=='number')
    st.enroute=null;
  if(!st.plans||typeof st.plans!=='object') st.plans={};
  else { const today=todayISO();
    Object.keys(st.plans).forEach(k=>{
      if(!/^\d{4}-\d{2}-\d{2}$/.test(k) || k<today || !Array.isArray(st.plans[k]))
        delete st.plans[k]; }); }
  st.termEnd  = /^\d{4}-\d{2}-\d{2}$/.test(st.termEnd||'') ? st.termEnd : '';
  st.name  =typeof st.name==='string' ? st.name.slice(0,80) : '';
  return st;
}

/* home-screen icon, drawn at runtime */
function drawIcons(){
  try{
    const draw=size=>{
      const c=document.createElement('canvas'); c.width=c.height=size;
      const g=c.getContext('2d'); if(!g) return '';
      const r=size*.2237;
      g.beginPath();
      g.moveTo(r,0); g.lineTo(size-r,0); g.quadraticCurveTo(size,0,size,r);
      g.lineTo(size,size-r); g.quadraticCurveTo(size,size,size-r,size);
      g.lineTo(r,size); g.quadraticCurveTo(0,size,0,size-r);
      g.lineTo(0,r); g.quadraticCurveTo(0,0,r,0); g.closePath();
      const grad=g.createLinearGradient(0,0,0,size);
      grad.addColorStop(0,'#1C1C22'); grad.addColorStop(1,'#08080B');
      g.fillStyle=grad; g.fill();
      const fs=Math.round(size*.245);
      g.font='700 '+fs+'px -apple-system, ui-monospace, "SF Mono", Menlo, monospace';
      g.textAlign='left'; g.textBaseline='middle';
      const a='11', cn=':', b='59';
      const w1=g.measureText(a).width, wc=g.measureText(cn).width, w2=g.measureText(b).width;
      const x=size/2-(w1+wc+w2)/2, y=size*.52;
      g.fillStyle='#F5F5F7'; g.fillText(a,x,y);
      g.fillStyle='#0A84FF'; g.fillText(cn,x+w1,y);
      g.fillStyle='#F5F5F7'; g.fillText(b,x+w1+wc,y);
      return c.toDataURL('image/png');
    };
    const set=(rel,size)=>{
      let l=document.querySelector('link[rel="'+rel+'"]');
      if(!l){ l=document.createElement('link'); l.rel=rel; document.head.appendChild(l); }
      l.href=draw(size);
    };
    set('apple-touch-icon',180); set('icon',64);
  }catch(e){}
}

/* ══════════════ DOMAIN ══════════════ */
const subById = id => S.subs.find(s=>s.id===id);
const scCls = sub => 'sc'+((sub&&typeof sub.ci==='number'?sub.ci:0)%8);

/* classes on a given weekday / date. One-offs live only on their date. */
function slotsOn(dayIx, iso){
  return S.slots
    .filter(s => s.once ? s.date===iso : s.day===dayIx)
    .sort((a,b)=>t2m(a.start)-t2m(b.start));
}
const markKey=(iso,sl)=> iso+'|'+sl.id+'|'+sl.subId+'|'+(sl.kind||'th');

/* marks made on the timetable only (used to protect manual backfill) */
function marksOnly(subId){
  const th={p:0,a:0}, tu={p:0,a:0}, pr={p:0,a:0};
  for(const k in S.marks){
    const p=k.split('|'); if(p[2]!==subId) continue;
    const c = p[3]==='tu' ? tu : p[3]==='pr' ? pr : th;
    if(S.marks[k]==='p') c.p++; else if(S.marks[k]==='a') c.a++;
  }
  return {th,tu,pr};
}
/* backfilled counters + everything marked = the real numbers */
function attFor(subId){
  const m=S.att[subId]||{};
  const th={p:(m.thp??m.p)||0, a:(m.tha??m.a)||0};
  const tu={p:m.tup||0, a:m.tua||0};
  const pr={p:m.prp||0, a:m.pra||0};
  const d=marksOnly(subId);
  th.p+=d.th.p; th.a+=d.th.a;
  tu.p+=d.tu.p; tu.a+=d.tu.a;
  pr.p+=d.pr.p; pr.a+=d.pr.a;
  th.t=th.p+th.a; tu.t=tu.p+tu.a; pr.t=pr.p+pr.a;
  return {th,tu,pr,
    p:th.p+tu.p+pr.p, a:th.a+tu.a+pr.a, t:th.t+tu.t+pr.t};
}
const pctOf=(p,t)=> t? p/t*100 : 0;
/* Two decimals, because that is what the college portal prints and the two
   numbers have to be reconcilable at a glance — 76.92% here and 76.92%
   there. A whole number keeps its clean form: 80%, not 80.00%. */
const pctFmt=n=>{ const r=Math.round(n*100)/100; return r%1===0?String(Math.round(r)):r.toFixed(2); };

/* DU / SBSC attendance-marks slab, out of 5 */
function attMarks(p,t){
  if(!t) return null;
  const q=pctOf(p,t);
  return q>85?5:q>80?4:q>75?3:q>70?2:q>67?1:0;
}
/* how many more can be missed / must be attended */
function canMiss(p,t){ const T=S.thr/100; return t? Math.floor(p/T - t) : 0; }
function mustAttend(p,t){
  const T=S.thr/100;
  if(T>=1) return Infinity;      /* 100% required — one absence can never be undone */
  return Math.ceil((T*t-p)/(1-T));
}

function bunkLine(p,t){
  if(!t) return T('No classes recorded.','No classes recorded yet.','Nothing recorded yet — mark a few classes.','No data. A blank slate, for now.');
  if(pctOf(p,t)>=S.thr){
    const m=canMiss(p,t);
    if(m>0) return T(
      m+' class'+(m===1?'':'es')+' may be missed while staying at or above '+S.thr+'%.',
      'You can miss '+m+' more and stay above '+S.thr+'%.',
      'You’ve got '+m+' free skip'+(m===1?'':'s')+' before you drop below '+S.thr+'%.',
      m+' skip'+(m===1?'':'s')+' in the bank. Spend '+(m===1?'it':'them')+' wisely.');
    return T('At the minimum threshold. No further absences permitted.',
      'Right on the line — don’t miss the next one.',
      'You’re exactly on the line. Next one is compulsory.',
      'Dead on the line. One more and the maths turns on you.');
  }
  const n=mustAttend(p,t);
  if(!isFinite(n)) return T(
    'Below the required 100%. Once a class is missed, the requirement cannot be met again.',
    'You need 100% — a missed class can’t be made up.',
    'At a 100% requirement, a missed class can’t be recovered. Worth double-checking that number.',
    'You set the bar at 100%. There is no recovering from this. Bold choice.');
  return T(
    'Below the required '+S.thr+'%. '+n+' consecutive class'+(n===1?'':'es')+' required to recover.',
    'Below '+S.thr+'% — attend the next '+n+' to get back.',
    'Below '+S.thr+'%. Attend the next '+n+' in a row and you’re clear.',
    'Below '+S.thr+'%. '+n+' straight classes to dig out. No pressure.');
}

/* what happens to this subject's % if today's class is skipped */
function skipImpact(subId){
  const A=attFor(subId);
  const now=pctOf(A.p,A.t), after=pctOf(A.p,A.t+1);
  return {now,after,safe:after>=S.thr,has:A.t>0};
}

/* ── "what if I skip the whole day?" ──────────────────────────────
   Costs out skipping every class still unmarked today: what each
   subject drops to, what it would take to climb back, and whether
   it's worth it.                                                   */
function skipDayLabel(iso){
  const n=Math.round((dateOf(iso)-dateOf(todayISO()))/864e5);
  return n===0 ? 'today' : n===1 ? 'tomorrow'
    : dateOf(iso).toLocaleDateString(undefined,{weekday:'long'});
}
function skipDayImpact(iso){
  const dow=dowOf(dateOf(iso));
  const pending=slotsOn(dow,iso).filter(sl=>subById(sl.subId)&&!S.marks[markKey(iso,sl)]);
  if(!pending.length) return null;

  const bySub={};
  pending.forEach(sl=>{ (bySub[sl.subId]=bySub[sl.subId]||[]).push(sl); });

  const rem=remainingBySub(iso);
  const rows=Object.keys(bySub).map(id=>{
    const A=attFor(id), n=bySub[id].length;
    const now=pctOf(A.p,A.t), after=pctOf(A.p,A.t+n);
    const rw=runwayVerdict(id, rem?rem[id]||0:null, n);
    return {sub:subById(id), n, now, after, had:A.t, rw,
            safe: rw.level==='ok'||rw.level==='none',
            wasSafe: A.t ? now>=S.thr : true,
            recover: (A.t && after<S.thr) ? mustAttend(A.p, A.t+n) : 0};
  }).sort((a,b)=>RUNWAY_RANK[b.rw.level]-RUNWAY_RANK[a.rw.level] || a.after-b.after);

  let GP=0,GT=0; S.subs.forEach(s=>{ const a=attFor(s.id); GP+=a.p; GT+=a.t; });
  const n=pending.length;
  /* the ones this skip actually pushes under the line */
  /* judged on whether the threshold stays REACHABLE, not on today's number */
  const breaks  = rows.filter(r=>r.rw.level==='gone');
  const already = rows.filter(r=>r.rw.level==='risk');
  const worst   = rows.reduce((w,r)=>Math.max(w,RUNWAY_RANK[r.rw.level]),0);
  const verdict = worst>=2 ? 'no' : worst===1 ? 'tight' : 'ok';
  return {rows, pending, count:n, breaks, already, verdict, iso, rem,
          weeksLeft:termWeeksLeft(),
          when:skipDayLabel(iso),
          now:pctOf(GP,GT), after:pctOf(GP,GT+n), hasHistory:GT>0};
}
/* Today if there's anything left to skip, otherwise the next day that has
   classes — so the feature is reachable on a Sunday too, not hidden. */
/* ── tomorrow, and when to set the alarm ──────────────────────────
   Travel time is a setting rather than a live Maps lookup: the app has
   no network by design, and your college doesn't move. Online-only days
   skip the commute entirely, so you get a later wake-up.            */
const m2t = m => { m=((Math.round(m)%1440)+1440)%1440;
  return fmtT(pad2(Math.floor(m/60))+':'+pad2(m%60)); };
/* The commute is not one number — an 8am run is nothing like a midday one,
   so travel is banded by when you'd actually be on the road. */
const TRAVEL_BANDS=[
  ['travelAM', 0,       9*60,  'before 9am'],
  ['travelMid',9*60,   15*60,  '9am – 3pm'],
  ['travelPM', 15*60,  24*60,  'after 3pm']
];
function travelFor(startMin){
  const b=TRAVEL_BANDS.find(x=>startMin>=x[1]&&startMin<x[2])||TRAVEL_BANDS[2];
  return clamp(+S[b[0]]||0,0,300);
}
const plannerReady = () => S.planner &&
  ((S.readyMin||0)>0||(S.readyMax||0)>0) &&
  ((S.travelAM||0)>0||(S.travelMid||0)>0||(S.travelPM||0)>0);

/* ── what you actually intend to attend that day ──────────────────
   Picking an option in "Worth going?" stores a plan for that date.
   Everything downstream — pickup time, wake time, the morning
   countdown — keys off the first class you're ACTUALLY going to,
   not the first one on the timetable.                            */
function liveSlots(iso){
  return slotsOn(dowOf(dateOf(iso)),iso)
    .filter(sl=>subById(sl.subId) && S.marks[markKey(iso,sl)]!=='c');
}
const planFor = iso => (S.plans&&Array.isArray(S.plans[iso])) ? S.plans[iso] : null;
/* Resolve a stored plan against what's actually on that day. A plan whose
   classes have since been deleted or cancelled is STALE — fall back to the
   normal day rather than silently claiming you're not going. An empty plan
   is different: that's you deliberately choosing to stay home. */
function resolvePlan(iso){
  const ids=planFor(iso), live=liveSlots(iso);
  if(!ids)        return {going:live, planned:false, stale:false};
  if(!ids.length) return {going:[],   planned:true,  stale:false};
  const kept=live.filter(sl=>ids.indexOf(sl.id)>=0);
  if(!kept.length) return {going:live, planned:false, stale:true};
  return {going:kept, planned:true, stale:false};
}
function setPlan(iso,ids){
  if(!S.plans) S.plans={};
  if(ids===null) delete S.plans[iso]; else S.plans[iso]=ids.slice();
  save();
}
function dayPlan(iso){
  const d=dateOf(iso), dow=dowOf(d);
  const list=liveSlots(iso);
  if(!list.length) return {iso,d,list:[],none:true};
  const rp=resolvePlan(iso);
  const going=rp.going, planned=rp.planned;
  const first=going[0]||null;                /* the class you're actually going to */
  if(!first) return {iso,d,list,going:[],planned,skippingAll:true,
                     none:false,configured:plannerReady(),
                     leaveAt:null,wakeAt:null,travel:0};
  const allOnline=going.every(sl=>sl.online);
  /* Travel is about the first class you have to physically get to. Basing it
     on going[0] when that one is online gives "leave at 4pm for your 4pm
     class" — the leave time collapses onto the class time because there is
     no journey. Departure hangs off the first ON-CAMPUS class, and a day
     with none has no departure at all. */
  const firstOnsite=going.find(sl=>!sl.online)||null;
  const start=t2m(first.start), configured=plannerReady();
  const travelStart = firstOnsite ? t2m(firstOnsite.start) : null;
  const travel   = (configured && firstOnsite) ? travelFor(travelStart) : 0;
  const leaveAt  = (configured && firstOnsite) ? travelStart-travel : null;
  const wakeAt   = (configured && firstOnsite) ? leaveAt-(S.readyMax||0) : null;
  return {iso, d, list, going, planned, skippingAll:false,
          first, firstOnsite, allOnline, travel, start, configured,
          leaveAt, wakeAt,
          wakeRushed: (configured&&firstOnsite) ? leaveAt-(S.readyMin||0) : null,
          dayBefore: configured && wakeAt!=null && wakeAt<0};
}
const tomorrowPlan = () => dayPlan(isoOf(addDays(new Date(),1)));

/* The next day you actually have class — today if classes are still to come,
   otherwise the next one within a fortnight. Weekends and cancelled days are
   skipped, so the card never says "tomorrow: nothing". */
function nextClassDay(){
  const mins=nowMin();
  for(let i=0;i<15;i++){
    const iso=isoOf(addDays(new Date(),i));
    const p=dayPlan(iso);
    if(p.none) continue;
    /* Today only counts while something is genuinely still ahead: not yet
       over AND not already marked. Once you've marked the last one, the day
       is done and the next class day is what you need — no clock involved. */
    if(i===0 && !p.list.some(sl=>t2m(sl.end)>mins && !S.marks[markKey(iso,sl)])) continue;
    return {iso, offset:i, plan:p};
  }
  return null;
}

/* You marked a class present, in a room, on campus. Everything after that
   about "when to leave" and "are you on your way" is answering a question
   you settled by being there — the journey happened. A later class today
   needs no second commute, so the countdown gives way to what's next.   */
function onCampusNow(){
  const iso=todayISO(), now=nowMin();
  return liveSlots(iso).some(sl=>
    !sl.online && S.marks[markKey(iso,sl)]==='p' && t2m(sl.start)<=now);
}

/* ══════════════ THE WAY BACK ══════════════
   Every journey has a return leg, and the app only ever knew about the way
   in. Once the classes you were there for are done, what you want is when
   you'll be home — and, if someone collects you, what time to tell them.
   Only in-person classes count: you don't come home from an online one.   */
function homewardStatus(){
  if(!plannerReady()) return null;
  const iso=todayISO(), now=nowMin();
  const p=dayPlan(iso);
  if(p.none||p.skippingAll) return null;
  /* the classes you were actually on campus for — cancelled and absent
     don't put you there, and online ones never did */
  const onsite=p.going.filter(sl=>{
    const m=S.marks[markKey(iso,sl)];
    return !sl.online && m!=='c' && m!=='a';
  });
  if(!onsite.length) return null;
  /* Still something to sit through? Then you're not going anywhere. Marking
     a class present is you telling the app you're done with it — an hour
     that's marked is over regardless of what the timetable says, which is
     the whole point of marking it. */
  const pending=onsite.filter(sl=>!S.marks[markKey(iso,sl)] && t2m(sl.end)>now);
  if(pending.length) return null;
  const lastEnd=onsite.reduce((e,sl)=>Math.max(e,t2m(sl.end)),0);
  /* out early because you marked it early: the day ended when you said so */
  const endedAt=Math.min(lastEnd, now);
  const travel=travelFor(Math.max(endedAt,now));
  /* and stop saying it once you'd be home anyway */
  if(now>endedAt+travel+45) return null;
  const leaveAt=Math.max(endedAt,now);
  return {lastEnd, endedAt, travel, leaveAt, homeBy:leaveAt+travel,
          early: endedAt<lastEnd,
          waited: now-endedAt, last:onsite[onsite.length-1]};
}

/* ── the morning question: how long have I got, and can I shower? ──
   Recomputed against the clock every minute while Today is open.     */
function morningStatus(){
  if(!plannerReady()) return null;
  const iso=todayISO();
  const p=dayPlan(iso);
  if(p.none||p.skippingAll) return null;
  const now=nowMin();
  /* A class you've already marked is dealt with — present, absent or
     cancelled alike. Travel advice is only about classes you still have
     to physically get to, so telling you you're late for one you've
     already recorded present is worse than saying nothing. */
  const pending=p.going.filter(sl=>!S.marks[markKey(iso,sl)] && t2m(sl.end)>now);
  if(!pending.length) return null;
  /* already there — see onCampusNow. "Next up" takes over from here, which
     is the useful thing to show someone sitting in college with a gap. */
  if(onCampusNow()) return null;
  const first=pending[0];
  const start=t2m(first.start);
  const travel=first.online?0:travelFor(start);
  const leaveAt=start-travel;
  const untilLeave=leaveAt-now, untilClass=start-now;
  /* if you've said you're on your way, stop counting down to a departure
     that already happened and start counting to arrival instead.
     There is nothing to arrive for if the next class is online, so the
     travelling state only applies when you're actually heading somewhere. */
  /* It also expires on its own. Left standing, one tap in the morning has
     you "arriving" all day — including from a seat in the classroom. Once
     you'd have got there (plus a little slack), you have arrived. */
  const er = (S.enroute && S.enroute.iso===iso && !first.online &&
              now < S.enroute.at + travel + 30) ? S.enroute : null;
  const level = er                            ? 'enroute'
              : untilLeave<0                  ? 'late'
              : untilLeave>=(S.readyMax||0)   ? 'relaxed'
              : untilLeave>=(S.readyMin||0)   ? 'quick'
              : 'tight';
  /* hand back a plan-shaped object keyed to the class actually pending */
  const pp=Object.assign({},p,{first,start,travel,leaveAt,
    wakeAt:leaveAt-(S.readyMax||0)});
  const arriveAt = er ? er.at+travel : now+travel;
  return {p:pp, now, untilLeave, untilClass, level, arriveAt, enroute:er,
          atHome: !!first.online,   /* nothing to travel to — you're already there */
          lateBy: Math.max(0, arriveAt-start)};
}
const MORNING_COLOUR={relaxed:'var(--green)',quick:'var(--orange)',tight:'var(--orange)',
                      late:'var(--red)',enroute:'var(--accent)'};
function morningLine(m){
  const shower=S.readyMax||0, quick=S.readyMin||0;
  if(m.level==='enroute'){
    const cls=subById(m.p.first.subId);
    if(m.lateBy<=0) return T(
      'On route. Arrival '+m2t(m.arriveAt)+', ahead of the '+fmtT(m.p.first.start)+' start.',
      'On your way — you’ll get there by '+m2t(m.arriveAt)+', in good time.',
      'On your way, and you’ll make it — in at '+m2t(m.arriveAt)+'.',
      'On your way and actually on time. Note the date.');
    return T(
      'On route. Arrival '+m2t(m.arriveAt)+', '+fmtDur(m.lateBy)+' after the start.',
      'On your way — arriving '+m2t(m.arriveAt)+', about '+fmtDur(m.lateBy)+' late.',
      'On your way. You’ll walk in around '+fmtDur(m.lateBy)+' late — not the end of the world.',
      'On your way, '+fmtDur(m.lateBy)+' late. Walk in like you meant it.');
  }
  if(m.level==='late') return T(
    'Departure time has passed. Arrival would be '+m2t(m.arriveAt)+'.',
    'You should have left already — leaving now puts you there at '+m2t(m.arriveAt)+'.',
    'Past your leave time. Go now and you arrive '+m2t(m.arriveAt)+'.',
    'You are late. Leaving this instant gets you there at '+m2t(m.arriveAt)+'.');
  if(m.level==='relaxed') return T(
    'Sufficient time for the full '+shower+' minute routine.',
    'Enough time for a proper shower and breakfast.',
    'You’ve got time for the full routine — shower included.',
    'Full shower available. Savour it, it won’t last.');
  if(m.level==='quick') return T(
    'Time for the '+quick+' minute routine only.',
    'Quick version only — shower fast.',
    'Enough for the quick routine. Skip the leisurely bit.',
    'Quick wash only. You know how this goes.');
  return T('Insufficient time to get ready. Leave as soon as possible.',
    'No time to get ready properly — go now.',
    'Cutting it very fine. Grab what you need and go.',
    'No shower today. We both saw this coming.');
}

function nextSkipDay(){
  for(let i=0;i<8;i++){
    const x=skipDayImpact(isoOf(addDays(new Date(),i)));
    if(x) return x;
  }
  return null;
}
/* ── runway: how much semester is left to fix things in ───────────
   The whole point. Missing a class in August is cheap because there
   are eighty more; missing the same class in December is not. Given
   the term end date we can count what's actually left and answer the
   real question — is the threshold still REACHABLE — instead of the
   useless one, are you above it today.                              */
/* `toISO` lets a caller ask about a window shorter than the term — the goal
   has its own deadline, while eligibility is still judged at term end. */
function remainingBySub(fromISO,toISO){
  const horizon=toISO||S.termEnd;
  if(!horizon) return null;
  const end=dateOf(horizon), out={};
  let d=dateOf(fromISO);
  for(let i=0;i<400;i++){
    const iso=isoOf(d);
    if(dateOf(iso)>end) break;
    slotsOn(dowOf(d),iso).forEach(sl=>{
      if(!subById(sl.subId)) return;
      if(S.marks[markKey(iso,sl)]) return;     /* already settled */
      out[sl.subId]=(out[sl.subId]||0)+1;
    });
    d=addDays(d,1);
  }
  return out;
}
/* How many of the remaining classes you can still miss and finish at or
   above the threshold. Negative means the threshold is already out of
   reach even attending everything left. */
function slackFor(subId,remaining){
  const A=attFor(subId), T=S.thr/100, k=remaining||0;
  return Math.floor(A.p + k - T*(A.t + k) + 1e-9);
}
const termWeeksLeft=()=>{
  if(!S.termEnd) return null;
  return Math.max(0,Math.ceil(daysTo(S.termEnd)/7));
};
/* verdict for missing `n` classes of one subject, given the runway */
/* ══════════════ WHEN A GOAL CAN LAND ══════════════
   "85% by Friday" is not a goal, it is arithmetic that has already failed.
   From p of t, attending every one of the next k classes gives (p+k)/(t+k),
   and that only reaches g when k >= (g·t − p)/(1 − g). So the soonest the
   goal can possibly land is the day the k-th class falls on — attend all
   of them, miss nothing. Any date before that is not a stretch, it is
   impossible, and the app should say which.

   At g = 100% the divisor is zero and the answer is never: a single absence
   already on the record can't be undone by attending anything.            */
function goalHorizon(){ return S.goalBy || S.termEnd || ''; }
function classesBetween(fromISO,toISO){
  if(!toISO) return null;
  const end=dateOf(toISO); let n=0, d=dateOf(fromISO);
  for(let i=0;i<400 && d<=end;i++){
    const iso=isoOf(d);
    n+=liveSlots(iso).filter(sl=>!S.marks[markKey(iso,sl)]).length;
    d=addDays(d,1);
  }
  return n;
}
function earliestGoalDate(goalPct){
  let P=0,T=0;
  S.subs.forEach(sb=>{ const A=attFor(sb.id); P+=A.p; T+=A.t; });
  const g=(+goalPct||0)/100;
  if(!T) return {iso:null, unknown:true};
  if(pctOf(P,T)>=goalPct) return {iso:todayISO(), already:true, need:0};
  if(g>=1) return {iso:null, never:true, need:null};
  const need=Math.ceil((g*T-P)/(1-g)-1e-9);
  if(need<=0) return {iso:todayISO(), already:true, need:0};
  /* walk forward until that many classes have gone by */
  let n=0, d=dateOf(todayISO());
  for(let i=0;i<400;i++){
    const iso=isoOf(d);
    n+=liveSlots(iso).filter(sl=>!S.marks[markKey(iso,sl)]).length;
    if(n>=need) return {iso, need, byThen:n};
    d=addDays(d,1);
  }
  return {iso:null, need, tooFar:true};
}

/* ══════════════ THE GOAL ══════════════
   Two things people actually want, which turn out to be one thing.

   Climbing: "I want to be at 75%." From p attended of t held, with k classes
   still to come, you must attend x of them where (p+x)/(t+k) >= G. So
   x = ceil(G(t+k) - p), and anything left over — k - x — is slack you may
   spend. Below the goal the slack is what you must NOT spend; at or above it,
   the same number is what you're free to spend.

   Holding: "I'm at 75%, keep me there." Attending lifts the ratio, missing
   drops it, so holding steady means attending a fixed FRACTION of what's
   held: after n more classes, attending a of them leaves (p+a)/(t+n), and
   setting that equal to p/t gives a = n·(p/t). At 75% that is three of every
   four — no budget, just a rhythm.

   So one number, two phases, and the app works out which you're in.        */
function bestFraction(x, maxDen){
  /* the simplest "a of every b" that lands closest to x — 0.75 → 3 of 4 */
  maxDen=maxDen||8;
  let best=null;
  for(let d=1; d<=maxDen; d++){
    const n=Math.round(x*d);
    if(n<=0 || n>=d) continue;               /* 0-of and all-of say nothing */
    const err=Math.abs(n/d - x);
    if(!best || err < best.err - 1e-12) best={n, d, err};
  }
  return best;
}
/* how a single subject stands against the goal */
function goalFor(subId, remaining){
  const G=(+S.goal||0)/100;
  if(!G) return null;
  const A=attFor(subId);
  const k=(remaining===null||remaining===undefined) ? null : (remaining||0);
  const cur=pctOf(A.p,A.t);
  const out={goal:+S.goal, cur, had:A.t, p:A.p,
             phase: (A.t && cur>=+S.goal) ? 'hold' : 'climb'};
  if(k===null){ out.unknown=true; return out; }
  out.remaining=k;
  /* classes of the k you must attend to finish at or above the goal */
  const need=Math.ceil(G*(A.t+k) - A.p - 1e-9);
  out.need  = clamp(need,0,k);
  out.slack = k - out.need;                 /* how many you may miss */
  out.reachable = need<=k;
  if(!out.reachable){
    /* the best you can do is attend every one that's left */
    out.best = pctOf(A.p+k, A.t+k);
  }
  return out;
}
/* and the same question asked of everything at once */
function goalOverall(){
  const G=+S.goal||0;
  if(!G) return null;
  const rem=remainingBySub(todayISO(), goalHorizon());
  let P=0,T=0,K=0, anyUnknown=(rem===null);
  S.subs.forEach(sb=>{ const A=attFor(sb.id); P+=A.p; T+=A.t;
                       if(rem) K+=rem[sb.id]||0; });
  const cur=pctOf(P,T);
  const out={goal:G, cur, p:P, had:T,
             phase:(T && cur>=G) ? 'hold' : 'climb'};
  /* holding steady means attending this fraction of whatever comes */
  if(T){
    const f=bestFraction(P/T, 8);
    if(f) out.rhythm=f;
  }
  if(anyUnknown){ out.unknown=true; return out; }
  out.remaining=K;
  const need=Math.ceil((G/100)*(T+K) - P - 1e-9);
  out.need =clamp(need,0,K);
  out.slack=K-out.need;
  out.reachable = need<=K;
  if(!out.reachable) out.best=pctOf(P+K,T+K);
  /* the subjects standing between you and the goal, worst first */
  out.by=S.goalBy||'';
  out.earliest=earliestGoalDate(G);
  out.blocking=S.subs.map(sb=>({sub:sb, g:goalFor(sb.id, rem?rem[sb.id]||0:null)}))
    .filter(x=>x.g && (!x.g.reachable || x.g.phase==='climb'))
    .sort((a,b)=>(a.g.reachable?1:0)-(b.g.reachable?1:0) || a.g.cur-b.g.cur);
  return out;
}

function runwayVerdict(subId,remaining,n){
  const A=attFor(subId);
  if(!A.t && !remaining) return {level:'none'};
  if(remaining===null||remaining===undefined)      /* no term date set */
    return {level: pctOf(A.p,A.t+n)>=S.thr?'ok':'risk', unknown:true};
  const slack=slackFor(subId,remaining);
  const after=slack-n;
  return {level: after<0 ? 'gone' : after<=2 ? 'tight' : 'ok',
          slack, after, remaining};
}
const RUNWAY_RANK={ok:0,tight:1,risk:2,gone:3,none:0};

/* ── "is the trip even worth it?" ─────────────────────────────────
   Different question from "can I skip one class". Once cancellations
   land you can end up with 8–9 and 12–1 and three dead hours between.
   You arrive once and leave once, so the sensible choices are the
   contiguous runs of class-blocks — plus not going at all.          */
const GAP_MIN=45;                 /* a gap longer than this splits the day */
function dayBlocks(iso){
  /* Only in-person classes make campus blocks. An online class is taken from
     home, so it can never create a gap you'd have to sit through — treating
     it as campus time invents waiting that doesn't exist. */
  const list=liveSlots(iso).filter(sl=>!sl.online);
  const blocks=[];
  list.forEach(sl=>{
    const s=t2m(sl.start), e=t2m(sl.end);
    const last=blocks[blocks.length-1];
    if(last && s-last.end<=GAP_MIN){ last.slots.push(sl); last.end=Math.max(last.end,e); }
    else blocks.push({slots:[sl], start:s, end:e});
  });
  return blocks;
}
/* ══════════════ WHAT A CHOICE COSTS ══════════════
   Given the exact classes you say you're attending — a preset combination,
   or a set you ticked by hand — work out the shape of the day and what it
   does to your attendance. Everything that offers you a choice runs through
   here, so a hand-picked day is judged by exactly the same rules as a
   suggested one. */
function planImpact(iso, ids, rem){
  /* `rem` — remaining classes per subject — is the expensive part, and it is
     identical for every option on a given day. Callers weighing several
     options work it out once and pass it in. */
  const live=liveSlots(iso);
  const inSet={}; (ids||[]).forEach(i=>{ inSet[i]=1; });
  const attend=live.filter(sl=>inSet[sl.id]);
  const onsite=attend.filter(sl=>!sl.online);        /* only these need travel */
  const settled=sl=>{ const m=S.marks[markKey(iso,sl)]; return m==='p'||m==='a'; };
  const skipped=live.filter(sl=>!inSet[sl.id] && !settled(sl));
  if(rem===undefined) rem=remainingBySub(iso);

  const bySub={};
  skipped.forEach(sl=>{ bySub[sl.subId]=(bySub[sl.subId]||0)+1; });
  const rows=Object.keys(bySub).map(id=>{
    const A=attFor(id), n=bySub[id];
    const now=pctOf(A.p,A.t), after=pctOf(A.p,A.t+n);
    const rw=runwayVerdict(id, rem?rem[id]||0:null, n);
    return {sub:subById(id), n, now, after, had:A.t, rw,
            safe: rw.level==='ok'||rw.level==='none'};
  }).sort((a,b)=>RUNWAY_RANK[b.rw.level]-RUNWAY_RANK[a.rw.level] || a.after-b.after);

  /* on campus from the first class you turn up for to the last you stay for */
  const onCampus = onsite.length
    ? t2m(onsite[onsite.length-1].end)-t2m(onsite[0].start) : 0;
  const campusContact = onsite.reduce((n,sl)=>n+(t2m(sl.end)-t2m(sl.start)),0);
  const contact  = attend.reduce((n,sl)=>n+(t2m(sl.end)-t2m(sl.start)),0);
  const first    = onsite[0]||null;
  const travel   = (first && plannerReady()) ? travelFor(t2m(first.start)) : 0;

  return {
    iso, attend, onsite, skipped, rows,
    onlineCount: attend.filter(sl=>sl.online).length,
    count:attend.length, onCampus, contact, dead:onCampus-campusContact,
    allOnline: attend.length ? attend.every(sl=>sl.online) : false,
    first, travel,
    leaveHome: first ? t2m(first.start)-travel : null,
    wakeAt: (first&&plannerReady()) ? t2m(first.start)-travel-(S.readyMax||0) : null,
    worst: rows.reduce((w,r)=>Math.max(w,RUNWAY_RANK[r.rw.level]),0),
    gone:   rows.some(r=>r.rw.level==='gone'),
    unsafe: rows.some(r=>r.rw.level==='gone'||r.rw.level==='risk'),
    ids: attend.map(sl=>sl.id)
  };
}

function dayOptions(iso){
  const live=liveSlots(iso);
  if(!live.length) return null;
  const onlineSlots=live.filter(sl=>sl.online);
  const blocks=dayBlocks(iso);                 /* in-person only */
  const rem=remainingBySub(iso);
  const all=live;
  const settled=sl=>{ const m=S.marks[markKey(iso,sl)]; return m==='p'||m==='a'; };

  /* `run` is a contiguous stretch of campus blocks; online classes ride along
     free unless you explicitly write the whole day off. The judging itself
     lives in planImpact — this only decides which classes are in, and what
     to call the result. */
  const build=(run, withOnline)=>{
    const onsite=[].concat.apply([],run.map(b=>b.slots));
    const ids=onsite.map(sl=>sl.id)
      .concat(withOnline?onlineSlots.map(sl=>sl.id):[]);
    const o=planImpact(iso, ids, rem);

    let label;
    if(!o.count)                        label='Skip everything';
    else if(!o.onsite.length)           label='Stay home — online only';
    else if(run.length===blocks.length) label = o.onlineCount ? 'Everything (online from home)'
                                                             : 'Go for everything';
    else label = fmtT(o.onsite[0].start)+'–'+
                 fmtT(o.onsite[o.onsite.length-1].end)+' on campus';
    return Object.assign(o, {run, label});
  };

  const opts=[];
  for(let i=0;i<blocks.length;i++)
    for(let j=i;j<blocks.length;j++) opts.push(build(blocks.slice(i,j+1),true));
  if(onlineSlots.length) opts.push(build([],true));   /* stay home, still attend online */
  opts.push(build([],false));                          /* write the day off entirely */

  const best=opts.slice().sort((a,b)=>
    (a.worst-b.worst) || (a.dead-b.dead) || (b.count-a.count))[0];
  const full=opts.find(o=>o.run.length===blocks.length && o.onlineCount===onlineSlots.length)
           || opts[0];
  return {iso, blocks, all, onlineSlots, opts, best, rem,
          weeksLeft: termWeeksLeft(), full};
}
const SKIP_COLOUR={ok:'var(--green)',tight:'var(--orange)',no:'var(--red)'};
const SKIP_WORD  ={ok:'Safe',tight:'Tight',no:'Don’t'};

    'Set a semester end date in Settings for a recoverability estimate.',

    'No end date set, so I can’t tell you whether you have time. Settings.');
  if(x.verdict==='no'){
    const who=(x.breaks[0]||x.already[0]);
    const name=who?esc(who.sub.name):'a subject';
    if(x.breaks.length) return T(
      'With '+wk+' week'+(wk===1?'':'s')+' left, '+name+' can no longer reach '+S.thr+'% if this is missed.',
      'Only '+wk+' week'+(wk===1?'':'s')+' left — miss this and '+name+' can’t get back to '+S.thr+'%.',
      'There isn’t enough term left. Miss this and '+name+' can’t reach '+S.thr+'% however hard you try after.',
      'Miss this and '+name+' is mathematically finished. '+wk+' week'+(wk===1?'':'s')+' left.');
    return x.breaks.length
      ? T('Skipping today puts '+name+' below the required '+S.thr+'%.',

          'Skip it and '+name+' goes under. Then it’s your problem.')
      : T(name+' is already below '+S.thr+'%. Skipping increases the shortfall.',

  const spare=x.rows.reduce(function(m,r){
    return (r.rw.after!=null && (m==null||r.rw.after<m)) ? r.rw.after : m; },null);
  if(x.verdict==='tight')
    return T('Recoverable, but little margin remains across '+wk+' remaining week'+(wk===1?'':'s')+'.',
      'You can still get back to '+S.thr+'%, but the margin is thin.',
      'Still recoverable — but you’d be down to '+(spare==null?'very few':spare)+' spare classes.',

  return T('Recoverable within the '+wk+' remaining week'+(wk===1?'':'s')+'.',

function showTab(id){

  if(id!=='settings') lastTab=id;

function closeSheet(){

  sheetSave=null; document.body.style.overflow='';
}
$('#sheetCancel').onclick=closeSheet;
/* drag the sheet down to dismiss — from the grabber/header, or from the
   body once it's scrolled to the top, so it never fights normal scrolling */
(function(){
  const sheet=document.getElementById('sheet');
  const bar=document.getElementById('sheetBar');
  const body=document.getElementById('sheetBody');
  if(!sheet) return;
  let y0=null, dy=0, dragging=false;
  const fromTop=e=>{
    const t=e.target;
    if(bar&&bar.contains&&bar.contains(t)) return true;
    if(t&&t.classList&&t.classList.contains('grab')) return true;
    return !body || (body.scrollTop||0)<=0;
  };
  sheet.addEventListener('touchstart',e=>{
    if(e.touches.length!==1||!fromTop(e)){ y0=null; return; }
    y0=e.touches[0].clientY; dy=0; dragging=false;
  },{passive:true});
  /* The panel is centred, so its resting transform is translateY(-50%) —
     a drag has to compose with that, not replace it, or the sheet jumps to
     the top of the screen the moment you touch it. It also fades as it
     goes, which is what tells you it's leaving rather than moving. */
  sheet.addEventListener('touchmove',e=>{
    if(y0===null) return;
    dy=e.touches[0].clientY-y0;
    if(dy<=0){ if(dragging){ sheet.style.transform=''; sheet.style.opacity='';
                             dragging=false; } return; }
    dragging=true;
    sheet.style.transition='none';
    sheet.style.transform='translateY(calc(-50% + '+dy.toFixed(1)+'px))';
    sheet.style.opacity=String(Math.max(.35,1-dy/420));
  },{passive:true});
  const release=()=>{
    if(y0===null) return;
    const d=dy; y0=null; dy=0;
    sheet.style.transition=''; sheet.style.transform=''; sheet.style.opacity='';
    if(dragging && d>90) closeSheet();
    dragging=false;
  };
  sheet.addEventListener('touchend',release,{passive:true});
  sheet.addEventListener('touchcancel',release,{passive:true});
})();
$('#scrim').onclick=()=>{ closeSheet(); closeAct(); };
$('#sheetDone').onclick=()=>{ if(sheetSave && sheetSave()!==false) closeSheet(); };
function sheetError(msg){
  let e=$('#sheetBody .sheetErr');

  e.textContent=msg; e.scrollIntoView({block:'nearest',behavior:'smooth'});
}
