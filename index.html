<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="mobile-web-app-capable" content="yes">

<meta name="theme-color" content="#F2F2F7" id="tcMeta">
<style>
/* ══════════════════════════════════════════════════════════════
   11:59 — iOS-native design tokens
   ══════════════════════════════════════════════════════════════ */
:root{
  color-scheme:light;
  --bg:#F2F2F7;
  --card:#FFFFFF;
  --card-press:#E5E5EA;
  --sep:rgba(60,60,67,.28);
  --sep-soft:rgba(60,60,67,.10);
  --label:#000000;
  --label2:rgba(60,60,67,.62);
  --label3:rgba(60,60,67,.32);
  --fill:rgba(118,118,128,.12);
  --fill2:rgba(118,118,128,.20);
  --accent:#007AFF;
  --green:#34C759; --red:#FF3B30; --orange:#FF9500; --yellow:#FFCC00;
  --purple:#AF52DE; --teal:#30B0C7; --pink:#FF2D55; --indigo:#5856D6; --brown:#A2845E;
  --nav:rgba(242,242,247,.80);
  /* liquid-glass pill (carried over from the wallet app) */
  --glass:rgba(255,255,255,.62); --glass-solid:rgba(252,251,249,.95);
  --glass-line:rgba(22,20,20,.11); --glass-hi:rgba(255,255,255,.80);
  --glass-active:rgba(22,20,20,.07);
  --sheet:#FFFFFF;
  --scrim:rgba(0,0,0,.32);
  --ta:.13;                       /* subject tint alpha */
  --font:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,system-ui,sans-serif;
  --round:12px;
}
[data-theme="dark"]{
  color-scheme:dark;
  --bg:#000000;
  --card:#1C1C1E;
  --card-press:#2C2C2E;
  --sep:rgba(84,84,88,.60);
  --sep-soft:rgba(84,84,88,.30);
  --label:#FFFFFF;
  --label2:rgba(235,235,245,.62);
  --label3:rgba(235,235,245,.32);
  --fill:rgba(118,118,128,.24);
  --fill2:rgba(118,118,128,.36);
  --accent:#0A84FF;
  --green:#30D158; --red:#FF453A; --orange:#FF9F0A; --yellow:#FFD60A;
  --purple:#BF5AF2; --teal:#40C8E0; --pink:#FF375F; --indigo:#5E5CE6; --brown:#AC8E68;
  --nav:rgba(20,20,22,.80);
  --glass:rgba(28,28,31,.58); --glass-solid:rgba(18,18,20,.95);
  --glass-line:rgba(241,239,237,.13); --glass-hi:rgba(255,255,255,.09);
  --glass-active:rgba(241,239,237,.13);
  --sheet:#1C1C1E;
  --scrim:rgba(0,0,0,.5);
  --ta:.22;
}

/* subject palette */
.sc0{--sc:var(--accent)} .sc1{--sc:var(--orange)} .sc2{--sc:var(--green)} .sc3{--sc:var(--purple)}
.sc4{--sc:var(--pink)}   .sc5{--sc:var(--teal)}   .sc6{--sc:var(--indigo)} .sc7{--sc:var(--brown)}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg); color:var(--label);
  font-family:var(--font); font-size:17px; line-height:1.4;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
  padding-bottom:calc(92px + env(safe-area-inset-bottom,0px));
}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer;font-size:17px}
input,select,textarea{font-family:inherit;font-size:17px;color:var(--label);background:none;border:none;outline:none;border-radius:8px}
input::placeholder,textarea::placeholder{color:var(--label3)}
a{color:var(--accent);text-decoration:none}
.tnum{font-variant-numeric:tabular-nums}

/* ── nav bar ─────────────────────────────────────────────── */
#nav{
  position:fixed;top:0;left:0;right:0;z-index:60;
  height:calc(48px + env(safe-area-inset-top,0px));
  padding-top:env(safe-area-inset-top,0px);
  display:flex;align-items:center;
  background:transparent;
  transition:background .22s ease, box-shadow .22s ease;
}
#nav.solid{
  background:var(--nav);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
  backdrop-filter:saturate(180%) blur(20px);
  box-shadow:0 .5px 0 var(--sep);
}
#navTitle{
  flex:1;text-align:center;font-size:17px;font-weight:600;letter-spacing:-.01em;
  opacity:0;transform:translateY(4px);transition:opacity .2s,transform .2s;
  padding:0 84px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
#nav.solid #navTitle{opacity:1;transform:none}
#navR{position:absolute;right:6px;display:flex;align-items:center;gap:2px;
  top:env(safe-area-inset-top,0px);height:48px}
.navBtn{
  width:42px;height:42px;display:flex;align-items:center;justify-content:center;
  color:var(--accent);border-radius:50%;
}
.navBtn:active{background:var(--fill)}
.navBtn svg{width:23px;height:23px;display:block}

/* ── layout ──────────────────────────────────────────────── */
main{padding-top:calc(48px + env(safe-area-inset-top,0px))}
section{display:none}
section.on{display:block;animation:fade .26s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.lg{padding:4px 20px 2px}
.lg h1{font-size:34px;font-weight:800;letter-spacing:-.032em;line-height:1.15}
.lg .sub{font-size:15px;color:var(--label2);margin-top:2px;font-weight:400}
.pad{padding:0 16px}

/* ── grouped list ────────────────────────────────────────── */
.gHead{font-size:13px;font-weight:600;letter-spacing:.02em;color:var(--label2);
  text-transform:uppercase;padding:22px 16px 7px;margin:0}
.gHead.tight{padding-top:14px}
.gNote{font-size:13px;color:var(--label2);padding:7px 16px 0;line-height:1.35}
.list{background:var(--card);border-radius:var(--round);margin:0 0 2px;overflow:hidden}
.row{
  position:relative;display:flex;align-items:center;gap:12px;
  min-height:48px;padding:11px 16px;width:100%;text-align:left;font-size:17px;
}
.row+.row::before{content:'';position:absolute;top:0;left:16px;right:0;height:.5px;background:var(--sep)}
button.row:active,.tap:active{background:var(--card-press)}
.row .rMain{flex:1;min-width:0}
.row .rT{font-size:17px;letter-spacing:-.01em}
.row .rS{font-size:13px;color:var(--label2);margin-top:2px;line-height:1.3}
.row .rV{color:var(--label2);font-size:17px;text-align:right;flex-shrink:0}
.row .chev{color:var(--label3);flex-shrink:0;font-size:15px;margin-left:-4px}
.row.danger .rT{color:var(--red)}
.row .ico{width:29px;height:29px;border-radius:7px;display:flex;align-items:center;
  justify-content:center;flex-shrink:0;color:#fff;font-size:15px}
.chk{color:var(--accent);font-size:17px;font-weight:700;flex-shrink:0}

/* inline controls inside rows */
.row input[type=text],.row input[type=number]{flex:1;text-align:right;min-width:0}
.row input[type=date],.row input[type=time],.row select{
  background:var(--fill);border-radius:8px;padding:7px 10px;font-size:16px;
  text-align:center;flex-shrink:0;max-width:52%;
}
.row select{text-align:left;-webkit-appearance:none;appearance:none;padding-right:26px;
  background-image:linear-gradient(45deg,transparent 50%,var(--label2) 50%),linear-gradient(135deg,var(--label2) 50%,transparent 50%);
  background-position:calc(100% - 14px) 55%,calc(100% - 9px) 55%;
  background-size:5px 5px,5px 5px;background-repeat:no-repeat}

/* ── segmented control ───────────────────────────────────── */
.seg{display:flex;background:var(--fill);border-radius:9px;padding:2px;gap:2px}
.seg button{
  flex:1;height:32px;border-radius:7px;font-size:13px;font-weight:600;
  color:var(--label);white-space:nowrap;padding:0 6px;transition:background .18s
}
.seg button.on{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.12)}
[data-theme="dark"] .seg button.on{background:#48484A;box-shadow:none}

/* ── buttons ─────────────────────────────────────────────── */
.btn{
  display:flex;align-items:center;justify-content:center;gap:7px;
  width:100%;height:50px;border-radius:13px;background:var(--accent);color:#fff;
  font-size:17px;font-weight:600;
}
.btn:active{opacity:.75}
.btn.ghost{background:var(--fill);color:var(--accent)}
.btn.dangerBtn{background:var(--red)}
.btn.sm{height:42px;font-size:16px;border-radius:11px}

/* ── cards ───────────────────────────────────────────────── */
.card{background:var(--card);border-radius:16px;padding:18px;margin:0 0 12px}
.card.tinted{background:color-mix(in srgb,var(--sc) calc(var(--ta)*100%),var(--card))}
@supports not (background:color-mix(in srgb,red 10%,blue)){
  .card.tinted{background:var(--card)}
}
.kicker{font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--label2)}

/* ── hero (today) ────────────────────────────────────────── */
#hero{margin:10px 16px 14px;border-radius:18px;overflow:hidden;background:var(--card);
  border-left:5px solid var(--sc,var(--accent))}
#hero .hTop{padding:16px 18px 14px}
#hero .hK{font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  color:var(--sc,var(--accent));display:flex;align-items:center;gap:7px}
#hero .hK .dot{width:7px;height:7px;border-radius:50%;background:var(--sc,var(--accent));
  animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.8)}}
#hero .hN{font-size:26px;font-weight:800;letter-spacing:-.03em;margin-top:7px;line-height:1.18}
#hero .hM{font-size:15px;color:var(--label2);margin-top:4px}
#hero .hM b{color:var(--label);font-weight:600}
#hero .hAct{padding:0 18px 16px}

/* mark control */
.mkSeg{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;background:var(--fill);
  border-radius:11px;padding:3px}
.mkSeg button{height:38px;border-radius:9px;font-size:14px;font-weight:600;color:var(--label2)}
.mkSeg button:active{opacity:.6}
.mkSeg button.on{color:#fff}
.mkSeg button.on[data-m="p"]{background:var(--green)}
.mkSeg button.on[data-m="a"]{background:var(--red)}
.mkSeg button.on[data-m="c"]{background:var(--fill2);color:var(--label)}

/* ── class card ──────────────────────────────────────────── */
.cls{background:var(--card);border-radius:14px;padding:14px 15px;margin-bottom:10px;
  border-left:4px solid var(--sc)}
.cls .cTop{display:flex;align-items:flex-start;gap:12px}
.cls .cTime{font-size:13px;font-weight:600;color:var(--label2);width:78px;flex-shrink:0;
  line-height:1.35;font-variant-numeric:tabular-nums}
.cls .cName{flex:1;min-width:0;font-size:17px;font-weight:600;letter-spacing:-.015em;line-height:1.25}
.cls .cMeta{font-size:13px;color:var(--label2);font-weight:400;margin-top:3px}
.cls .cMore{color:var(--label3);font-size:19px;padding:0 2px;line-height:1;align-self:center}
.cls .cSkip{font-size:13px;color:var(--label2);margin-top:9px;display:flex;align-items:center;gap:6px}
.cls .cSkip b{font-weight:600}
.cls.done{opacity:.62}
.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  padding:2px 7px;border-radius:5px;background:var(--fill);color:var(--label2);vertical-align:2px}
.tag.tu{background:color-mix(in srgb,var(--sc) 18%,transparent);color:var(--sc)}
.tag.pr{background:color-mix(in srgb,var(--purple) 20%,transparent);color:var(--purple)}
.tag.online{background:color-mix(in srgb,var(--teal) 20%,transparent);color:var(--teal)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;
  padding:3px 9px;border-radius:99px}
.pill.ok{background:color-mix(in srgb,var(--green) 16%,transparent);color:var(--green)}
.pill.no{background:color-mix(in srgb,var(--red) 16%,transparent);color:var(--red)}
.pill.mid{background:color-mix(in srgb,var(--orange) 18%,transparent);color:var(--orange)}
@supports not (background:color-mix(in srgb,red 10%,blue)){
  .pill.ok{background:var(--fill)} .pill.no{background:var(--fill)} .pill.mid{background:var(--fill)}
  .tag.tu{background:var(--fill)}
  .tag.pr{background:var(--fill);color:var(--purple)}
  .tag.online{background:var(--fill);color:var(--teal)}
}

/* ── stat tiles ──────────────────────────────────────────── */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 16px 12px}
.tile{background:var(--card);border-radius:14px;padding:14px 15px}
.tile .tV{font-size:28px;font-weight:800;letter-spacing:-.03em;line-height:1.1;font-variant-numeric:tabular-nums}
.tile .tL{font-size:12.5px;color:var(--label2);margin-top:3px;line-height:1.3}

/* ── ring ────────────────────────────────────────────────── */
.ring{width:112px;height:112px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;flex-shrink:0;position:relative}
.ring .inner{width:88px;height:88px;border-radius:50%;background:var(--card);
  display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .rv{font-size:25px;font-weight:800;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.ring .rl{font-size:10.5px;color:var(--label2);margin-top:3px;letter-spacing:.03em}

/* ── bars ────────────────────────────────────────────────── */
.bar{height:7px;border-radius:99px;background:var(--fill);position:relative;overflow:visible;margin:11px 0 0}
.bar .fl{height:7px;border-radius:99px;transition:width .5s cubic-bezier(.22,1,.36,1)}
.bar .rq{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--label);opacity:.45;border-radius:2px}

/* ── day strip (timetable) ───────────────────────────────── */
/* ── date picker rail ────────────────────────────────────────────
   Behaves like the iPhone clock picker: flick it, it glides, and
   whichever date lands under the centre marker becomes the selected
   day. Scroll-snap does the settling; a scroll-end handler reads the
   centred chip. */
#railWrap{position:relative}
#railWrap::before{                      /* the centre selection band */
  content:'';position:absolute;left:50%;top:6px;bottom:6px;width:58px;
  transform:translateX(-50%);border-radius:14px;background:var(--fill);
  pointer-events:none;z-index:0;
}
#dayStrip{position:relative;z-index:1;display:flex;gap:7px;overflow-x:auto;overflow-y:hidden;
  padding:8px 0 6px;-webkit-overflow-scrolling:touch;scrollbar-width:none;
  overscroll-behavior-x:contain;scroll-snap-type:x mandatory}
#dayStrip::-webkit-scrollbar{display:none}
/* first and last chips must be able to reach the centre */
#dayStrip::before,#dayStrip::after{content:'';flex:0 0 calc(50vw - 25px)}
.dChip{flex:0 0 auto;width:50px;border-radius:12px;padding:5px 2px 6px;text-align:center;
  background:transparent;scroll-snap-align:center;transition:background .18s,transform .18s}
.dChip .dM{font-size:9px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
  color:var(--accent);height:11px;line-height:11px}
.dChip.wknd .dW,.dChip.wknd .dN{opacity:.55}
/* the centred day reads as selected — no fill, the band behind it does that */
.dChip.on{transform:scale(1.06)}
.dChip.on .dW{color:var(--accent)}
.dChip.on .dN{font-weight:800}
.dChip.on.wknd .dW,.dChip.on.wknd .dN{opacity:1}
.dChip .dW{font-size:10.5px;font-weight:700;letter-spacing:.05em;color:var(--label2);text-transform:uppercase}
.dChip .dN{font-size:17px;font-weight:700;margin-top:3px;font-variant-numeric:tabular-nums}
.dChip .dD{width:5px;height:5px;border-radius:50%;background:var(--label3);margin:4px auto 0}
/* today is always marked in red, selected or not (Calendar app convention) */
.dChip.today .dN,.dChip.today .dW{color:var(--red);opacity:1}
#ttHead{display:flex;align-items:center;gap:10px;padding:12px 20px 8px}
#ttHead .h{font-size:20px;font-weight:700;letter-spacing:-.02em;flex:1}
#ttHead .w{font-size:13px;color:var(--label2)}
#ttBody{padding:0 16px;transition:transform .18s ease-out}
#timetable{touch-action:pan-y}
#ttHead{touch-action:pan-y}
/* the rail must own horizontal panning — pan-y here would kill finger scrolling */
#dayStrip{touch-action:pan-x}
#ttBody.slideL{animation:slL .26s ease}
#ttBody.slideR{animation:slR .26s ease}
@keyframes slL{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
@keyframes slR{from{opacity:0;transform:translateX(-26px)}to{opacity:1;transform:none}}

/* ── empty state ─────────────────────────────────────────── */
.empty{text-align:center;padding:44px 30px;color:var(--label2)}
.empty .eE{font-size:38px;margin-bottom:12px;opacity:.85}
.empty .eT{font-size:17px;font-weight:600;color:var(--label);margin-bottom:5px}
.empty .eS{font-size:14.5px;line-height:1.45}

/* ── deadlines ───────────────────────────────────────────── */
.dlChk{width:25px;height:25px;border-radius:50%;border:1.8px solid var(--label3);
  flex-shrink:0;display:flex;align-items:center;justify-content:center;
  font-size:13px;color:transparent;transition:all .18s}
.dlChk.on{background:var(--green);border-color:var(--green);color:#fff}
.dlRow.done .rT{text-decoration:line-through;color:var(--label2)}
.when{font-size:13px;font-weight:600;text-align:right;flex-shrink:0;font-variant-numeric:tabular-nums}
.when.late{color:var(--red)} .when.near{color:var(--orange)} .when.calm{color:var(--label2)}
.subChip{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.03em;
  padding:2px 7px;border-radius:5px;color:var(--sc);
  background:color-mix(in srgb,var(--sc) 16%,transparent)}
@supports not (background:color-mix(in srgb,red 10%,blue)){.subChip{background:var(--fill)}}

/* procrastination meter */
.pmTrack{position:relative;height:7px;border-radius:99px;
  background:linear-gradient(90deg,var(--green),var(--yellow) 55%,var(--red));margin:14px 0 0}
.pmPin{position:absolute;top:50%;width:17px;height:17px;margin:-8.5px 0 0 -8.5px;border-radius:50%;
  background:var(--card);border:3px solid var(--label);transition:left .8s cubic-bezier(.22,1,.36,1)}
.pmEnds{display:flex;justify-content:space-between;margin-top:9px;font-size:11.5px;color:var(--label2)}
.pmStats{display:flex;gap:22px;flex-wrap:wrap;margin-top:14px;padding-top:13px;border-top:.5px solid var(--sep)}
.pmStats span{font-size:11.5px;color:var(--label2);display:flex;flex-direction:column;gap:2px}
.pmStats b{font-size:17px;color:var(--label);font-weight:700}

/* ── calendar ────────────────────────────────────────────── */
#calBar{display:flex;align-items:center;gap:4px;padding:6px 16px 10px}
#calTitle{flex:1;font-size:20px;font-weight:700;letter-spacing:-.02em}
.calNav{width:38px;height:38px;border-radius:50%;color:var(--accent);font-size:19px;
  display:flex;align-items:center;justify-content:center}
.calNav:active{background:var(--fill)}
#calGrid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;padding:0 10px}
.cDow{text-align:center;font-size:11px;font-weight:600;color:var(--label2);padding:2px 0 6px}
.cD{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;border-radius:50%;font-size:16px;font-variant-numeric:tabular-nums;position:relative}
.cD.pad{opacity:0;pointer-events:none}
.cD.today{color:var(--red);font-weight:700}
.cD.sel{background:var(--accent);color:#fff!important;font-weight:700}
.cD .dots{display:flex;gap:2.5px;height:5px;align-items:center}
.cD .dots i{width:5px;height:5px;border-radius:50%;background:var(--sc,var(--label3))}
.cD.sel .dots i{background:rgba(255,255,255,.9)}

/* ── sheet ───────────────────────────────────────────────── */
#scrim{position:fixed;inset:0;z-index:90;background:var(--scrim);opacity:0;
  transition:opacity .28s ease;pointer-events:none;
  -webkit-backdrop-filter:blur(1px);backdrop-filter:blur(1px)}
#scrim.on{opacity:1;pointer-events:auto}
#sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:100;
  background:var(--sheet);border-radius:16px 16px 0 0;
  transform:translateY(102%);transition:transform .34s cubic-bezier(.32,.72,0,1);
  max-height:92vh;display:flex;flex-direction:column;
  box-shadow:0 -1px 0 var(--sep-soft);
}
#sheet.on{transform:none}
#sheet .grab{width:36px;height:5px;border-radius:99px;background:var(--label3);
  margin:8px auto 0;flex-shrink:0}
#sheetBar{display:flex;align-items:center;padding:10px 14px 8px;flex-shrink:0}
#sheetBar .sTitle{flex:1;text-align:center;font-size:17px;font-weight:600}
#sheetBar button{font-size:17px;color:var(--accent);min-width:64px;padding:4px 0}
#sheetBar button.done{font-weight:600;text-align:right}
#sheetBar button.cancel{text-align:left}
#sheetBar button:disabled{color:var(--label3)}
#sheetBody{overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:0 16px calc(24px + env(safe-area-inset-bottom,0px));flex:1}

#act.on{transform:none}
.actGrp{background:var(--card);border-radius:14px;overflow:hidden;margin-bottom:8px}

.actGrp button{width:100%;height:56px;font-size:19px;color:var(--accent);position:relative;display:block}
.actGrp button+button::before{content:'';position:absolute;top:0;left:0;right:0;height:.5px;background:var(--sep)}

.actHead::after{content:'';position:absolute;bottom:0;left:0;right:0;height:.5px;background:var(--sep)}

/* ── colour picker ───────────────────────────────────────── */
.swatches{display:flex;gap:10px;flex-wrap:wrap;padding:14px 16px}
.swatch{width:36px;height:36px;border-radius:50%;background:var(--sc);

.swatch:not(.on){box-shadow:none}
.swatch.on{box-shadow:0 0 0 3px var(--card),0 0 0 5.5px var(--sc)}

/* ── tab bar ─────────────────────────────────────────────── */
/* floating liquid-glass pill — ported from the wallet app */
#tabbar{
  position:fixed;z-index:70;display:flex;align-items:center;gap:4px;
  left:max(12px,env(safe-area-inset-left,0px));
  right:max(12px,env(safe-area-inset-right,0px));
  bottom:calc(11px + env(safe-area-inset-bottom,0px));
  height:60px;padding:6px;border-radius:999px;
  background:var(--glass);
  backdrop-filter:blur(26px) saturate(180%);
  -webkit-backdrop-filter:blur(26px) saturate(180%);
  border:1px solid var(--glass-line);
  box-shadow:0 12px 40px rgba(0,0,0,.26), inset 0 1px 0 var(--glass-hi);
  /* Promote to its own compositing layer and keep it there. Without this the
     blur is re-sampled on the main thread during momentum scroll and visibly
     lags/freezes on iOS. */
  transform:translateZ(0);
  -webkit-transform:translateZ(0);
  backface-visibility:hidden;
  -webkit-backface-visibility:hidden;
  will-change:opacity;
  transition:opacity .28s ease;
}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  #tabbar{background:var(--glass-solid)}
}
/* shrinks out of the way while the page is moving, settles back when it stops */
/* Recedes while the page moves, settles back when it stops. Opacity only —
   scaling a backdrop-filtered element is what made this glitch on iOS. */
#tabbar.scrolling{opacity:.82}
#tabbar button{
  flex:1;height:100%;border-radius:999px;min-width:0;position:relative;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;

  transition:color .25s, background .3s cubic-bezier(.22,1,.36,1);
}
@media(max-width:359px){ #tabbar button{font-size:7.5px;letter-spacing:.02em} }
#tabbar button svg{width:23px;height:23px;display:block;
  transition:transform .3s cubic-bezier(.34,1.56,.64,1)}

.badge{position:absolute;top:-3px;left:50%;margin-left:4px;min-width:16px;height:16px;border-radius:99px;
  background:var(--red);color:#fff;font-size:10.5px;font-weight:700;display:flex;
  align-items:center;justify-content:center;padding:0 4px;
  box-shadow:0 0 0 2px var(--glass-solid);pointer-events:none}

/* ── toast ───────────────────────────────────────────────── */
#toast{
  position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));
  transform:translate(-50%,14px);z-index:110;
  background:rgba(30,30,32,.94);color:#fff;font-size:14.5px;font-weight:500;
  padding:11px 18px;border-radius:99px;opacity:0;pointer-events:none;
  transition:opacity .24s,transform .24s;max-width:86vw;text-align:center;
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
}
[data-theme="dark"] #toast{background:rgba(70,70,74,.95)}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* ── onboarding ──────────────────────────────────────────── */
#intro{position:fixed;inset:0;z-index:200;background:var(--bg);display:flex;
  flex-direction:column;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}

  justify-content:center;text-align:center}
#introBody .iE{font-size:56px;margin-bottom:22px}
#introBody h2{font-size:29px;font-weight:800;letter-spacing:-.03em;line-height:1.2;margin-bottom:12px}
#introBody p{font-size:16.5px;color:var(--label2);line-height:1.5;max-width:340px;margin:0 auto}
#introBody p b{color:var(--label);font-weight:600}

#introFoot{padding:16px 22px 22px;flex-shrink:0}

@media (prefers-reduced-motion:reduce){

}

<script>
/* ══════════════════════════════════════════════════════════════
   11:59 — college companion.  Single file, offline, no account.
   ══════════════════════════════════════════════════════════════ */
'use strict';
const $  = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
/* time + a monotonic counter + randomness. The counter makes collisions
   impossible within a session (the old version relied on 4 random chars,
   which can repeat when ids are minted in the same millisecond); the
   random tail keeps ids distinct across devices when backups are merged. */
let _uidSeq = 0;
const uid = () => Date.now().toString(36) + '-' +
  (_uidSeq = (_uidSeq + 1) % 1679616).toString(36) + '-' +
  Math.random().toString(36).slice(2, 8);
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));

const DAYS  = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const DAYSL = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];

/* class kinds — theory / tutorial / practical. "online" is a separate flag,
   so any kind can also be an online class. */
const KINDS = [['th','Theory'],['tu','Tutorial'],['pr','Practical']];
const KIND_NAME = {th:'Theory', tu:'Tutorial', pr:'Practical'};
const KIND_TAG  = {th:'', tu:'Tut', pr:'Prac'};
const kindOf = sl => (sl && KIND_NAME[sl.kind]) ? sl.kind : 'th';
/* the little badges on a class card */
const kindTag = sl => KIND_TAG[kindOf(sl)]
  ? ' <span class="tag '+kindOf(sl)+'">'+KIND_TAG[kindOf(sl)]+'</span>' : '';
const onlineTag = sl => sl.online ? ' <span class="tag online">Online</span>' : '';
/* where the class happens — a room, or "Online" */
const placeOf = sl => sl.online ? 'Online' : (sl.room||'');

const pad2 = n => String(n).padStart(2,'0');
const isoOf = d => d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
const todayISO = () => isoOf(new Date());
const dateOf = iso => new Date(iso+'T00:00:00');
const daysTo = iso => Math.round((dateOf(iso)-dateOf(todayISO()))/864e5);
const dowOf = d => (d.getDay()+6)%7;                    /* Mon = 0 */
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x;};

const t2m = t => { const p=String(t||'0:0').split(':'); return (+p[0])*60+(+p[1]||0); };
const fmtT = t => { let [h,m]=String(t).split(':').map(Number); const ap=h>=12?'pm':'am';
  h=h%12||12; return h+(m?':'+pad2(m):'')+ap; };
const nowMin = () => { const d=new Date(); return d.getHours()*60+d.getMinutes(); };
const fmtDur = m => m<60 ? m+' min' : (m%60===0 ? (m/60)+' hr' : Math.floor(m/60)+' hr '+(m%60)+' min');

/* ── icons ─────────────────────────────────────────────────── */
const ICO = {
  today:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5.2l3.2 1.9"/></svg>',
  grid:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 9.5h18M8.5 4v3M15.5 4v3"/></svg>',
  chart:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M5 20V11M12 20V5M19 20v-6"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l4.2 4.2L20 6"/><path d="M4 6.5h8" opacity=".45"/></svg>',
  cal:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16.5" rx="3"/><path d="M3 9.5h18M8 3.5v3M16 3.5v3"/><circle cx="8.5" cy="14" r="1.1" fill="currentColor" stroke="none"/><circle cx="12" cy="14" r="1.1" fill="currentColor" stroke="none"/></svg>',
  gear:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.6 1.6 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.6 1.6 0 00-1.8-.3 1.6 1.6 0 00-1 1.5V21a2 2 0 11-4 0v-.1A1.6 1.6 0 008 19.4a1.6 1.6 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.6 1.6 0 00.3-1.8 1.6 1.6 0 00-1.5-1H2a2 2 0 110-4h.1A1.6 1.6 0 003.6 9a1.6 1.6 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.6 1.6 0 001.8.3H8a1.6 1.6 0 001-1.5V3a2 2 0 114 0v.1a1.6 1.6 0 001 1.5 1.6 1.6 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.6 1.6 0 00-.3 1.8V9a1.6 1.6 0 001.5 1H21a2 2 0 110 4h-.1a1.6 1.6 0 00-1.5 1z"/></svg>',
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>'
};

/* ══════════════ STATE ══════════════ */
const KEY='sem5plan';
/* One place that knows every field. Wipe, import and first run all go
   through here, so adding a setting can't leave one path with `undefined`. */
function blankState(keep){
  keep=keep||{};
  return {subs:[],slots:[],marks:{},att:{},dls:[],cats:[],tab:'home',
          thr:67, ready:0, travel:0, name:'',
          theme:keep.theme||'auto', tone:keep.tone||'friendly'};
}
/* Repair anything missing or the wrong shape — old saves, hand-edited
   backups, a file from a previous version. */
function normalise(st){
  st=Object.assign(blankState(st),st||{});
  if(!['light','dark','auto'].includes(st.theme)) st.theme='auto';
  if(!['pro','plain','friendly','snark'].includes(st.tone)) st.tone='friendly';
  ['subs','slots','dls','cats'].forEach(k=>{ if(!Array.isArray(st[k])) st[k]=[]; });
  ['marks','att'].forEach(k=>{ if(!st[k]||typeof st[k]!=='object') st[k]={}; });
  st.subs.forEach((s,i)=>{
    if(typeof s.ci!=='number') s.ci=i%8;
    if(!s.code) s.code=String(s.name||'?').slice(0,3).toUpperCase();
  });
  st.thr   =clamp(+st.thr   ||67,1,100);
  st.ready =clamp(+st.ready ||0,0,300);
  st.travel=clamp(+st.travel||0,0,300);
  st.name  =typeof st.name==='string' ? st.name.slice(0,80) : '';
  return st;
}
let S=blankState();
try{ const raw=localStorage.getItem(KEY); if(raw) S=Object.assign(S,JSON.parse(raw)||{}); }catch(e){}
S=normalise(S);

function save(){ try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){} }

/* ══════════════ TONE ══════════════
   S.tone: pro | plain | friendly | snark                        */
const TONE_IX={pro:0,plain:1,friendly:2,snark:3};
function T(pro,plain,friendly,snark){
  return [pro,plain,friendly,snark][TONE_IX[S.tone]??2];
}

/* ══════════════ THEME ══════════════ */
const darkMQ = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
const effTheme = () => S.theme==='auto' ? ((darkMQ&&darkMQ.matches)?'dark':'light') : S.theme;
function applyTheme(){
  const e=effTheme();
  document.documentElement.dataset.theme=e;
  const tc=$('#tcMeta'); if(tc) tc.setAttribute('content', e==='dark'?'#000000':'#F2F2F7');
  const cs=$('#csMeta'); if(cs) cs.setAttribute('content', e);
  drawIcons();
}
if(darkMQ){
  const f=()=>{ if(S.theme==='auto') applyTheme(); };
  if(darkMQ.addEventListener) darkMQ.addEventListener('change',f); else if(darkMQ.addListener) darkMQ.addListener(f);
}

/* home-screen icon, drawn at runtime */
function drawIcons(){
  try{
    const draw=size=>{
      const c=document.createElement('canvas'); c.width=c.height=size;
      const g=c.getContext('2d'); if(!g) return '';
      const r=size*.2237;
      g.beginPath();
      g.moveTo(r,0); g.lineTo(size-r,0); g.quadraticCurveTo(size,0,size,r);
      g.lineTo(size,size-r); g.quadraticCurveTo(size,size,size-r,size);
      g.lineTo(r,size); g.quadraticCurveTo(0,size,0,size-r);
      g.lineTo(0,r); g.quadraticCurveTo(0,0,r,0); g.closePath();
      const grad=g.createLinearGradient(0,0,0,size);
      grad.addColorStop(0,'#1C1C22'); grad.addColorStop(1,'#08080B');
      g.fillStyle=grad; g.fill();
      const fs=Math.round(size*.245);
      g.font='700 '+fs+'px -apple-system, ui-monospace, "SF Mono", Menlo, monospace';
      g.textAlign='left'; g.textBaseline='middle';
      const a='11', cn=':', b='59';
      const w1=g.measureText(a).width, wc=g.measureText(cn).width, w2=g.measureText(b).width;
      const x=size/2-(w1+wc+w2)/2, y=size*.52;
      g.fillStyle='#F5F5F7'; g.fillText(a,x,y);
      g.fillStyle='#0A84FF'; g.fillText(cn,x+w1,y);
      g.fillStyle='#F5F5F7'; g.fillText(b,x+w1+wc,y);
      return c.toDataURL('image/png');
    };
    const set=(rel,size)=>{
      let l=document.querySelector('link[rel="'+rel+'"]');
      if(!l){ l=document.createElement('link'); l.rel=rel; document.head.appendChild(l); }
      l.href=draw(size);
    };
    set('apple-touch-icon',180); set('icon',64);
  }catch(e){}
}

/* ══════════════ DOMAIN ══════════════ */
const subById = id => S.subs.find(s=>s.id===id);
const scCls = sub => 'sc'+((sub&&typeof sub.ci==='number'?sub.ci:0)%8);

/* classes on a given weekday / date. One-offs live only on their date. */
function slotsOn(dayIx, iso){
  return S.slots
    .filter(s => s.once ? s.date===iso : s.day===dayIx)
    .sort((a,b)=>t2m(a.start)-t2m(b.start));
}
const markKey=(iso,sl)=> iso+'|'+sl.id+'|'+sl.subId+'|'+(sl.kind||'th');

/* marks made on the timetable only (used to protect manual backfill) */
function marksOnly(subId){
  const th={p:0,a:0}, tu={p:0,a:0}, pr={p:0,a:0};
  for(const k in S.marks){
    const p=k.split('|'); if(p[2]!==subId) continue;
    const c = p[3]==='tu' ? tu : p[3]==='pr' ? pr : th;
    if(S.marks[k]==='p') c.p++; else if(S.marks[k]==='a') c.a++;
  }
  return {th,tu,pr};
}
/* backfilled counters + everything marked = the real numbers */
function attFor(subId){
  const m=S.att[subId]||{};
  const th={p:(m.thp??m.p)||0, a:(m.tha??m.a)||0};
  const tu={p:m.tup||0, a:m.tua||0};
  const pr={p:m.prp||0, a:m.pra||0};
  const d=marksOnly(subId);
  th.p+=d.th.p; th.a+=d.th.a;
  tu.p+=d.tu.p; tu.a+=d.tu.a;
  pr.p+=d.pr.p; pr.a+=d.pr.a;
  th.t=th.p+th.a; tu.t=tu.p+tu.a; pr.t=pr.p+pr.a;
  return {th,tu,pr,
    p:th.p+tu.p+pr.p, a:th.a+tu.a+pr.a, t:th.t+tu.t+pr.t};
}
const pctOf=(p,t)=> t? p/t*100 : 0;
const pctFmt=n=>{ const r=Math.round(n*10)/10; return r%1===0?String(Math.round(r)):r.toFixed(1); };

/* DU / SBSC attendance-marks slab, out of 5 */
function attMarks(p,t){
  if(!t) return null;
  const q=pctOf(p,t);
  return q>85?5:q>80?4:q>75?3:q>70?2:q>67?1:0;
}
/* how many more can be missed / must be attended */
function canMiss(p,t){ const T=S.thr/100; return t? Math.floor(p/T - t) : 0; }
function mustAttend(p,t){
  const T=S.thr/100;
  if(T>=1) return Infinity;      /* 100% required — one absence can never be undone */
  return Math.ceil((T*t-p)/(1-T));
}

function bunkLine(p,t){
  if(!t) return T('No classes recorded.','No classes recorded yet.','Nothing recorded yet — mark a few classes.','No data. A blank slate, for now.');
  if(pctOf(p,t)>=S.thr){
    const m=canMiss(p,t);
    if(m>0) return T(
      m+' class'+(m===1?'':'es')+' may be missed while staying at or above '+S.thr+'%.',
      'You can miss '+m+' more and stay above '+S.thr+'%.',
      'You’ve got '+m+' free skip'+(m===1?'':'s')+' before you drop below '+S.thr+'%.',
      m+' skip'+(m===1?'':'s')+' in the bank. Spend '+(m===1?'it':'them')+' wisely.');
    return T('At the minimum threshold. No further absences permitted.',
      'Right on the line — don’t miss the next one.',
      'You’re exactly on the line. Next one is compulsory.',
      'Dead on the line. One more and the maths turns on you.');
  }
  const n=mustAttend(p,t);
  if(!isFinite(n)) return T(
    'Below the required 100%. Once a class is missed, the requirement cannot be met again.',
    'You need 100% — a missed class can’t be made up.',
    'At a 100% requirement, a missed class can’t be recovered. Worth double-checking that number.',
    'You set the bar at 100%. There is no recovering from this. Bold choice.');
  return T(
    'Below the required '+S.thr+'%. '+n+' consecutive class'+(n===1?'':'es')+' required to recover.',
    'Below '+S.thr+'% — attend the next '+n+' to get back.',
    'Below '+S.thr+'%. Attend the next '+n+' in a row and you’re clear.',
    'Below '+S.thr+'%. '+n+' straight classes to dig out. No pressure.');
}

/* what happens to this subject's % if today's class is skipped */
function skipImpact(subId){
  const A=attFor(subId);
  const now=pctOf(A.p,A.t), after=pctOf(A.p,A.t+1);
  return {now,after,safe:after>=S.thr,has:A.t>0};
}

/* ── "what if I skip the whole day?" ──────────────────────────────
   Costs out skipping every class still unmarked today: what each
   subject drops to, what it would take to climb back, and whether
   it's worth it.                                                   */
function skipDayLabel(iso){
  const n=Math.round((dateOf(iso)-dateOf(todayISO()))/864e5);
  return n===0 ? 'today' : n===1 ? 'tomorrow'
    : dateOf(iso).toLocaleDateString(undefined,{weekday:'long'});
}
function skipDayImpact(iso){
  const dow=dowOf(dateOf(iso));
  const pending=slotsOn(dow,iso).filter(sl=>subById(sl.subId)&&!S.marks[markKey(iso,sl)]);
  if(!pending.length) return null;

  const bySub={};
  pending.forEach(sl=>{ (bySub[sl.subId]=bySub[sl.subId]||[]).push(sl); });

  const rows=Object.keys(bySub).map(id=>{
    const A=attFor(id), n=bySub[id].length;
    const now=pctOf(A.p,A.t), after=pctOf(A.p,A.t+n);
    const wasSafe = A.t ? now>=S.thr : true;
    const safe    = after>=S.thr;
    return {sub:subById(id), n, now, after, safe, wasSafe, had:A.t,
            recover: (A.t && !safe) ? mustAttend(A.p, A.t+n) : 0};
  }).sort((a,b)=>a.after-b.after);

  let GP=0,GT=0; S.subs.forEach(s=>{ const a=attFor(s.id); GP+=a.p; GT+=a.t; });
  const n=pending.length;
  /* the ones this skip actually pushes under the line */
  const breaks  = rows.filter(r=>r.had && r.wasSafe && !r.safe);
  /* already under before you skip — skipping just digs deeper */
  const already = rows.filter(r=>r.had && !r.wasSafe);

  const verdict = breaks.length ? 'no'
                : already.length ? 'no'
                : rows.some(r=>r.had && r.after < S.thr+2) ? 'tight'
                : 'ok';
  return {rows, pending, count:n, breaks, already, verdict, iso,
          when:skipDayLabel(iso),
          now:pctOf(GP,GT), after:pctOf(GP,GT+n), hasHistory:GT>0};
}
const skipTodayImpact=()=>skipDayImpact(todayISO());
/* Today if there's anything left to skip, otherwise the next day that has
   classes — so the feature is reachable on a Sunday too, not hidden. */
/* ── tomorrow, and when to set the alarm ──────────────────────────
   Travel time is a setting rather than a live Maps lookup: the app has
   no network by design, and your college doesn't move. Online-only days
   skip the commute entirely, so you get a later wake-up.            */
const m2t = m => { m=((Math.round(m)%1440)+1440)%1440;
  return fmtT(pad2(Math.floor(m/60))+':'+pad2(m%60)); };
function dayPlan(iso){
  const d=dateOf(iso), dow=dowOf(d);
  const list=slotsOn(dow,iso).filter(sl=>subById(sl.subId));
  if(!list.length) return {iso,d,list:[],none:true};
  const first=list[0];                       /* slotsOn sorts by start time */
  const allOnline=list.every(sl=>sl.online);
  const travel = first.online ? 0 : (S.travel||0);
  const leaveAt = t2m(first.start)-travel;
  const wakeAt  = leaveAt-(S.ready||0);
  return {iso, d, list, first, allOnline, travel,
          configured:(S.ready||0)>0||(S.travel||0)>0,
          leaveAt, wakeAt, dayBefore: wakeAt<0};
}
const tomorrowPlan = () => dayPlan(isoOf(addDays(new Date(),1)));

function nextSkipDay(){
  for(let i=0;i<8;i++){
    const x=skipDayImpact(isoOf(addDays(new Date(),i)));
    if(x) return x;
  }
  return null;
}

function keepScroll(fn){
  const y=(typeof window!=='undefined'&&window.scrollY)||0;
  fn();

  if(h>=23||h<4) return T('Late session.','It’s late.','Late one. Sleep is also a strategy.',

/* ══════════════ TIMETABLE (one day at a time) ══════════════ */
let ttDate=new Date();
let lastSwipe=0;                 /* set by the swipe handler, read by the day chips */

/* Scroll the rail so the selected chip sits in the middle. Guarded because
   layout numbers are 0/undefined until the element is actually on screen. */
function centreRail(rail,retry){
  if(!rail) return;
  const sel=rail.querySelector? rail.querySelector('.dChip.on') : null;
  if(!sel) return;
  const w=rail.clientWidth||0, l=sel.offsetLeft||0, cw=sel.offsetWidth||0;
  if(!w||!cw){
    /* the tab was still hidden when this ran, so there is no layout yet —
       try once more next frame, otherwise the rail sits stuck at day one */
    if(!retry && typeof requestAnimationFrame==='function')
      requestAnimationFrame(()=>centreRail(rail,true));
    return;
  }
  rail.scrollLeft=Math.max(0, l - w/2 + cw/2);
}
/* which chip is sitting under the centre marker right now */
function chipAtCentre(rail){
  if(!rail||!rail.querySelectorAll) return null;
  const w=rail.clientWidth||0; if(!w) return null;
  const mid=(rail.scrollLeft||0)+w/2;
  let best=null, bestD=Infinity;
  rail.querySelectorAll('.dChip').forEach(c=>{
    const centre=(c.offsetLeft||0)+(c.offsetWidth||0)/2;
    const d=Math.abs(centre-mid);
    if(d<bestD){ bestD=d; best=c; }
  });
  return best;
}
/* Scrolling the rail selects whatever lands in the middle — the clock-picker
   behaviour. Debounced so it fires when the flick settles, not per frame. */
(function(){
  const rail=document.getElementById('dayStrip'); if(!rail) return;
  let t=null;
  rail.addEventListener('scroll',()=>{
    clearTimeout(t);
    t=setTimeout(()=>{
      const c=chipAtCentre(rail);
      if(!c||!c.dataset||!c.dataset.d) return;
      if(c.dataset.d===isoOf(ttDate)) return;   /* already showing this day */
      ttDate=dateOf(c.dataset.d);
      markRailSelection();
      renderDay();                              /* rail keeps its scroll position */
    },110);
  },{passive:true});
})();
/* ── the date rail ────────────────────────────────────────────────
   Built once and then left alone. Rebuilding it on every day change
   would reset scrollLeft mid-flick and fight your finger, so scrolling
   only ever repaints the day *below* it. */
let railFrom=null, railTo=null;
function renderRail(force){
  const rail=$('#dayStrip'); if(!rail) return;
  const iso=isoOf(ttDate), tISO=todayISO(), today0=new Date();
  let from=addDays(today0,-140), to=addDays(today0,70);
  if(dateOf(iso) < dateOf(isoOf(from))) from=addDays(ttDate,-21);
  if(dateOf(iso) > dateOf(isoOf(to)))   to  =addDays(ttDate, 21);
  const needsBuild = force || railFrom!==isoOf(from) || railTo!==isoOf(to) ||
    !(rail.querySelectorAll&&rail.querySelectorAll('.dChip').length);
  if(needsBuild){
    let strip='', prevMonth=null;
    for(let d=new Date(from); isoOf(d)<=isoOf(to); d=addDays(d,1)){
      const di=isoOf(d), dw=dowOf(d);
      const n=slotsOn(dw,di).filter(s=>subById(s.subId)).length;
      const mLabel = d.getMonth()!==prevMonth ? d.toLocaleDateString(undefined,{month:'short'}) : '';
      prevMonth=d.getMonth();
      strip+='<button class="dChip'+(di===tISO?' today':'')+(dw>=5?' wknd':'')+
        '" data-d="'+di+'">'+
        '<div class="dM">'+mLabel+'</div>'+
        '<div class="dW">'+DAYS[dw]+'</div><div class="dN">'+d.getDate()+'</div>'+
        '<div class="dD"'+(n?'':' style="background:transparent"')+'></div></button>';
    }
    rail.innerHTML=strip;
    railFrom=isoOf(from); railTo=isoOf(to);
    $$('#dayStrip .dChip').forEach(b=>b.onclick=()=>{
      if(Date.now()-lastSwipe<400) return;    /* this click came from a swipe, not a tap */
      goToDay(b.dataset.d,true);
    });
  }
  markRailSelection();
}
/* paint the selected chip without touching scroll position */
function markRailSelection(){
  const iso=isoOf(ttDate);
  $$('#dayStrip .dChip').forEach(b=>b.classList.toggle('on', b.dataset.d===iso));
}
/* move to a day: repaint the day content, and glide the rail to centre it */
function goToDay(iso,scroll){
  ttDate=dateOf(iso);
  renderRail();
  renderDay();
  if(scroll!==false) centreRail($('#dayStrip'));
}

function renderTT(){ renderRail(); renderDay(); centreRail($('#dayStrip')); }

    h='<div class="empty"><div class="eE">'+(dow===6?'☀️':'📅')+'</div>'+

      '<div class="eS">'+T('Use + to add a class to this day.','Tap + above to add one.',

      '<div style="height:16px"></div><button class="btn ghost sm" id="ttAdd" style="max-width:220px;margin:0 auto">Add a class</button></div>';
  } else {
    const markable = diff<=0;
    list.forEach(sl=>{

      h+='<div class="cls '+scCls(sub)+(m?' done':'')+'">'+
        '<div class="cTop">'+
          '<div class="cTime">'+fmtT(sl.start)+'<br>'+fmtT(sl.end)+'</div>'+
          '<div class="cName">'+esc(sub.name)+
            kindTag(sl)+onlineTag(sl)+
            (sl.once?' <span class="tag">Once</span>':'')+
            '<div class="cMeta">'+esc(sub.code)+(placeOf(sl)?' · '+esc(placeOf(sl)):'')+
            ' · '+fmtDur(t2m(sl.end)-t2m(sl.start))+'</div></div>'+
          '<button class="cMore" data-slot="'+sl.id+'" data-iso="'+iso+'">⋯</button>'+
        '</div>'+
        (markable ? mkSegHTML(key)
          : '<div class="cSkip" style="color:var(--label3)">Marking opens on the day</div>')+
        '</div>';
    });
    if(markable && list.filter(sl=>!S.marks[markKey(iso,sl)]).length>1)
      h='<div style="display:flex;gap:9px;margin-bottom:12px">'+
        '<button class="btn ghost sm" id="ttAllP">All present</button>'+
        '<button class="btn ghost sm" id="ttAllA" style="color:var(--red)">All absent</button></div>'+h;
    h+='<button class="btn ghost sm" id="ttAdd" style="margin-top:4px">+ Add a class to '+DAYSL[dow]+'</button>';
  }
  const body=$('#ttBody');
  body.innerHTML=h;
  bindMkSeg(body);
  $$('#ttBody .cMore').forEach(b=>b.onclick=()=>slotActions(b.dataset.slot,b.dataset.iso));

  const markDay=v=>{ list.forEach(sl=>S.marks[markKey(iso,sl)]=v); save(); keepScroll(renderAll);
    toast(DAYSL[dow]+' marked '+(v==='p'?'present':'absent')+'.'); };
  const ap=$('#ttAllP'), aa=$('#ttAllA');

/* ══════════════ CATCH UP — mark classes you missed logging ══════════════ */
let catchBack=21;                      /* how many days back to scan */
function unmarkedPast(days){
  const out=[], now=new Date(), mins=nowMin();
  for(let i=0;i<=days;i++){
    const d=addDays(now,-i), iso=isoOf(d);
    const slots=slotsOn(dowOf(d),iso).filter(sl=>{
      if(!subById(sl.subId)) return false;
      if(i===0 && t2m(sl.end)>mins) return false;      /* today: only classes that have ended */
      return !S.marks[markKey(iso,sl)];
    });
    if(slots.length) out.push({iso,d,slots});
  }
  return out;
}
const unmarkedCount=days=>unmarkedPast(days).reduce((n,g)=>n+g.slots.length,0);

function catchUpHTML(){
  const groups=unmarkedPast(catchBack);
  if(!groups.length)
    return '<div class="empty"><div class="eE">✅</div>'+
      '<div class="eT">'+T('Nothing outstanding.','All caught up.','All caught up — nothing missing.',
        'All caught up. Suspiciously diligent.')+'</div>'+
      '<div class="eS">Every class in the last '+catchBack+' days is marked.</div></div>';
  const total=groups.reduce((n,g)=>n+g.slots.length,0);
  let h='<div class="sheetIntro">'+total+' class'+(total===1?'':'es')+' from the last '+catchBack+
    ' days you never marked, newest first. Mark them here and every percentage updates as you go.</div>';
  groups.forEach(g=>{
    const rel=Math.round((dateOf(g.iso)-dateOf(todayISO()))/864e5);
    const when = rel===0?'Today' : rel===-1?'Yesterday'
      : g.d.toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'short'});
    h+='<div class="gHead" style="padding-left:4px;padding-right:4px">'+when+' · '+g.slots.length+' unmarked</div>';
    if(g.slots.length>1)
      h+='<div style="display:flex;gap:9px;margin-bottom:10px">'+
        '<button class="btn ghost sm" data-cuall="p" data-iso="'+g.iso+'">All present</button>'+
        '<button class="btn ghost sm" data-cuall="a" data-iso="'+g.iso+'" style="color:var(--red)">All absent</button></div>';
    g.slots.forEach(sl=>{
      const sub=subById(sl.subId);
      h+='<div class="cls '+scCls(sub)+'">'+
        '<div class="cTop"><div class="cTime">'+fmtT(sl.start)+'<br>'+fmtT(sl.end)+'</div>'+
        '<div class="cName">'+esc(sub.name)+kindTag(sl)+onlineTag(sl)+
        '<div class="cMeta">'+esc(sub.code)+(placeOf(sl)?' · '+esc(placeOf(sl)):'')+'</div></div></div>'+
        mkSegHTML(markKey(g.iso,sl))+'</div>';
    });

  h+='<div style="height:8px"></div>'+
     '<button class="btn ghost sm" id="cuMore">Look back further (+3 weeks)</button>'+

function bindCatchUp(){
  const refresh=()=>{ $('#sheetBody').innerHTML=catchUpHTML(); bindCatchUp(); };

  $$('#sheetBody .mkSeg').forEach(seg=>{

/* ── swipe between days ──────────────────────────────────────────
   Attached to the whole Classes screen, so dragging the date strip
   works as well as dragging the list under it. The card follows your
   finger while you drag, so it's obvious the gesture is live.      */
(function(){
  const sec=document.getElementById('timetable');
  const body=()=>document.getElementById('ttBody');
  let x0=null, y0=null, drag=false;

  const settle=()=>{ const b=body(); if(b){ b.style.transition=''; b.style.transform=''; } };
  const reset=()=>{ x0=null; drag=false; settle(); };

  sec.addEventListener('touchstart',e=>{
    if(e.touches.length!==1){ reset(); return; }
    /* the date rail scrolls itself — don't also step the day underneath it */
    if(e.target&&e.target.closest&&e.target.closest('#dayStrip')){ reset(); return; }
    x0=e.touches[0].clientX; y0=e.touches[0].clientY; drag=false;
  },{passive:true});

  sec.addEventListener('touchmove',e=>{
    if(x0===null||e.touches.length!==1) return;
    const dx=e.touches[0].clientX-x0, dy=e.touches[0].clientY-y0;
    /* commit to a horizontal drag once it clearly beats vertical movement */
    if(!drag && Math.abs(dx)>10 && Math.abs(dx)>Math.abs(dy)) drag=true;
    if(drag){
      const b=body();
      if(b){ b.style.transition='none'; b.style.transform='translateX('+(dx*0.4).toFixed(1)+'px)'; }
    }
  },{passive:true});

  sec.addEventListener('touchend',e=>{
    if(x0===null) return;
    const dx=e.changedTouches[0].clientX-x0, dy=e.changedTouches[0].clientY-y0;
    const wasDrag=drag;
    reset();
    if(!wasDrag) return;
    /* only needs to beat vertical drift, not dominate it — a real thumb
       swipe on a phone always drifts a bit */
    if(Math.abs(dx)<38||Math.abs(dx)<Math.abs(dy)) return;
    lastSwipe=Date.now();                 /* suppress the click a swipe can emit */
    ttDate=addDays(ttDate, dx<0?1:-1);
    renderTT();
    const b=body();
    if(b){ b.classList.remove('slideL','slideR'); void b.offsetWidth;
           b.classList.add(dx<0?'slideL':'slideR'); }
  },{passive:true});

  sec.addEventListener('touchcancel',reset,{passive:true});
})();

/* ── class actions ── */
function slotActions(slotId,iso){
  const sl=S.slots.find(x=>x.id===slotId); if(!sl) return;
  const sub=subById(sl.subId);
  openAct({
    title:(sub?sub.name:'Class')+' · '+fmtT(sl.start),
    msg: sl.once ? 'A one-off class on '+iso : 'Repeats every '+DAYSL[sl.day],
    actions:[
      {label:'Edit this class', fn:()=>sheetClass(sl)},
      {label:'Delete', destructive:true, fn:()=>{
        openAct({title:'Delete this class?',
          msg: sl.once?'It only exists on this date.':'It will be removed from every week.',
          actions:[{label:'Delete class',destructive:true,fn:()=>{
            S.slots=S.slots.filter(x=>x.id!==slotId);
            Object.keys(S.marks).forEach(k=>{ if(k.split('|')[1]===slotId) delete S.marks[k]; });
            save(); renderAll(); toast('Class deleted.');
          }}]});
      }}
    ]
  });
}

      sync(); syncMode();

      if(del) del.onclick=()=>{ closeSheet(); setTimeout(()=>slotActions(slot.id,todayISO()),200); };

      if(d) d.onclick=()=>openAct({
        title:'Delete '+sub.name+'?', msg:'Its classes, deadlines and attendance go too.',
        actions:[{label:'Delete subject',destructive:true,fn:()=>{

          S.slots=S.slots.filter(s=>s.subId!==sub.id);
          S.dls=S.dls.filter(d=>d.subId!==sub.id);
          delete S.att[sub.id];
          Object.keys(S.marks).forEach(k=>{ if(k.split('|')[2]===sub.id) delete S.marks[k]; });
          save(); closeSheet(); renderAll(); toast('Subject deleted.');
        }}]});
    }

}

/* ══════════════ MONTH DETAIL ══════════════
   Everything that was marked in one month, grouped by day. Marks stay
   editable here so a mistake spotted in the breakdown can be fixed
   without hunting for the day in the timetable.                       */
function monthEntries(mo){
  const byDay={};
  for(const k in S.marks){
    if(k.slice(0,7)!==mo) continue;
    const p=k.split('|');
    const sub=subById(p[2]); if(!sub) continue;      /* subject since deleted */
    (byDay[p[0]]=byDay[p[0]]||[]).push({
      key:k, iso:p[0], kind:p[3]||'th', sub,
      mark:S.marks[k],
      slot:S.slots.find(s=>s.id===p[1])||null
    });
  }
  Object.keys(byDay).forEach(d=>byDay[d].sort((a,b)=>{
    const at=a.slot?t2m(a.slot.start):0, bt=b.slot?t2m(b.slot.start):0;
    return at-bt;
  }));
  return byDay;
}
function monthHTML(mo){
  const byDay=monthEntries(mo);
  const days=Object.keys(byDay).sort().reverse();      /* newest day first */
  const title=new Date(mo+'-01T00:00:00').toLocaleDateString(undefined,{month:'long',year:'numeric'});
  if(!days.length) return '<div class="empty"><div class="eE">📭</div>'+
    '<div class="eT">Nothing marked in '+esc(title)+'</div></div>';

  /* month totals — cancelled classes count towards neither side */
  let P=0,A=0,C=0; const perSub={};
  days.forEach(d=>byDay[d].forEach(e=>{
    if(e.mark==='p') P++; else if(e.mark==='a') A++; else C++;
    const s=perSub[e.sub.id]=perSub[e.sub.id]||{sub:e.sub,p:0,a:0};
    if(e.mark==='p') s.p++; else if(e.mark==='a') s.a++;
  }));
  const held=P+A, pct=pctOf(P,held);

  let h='<div class="pad" style="padding:0"><div class="card" style="margin-bottom:14px">'+
    '<div style="display:flex;align-items:baseline;gap:10px">'+
      '<div style="font-size:30px;font-weight:800;letter-spacing:-.03em;'+
        'color:'+(held? (pct>=S.thr?'var(--green)':'var(--red)') :'var(--label3)')+'" class="tnum">'+
        (held?pctFmt(pct)+'%':'—')+'</div>'+
      '<div style="font-size:13.5px;color:var(--label2)">'+P+' present · '+A+' absent'+
        (C?' · '+C+' cancelled':'')+'</div></div>'+
    '<div style="display:flex;gap:7px;flex-wrap:wrap;margin-top:12px">'+
      Object.keys(perSub).map(id=>{
        const s=perSub[id], t=s.p+s.a, q=pctOf(s.p,t);
        return '<span class="pill '+(!t?'':q>=S.thr?'ok':'no')+'">'+esc(s.sub.code)+' '+s.p+'/'+t+'</span>';
      }).join('')+
    '</div></div>';

  days.forEach(iso=>{
    const d=dateOf(iso);
    h+='<div class="gHead" style="padding-left:4px;padding-right:4px">'+
      d.toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'short'})+'</div>';
    byDay[iso].forEach(e=>{
      const sl=e.slot||{kind:e.kind,start:'',end:'',room:''};
      h+='<div class="cls '+scCls(e.sub)+'">'+
        '<div class="cTop">'+
          '<div class="cTime">'+(e.slot?fmtT(e.slot.start)+'<br>'+fmtT(e.slot.end):'—')+'</div>'+
          '<div class="cName">'+esc(e.sub.name)+kindTag(sl)+onlineTag(sl)+
            '<div class="cMeta">'+esc(e.sub.code)+
            (e.slot&&placeOf(e.slot)?' · '+esc(placeOf(e.slot)):'')+
            (e.slot?'':' · class since removed')+'</div></div>'+
        '</div>'+mkSegHTML(e.key)+'</div>';
    });
  });
  return h+'</div>';
}

/* ══════════════ ATTENDANCE APPEAL ══════════════
   End-of-semester: find every class you were marked absent for, work out
   how many need reversing to clear the threshold, and draft the message
   to the professor. Reversing an absence moves it to present — the total
   held is unchanged — so the maths is ceil(thr*total) - present.        */
function absencesFor(subId){
  const out=[];
  for(const k in S.marks){
    if(S.marks[k]!=='a') continue;
    const p=k.split('|');
    if(p[2]!==subId) continue;
    out.push({key:k, iso:p[0], kind:p[3]||'th',
              slot:S.slots.find(s=>s.id===p[1])||null});
  }
  return out.sort((a,b)=>a.iso.localeCompare(b.iso));
}
/* how many reversals it takes to reach the required percentage */
function reversalsNeeded(p,t){
  if(!t) return 0;
  if(pctOf(p,t)>=S.thr) return 0;
  return Math.max(0, Math.ceil(S.thr/100*t - p - 1e-9));
}
let appealSel={};                 /* key -> true, which absences are ticked */
function appealHTML(sub){
  const A=attFor(sub.id), abs=absencesFor(sub.id);
  const need=reversalsNeeded(A.p,A.t);
  const picked=abs.filter(a=>appealSel[a.key]);
  const after=pctOf(A.p+picked.length, A.t);

  let h='<div class="card" style="margin-bottom:14px">'+
    '<div style="font-size:17px;font-weight:700;letter-spacing:-.02em">'+esc(sub.name)+'</div>'+
    '<div style="display:flex;align-items:baseline;gap:9px;margin-top:8px">'+
      '<span class="tnum" style="font-size:26px;font-weight:800;color:'+
        (pctOf(A.p,A.t)>=S.thr?'var(--green)':'var(--red)')+'">'+pctFmt(pctOf(A.p,A.t))+'%</span>'+
      (picked.length? '<span style="font-size:18px;color:var(--label3)">→</span>'+
        '<span class="tnum" style="font-size:26px;font-weight:800;color:'+
        (after>=S.thr?'var(--green)':'var(--red)')+'">'+pctFmt(after)+'%</span>' : '')+
      '<span style="font-size:13px;color:var(--label2);margin-left:auto">'+A.p+'/'+A.t+'</span>'+
    '</div>'+
    '<div style="font-size:13.5px;color:var(--label2);margin-top:10px;line-height:1.45">'+
      (!abs.length ? 'No absences recorded for this subject — nothing to appeal.'
       : !need ? 'Already above '+S.thr+'%. Nothing needs reversing.'
       : 'You need <b style="color:var(--label)">'+need+'</b> of these '+abs.length+
         ' absence'+(abs.length===1?'':'s')+' reversed to reach '+S.thr+'%.'+
         (picked.length? ' You’ve picked <b style="color:var(--label)">'+picked.length+'</b>.' : ''))+
    '</div></div>';

  if(!abs.length) return h;

  h+='<div class="gHead" style="padding-left:4px">Pick the classes to appeal</div>'+
     '<div style="display:flex;gap:9px;margin-bottom:10px">'+
       '<button class="btn ghost sm" id="apAll">Select all</button>'+
       '<button class="btn ghost sm" id="apNone">Clear</button></div>'+
     '<div class="list">';
  abs.forEach(a=>{
    const on=!!appealSel[a.key], sl=a.slot||{kind:a.kind};
    h+='<button class="row tap" data-ap="'+esc(a.key)+'">'+
      '<span class="dlChk'+(on?' on':'')+'">✓</span>'+
      '<div class="rMain"><div class="rT">'+
        dateOf(a.iso).toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'})+
        kindTag(sl)+onlineTag(sl)+'</div>'+
      '<div class="rS">'+(a.slot? fmtT(a.slot.start)+'–'+fmtT(a.slot.end)+
        (placeOf(a.slot)?' · '+esc(placeOf(a.slot)):'') : 'class since removed')+'</div></div>'+
      '</button>';
  });
  h+='</div>';

  h+='<div class="gHead">Why were you away?</div><div class="list">'+
     '<label class="row"><input type="text" id="apReason" placeholder="medical leave, family emergency…" '+
       'value="'+esc(appealSel.__reason||'')+'" style="text-align:left"></label></div>'+
     '<div style="height:14px"></div>'+
     '<button class="btn sm" id="apMake">Write the message ('+picked.length+')</button>'+
     '<div class="gNote" style="text-align:center">Nothing is sent from the app — you get text to copy.</div>';
  return h;
}
function appealMessage(sub,picked,reason){
  const A=attFor(sub.id);
  const lines=picked.map(a=>{
    const d=dateOf(a.iso).toLocaleDateString(undefined,
      {weekday:'long',day:'numeric',month:'long',year:'numeric'});
    const when=a.slot? ' ('+fmtT(a.slot.start)+'–'+fmtT(a.slot.end)+')' : '';
    const kind=KIND_NAME[a.slot?kindOf(a.slot):a.kind];
    return '  • '+d+when+' — '+kind;
  }).join('\n');
  return 'Subject: Attendance rectification request — '+sub.name+' ('+sub.code+')\n\n'+
    'Respected Sir/Ma’am,\n\n'+
    'I hope you are well. I am writing to request a review of my attendance record for '+
    sub.name+'.\n\nI was marked absent for the following '+
    (picked.length===1?'class':picked.length+' classes')+':\n\n'+lines+'\n\n'+
    (reason? 'Reason: '+reason+'\n\n' : '')+
    'My attendance in this subject currently stands at '+pctFmt(pctOf(A.p,A.t))+'% ('+
    A.p+' of '+A.t+' classes). If you find the above in order, I would be grateful '+
    'if these could be marked as present.\n\n'+
    'I am happy to provide any supporting documents you may need. '+
    'Thank you for your time and consideration.\n\n'+
    'Respectfully,\n'+(S.name||'[your name]');
}
function sheetAppealMessage(sub,picked,reason){
  const msg=appealMessage(sub,picked,reason);
  openSheet({
    title:'Message', cancelLabel:'Done',
    body:'<div class="sheetIntro">Copy this and send it however you normally reach your professor.</div>'+
      '<div class="card" style="white-space:pre-wrap;font-size:14px;line-height:1.55;'+
        'font-family:var(--font);color:var(--label)">'+esc(msg)+'</div>'+
      '<div style="height:14px"></div>'+
      '<button class="btn sm" id="apCopy">Copy message</button>'+
      (S.name?'':'<div class="gNote" style="text-align:center">Add your name in Settings and it signs off properly.</div>'),
    after(){
      $('#apCopy').onclick=()=>{
        let done=false;
        try{
          if(navigator.clipboard&&navigator.clipboard.writeText){
            navigator.clipboard.writeText(msg); done=true;
          }
        }catch(e){}
        toast(done?'Copied.':'Select the text above to copy.');
      };
    }
  });
}
function sheetAppeal(sub){
  appealSel={};
  const bind=()=>{
    const refresh=()=>{
      appealSel.__reason=($('#apReason')&&$('#apReason').value)||appealSel.__reason||'';
      $('#sheetBody').innerHTML=appealHTML(sub); bind();
    };
    $$('#sheetBody [data-ap]').forEach(b=>b.onclick=()=>{
      const k=b.dataset.ap;
      if(appealSel[k]) delete appealSel[k]; else appealSel[k]=true;
      refresh();
    });
    const all=$('#apAll'), none=$('#apNone');
    if(all)  all.onclick =()=>{ absencesFor(sub.id).forEach(a=>appealSel[a.key]=true); refresh(); };
    if(none) none.onclick=()=>{ const r=appealSel.__reason; appealSel={__reason:r}; refresh(); };
    const mk=$('#apMake');
    if(mk) mk.onclick=()=>{
      const picked=absencesFor(sub.id).filter(a=>appealSel[a.key]);
      if(!picked.length){ toast('Pick at least one class first.'); return; }
      const reason=($('#apReason')&&$('#apReason').value.trim())||'';
      sheetAppealMessage(sub,picked,reason);
    };
  };
  openSheet({title:'Appeal · '+sub.code, body:appealHTML(sub), cancelLabel:'Close', after:bind});
}
function sheetAppealPick(){
  const withAbs=S.subs.map(s=>({sub:s,n:absencesFor(s.id).length,A:attFor(s.id)}))
                      .filter(x=>x.n>0)
                      .sort((a,b)=>pctOf(a.A.p,a.A.t)-pctOf(b.A.p,b.A.t));
  if(!withAbs.length){
    openSheet({title:'Attendance appeal', cancelLabel:'Done',
      body:'<div class="empty"><div class="eE">🎉</div><div class="eT">No absences on record</div>'+
        '<div class="eS">Nothing to appeal — every class you’ve marked is a present.</div></div>'});
    return;
  }
  let h='<div class="sheetIntro">Pick a subject to see every class you were marked absent for, '+
    'choose which ones to appeal, and get a message to send.</div><div class="list">';
  withAbs.forEach(x=>{
    const pct=pctOf(x.A.p,x.A.t), need=reversalsNeeded(x.A.p,x.A.t);
    h+='<button class="row tap '+scCls(x.sub)+'" data-apsub="'+x.sub.id+'">'+
      '<span class="ico" style="background:var(--sc);font-size:11px;font-weight:700">'+
        esc(x.sub.code.slice(0,3))+'</span>'+
      '<div class="rMain"><div class="rT">'+esc(x.sub.name)+'</div>'+
      '<div class="rS">'+x.n+' absence'+(x.n===1?'':'s')+
        (need? ' · '+need+' to reverse for '+S.thr+'%' : ' · already above '+S.thr+'%')+'</div></div>'+
      '<span class="pill '+(pct>=S.thr?'ok':'no')+'">'+pctFmt(pct)+'%</span>'+
      '<span class="chev">›</span></button>';
  });
  openSheet({title:'Attendance appeal', body:h+'</div>', cancelLabel:'Done',
    after(){ $$('#sheetBody [data-apsub]').forEach(b=>b.onclick=()=>sheetAppeal(subById(b.dataset.apsub))); }});
}

function sheetMonth(mo){
  const title=new Date(mo+'-01T00:00:00').toLocaleDateString(undefined,{month:'long',year:'numeric'});
  const bind=()=>{
    const refresh=()=>{ $('#sheetBody').innerHTML=monthHTML(mo); bind(); };
    $$('#sheetBody .mkSeg').forEach(seg=>{
      seg.querySelectorAll('button').forEach(b=>b.onclick=e=>{
        e.stopPropagation();
        setMark(seg.dataset.key, S.marks[seg.dataset.key]===b.dataset.m ? null : b.dataset.m);
        refresh();
      });
    });
  };
  openSheet({title, body:monthHTML(mo), cancelLabel:'Done', after:bind});
}

            tup=g('#bTup'), tut=g('#bTut'),
            prp=g('#bPrp'), prt=g('#bPrt');
      if(tht<thp||tut<tup||prt<prp) return sheetError('Total held can’t be smaller than attended.'), false;

}

/* ══════════════ DEADLINES ══════════════ */
const DL_BASE=['assignment','internal','exam','other'];
const dlTypes=()=>[...new Set([...DL_BASE,...S.cats,...S.dls.map(d=>d.type).filter(Boolean)])];
let dueFilter='open';

function whenHTML(d){
  if(d.done){
    const tag=leadTag(leadHours(d));
    return '<span class="when calm">'+(tag?esc(tag.t):'Done')+'</span>';
  }
  const n=daysTo(d.date);
  if(n<0)  return '<span class="when late">'+Math.abs(n)+'d late</span>';
  if(n===0)return '<span class="when late">Today</span>';
  if(n===1)return '<span class="when near">Tomorrow</span>';
  if(n<=6) return '<span class="when near">'+n+' days</span>';
  return '<span class="when calm">'+dateOf(d.date).toLocaleDateString(undefined,{day:'numeric',month:'short'})+'</span>';
}
function dueRowHTML(d){
  const sub=subById(d.subId);
  return '<div class="row dlRow'+(d.done?' done':'')+'" data-dl="'+d.id+'">'+
    '<button class="dlChk'+(d.done?' on':'')+'" data-tick="'+d.id+'">✓</button>'+
    '<button class="rMain tap" data-open="'+d.id+'" style="background:none;text-align:left;padding:0">'+
      '<div class="rT">'+esc(d.title)+'</div>'+
      '<div class="rS">'+(sub?'<span class="subChip '+scCls(sub)+'">'+esc(sub.code)+'</span> ':'')+
        esc(d.type||'other')+'</div></button>'+
    whenHTML(d)+'</div>';
}
function bindDueRows(root){
  (root||document).querySelectorAll('[data-tick]').forEach(b=>b.onclick=e=>{
    e.stopPropagation();
    const d=S.dls.find(x=>x.id===b.dataset.tick); if(!d) return;
    d.done=!d.done;
    if(d.done){ d.doneAt=Date.now(); const t=leadTag(leadHours(d));
      toast(t? T('Completed.','Done.',t.t+' — nice.',t.t+'.') : 'Done.');
    } else delete d.doneAt;
    save(); renderAll();
  });
  (root||document).querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{
    const d=S.dls.find(x=>x.id===b.dataset.open); if(d) sheetDeadline(d);
  });
}
function renderDue(){
  const f=[['open','To do'],['all','All'],['done','Done']];
  $('#dueFilter').innerHTML='<div class="seg">'+f.map(x=>
    '<button data-f="'+x[0]+'"'+(dueFilter===x[0]?' class="on"':'')+'>'+x[1]+'</button>').join('')+'</div>';
  $$('#dueFilter button').forEach(b=>b.onclick=()=>{ dueFilter=b.dataset.f; renderDue(); });

  let list=S.dls.slice();
  if(dueFilter==='open') list=list.filter(d=>!d.done);
  if(dueFilter==='done') list=list.filter(d=>d.done);
  list.sort((a,b)=>(a.done-b.done)||a.date.localeCompare(b.date));

  if(!list.length){
    $('#dueList').innerHTML='<div class="empty"><div class="eE">'+(dueFilter==='done'?'📦':'✅')+'</div>'+
      '<div class="eT">'+(dueFilter==='done'?'Nothing finished yet':
        T('No items','Nothing due','All clear','Nothing due. Suspicious.'))+'</div>'+
      '<div class="eS">'+(dueFilter==='done'?'Tick something off and it lands here.':
        'Tap + at the top to add an assignment, internal or exam.')+'</div>'+
      '<div style="height:16px"></div><button class="btn ghost sm" id="dueAdd" style="max-width:220px;margin:0 auto">Add a deadline</button></div>';
    $('#dueAdd').onclick=()=>sheetDeadline(null);
    renderProc(); return;
  }
  /* group */
  const groups=[['Overdue',d=>!d.done&&daysTo(d.date)<0],
                ['Today',  d=>!d.done&&daysTo(d.date)===0],
                ['This week',d=>!d.done&&daysTo(d.date)>0&&daysTo(d.date)<=7],
                ['Later',  d=>!d.done&&daysTo(d.date)>7],
                ['Done',   d=>d.done]];
  let h='';
  groups.forEach(([name,fn])=>{
    const g=list.filter(fn); if(!g.length) return;
    h+='<div class="gHead">'+name+' · '+g.length+'</div><div class="pad"><div class="list">'+
      g.map(dueRowHTML).join('')+'</div></div>';
  });
  $('#dueList').innerHTML=h;
  bindDueRows($('#dueList'));
  renderProc();
}

  const ed=!!dl;
  const cur=dl||{title:'',subId:'',type:'assignment',date:presetDate||todayISO(),note:''};
  const body=
    '<div class="list">'+
      '<label class="row"><div class="rMain"><div class="rT">What’s due</div></div>'+
        '<input type="text" id="dT" placeholder="Assignment 2" value="'+esc(cur.title)+'"></label>'+
      '<label class="row"><div class="rMain"><div class="rT">Date</div></div>'+
        '<input type="date" id="dD" value="'+cur.date+'"></label>'+
      '<label class="row"><div class="rMain"><div class="rT">Subject</div></div>'+
        '<select id="dS"><option value="">None</option>'+
        S.subs.map(s=>'<option value="'+s.id+'"'+(s.id===cur.subId?' selected':'')+'>'+esc(s.name)+'</option>').join('')+
        '</select></label>'+
      '<label class="row"><div class="rMain"><div class="rT">Kind</div></div>'+
        '<select id="dTy">'+dlTypes().map(t=>'<option value="'+esc(t)+'"'+(t===cur.type?' selected':'')+'>'+esc(t)+'</option>').join('')+
        '<option value="__new">+ New kind…</option></select></label>'+
      '<label class="row" id="rowNewTy" style="display:none"><div class="rMain"><div class="rT">Name it</div></div>'+
        '<input type="text" id="dTyNew" placeholder="notebook submission"></label>'+
    '</div>'+
    '<div class="gHead tight">Note</div>'+
    '<div class="list"><label class="row"><input type="text" id="dN" placeholder="Optional detail" '+
      'value="'+esc(cur.note||'')+'" style="text-align:left"></label></div>'+
    (ed?'<div style="height:18px"></div><button class="btn dangerBtn sm" id="dDel">Delete</button>':'');
  openSheet({
    title: ed?'Edit deadline':'New deadline', body, doneLabel:'Save',
    onSave(){
      const t=$('#dT').value.trim();
      if(!t) return sheetError('Give it a name.'), false;
      const date=$('#dD').value;
      if(!date) return sheetError('Pick a date.'), false;
      let type=$('#dTy').value;
      if(type==='__new'){
        type=$('#dTyNew').value.trim().toLowerCase();
        if(!type) return sheetError('Name the new kind, or pick an existing one.'), false;
        if(!DL_BASE.includes(type)&&!S.cats.includes(type)) S.cats.push(type);
      }
      const target=dl||{id:uid(),done:false};
      Object.assign(target,{title:t,subId:$('#dS').value,type,date,note:$('#dN').value.trim()});
      if(!dl) S.dls.push(target);
      save(); renderAll(); toast(ed?'Updated.':'Deadline added.');
    },
    after(){
      $('#dTy').onchange=()=>{
        const n=$('#dTy').value==='__new';
        $('#rowNewTy').style.display=n?'':'none';
        if(n) $('#dTyNew').focus();
      };
      const d=$('#dDel');
      if(d) d.onclick=()=>openAct({title:'Delete this?',msg:dl.title,
        actions:[{label:'Delete',destructive:true,fn:()=>{
          S.dls=S.dls.filter(x=>x.id!==dl.id); save(); closeSheet(); renderAll(); toast('Deleted.');
        }}]});
      if(!ed) setTimeout(()=>{ const i=$('#dT'); if(i) i.focus(); },260);
    }
  });
}

/* ── procrastination meter ── */
function leadHours(d){
  if(!d.done||!d.doneAt) return null;
  return (new Date(d.date+'T23:59:59').getTime()-d.doneAt)/3600000;
}
function leadTag(h){
  if(h===null||h===undefined) return null;
  if(h<0)  return {k:'late', t:'Missed it'};
  if(h<12) return {k:'wire', t:'Eleventh hour'};
  if(h<48) return {k:'close',t:'Cut it close'};
  return {k:'early',t:'Ahead of it'};
}
function procScore(){
  const done=S.dls.filter(d=>d.done&&d.doneAt);
  if(!done.length) return null;
  const recent=done.slice().sort((a,b)=>b.doneAt-a.doneAt).slice(0,10);
  const avg=recent.reduce((n,d)=>n+clamp(leadHours(d),-24,96),0)/recent.length;
  return {score:Math.round(clamp(100-(avg/72)*100,0,100)), avg, n:done.length};
}
function procLine(score){
  if(score<20) return T('Consistently ahead of deadlines.','You finish early.',
    'You finish things early. Genuinely impressive.','Suspiciously organised. Everything alright?');
  if(score<40) return T('Generally ahead of schedule.','Usually early.',
    'Mostly ahead of things. Keep it up.','Annoyingly on top of things.');
  if(score<60) return T('Completion times are close to due dates.','You finish around the deadline.',
    'You finish near the deadline. Very normal.','Respectably human. Neither hero nor cautionary tale.');
  if(score<80) return T('Completion typically occurs shortly before the deadline.','You cut it fine.',
    'You do cut it a bit fine.','Cutting it fine. Familiar.');
  return T('Completion typically occurs at or past the deadline.','You finish at the last minute.',
    'Last-minute is your default setting.','You are the reason this app is named what it is.');
}
function renderProc(){
  const p=procScore();
  if(!p){
    $('#procCard').innerHTML='<div class="gHead">Habit</div><div class="pad"><div class="card">'+
      '<div class="kicker">How early you finish</div>'+
      '<div style="font-size:14px;color:var(--label2);margin-top:9px;line-height:1.45">'+
      T('No completed items yet.','Nothing finished yet — tick something off and this fills in.',
        'Nothing finished yet. Tick something off and this starts tracking.',
        'Nothing finished yet, so nothing to hold against you. Yet.')+'</div></div></div>';
    return;
  }
  const streak=(()=>{ let n=0;
    for(const d of S.dls.filter(x=>x.done&&x.doneAt).sort((a,b)=>b.doneAt-a.doneAt)){
      if(leadHours(d)>=48) n++; else break; } return n; })();
  const avgTxt = p.avg>=24 ? (Math.round(p.avg/24*10)/10)+' days' : Math.round(Math.max(0,p.avg))+' hours';
  $('#procCard').innerHTML='<div class="gHead">Habit</div><div class="pad"><div class="card">'+
    '<div style="display:flex;align-items:baseline;justify-content:space-between">'+
      '<span class="kicker">How early you finish</span>'+
      '<span style="font-size:26px;font-weight:800;letter-spacing:-.03em" class="tnum">'+p.score+'</span></div>'+
    '<div class="pmTrack"><div class="pmPin" style="left:'+p.score+'%"></div></div>'+
    '<div class="pmEnds"><span>Early bird</span><span>Eleventh hour</span></div>'+
    '<div style="font-size:14px;color:var(--label2);margin-top:13px;line-height:1.45">'+esc(procLine(p.score))+'</div>'+
    '<div class="pmStats"><span><b>'+avgTxt+'</b>average lead time</span>'+
      '<span><b>'+streak+'</b>in a row done early</span>'+

/* ══════════════ CALENDAR ══════════════ */
let calY,calM,calSel=todayISO();
function renderCal(){
  if(calY===undefined){ const n=new Date(); calY=n.getFullYear(); calM=n.getMonth(); }
  const first=new Date(calY,calM,1), padd=(first.getDay()+6)%7, days=new Date(calY,calM+1,0).getDate();
  $('#calBar').innerHTML='<div id="calTitle">'+first.toLocaleDateString(undefined,{month:'long',year:'numeric'})+'</div>'+
    '<button class="calNav" id="calPrev">‹</button>'+
    '<button class="calNav" id="calToday" style="width:auto;padding:0 12px;font-size:15px;font-weight:600">Today</button>'+
    '<button class="calNav" id="calNext">›</button>';
  $('#calPrev').onclick=()=>{ calM--; if(calM<0){calM=11;calY--;} renderCal(); };
  $('#calNext').onclick=()=>{ calM++; if(calM>11){calM=0;calY++;} renderCal(); };
  $('#calToday').onclick=()=>{ const n=new Date(); calY=n.getFullYear(); calM=n.getMonth(); calSel=todayISO(); renderCal(); };

  let h=['M','T','W','T','F','S','S'].map(d=>'<div class="cDow">'+d+'</div>').join('');
  for(let i=0;i<padd;i++) h+='<div class="cD pad"></div>';
  for(let d=1;d<=days;d++){
    const iso=calY+'-'+pad2(calM+1)+'-'+pad2(d);
    const items=S.dls.filter(x=>x.date===iso&&!x.done);
    const dots=items.slice(0,3).map(x=>{
      const sub=subById(x.subId);
      return '<i class="'+(sub?scCls(sub):'')+'"></i>';
    }).join('');
    h+='<button class="cD'+(iso===todayISO()?' today':'')+(iso===calSel?' sel':'')+'" data-c="'+iso+'">'+
      d+'<span class="dots">'+dots+'</span></button>';
  }
  $('#calGrid').innerHTML=h;
  $$('#calGrid [data-c]').forEach(b=>b.onclick=()=>{ calSel=b.dataset.c; renderCal(); });

  /* selected day detail */
  const d=dateOf(calSel);
  const cls=slotsOn(dowOf(d),calSel).filter(s=>subById(s.subId));
  const dls=S.dls.filter(x=>x.date===calSel);
  let dh='<div class="gHead">'+d.toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long'})+'</div><div class="pad">';
  if(!cls.length&&!dls.length){
    dh+='<div class="list"><div class="row"><div class="rMain"><div class="rT" style="color:var(--label2);font-size:15px">Nothing on this day</div></div></div></div>';
  }
  if(dls.length) dh+='<div class="list">'+dls.map(dueRowHTML).join('')+'</div>';
  if(cls.length){
    dh+='<div style="height:8px"></div><div class="list">'+cls.map(sl=>{
      const sub=subById(sl.subId);
      return '<div class="row '+scCls(sub)+'"><span class="ico" style="background:var(--sc)"></span>'+
        '<div class="rMain"><div class="rT">'+esc(sub.name)+kindTag(sl)+onlineTag(sl)+'</div>'+
        '<div class="rS">'+fmtT(sl.start)+'–'+fmtT(sl.end)+(placeOf(sl)?' · '+esc(placeOf(sl)):'')+'</div></div></div>';
    }).join('')+'</div>';
  }
  dh+='<div style="height:12px"></div><button class="btn ghost sm" id="calAdd">+ Add something on this day</button></div>';
  $('#calDay').innerHTML=dh;
  bindDueRows($('#calDay'));
  $('#calAdd').onclick=()=>sheetDeadline(null,calSel);
}

    '<label class="row"><div class="rMain"><div class="rT">Getting ready</div>'+
      '<div class="rS">Shower, breakfast, packing — door to door</div></div>'+

      'style="width:60px;text-align:center;background:var(--fill);border-radius:8px;padding:7px 0;flex:none">'+

    '<button class="row tap" id="tourBtn"><div class="rMain"><div class="rT">Show the tour again</div></div>'+

  $('#setTravel').onchange=e=>{ S.travel=clamp(parseInt(e.target.value)||0,0,300); e.target.value=S.travel; save(); };
  $('#setName').onchange  =e=>{ S.name=String(e.target.value||'').trim().slice(0,80); save(); };
