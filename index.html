  $('#expBtn').onclick=doExport;
  $('#impBtn').onclick=()=>$('#impFile').click();
  $('#demoBtn').onclick=()=>{
    openAct({title:'Load example data?', msg:S.subs.length?'This replaces everything currently in the app.':'A filled-in semester so you can see how it works.',
      actions:[{label:'Load example data', destructive:S.subs.length>0, fn:()=>{ loadDemo(); toast('Example data loaded.'); }}]});
  };
  $('#tourBtn').onclick=()=>showIntro(true);
  $('#wipeBtn').onclick=()=>openAct({title:'Erase everything?', msg:'Subjects, timetable, attendance and deadlines. This cannot be undone.',
    actions:[{label:'Erase everything', destructive:true, fn:()=>{
      const keepTheme=S.theme, keepTone=S.tone;
      S=blankState({theme:keepTheme,tone:keepTone});
      save(); renderAll(); showTab('home'); toast('Erased.');
    }}]});
}
function doExport(){
  try{
    const blob=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='1159-backup-'+todayISO()+'.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),3000);
    toast('Backup saved.');
  }catch(e){ toast('Couldn’t export here.'); }
}
$('#impFile').onchange=e=>{
  const f=e.target.files&&e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=JSON.parse(r.result);
      if(!d||typeof d!=='object'||!Array.isArray(d.subs)) throw 0;
      S=normalise(Object.assign(blankState(S),d));
      save(); renderAll(); showTab('home'); toast('Backup restored.');
    }catch(err){ toast('That file didn’t look right.'); }
  };
  r.readAsText(f);
  e.target.value='';
};

  const off=n=>isoOf(addDays(new Date(),n));
  const subs=[
    {id:'d-ca',name:'Cost Accounting',code:'CA',ci:0},
    {id:'d-ie',name:'Indian Economy',code:'IE',ci:1},
    {id:'d-ib',name:'International Business',code:'IB',ci:2},

  ];

    {id:'sl8',subId:'d-ib',day:4,kind:'tu',start:'12:10',end:'12:50',room:'C-2'},
    {id:'sl9',subId:'d-bs',day:3,kind:'pr',start:'14:00',end:'16:00',room:'Lab 2'},
    {id:'sl10',subId:'d-ib',day:2,kind:'pr',start:'14:00',end:'15:30',room:'',online:true}
  ];
  const marks={};
  const now=new Date();
  const months=[[now.getFullYear(),now.getMonth()-2],[now.getFullYear(),now.getMonth()-1],[now.getFullYear(),now.getMonth()]]
    .map(([y,m])=>{ const d=new Date(y,m,1); return [d.getFullYear(),d.getMonth()+1]; });
  function spread(subId,kind,p,a){
    const per=n=>{const b=Math.floor(n/3),r=n%3,o=[b,b,b];for(let i=0;i<r;i++)o[2-i]++;return o;};
    const ps=per(p), as=per(a);
    months.forEach(([y,m],mi)=>{
      let day=2;
      for(let i=0;i<ps[mi];i++){ marks[y+'-'+pad2(m)+'-'+pad2(Math.min(27,day))+'|dm'+subId+kind+mi+i+'p|'+subId+'|'+kind]='p'; day+=2; }
      for(let i=0;i<as[mi];i++){ marks[y+'-'+pad2(m)+'-'+pad2(Math.min(27,day))+'|dm'+subId+kind+mi+i+'a|'+subId+'|'+kind]='a'; day+=2; }
    });
  }
  spread('d-ca','th',9,19);  spread('d-ca','tu',1,8);
  spread('d-ie','th',20,11); spread('d-ie','tu',5,6);
  spread('d-ib','th',21,13); spread('d-ib','tu',10,4);  spread('d-ib','pr',7,2);
  spread('d-bs','th',17,16); spread('d-bs','pr',11,3);
  const dls=[
    {id:'dm1',title:'Cost Accounting — Assignment 2',subId:'d-ca',type:'assignment',date:off(-2),done:false},
    {id:'dm2',title:'Indian Economy — Reading response',subId:'d-ie',type:'assignment',date:off(1),done:false},
    {id:'dm3',title:'International Business — Case study',subId:'d-ib',type:'assignment',date:off(3),done:false},
    {id:'dm4',title:'Business Statistics — Internal I',subId:'d-bs',type:'internal',date:off(6),done:false},
    {id:'dm5',title:'Cost Accounting — Internal exam',subId:'d-ca',type:'exam',date:off(11),done:false},
    {id:'dm6',title:'Society membership renewal',subId:'',type:'other',date:off(9),done:false},
    {id:'dm7',title:'Indian Economy — Term paper draft',subId:'d-ie',type:'assignment',date:off(-6),done:true,doneAt:Date.now()-6*864e5},
    {id:'dm8',title:'Business Statistics — End-sem',subId:'d-bs',type:'exam',date:off(34),done:false}
  ];
  return {subs,slots,marks,att:{},dls,cats:[],thr:S.thr,theme:S.theme,tone:S.tone,tab:S.tab};
}
function loadDemo(){ S=Object.assign({},S,demoState()); save(); renderAll(); showTab('home'); }

const INTRO_V='2';
const INTRO=[
  {e:'🕛', t:'11:59',
   p:'Your timetable, attendance and deadlines — in one place, on your phone, offline. Named after when you’ll probably open it.'},
  {e:'✅', t:'Mark classes in one tap',
   p:'<b>Today</b> shows what you have, in order. Tap <b>Present</b> or <b>Absent</b> and the maths updates everywhere.'},
  {e:'🧮', t:'Know before you skip',
   p:'Every class shows what skipping it would do to your percentage — <b>before</b> you decide. Set your minimum in Settings.'},
  {e:'📅', t:'One day at a time',
   p:'<b>Classes</b> shows a single day, big enough to read. <b>Swipe left or right</b> to move between days.'},
  {e:'💬', t:'Pick how it talks',
   p:'This app has a voice, and you choose how much of it you want.', tone:true}
];
function showIntro(force){
  if(!force){
    let seen=null; try{ seen=localStorage.getItem('eh-intro'); }catch(e){ return; }
    if(seen===INTRO_V) return;
  }
  let i=0;
  const el=$('#intro');
  $('#introDots').innerHTML=INTRO.map(()=>'<i></i>').join('');
  function paint(){
    const s=INTRO[i];
    $('#introBody').innerHTML='<div class="iE">'+s.e+'</div><h2>'+s.t+'</h2><p>'+s.p+'</p>'+
      (s.tone?'<div class="iList"><div class="list">'+TONE_OPTS.map(t=>
        '<button class="row tap" data-itone="'+t[0]+'"><div class="rMain"><div class="rT">'+t[1]+'</div>'+
        '<div class="rS">'+t[2]+'</div></div>'+(S.tone===t[0]?'<span class="chk">✓</span>':'')+
        '</button>').join('')+'</div></div>':'');
    $$('#introBody [data-itone]').forEach(b=>b.onclick=()=>{ S.tone=b.dataset.itone; save(); paint(); });
    [...$('#introDots').children].forEach((d,n)=>d.classList.toggle('on',n===i));
    $('#introNext').textContent = i===INTRO.length-1 ? 'Start' : 'Continue';
    $('#introSkip').style.visibility = i===INTRO.length-1 ? 'hidden' : 'visible';
  }
  function done(){ try{ localStorage.setItem('eh-intro',INTRO_V); }catch(e){} el.setAttribute('hidden',''); renderAll(); }
  $('#introNext').onclick=()=>{ if(i<INTRO.length-1){ i++; paint(); } else done(); };
  $('#introSkip').onclick=done;
  el.removeAttribute('hidden'); paint();
}

/* ══════════════ BOOT ══════════════ */
function renderAll(){
  renderTabs(); navButtons();
  if(S.tab==='home') renderHome();
  else if(S.tab==='timetable') renderTT();
  else if(S.tab==='attendance') renderAtt();
  else if(S.tab==='deadlines') renderDue();
  else if(S.tab==='calendar') renderCal();
  else if(S.tab==='settings') renderSettings();
}
applyTheme();
if(!TABS.some(t=>t.id===S.tab) && S.tab!=='settings') S.tab='home';
showTab(S.tab);
showIntro(false);

/* re-render when the app comes back after a while (day may have changed) */
let hiddenAt=0;
document.addEventListener('visibilitychange',()=>{
  if(document.hidden) hiddenAt=Date.now();
  else if(Date.now()-hiddenAt>60000) renderAll();
});
/* keep "in class now" fresh */
setInterval(()=>{ if(S.tab==='home' && !$('#sheet').classList.contains('on')) renderHome(); }, 60000);
</script>
