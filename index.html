        }}]});
      if(!ed) setTimeout(()=>{ const i=$('#dT'); if(i) i.focus(); },260);
    }
  });
}

/* ── procrastination meter ── */
function leadHours(d){
  if(!d.done||!d.doneAt) return null;
  return (new Date(d.date+'T23:59:59').getTime()-d.doneAt)/3600000;
}
function leadTag(h){
  if(h===null||h===undefined) return null;
  if(h<0)  return {k:'late', t:'Missed it'};
  if(h<12) return {k:'wire', t:'Eleventh hour'};
  if(h<48) return {k:'close',t:'Cut it close'};
  return {k:'early',t:'Ahead of it'};
}
function procScore(){
  const done=S.dls.filter(d=>d.done&&d.doneAt);
  if(!done.length) return null;
  const recent=done.slice().sort((a,b)=>b.doneAt-a.doneAt).slice(0,10);
  const avg=recent.reduce((n,d)=>n+clamp(leadHours(d),-24,96),0)/recent.length;
  return {score:Math.round(clamp(100-(avg/72)*100,0,100)), avg, n:done.length};
}
function procLine(score){
  if(score<20) return T('Consistently ahead of deadlines.','You finish early.',
    'You finish things early. Genuinely impressive.','Suspiciously organised. Everything alright?');
  if(score<40) return T('Generally ahead of schedule.','Usually early.',
    'Mostly ahead of things. Keep it up.','Annoyingly on top of things.');
  if(score<60) return T('Completion times are close to due dates.','You finish around the deadline.',
    'You finish near the deadline. Very normal.','Respectably human. Neither hero nor cautionary tale.');
  if(score<80) return T('Completion typically occurs shortly before the deadline.','You cut it fine.',
    'You do cut it a bit fine.','Cutting it fine. Familiar.');
  return T('Completion typically occurs at or past the deadline.','You finish at the last minute.',
    'Last-minute is your default setting.','You are the reason this app is named what it is.');
}
function renderProc(){
  const p=procScore();
  if(!p){
    $('#procCard').innerHTML='<div class="gHead">Habit</div><div class="pad"><div class="card">'+
      '<div class="kicker">How early you finish</div>'+
      '<div style="font-size:14px;color:var(--label2);margin-top:9px;line-height:1.45">'+
      T('No completed items yet.','Nothing finished yet — tick something off and this fills in.',
        'Nothing finished yet. Tick something off and this starts tracking.',
        'Nothing finished yet, so nothing to hold against you. Yet.')+'</div></div></div>';
    return;
  }
  const streak=(()=>{ let n=0;
    for(const d of S.dls.filter(x=>x.done&&x.doneAt).sort((a,b)=>b.doneAt-a.doneAt)){
      if(leadHours(d)>=48) n++; else break; } return n; })();
  const avgTxt = p.avg>=24 ? (Math.round(p.avg/24*10)/10)+' days' : Math.round(Math.max(0,p.avg))+' hours';
  $('#procCard').innerHTML='<div class="gHead">Habit</div><div class="pad"><div class="card">'+
    '<div style="display:flex;align-items:baseline;justify-content:space-between">'+
      '<span class="kicker">How early you finish</span>'+
      '<span style="font-size:26px;font-weight:800;letter-spacing:-.03em" class="tnum">'+p.score+'</span></div>'+
    '<div class="pmTrack"><div class="pmPin" style="left:'+p.score+'%"></div></div>'+
    '<div class="pmEnds"><span>Early bird</span><span>Eleventh hour</span></div>'+
    '<div style="font-size:14px;color:var(--label2);margin-top:13px;line-height:1.45">'+esc(procLine(p.score))+'</div>'+
    '<div class="pmStats"><span><b>'+avgTxt+'</b>average lead time</span>'+
      '<span><b>'+streak+'</b>in a row done early</span>'+
      '<span><b>'+p.n+'</b>finished so far</span></div></div></div>';
}

/* ══════════════ CALENDAR ══════════════ */
let calY,calM,calSel=todayISO();
function renderCal(){
  if(calY===undefined){ const n=new Date(); calY=n.getFullYear(); calM=n.getMonth(); }
  const first=new Date(calY,calM,1), padd=(first.getDay()+6)%7, days=new Date(calY,calM+1,0).getDate();
  $('#calBar').innerHTML='<div id="calTitle">'+first.toLocaleDateString(undefined,{month:'long',year:'numeric'})+'</div>'+
    '<button class="calNav" id="calPrev">‹</button>'+
    '<button class="calNav" id="calToday" style="width:auto;padding:0 12px;font-size:15px;font-weight:600">Today</button>'+
    '<button class="calNav" id="calNext">›</button>';
  $('#calPrev').onclick=()=>{ calM--; if(calM<0){calM=11;calY--;} renderCal(); };
  $('#calNext').onclick=()=>{ calM++; if(calM>11){calM=0;calY++;} renderCal(); };
  $('#calToday').onclick=()=>{ const n=new Date(); calY=n.getFullYear(); calM=n.getMonth(); calSel=todayISO(); renderCal(); };

  let h=['M','T','W','T','F','S','S'].map(d=>'<div class="cDow">'+d+'</div>').join('');
  for(let i=0;i<padd;i++) h+='<div class="cD pad"></div>';
  for(let d=1;d<=days;d++){
    const iso=calY+'-'+pad2(calM+1)+'-'+pad2(d);
    const items=S.dls.filter(x=>x.date===iso&&!x.done);
    const dots=items.slice(0,3).map(x=>{
      const sub=subById(x.subId);
      return '<i class="'+(sub?scCls(sub):'')+'"></i>';
    }).join('');
    h+='<button class="cD'+(iso===todayISO()?' today':'')+(iso===calSel?' sel':'')+'" data-c="'+iso+'">'+
      d+'<span class="dots">'+dots+'</span></button>';
  }
  $('#calGrid').innerHTML=h;
  $$('#calGrid [data-c]').forEach(b=>b.onclick=()=>{ calSel=b.dataset.c; renderCal(); });

  /* selected day detail */
  const d=dateOf(calSel);
  const cls=slotsOn(dowOf(d),calSel).filter(s=>subById(s.subId));
  const dls=S.dls.filter(x=>x.date===calSel);
  let dh='<div class="gHead">'+d.toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long'})+'</div><div class="pad">';
  if(!cls.length&&!dls.length){
    dh+='<div class="list"><div class="row"><div class="rMain"><div class="rT" style="color:var(--label2);font-size:15px">Nothing on this day</div></div></div></div>';
  }
  if(dls.length) dh+='<div class="list">'+dls.map(dueRowHTML).join('')+'</div>';
  if(cls.length){
    dh+='<div style="height:8px"></div><div class="list">'+cls.map(sl=>{
      const sub=subById(sl.subId);
      return '<div class="row '+scCls(sub)+'"><span class="ico" style="background:var(--sc)"></span>'+
        '<div class="rMain"><div class="rT">'+esc(sub.name)+kindTag(sl)+onlineTag(sl)+'</div>'+
        '<div class="rS">'+fmtT(sl.start)+'–'+fmtT(sl.end)+(placeOf(sl)?' · '+esc(placeOf(sl)):'')+'</div></div></div>';
    }).join('')+'</div>';
  }
  dh+='<div style="height:12px"></div><button class="btn ghost sm" id="calAdd">+ Add something on this day</button></div>';
  $('#calDay').innerHTML=dh;
  bindDueRows($('#calDay'));
  $('#calAdd').onclick=()=>sheetDeadline(null,calSel);
}

function doExport(){
  try{
    const blob=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='1159-backup-'+todayISO()+'.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),3000);
    toast('Backup saved.');
  }catch(e){ toast('Couldn’t export here.'); }
}
$('#impFile').onchange=e=>{
  const f=e.target.files&&e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=JSON.parse(r.result);
      if(!d||typeof d!=='object'||!Array.isArray(d.subs)) throw 0;
      S=normalise(Object.assign(blankState(S),d));
      save(); renderAll(); showTab('home'); toast('Backup restored.');
    }catch(err){ toast('That file didn’t look right.'); }
  };
  r.readAsText(f);
  e.target.value='';
};

/* ══════════════ SHORTCUTS ══════════════
   Apple Shortcuts cannot reach inside a web app, but it can open a URL, so
   the URL is the interface. An automation that fires when you leave home
   opens ?do=enroute; a tap on the Home Screen opens ?do=mark&as=p&when=now
   and you never look at the app at all.

   Three rules this has to obey:
     · it must work with no signal — parsing a query string does, which is
       why this is a URL and not an API;
     · it must never fire twice. The command is stripped from the address
       bar the moment it is acted on, so a refresh, a restore, or the
       service worker re-serving the page cannot re-mark a class;
     · it must say what it did. Silently changing attendance and showing
       the normal screen is indistinguishable from the shortcut failing.  */
const SHORTCUT_HELP=[
  ['?do=enroute',            'I\u2019m on my way',        'Sets off the arrival countdown, same as the button.'],
  ['?do=mark&as=p',          'Mark present',               'The class on now, or the next one if you\u2019re between.'],
  ['?do=mark&as=a',          'Mark absent',                ''],
  ['?do=mark&as=c',          'Class cancelled',            ''],
  ['?do=mark&as=p&when=all', 'Mark the whole day present', 'Everything on today that isn\u2019t marked yet.'],
  ['?do=home',               'Heading home',               'Clears the on-my-way state.'],
  ['?do=open&tab=attendance','Open a tab',                 'home, timetable, attendance, due, calendar.']
];
function shortcutTarget(){
  /* the class a bare "mark" applies to: the one running now, else the next
     one still to come today */
  const iso=todayISO(), now=nowMin();
  const live=liveSlots(iso).filter(sl=>!S.marks[markKey(iso,sl)]);
  return live.find(sl=>nowMin()>=t2m(sl.start)&&now<t2m(sl.end))
      || live.find(sl=>t2m(sl.start)>now)
      || null;
}
function runShortcut(q){
  const get=k=>{ const m=new RegExp('[?&]'+k+'=([^&]*)').exec(q); 
                 return m?decodeURIComponent(m[1].replace(/\+/g,' ')):''; };
  const doing=get('do');
  if(!doing) return null;
  const iso=todayISO();
  let msg=null;

  if(doing==='enroute'){
    S.enroute={iso, at:nowMin()};
    const ms=morningStatus();
    msg = ms && ms.arriveAt!=null
      ? 'On your way \u2014 arriving '+m2t(ms.arriveAt)
      : 'On your way.';
  }
  else if(doing==='home'){
    S.enroute=null; msg='Not on your way any more.';
  }
  else if(doing==='mark'){
    const as=(get('as')||'p').charAt(0);
    if(['p','a','c'].indexOf(as)<0) return {msg:'Unknown mark \u2014 use p, a or c.', bad:true};
    const word = as==='p'?'present':as==='a'?'absent':'cancelled';
    if(get('when')==='all'){
      const list=liveSlots(iso).filter(sl=>!S.marks[markKey(iso,sl)]);
      if(!list.length) return {msg:'Nothing left to mark today.', bad:true};
      list.forEach(sl=>{ S.marks[markKey(iso,sl)]=as; });
      if(as==='p') S.enroute=null;
      msg=list.length+' class'+(list.length===1?'':'es')+' marked '+word+'.';
    } else {
      const sl=shortcutTarget();
      if(!sl) return {msg:'No class to mark right now.', bad:true};
      S.marks[markKey(iso,sl)]=as;
      if(as==='p') S.enroute=null;
      msg=esc(subById(sl.subId).name)+' \u00b7 '+fmtT(sl.start)+' marked '+word+'.';
    }
  }
  else if(doing==='open'){
    const tab=get('tab');
    if(TABS.some(t=>t.id===tab)||tab==='settings'){ S.tab=tab; return {msg:null, tab}; }
    return null;
  }
  else return {msg:'Don\u2019t know how to \u201c'+esc(doing)+'\u201d.', bad:true};

  save();
  return {msg};
}
(function(){
  let q=''; try{ q=location.search||''; }catch(e){}
  if(!q || q.indexOf('do=')<0) return;
  let r=null;
  try{ r=runShortcut(q); }catch(e){ r={msg:'That shortcut didn\u2019t work.', bad:true}; }
  /* strip it before anything else can re-run it */
  try{ if(history.replaceState) history.replaceState(null,'',location.pathname); }catch(e){}
  if(!r) return;
  if(r.tab) S.tab=r.tab;
  if(r.msg) setTimeout(()=>toast(r.msg, r.bad?'bad':''), 260);
})();

applyTheme();
if(!TABS.some(t=>t.id===S.tab) && S.tab!=='settings') S.tab='home';

/* ── where to open ──────────────────────────────────────────────
   Coming back after a gap, or having last been in Settings, you
   almost always want Today — not wherever you happened to stop.
   Within a few minutes it behaves like a resume instead.        */
const SEEN_KEY='eh-last-seen';
function markSeen(){ try{ localStorage.setItem(SEEN_KEY,String(Date.now())); }catch(e){} }
(function(){
  let last=0; try{ last=+localStorage.getItem(SEEN_KEY)||0; }catch(e){}
  const gap=Date.now()-last;
  if(!last || gap>15*60000 || S.tab==='settings') S.tab='home';
})();
showTab(S.tab);
markSeen();
showIntro(false);

/* ── coming back ────────────────────────────────────────────────
   A day rollover matters more than elapsed time: at 00:05 the whole
   app is about a different day, so snap the timetable and calendar
   to the new today rather than leaving yesterday on screen.      */
let hiddenAt=0, renderedFor=todayISO();
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){ hiddenAt=Date.now(); markSeen(); return; }
  const today=todayISO();
  const rolled = today!==renderedFor;
  const away   = Date.now()-hiddenAt;
  if(rolled){
    renderedFor=today;
    ttDate=new Date(); calSel=today;
    const n=new Date(); calY=n.getFullYear(); calM=n.getMonth();
    if(away>15*60000) showTab('home'); else renderAll();
  } else if(away>15*60000 && S.tab==='settings'){ showTab('home'); }
  else if(away>60000){ renderAll(); }
  markSeen();
});

/* ══════════════ OFFLINE WORKER ══════════════
   Optional, and deliberately so. Opened as a file on your phone the app is
   already fully offline and this does nothing — a file: page cannot register
   a worker, and there would be nothing to cache. Hosted at a web address it
   is what stops the app failing to open with no signal.
   If sw.js isn't there, registration fails quietly and nothing changes. */
let swReg=null;
function swSupported(){
  try{ return 'serviceWorker' in navigator &&
              /^https?:$/.test(location.protocol); }
  catch(e){ return false; }
}
function registerSW(){
  if(!swSupported()) return;
  navigator.serviceWorker.register('sw.js').then(reg=>{
    swReg=reg;
    reg.addEventListener('updatefound',()=>{
      const w=reg.installing; if(!w) return;
      w.addEventListener('statechange',()=>{
        if(w.state==='installed' && navigator.serviceWorker.controller)
          toast('Update ready — reopen the app');
      });
    });
  }).catch(()=>{});     /* no sw.js alongside index.html: that's fine */
  navigator.serviceWorker.addEventListener('message',e=>{
    if(e.data && e.data.type==='CLEARED'){
      toast('Cache cleared — reloading');
      setTimeout(()=>location.reload(),600);
    }
  });
}
registerSW();

/* keep the countdown and "in class now" honest without a visible redraw */
setInterval(()=>{
  if($('#sheet').classList.contains('on')) return;
  if(todayISO()!==renderedFor){        /* midnight passed with the app open */
    renderedFor=todayISO(); ttDate=new Date(); calSel=renderedFor; renderAll(); return;
  }
  if(S.tab==='home') renderHome();
}, 60000);
