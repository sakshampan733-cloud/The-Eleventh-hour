/* ══════════════ MARKING ══════════════ */
/* Re-render without the page jumping under your finger. Marking a class can
   change the content above it (a row appears or disappears), which used to
   shift everything mid-tap. */
function keepScroll(fn){
  const y=(typeof window!=='undefined'&&window.scrollY)||0;
  fn();
  if(y&&typeof window!=='undefined'&&window.scrollTo) window.scrollTo(0,y);
}
function setMark(key,v){
  if(v) S.marks[key]=v; else delete S.marks[key];
  /* you marked yourself present — you are plainly no longer in transit */
  if(v==='p' && S.enroute && key.indexOf(S.enroute.iso+'|')===0) S.enroute=null;
  save();
  keepScroll(renderAll);
}
function mkSegHTML(key){
  const m=S.marks[key];
  return '<div class="mkSeg" data-key="'+key+'">'+
    '<button data-m="p"'+(m==='p'?' class="on"':'')+'>Present</button>'+
    '<button data-m="a"'+(m==='a'?' class="on"':'')+'>Absent</button>'+
    '<button data-m="c"'+(m==='c'?' class="on"':'')+'>Cancelled</button></div>';
}
/* A future class can't be attended yet, but you often know in advance that
   it's been called off — so cancelling is allowed ahead of time. */
function cancelHTML(key){
  const on=S.marks[key]==='c';
  return '<div class="mkSeg" data-key="'+key+'" style="grid-template-columns:1fr">'+
    '<button data-m="c"'+(on?' class="on"':'')+'>'+
      (on?'Cancelled — tap to undo':'Mark as cancelled')+'</button></div>';
}
function bindMkSeg(root){
  (root||document).querySelectorAll('.mkSeg').forEach(seg=>{
    seg.querySelectorAll('button').forEach(b=>b.onclick=e=>{
      e.stopPropagation();
      const key=seg.dataset.key, v=b.dataset.m;
      setMark(key, S.marks[key]===v ? null : v);
      toast(S.marks[key]==='p'?T('Marked present.','Marked present.','Present — nice.','Present. Noted, reluctantly.')
        : S.marks[key]==='a'?T('Marked absent.','Marked absent.','Marked absent.','Absent. Bold.')
        : S.marks[key]==='c'?'Class cancelled.':'Cleared.');
    });
  });
}

/* ══════════════ TODAY ══════════════ */
function greetLine(){
  const h=new Date().getHours();
  const overdue=S.dls.filter(d=>!d.done&&daysTo(d.date)<0).length;
  const dueToday=S.dls.filter(d=>!d.done&&daysTo(d.date)===0).length;
  const soon=S.dls.filter(d=>!d.done&&daysTo(d.date)>0&&daysTo(d.date)<=3).length;
  if(overdue>2) return T(overdue+' items are past their due date.',
    overdue+' things are overdue.',
    overdue+' overdue — maybe clear one today.',
    'Several things are past due. Bold of you to open this.');
  if(overdue===1) return T('1 item is past its due date.','1 thing is overdue.',
    'One thing is overdue — quick win?','One thing is overdue. We both know which.');
  if(dueToday) return T(dueToday+' item'+(dueToday===1?'':'s')+' due today.',
    dueToday+' due today.', dueToday+' due today — you’ve got this.',
    dueToday+' due today. The hour approaches.');
  if(h>=23||h<4) return T('Late session.','It’s late.','Late one. Sleep is also a strategy.',
    'Nearly midnight. Historically your most productive hour.');
  if(soon) return T(soon+' item'+(soon===1?'':'s')+' due within 3 days.',
    soon+' due in the next 3 days.', soon+' coming up this week — nothing scary.',
    soon+' due within three days. Plenty of time, surely.');
  if(h<9) return T('Good morning.','Morning.','Morning — early start.','Awake early. Suspicious.');
  if(h>=20) return T('Good evening.','Evening.','Evening — wrap-up time.','Evening. Statistically when the panic sets in.');
  return T('No pending items.','Nothing overdue.','All clear right now.','Nothing on fire. Enjoy it while it lasts.');
}

function renderHome(){
  const now=new Date(), iso=todayISO(), dow=dowOf(now), mins=nowMin();
  $('#todayDate').textContent = now.toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long'});

  const todays=slotsOn(dow,iso).filter(sl=>subById(sl.subId));
  /* "what's next" must follow the classes you actually plan to attend —
     pointing at an 8am you've already decided to skip is worse than useless */
  const rpT=resolvePlan(iso);
  const goingToday=rpT.going;
  /* Worked out up front: several hero branches need to know whether the
     travel card is already speaking for a class before they speak for it
     too. Declared here rather than below, where it was in the temporal
     dead zone of the branches that referenced it. */
  const ms=morningStatus();

  /* ── hero ── */
  /* any mark — present, absent or cancelled — means the class is handled,
     so the hero moves on instead of still reporting it as live */
  const live   = goingToday.find(sl=>mins>=t2m(sl.start)&&mins<t2m(sl.end)
                                     && !S.marks[markKey(iso,sl)]);
  const next   = goingToday.find(sl=>t2m(sl.start)>mins && !S.marks[markKey(iso,sl)]);
  const unmark = todays.filter(sl=>!S.marks[markKey(iso,sl)]).length;
  let hero='';

  if(live){
    const sub=subById(live.subId), key=markKey(iso,live), imp=skipImpact(sub.id);
    hero='<div id="hero" class="'+scCls(sub)+'">'+
      '<div class="hTop">'+
        '<div class="hK"><span class="dot"></span>In class now</div>'+
        '<div class="hN">'+esc(sub.name)+'</div>'+
        '<div class="hM">'+fmtT(live.start)+'–'+fmtT(live.end)+
          (placeOf(live)?' · '+esc(placeOf(live)):'')+
          (kindOf(live)!=='th'?' · '+KIND_NAME[kindOf(live)]:'')+
          ' · <b>'+fmtDur(t2m(live.end)-mins)+' left</b></div>'+
      '</div><div class="hAct">'+mkSegHTML(key)+
      (imp.has?'<div class="cls cSkip" style="background:none;padding:9px 0 0;border:none;margin:0;font-size:13px;color:var(--label2)">'+
        'Right now: <b style="color:var(--label)">'+pctFmt(imp.now)+'%</b> · miss this and it’s '+
        pctFmt(imp.after)+'%</div>':'')+
      '</div></div>';
  } else if(next){
   /* The departure/at-home card above may already name this exact class —
      then "Next up" is the same widget twice and we draw nothing. Note this
      is a nested if, not a further `else if`: skipping the duplicate must
      not fall through to "Done for the day" while the class is still ahead. */
   if(!(ms && ms.atHome && ms.p.first && ms.p.first.id===next.id)){
    const sub=subById(next.subId), gap=t2m(next.start)-mins, imp=skipImpact(sub.id);
    hero='<div id="hero" class="'+scCls(sub)+'">'+
      '<div class="hTop">'+
        '<div class="hK">Next up</div>'+
        '<div class="hN">'+esc(sub.name)+'</div>'+
        '<div class="hM">'+fmtT(next.start)+(placeOf(next)?' · '+esc(placeOf(next)):'')+
          (kindOf(next)!=='th'?' · '+KIND_NAME[kindOf(next)]:'')+' · <b>in '+fmtDur(gap)+'</b></div>'+
      '</div>'+
      (imp.has?'<div class="hAct"><div style="font-size:14px;color:var(--label2);line-height:1.4">'+
        (imp.safe
          ? T('Skipping keeps '+esc(sub.code)+' at '+pctFmt(imp.after)+'%, above the minimum.',
              'Skip it and '+esc(sub.code)+' is still '+pctFmt(imp.after)+'% — above '+S.thr+'%.',
              'You could skip this — '+esc(sub.code)+' would still sit at '+pctFmt(imp.after)+'%.',
              'You can skip it. '+esc(sub.code)+' survives at '+pctFmt(imp.after)+'%. Your call.')
          : T('Skipping drops '+esc(sub.code)+' to '+pctFmt(imp.after)+'%, below the minimum.',
              'Skip it and '+esc(sub.code)+' falls to '+pctFmt(imp.after)+'% — under '+S.thr+'%.',
              'Best not to skip — '+esc(sub.code)+' would drop to '+pctFmt(imp.after)+'%.',
              'Skip it and '+esc(sub.code)+' drops to '+pctFmt(imp.after)+'%. Then it’s your problem.'))+
        '</div></div>':'')+
      '</div>';
   }
  } else if(todays.length){
    hero='<div id="hero" class="sc2"><div class="hTop">'+
      '<div class="hK">Done for the day</div>'+
      '<div class="hN">'+T('Classes complete','That’s the lot','That’s your day done','Survived another one')+'</div>'+
      '<div class="hM">'+(unmark
        ? unmark+' class'+(unmark===1?'':'es')+' still unmarked below.'
        : T('All classes marked.','Everything’s marked.','All marked — tidy.','All marked. Look at you.'))+
      '</div></div></div>';
  } else {
    const tISO=isoOf(addDays(now,1)), tCount=slotsOn(dowOf(addDays(now,1)),tISO).filter(s=>subById(s.subId)).length;
    hero='<div id="hero" class="sc0"><div class="hTop">'+
      '<div class="hK">'+(dow===6?'Sunday':'No classes')+'</div>'+
      '<div class="hN">'+T('No scheduled classes','Nothing scheduled today',
        'Free day','A free day. Suspicious.')+'</div>'+
      '<div class="hM">'+(tCount? 'Tomorrow: '+tCount+' class'+(tCount===1?'':'es')+'.'
        : 'Nothing tomorrow either.')+'</div></div></div>';
  }
  /* ── the one thing that matters right now, at the very top ──
     Morning: when to leave. Evening: when to go tomorrow. Nothing
     below the fold for either. ── */
  const cm=commute();
  /* No configured hour: the timetable already says when today is finished.
     Once nothing is left to attend today, the next class day becomes the
     thing you need — whether that's this evening or Sunday night. */
  const ndH=nextClassDay();
  const aheadToday = !!(ndH && ndH.offset===0);
  const tpH = (ndH && ndH.offset>0) ? ndH.plan : null;
  const nextDayName = tpH ? (ndH.offset===1 ? 'Tomorrow'
                     : tpH.d.toLocaleDateString(undefined,{weekday:'long'})) : '';
  if(!ms && !aheadToday && tpH && tpH.skippingAll){
    hero='<div id="hero" style="border-left-color:var(--label3)"><div class="hTop">'+
      '<div class="hK" style="color:var(--label2)">'+esc(nextDayName)+'</div>'+
      '<div class="hN">Not going in</div>'+
      '<div class="hM">You’ve planned to skip '+tpH.list.length+' class'+
        (tpH.list.length===1?'':'es')+'.</div>'+
      '<div style="display:flex;gap:9px;margin-top:13px">'+
        '<button class="btn ghost sm" id="heroWorth">Change plan</button></div>'+
      '</div></div>'+hero;

    hero='<div id="hero" style="border-left-color:var(--indigo)"><div class="hTop">'+
      '<div class="hK" style="color:var(--indigo)">'+esc(nextDayName)+'</div>'+
      '<div class="hN">All from home</div>'+

        ' \u2014 every class '+esc(nextDayName.toLowerCase())+' is online.</div>'+
      '<div style="display:flex;gap:9px;margin-top:13px">'+
        '<button class="btn ghost sm" id="heroWorth">Worth going?</button></div>'+
      '</div></div>'+hero;
  } else if(!ms && !aheadToday && tpH && tpH.configured){
    const wake=tpH.dayBefore?null:tpH.wakeAt;
    hero='<div id="hero" style="border-left-color:var(--purple)"><div class="hTop">'+
      '<div class="hK" style="color:var(--purple)">'+esc(cm.head)+'</div>'+
      '<div class="hN">'+esc(cm.verb)+' '+m2t(tpH.leaveAt)+'</div>'+
      '<div class="hM">'+esc(nextDayName)+
        ' · '+(tpH.planned?'your first <b>planned</b> class ':'first class ')+fmtT(tpH.firstOnsite.start)+
        (wake!=null?' · wake by <b>'+m2t(wake)+'</b>':'')+
        (tpH.planned&&tpH.going.length<tpH.list.length
          ? '<br><span style="color:var(--accent)">Skipping '+
            (tpH.list.length-tpH.going.length)+' earlier class'+
            ((tpH.list.length-tpH.going.length)===1?'':'es')+' by your plan</span>' : '')+
        '</div>'+
      '<div style="display:flex;gap:9px;margin-top:13px">'+
        (cm.msg?'<button class="btn ghost sm" id="heroCopy">Copy message</button>':'')+
        '<button class="btn ghost sm" id="heroWorth">Worth going?</button>'+
      '</div></div></div>'+hero;
  }
  /* An at-home card doesn't compete with the journey home — you can be on
     your way back from campus and have an online class later. Only a real
     get-to-college card replaces it. */
  const hwd = (live || (ms && !ms.atHome)) ? null : homewardStatus();
  if(hwd){
    const cm2=commute();
    hero='<div id="hero" style="border-left-color:var(--teal)"><div class="hTop">'+
      '<div class="hK" style="color:var(--teal)">'+

      '<div class="hM">'+
        (hwd.waited<5
          ? 'That\u2019s you done. '
          : esc(subById(hwd.last.subId).code)+' done '+fmtDur(hwd.waited)+' ago. ')+

          ? 'Tell your '+(S.commute==='driver'?'driver':'cab')+' '+m2t(hwd.leaveAt)+
            ' \u2014 about '+fmtDur(hwd.travel)+' back.'
          : 'About '+fmtDur(hwd.travel)+' back from here.')+'</div>'+

        'padding-top:12px;border-top:.5px solid var(--sep)">'+
        '<span style="font-size:11.5px;color:var(--label2);display:flex;flex-direction:column;gap:2px">'+
          '<b style="font-size:15px;color:var(--label);font-weight:700">'+
          (hwd.early?m2t(hwd.endedAt):fmtT(hwd.last.end))+

        '<span style="font-size:11.5px;color:var(--label2);display:flex;flex-direction:column;gap:2px">'+

        '<button class="btn ghost sm" id="heroHomeCopy">Copy message</button></div>':'')+
      '</div></div>'+hero;
  }

  /* A class is running right now, so you are sitting in it — "In class now"
     is already the hero and travel advice for the same moment contradicts it
     outright. Being on your way and being in the room cannot both be true. */
  if(ms && !live && ms.atHome){
    const cls=subById(ms.p.first.subId);
    hero='<div id="hero" style="border-left-color:var(--indigo)"><div class="hTop">'+
      '<div class="hK" style="color:var(--indigo)">'+
        '<span class="dot" style="background:var(--indigo)"></span>From home</div>'+
      '<div class="hN">'+(ms.untilClass<1?'Starting now'
                         :'Online in '+fmtDur(ms.untilClass))+'</div>'+

/* ══════════════ TIMETABLE (one day at a time) ══════════════ */
let ttDate=new Date();
let lastSwipe=0;                 /* set by the swipe handler, read by the day chips */

/* Scroll the rail so the selected chip sits in the middle. Guarded because
   layout numbers are 0/undefined until the element is actually on screen. */
function centreRail(rail,retry){
  if(!rail) return;
  const sel=rail.querySelector? rail.querySelector('.dChip.on') : null;
  if(!sel) return;
  const w=rail.clientWidth||0, l=sel.offsetLeft||0, cw=sel.offsetWidth||0;
  if(!w||!cw){
    /* the tab was still hidden when this ran, so there is no layout yet —
       try once more next frame, otherwise the rail sits stuck at day one */
    if(!retry && typeof requestAnimationFrame==='function')
      requestAnimationFrame(()=>centreRail(rail,true));
    return;
  }
  rail.scrollLeft=Math.max(0, l - w/2 + cw/2);
}
/* which chip is sitting under the centre marker right now */
function chipAtCentre(rail){
  if(!rail||!rail.querySelectorAll) return null;
  const w=rail.clientWidth||0; if(!w) return null;
  const mid=(rail.scrollLeft||0)+w/2;
  let best=null, bestD=Infinity;
  rail.querySelectorAll('.dChip').forEach(c=>{
    const centre=(c.offsetLeft||0)+(c.offsetWidth||0)/2;
    const d=Math.abs(centre-mid);
    if(d<bestD){ bestD=d; best=c; }
  });
  return best;
}
/* Scrolling the rail selects whatever lands in the middle — the clock-picker
   behaviour. Debounced so it fires when the flick settles, not per frame. */
(function(){
  const rail=document.getElementById('dayStrip'); if(!rail) return;
  let t=null;
  rail.addEventListener('scroll',()=>{
    clearTimeout(t);
    t=setTimeout(()=>{
      const c=chipAtCentre(rail);
      if(!c||!c.dataset||!c.dataset.d) return;
      if(c.dataset.d===isoOf(ttDate)) return;   /* already showing this day */
      ttDate=dateOf(c.dataset.d);
      markRailSelection();
      renderDay();                              /* rail keeps its scroll position */
    },110);
  },{passive:true});
})();
/* ── the date rail ────────────────────────────────────────────────
   Built once and then left alone. Rebuilding it on every day change
   would reset scrollLeft mid-flick and fight your finger, so scrolling
   only ever repaints the day *below* it. */
let railFrom=null, railTo=null;
function renderRail(force){
  const rail=$('#dayStrip'); if(!rail) return;
  const iso=isoOf(ttDate), tISO=todayISO(), today0=new Date();
  let from=addDays(today0,-140), to=addDays(today0,70);
  if(dateOf(iso) < dateOf(isoOf(from))) from=addDays(ttDate,-21);
  if(dateOf(iso) > dateOf(isoOf(to)))   to  =addDays(ttDate, 21);
  const needsBuild = force || railFrom!==isoOf(from) || railTo!==isoOf(to) ||
    !(rail.querySelectorAll&&rail.querySelectorAll('.dChip').length);
  if(needsBuild){
    let strip='', prevMonth=null;
    for(let d=new Date(from); isoOf(d)<=isoOf(to); d=addDays(d,1)){
      const di=isoOf(d), dw=dowOf(d);
      const n=slotsOn(dw,di).filter(s=>subById(s.subId)).length;
      const mLabel = d.getMonth()!==prevMonth ? d.toLocaleDateString(undefined,{month:'short'}) : '';
      prevMonth=d.getMonth();
      strip+='<button class="dChip'+(di===tISO?' today':'')+(dw>=5?' wknd':'')+
        '" data-d="'+di+'">'+
        '<div class="dM">'+mLabel+'</div>'+
        '<div class="dW">'+DAYS[dw]+'</div><div class="dN">'+d.getDate()+'</div>'+
        '<div class="dD"'+(n?'':' style="background:transparent"')+'></div></button>';
    }
    rail.innerHTML=strip;
    railFrom=isoOf(from); railTo=isoOf(to);
    $$('#dayStrip .dChip').forEach(b=>b.onclick=()=>{
      if(Date.now()-lastSwipe<400) return;    /* this click came from a swipe, not a tap */
      goToDay(b.dataset.d,true);
    });
  }
  markRailSelection();
}
/* paint the selected chip without touching scroll position */
function markRailSelection(){
  const iso=isoOf(ttDate);
  $$('#dayStrip .dChip').forEach(b=>b.classList.toggle('on', b.dataset.d===iso));
}

      '<div style="height:16px"></div><button class="btn ghost sm" id="ttAdd" style="max-width:220px;margin:0 auto">Add a class</button></div>';

            (sl.once?' <span class="tag">Once</span>':'')+
            '<div class="cMeta">'+esc(sub.code)+(placeOf(sl)?' · '+esc(placeOf(sl)):'')+
            ' · '+fmtDur(t2m(sl.end)-t2m(sl.start))+'</div></div>'+
          '<button class="cMore" data-slot="'+sl.id+'" data-iso="'+iso+'">⋯</button>'+
        '</div>'+
        (markable ? mkSegHTML(key) : cancelHTML(key))+
        (markable ? '' : '<div class="cSkip" style="color:var(--label3)">'+
          'Present/absent opens on the day</div>')+
        '</div>';
    });
    if(markable && list.filter(sl=>!S.marks[markKey(iso,sl)]).length>1)
      h='<div style="display:flex;gap:9px;margin-bottom:12px">'+
        '<button class="btn ghost sm" id="ttAllP">All present</button>'+
        '<button class="btn ghost sm" id="ttAllA" style="color:var(--red)">All absent</button></div>'+h;
    if(dayBlocks(iso).length>1)

/* ══════════════ CATCH UP — mark classes you missed logging ══════════════ */
let catchBack=21;                      /* how many days back to scan */
function unmarkedPast(days){
  const out=[], now=new Date(), mins=nowMin();
  for(let i=0;i<=days;i++){
    const d=addDays(now,-i), iso=isoOf(d);
    const slots=slotsOn(dowOf(d),iso).filter(sl=>{
      if(!subById(sl.subId)) return false;
      if(i===0 && t2m(sl.end)>mins) return false;      /* today: only classes that have ended */
      return !S.marks[markKey(iso,sl)];
    });
    if(slots.length) out.push({iso,d,slots});
  }
  return out;
}
const unmarkedCount=days=>unmarkedPast(days).reduce((n,g)=>n+g.slots.length,0);

function catchUpHTML(){
  const groups=unmarkedPast(catchBack);
  if(!groups.length)
    return '<div class="empty"><div class="eE">✅</div>'+
      '<div class="eT">'+T('Nothing outstanding.','All caught up.','All caught up — nothing missing.',
        'All caught up. Suspiciously diligent.')+'</div>'+
      '<div class="eS">Every class in the last '+catchBack+' days is marked.</div></div>';
  const total=groups.reduce((n,g)=>n+g.slots.length,0);
  let h='<div class="sheetIntro">'+total+' class'+(total===1?'':'es')+' from the last '+catchBack+
    ' days you never marked, newest first. Mark them here and every percentage updates as you go.</div>';
  groups.forEach(g=>{
    const rel=Math.round((dateOf(g.iso)-dateOf(todayISO()))/864e5);
    const when = rel===0?'Today' : rel===-1?'Yesterday'
      : g.d.toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'short'});
    h+='<div class="gHead" style="padding-left:4px;padding-right:4px">'+when+' · '+g.slots.length+' unmarked</div>';
    if(g.slots.length>1)
      h+='<div style="display:flex;gap:9px;margin-bottom:10px">'+
        '<button class="btn ghost sm" data-cuall="p" data-iso="'+g.iso+'">All present</button>'+
        '<button class="btn ghost sm" data-cuall="a" data-iso="'+g.iso+'" style="color:var(--red)">All absent</button></div>';
    g.slots.forEach(sl=>{
      const sub=subById(sl.subId);
      h+='<div class="cls '+scCls(sub)+'">'+
        '<div class="cTop"><div class="cTime">'+fmtT(sl.start)+'<br>'+fmtT(sl.end)+'</div>'+
        '<div class="cName">'+esc(sub.name)+kindTag(sl)+onlineTag(sl)+
        '<div class="cMeta">'+esc(sub.code)+(placeOf(sl)?' · '+esc(placeOf(sl)):'')+'</div></div></div>'+
        mkSegHTML(markKey(g.iso,sl))+'</div>';
    });
  });
  h+='<div style="height:8px"></div>'+
     '<button class="btn ghost sm" id="cuMore">Look back further (+3 weeks)</button>'+
     '<div class="gNote" style="text-align:center">Currently scanning '+catchBack+' days.</div>';
  return h;
}
function bindCatchUp(){
  const refresh=()=>{ $('#sheetBody').innerHTML=catchUpHTML(); bindCatchUp(); };
  /* marks apply immediately, then the list re-renders so cleared rows disappear */
  $$('#sheetBody .mkSeg').forEach(seg=>{
    seg.querySelectorAll('button').forEach(b=>b.onclick=e=>{
      e.stopPropagation();

/* ── swipe between days ──────────────────────────────────────────
   Attached to the whole Classes screen, so dragging the date strip
   works as well as dragging the list under it. The card follows your
   finger while you drag, so it's obvious the gesture is live.      */
(function(){
  const sec=document.getElementById('timetable');
  const body=()=>document.getElementById('ttBody');
  let x0=null, y0=null, drag=false;

  const settle=()=>{ const b=body(); if(b){ b.style.transition=''; b.style.transform=''; } };
  const reset=()=>{ x0=null; drag=false; settle(); };

  sec.addEventListener('touchstart',e=>{
    if(e.touches.length!==1){ reset(); return; }
    /* the date rail scrolls itself — don't also step the day underneath it */
    if(e.target&&e.target.closest&&e.target.closest('#dayStrip')){ reset(); return; }
    x0=e.touches[0].clientX; y0=e.touches[0].clientY; drag=false;
  },{passive:true});

  sec.addEventListener('touchmove',e=>{
    if(x0===null||e.touches.length!==1) return;
    const dx=e.touches[0].clientX-x0, dy=e.touches[0].clientY-y0;
    /* commit to a horizontal drag once it clearly beats vertical movement */
    if(!drag && Math.abs(dx)>10 && Math.abs(dx)>Math.abs(dy)) drag=true;
    if(drag){
      const b=body();
      if(b){ b.style.transition='none'; b.style.transform='translateX('+(dx*0.4).toFixed(1)+'px)'; }
    }
  },{passive:true});

  sec.addEventListener('touchend',e=>{
    if(x0===null) return;
    const dx=e.changedTouches[0].clientX-x0, dy=e.changedTouches[0].clientY-y0;
    const wasDrag=drag;
    reset();
    if(!wasDrag) return;
    /* only needs to beat vertical drift, not dominate it — a real thumb
       swipe on a phone always drifts a bit */
    if(Math.abs(dx)<38||Math.abs(dx)<Math.abs(dy)) return;
    lastSwipe=Date.now();                 /* suppress the click a swipe can emit */
    ttDate=addDays(ttDate, dx<0?1:-1);
    renderTT();
    const b=body();
    if(b){ b.classList.remove('slideL','slideR'); void b.offsetWidth;
           b.classList.add(dx<0?'slideL':'slideR'); }
  },{passive:true});

  sec.addEventListener('touchcancel',reset,{passive:true});
})();

/* The card reads differently in each phase, because the question is
   different: climbing you want to know what it takes, holding you want to
   know what you can get away with. */
/* The margin, drawn. `spare` is how many classes you can still miss and
   `total` how many are left in all — filled pips are yours to spend, hollow
   ones are already committed. Capped, because forty pips is a wall, not a
   reading. */
function marginHTML(spare, total, colour){
  if(spare===null||spare===undefined) return '';
  const CAP=14;
  const s=Math.max(0,spare), t=Math.max(s,total||s);
  const shown=Math.min(t,CAP);
  const filled=Math.round(shown*(t?s/t:0));
  let h='<div class="margin'+(s?'':' none')+'" style="--mg:'+(colour||'var(--green)')+'">';
  for(let i=0;i<shown;i++) h+='<i'+(i<filled?'':' class="spent"')+'></i>';
  h+='<span class="mgN">'+(s? s+' to spare' : 'none to spare')+
     (t>CAP?' of '+t:'')+'</span></div>';
  return h;
}

/* ══════════════ WHAT A WEEK HAS TO LOOK LIKE ══════════════
   The goal card gives you a total — "attend 34 of the 51 left" — which is
   true and useless on a Tuesday. What you actually plan in is weeks: this
   many classes on the timetable, this many you have to be at, this many
   you can let go. So the total is spread back over the real weeks left,
   using each week's own class count rather than an average, because a week
   with two classes and a week with twelve are not the same week.

   The misses are handed out proportionally with a running accumulator, so
   they add up to exactly the number you have — no week silently gains or
   loses one to rounding.                                                */
function weekPlan(){
  const horizon=goalHorizon();
  if(!horizon) return null;
  const end=dateOf(horizon);
  let P=0,T=0;
  S.subs.forEach(sb=>{ const A=attFor(sb.id); P+=A.p; T+=A.t; });

  /* every remaining class, grouped into the week it falls in */
  const weeks=[];
  let d=dateOf(todayISO()), guard=0;
  const startOfWeek=x=>{ const c=new Date(x); const w=(c.getDay()+6)%7; return addDays(c,-w); };
  let cur=null;
  while(d<=end && guard++<400){
    const iso=isoOf(d);
    const n=liveSlots(iso).filter(sl=>!S.marks[markKey(iso,sl)]).length;
    const ws=isoOf(startOfWeek(d));
    if(!cur || cur.ws!==ws){ cur={ws, from:iso, to:iso, classes:0, days:[]}; weeks.push(cur); }
    cur.to=iso;
    if(n){ cur.classes+=n; cur.days.push({iso, n}); }
    d=addDays(d,1);
  }
  const K=weeks.reduce((a,w)=>a+w.classes,0);
  if(!K) return {weeks:[], total:0, need:0, misses:0, had:T, p:P};

  const target=(+S.goal||S.thr)/100;
  const rawNeed=Math.ceil(target*(T+K)-P-1e-9);
  const need=clamp(rawNeed,0,K);
  const reachable=rawNeed<=K;
  let misses=K-need;

  /* hand the misses out in proportion to each week's own size */
  let acc=0, given=0;
  weeks.forEach((w,i)=>{
    acc += misses*(w.classes/K);
    let take = (i===weeks.length-1) ? misses-given : Math.floor(acc+1e-9)-given;
    take=clamp(take,0,w.classes);
    w.miss=take; w.attend=w.classes-take; given+=take;
  });

  /* and walk it forward so you can see where the number gets to */
  let p=P,t=T;
  weeks.forEach(w=>{ p+=w.attend; t+=w.classes; w.pct=pctOf(p,t); });

  /* Two different things get called "holding". Spending the surplus drifts
     you down to the goal and buys the most free classes — that is the plan
     above. Staying exactly where you are is a rate, not a budget: attend
     the same fraction you already have and the number does not move. When
     you are above the goal both are true, and only you know which you
     meant, so the sheet shows both. */
  const rate = T? P/T : 0;
  let sp=P, st=T;
  weeks.forEach(w=>{
    w.steady = w.classes ? Math.round(w.classes*rate) : 0;
    sp+=w.steady; st+=w.classes;
    w.steadyPct = pctOf(sp,st);
  });

  const withClasses=weeks.filter(w=>w.classes);
  const avgOf = withClasses.length
    ? Math.round(withClasses.reduce((a,w)=>a+w.classes,0)/withClasses.length) : 0;
  const avgAtt = withClasses.length
    ? Math.round(withClasses.reduce((a,w)=>a+w.attend,0)/withClasses.length) : 0;
  const avgSteady = withClasses.length
    ? Math.round(withClasses.reduce((a,w)=>a+w.steady,0)/withClasses.length) : 0;
  const curPct=pctOf(P,T);   /* `cur` is the week accumulator above */
  return {weeks, total:K, need, misses, reachable, had:T, p:P, cur:curPct,
          target:+S.goal||S.thr, usingGoal:!!S.goal,
          endsAt: t? pctOf(p,t) : 0,
          holding: T>0 && curPct>=(+S.goal||S.thr),
          steady:{classes:avgOf, attend:avgSteady, miss:avgOf-avgSteady,
                  endsAt: st? pctOf(sp,st) : 0},
          typical:{classes:avgOf, attend:avgAtt, miss:avgOf-avgAtt}};
}

/* The sheet the goal card opens: the same arithmetic, but shaped like a
   week, because that is the unit you actually live in. */
function weekPlanHTML(){
  const w=weekPlan();
  if(!w) return '<div class="empty"><div class="eE">\ud83d\udcc5</div>'+
    '<div class="eT">No term end date</div>'+
    '<div class="eS">Set when the semester ends in Settings and this can lay '+
    'out every week between now and then.</div></div>';
  if(!w.total) return '<div class="empty"><div class="eE">\ud83c\udf1e</div>'+
    '<div class="eT">Nothing left on the timetable</div>'+
    '<div class="eS">No unmarked classes between now and the end of term.</div></div>';

  const col=!w.reachable?'var(--red)':w.misses>2?'var(--green)':'var(--orange)';
  let h='<div class="sheetIntro">Your '+(w.usingGoal?'goal':'minimum')+' of '+
    w.target+'%, spread over the weeks you actually have left.</div>';

  /* the headline: what a normal week has to contain */
  h+='<div class="card" style="border-left:3px solid '+col+'">'+
    '<div class="micro">A typical week</div>'+
    '<div style="display:flex;align-items:baseline;gap:8px;margin-top:6px">'+
      '<span class="tnum" style="font-size:34px;font-weight:600;letter-spacing:-.04em;color:'+
        col+'">'+w.typical.attend+'</span>'+
      '<span style="font-size:15px;color:var(--label2)">of '+w.typical.classes+
        ' classes</span>'+
      (w.typical.miss>0
        ? '<span class="pill ok" style="margin-left:auto">'+w.typical.miss+' spare</span>'
        : '<span class="pill no" style="margin-left:auto">no room</span>')+
    '</div>'+
    '<div style="font-size:13px;color:var(--label2);margin-top:9px;line-height:1.5">'+
      (!w.reachable
        ? 'Attending every one of the '+w.total+' left still finishes at <b>'+
          pctFmt(w.endsAt)+'%</b> \u2014 the '+w.target+'% cannot be reached from here.'
        : 'Keep that up across '+w.weeks.filter(function(x){return x.classes;}).length+
          ' weeks and you finish at <b>'+pctFmt(w.endsAt)+'%</b>. '+
          (w.misses? 'You have <b>'+w.misses+'</b> classes to spend in total.'
                   : 'There is nothing spare \u2014 every class counts.'))+
    '</div>'+
    marginHTML(w.misses, w.total, col)+
  '</div>';

  /* above the goal: the other reading of "hold" */
  if(w.holding && w.reachable && w.steady.attend>w.typical.attend){
    h+='<div class="card">'+
      '<div class="micro">Or stay exactly where you are</div>'+
      '<div style="display:flex;align-items:baseline;gap:8px;margin-top:6px">'+
        '<span class="tnum" style="font-size:26px;font-weight:600;letter-spacing:-.04em">'+
          w.steady.attend+'</span>'+
        '<span style="font-size:14px;color:var(--label2)">of '+w.steady.classes+
          ' classes a week</span>'+
        '<span class="pill ok" style="margin-left:auto">'+pctFmt(w.cur)+'%</span>'+
      '</div>'+
      '<div style="font-size:13px;color:var(--label2);margin-top:8px;line-height:1.5">'+
        /* Honest about the rounding: you cannot attend nine and a half
           classes, so the closest you can stand to still is a whole number
           either side of the rate. */
        'Your current rate, rounded to whole classes \u2014 the nearest you can '+
        'stand to still. You finish at <b>'+pctFmt(w.steady.endsAt)+'%</b> '+
        (w.steady.endsAt>w.cur+0.005 ? 'a shade above where you are now'
         : w.steady.endsAt<w.cur-0.005 ? 'a shade below where you are now'
         : 'exactly where you are now')+
        ', against '+pctFmt(w.endsAt)+'% if you spend the surplus instead. '+
        'It costs '+(w.steady.attend-w.typical.attend)+
        ' more class'+((w.steady.attend-w.typical.attend)===1?'':'es')+' a week.'+
      '</div></div>';
  }

  h+='<div class="gHead">Week by week</div><div class="list">';
  w.weeks.forEach(function(x){
    if(!x.classes){
      h+='<div class="row" style="opacity:.5"><div class="rMain">'+
        '<div class="rT" style="font-size:15px">'+esc(weekLabel(x))+'</div>'+
        '<div class="rS">No classes</div></div></div>';
      return;
    }
    const tight=x.miss===0;
    h+='<div class="row"><div class="rMain">'+
      '<div class="rT" style="font-size:15px">'+esc(weekLabel(x))+'</div>'+
      '<div class="rS">'+x.classes+' on the timetable \u00b7 '+
        (tight? 'attend every one' : x.miss+' you can miss')+'</div></div>'+
      '<div style="text-align:right;flex-shrink:0">'+
        '<div class="tnum" style="font-size:16px;font-weight:600">'+x.attend+'/'+x.classes+'</div>'+
        '<div class="tnum" style="font-size:11px;color:var(--label2);margin-top:2px">'+
          pctFmt(x.pct)+'%</div>'+
      '</div></div>';
  });
  h+='</div><div class="gNote">The spare classes are shared out in proportion to '+
     'how busy each week is, so a heavy week gets more of them than a light one.</div>';
  return h;
}
function weekLabel(x){
  const a=dateOf(x.from), b=dateOf(x.to);
  const today=todayISO();
  if(x.from<=today && today<=x.to) return 'This week';
  const sameMonth=a.getMonth()===b.getMonth();
  return a.toLocaleDateString(undefined,{day:'numeric',month:sameMonth?undefined:'short'})+
    '\u2013'+b.toLocaleDateString(undefined,{day:'numeric',month:'short'});
}
function sheetWeekPlan(){
  openSheet({title:'Your weeks', body:weekPlanHTML(), cancelLabel:'Done'});
}

function goalCardHTML(){
  const g=goalOverall();
  if(!g) return '';
  const hold = g.phase==='hold';
  const col = !g.reachable && !g.unknown ? 'var(--red)'
            : hold                       ? 'var(--green)' : 'var(--accent)';
  let h='<div class="gHead">Your goal</div><div class="pad">'+
    '<div class="card" style="border-left:4px solid '+col+'">'+
    '<div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">'+
      '<div><div style="font-size:11.5px;color:var(--label3);text-transform:uppercase;'+
        'letter-spacing:.05em;font-weight:700">Now</div>'+
        '<div class="tnum" style="font-size:30px;font-weight:800;letter-spacing:-.03em;color:'+
        col+'">'+(g.had?pctFmt(g.cur)+'%':'—')+'</div></div>'+
      '<span style="font-size:20px;color:var(--label3)">'+(hold?'\u2261':'\u2192')+'</span>'+
      '<div><div style="font-size:11.5px;color:var(--label3);text-transform:uppercase;'+
        'letter-spacing:.05em;font-weight:700">Goal</div>'+
        '<div class="tnum" style="font-size:24px;font-weight:700;letter-spacing:-.02em;'+
        'color:var(--label2)">'+g.goal+'%</div>'+
        (g.by? '<div class="tnum" style="font-size:10.5px;color:var(--label3);margin-top:2px">by '+
          dateOf(g.by).toLocaleDateString(undefined,{day:'numeric',month:'short'})+'</div>' : '')+
        '</div>'+
      '<span class="pill '+(!g.reachable&&!g.unknown?'no':hold?'ok':'mid')+
        '" style="margin-left:auto">'+
        (!g.reachable&&!g.unknown ? 'out of reach' : hold ? 'holding' : 'climbing')+
      '</span>'+
    '</div>';

  if(g.unknown){
    h+='<div class="gNote" style="padding:10px 0 0">Set your term end date in Settings '+
       'and this can tell you exactly how many classes it takes.</div>';
  } else if(g.by && g.earliest && g.earliest.iso &&
            dateOf(g.by)<dateOf(g.earliest.iso) && !g.earliest.already){
    h+='<div style="font-size:13.5px;color:var(--label2);margin-top:10px;line-height:1.5">'+
      'Not by <b>'+dateOf(g.by).toLocaleDateString(undefined,{day:'numeric',month:'short'})+
      '</b>. '+g.goal+'% needs '+g.earliest.need+' more class'+
      (g.earliest.need===1?'':'es')+' attended, and the last of them is not until <b>'+
      dateOf(g.earliest.iso).toLocaleDateString(undefined,{day:'numeric',month:'short'})+
      '</b> \u2014 with nothing missed in between.</div>';
  } else if(!g.reachable){
    h+='<div style="font-size:13.5px;color:var(--label2);margin-top:10px;line-height:1.5">'+
      'Even attending every one of the '+g.remaining+' classes left, you finish at <b>'+
      pctFmt(g.best)+'%</b>. '+(g.best>=S.thr
        ? 'Still above the '+S.thr+'% you need, so the goal is the only thing out of reach.'
        : 'That is below the '+S.thr+'% you need \u2014 the goal is not the problem here.')+
      '</div>';
  } else if(hold){
    h+='<div style="font-size:13.5px;color:var(--label2);margin-top:10px;line-height:1.5">'+
      (g.rhythm
        ? 'To sit still at this level, attend <b style="color:var(--label)">'+g.rhythm.n+
          ' of every '+g.rhythm.d+'</b> classes \u2014 that is the rate that neither '+
          'lifts nor drops you.'
        : 'Attend at your current rate and the number stays where it is.')+
      '</div>'+
      marginHTML(g.slack, g.remaining,
                 g.slack>2?'var(--green)':g.slack?'var(--orange)':'var(--red)');
  } else {
    const gap=g.need-0;
    h+='<div style="font-size:13.5px;color:var(--label2);margin-top:10px;line-height:1.5">'+
      'Attend <b style="color:var(--label)">'+gap+'</b> of the '+g.remaining+
      ' classes left to get there'+
      (g.slack>0 ? '.' : ' \u2014 every single one. No room to miss any.')+
      '</div>'+
      marginHTML(g.slack, g.remaining,
                 g.slack>2?'var(--accent)':g.slack?'var(--orange)':'var(--red)');
  }

  if(g.blocking && g.blocking.length){
    h+='<div style="margin-top:12px;padding-top:11px;border-top:.5px solid var(--sep);'+
      'display:flex;gap:6px;flex-wrap:wrap">'+
      g.blocking.slice(0,6).map(b=>'<span class="pill '+
        (b.g.reachable?'mid':'no')+'">'+esc(b.sub.code)+' '+pctFmt(b.g.cur)+'%'+
        (b.g.reachable&&b.g.remaining!=null?' \u00b7 '+b.g.need+' to go':'')+'</span>').join('')+
      '</div>'+
      '<div class="gNote" style="padding:8px 0 0">Behind on these. The overall number '+
      'hides them, but attendance is checked per subject.</div>';
  }

  h+='<div style="display:flex;gap:9px;margin-top:13px">'+
      '<button class="btn ghost sm" id="goalWeeks">How my weeks look</button>'+
      '<button class="btn ghost sm" id="goalEdit">Change goal</button>'+
    '</div>'+
    (hold?'':'<button class="btn ghost sm" id="goalHere" style="margin-top:9px">'+
      'Hold me where I am instead</button>');
  return h+'</div></div>';
}
/* Setting it, and the shortcut that is the whole point of "maintain": take
   where I am now and make that the line. */
function sheetGoal(){
  const g=goalOverall();
  let GP=0,GT=0; S.subs.forEach(sb=>{const A=attFor(sb.id); GP+=A.p; GT+=A.t;});
  const cur=pctOf(GP,GT);
  const ed=earliestGoalDate(+S.goal||75);
  const body='<div class="sheetIntro">A goal is what you\u2019re aiming for. It sits above '+
    'the '+S.thr+'% you actually have to hold \u2014 that minimum never moves.</div>'+
    '<div class="list">'+
      '<label class="row"><div class="rMain"><div class="rT">Goal</div>'+
      '<div class="rS">Leave at 0 to turn this off</div></div>'+
      '<input type="number" id="glVal" min="0" max="100" value="'+(+S.goal||0)+'" '+
      'style="width:76px;text-align:center;background:var(--fill);border-radius:8px;'+
      'padding:7px 0;flex:none"></label>'+
      '<label class="row"><div class="rMain"><div class="rT">Reach it by</div>'+
      '<div class="rS">Blank means the end of term</div></div>'+
      '<input type="date" id="glBy" value="'+esc(S.goalBy||'')+'"></label>'+
    '</div>'+
    '<div id="glWhen"></div>'+
    (GT? '<div class="gHead tight">Quick</div><div class="list">'+
      '<button class="row tap" id="glNow"><span class="ico" style="background:var(--green)">\u2261</span>'+
        '<div class="rMain"><div class="rT">Hold me at '+pctFmt(cur)+'%</div>'+
        '<div class="rS">Where you are right now \u2014 don\u2019t climb, don\u2019t slip</div></div>'+
        '</button>'+
      [75,80,85].filter(v=>v>cur).slice(0,2).map(v=>
        '<button class="row tap" data-gq="'+v+'"><span class="ico" style="background:var(--accent)">'+
        '\u2191</span><div class="rMain"><div class="rT">Climb to '+v+'%</div></div></button>').join('')+
      '</div>' : '')+
    '<div class="gNote">Once you reach it the card switches from what it takes to get '+
    'there, to how much you can afford to miss while staying there.</div>';
  openSheet({title:'Attendance goal', body, doneLabel:'Save',
    after(){
      const nw=$('#glNow');
      const val=()=>clamp(parseInt($('#glVal').value)||0,0,100);
      /* Recomputed as you type, because "85% by Friday" needs answering
         while you can still change Friday. */
      const verdict=()=>{
        const box=$('#glWhen'); if(!box) return;
        const g=val();
        if(!g){ box.innerHTML=''; return; }
        const e=earliestGoalDate(g);
        const by=($('#glBy')&&$('#glBy').value)||'';
        let msg,col;
        if(e.never){ col='var(--red)';
          msg='<b>Not reachable at all.</b> '+g+'% allows no absences, and there '+
              'are already some on the record \u2014 attending everything from here '+
              'cannot undo them.'; }
        else if(e.already){ col='var(--green)';
          msg='You are already at or above '+g+'%. Setting it here holds the line.'; }
        else if(!e.iso){ col='var(--red)';
          msg='<b>Not reachable this term.</b> Even attending every remaining class '+
              'falls short of '+g+'%.'; }
        else {
          const soonest=dateOf(e.iso).toLocaleDateString(undefined,
            {day:'numeric',month:'short'});
          if(by && dateOf(by)<dateOf(e.iso)){ col='var(--orange)';
            msg='<b>Not by then.</b> '+g+'% needs '+e.need+' more class'+
                (e.need===1?'':'es')+' attended, and the '+e.need+
                (e.need===1?'st':'th')+' one is not until <b>'+soonest+'</b> \u2014 '+
                'and only if you miss none between now and then.'+
                '<div style="margin-top:9px"><button class="btn ghost sm" id="glFix">'+
                'Move it to '+soonest+'</button></div>'; }
          else { col='var(--green)';
            msg='Possible from <b>'+soonest+'</b> at the earliest \u2014 that is '+
                e.need+' class'+(e.need===1?'':'es')+' attended with nothing missed. '+
                (by? 'Your date leaves room on top of that.'
                   : 'Pick a date after that, or leave it blank for the end of term.'); }
        }
        box.innerHTML='<div class="card" style="border-left:3px solid '+col+';margin-top:12px">'+
          '<div style="font-size:13px;color:var(--label2);line-height:1.5">'+msg+'</div></div>';
        const fx=$('#glFix');
        if(fx) fx.onclick=()=>{ const e2=earliestGoalDate(val());
          if(e2.iso){ $('#glBy').value=e2.iso; verdict(); } };
      };
      verdict();
      const gv=$('#glVal'); if(gv){ gv.oninput=verdict; gv.onchange=verdict; }
      const gb=$('#glBy');  if(gb){ gb.onchange=verdict; }
      if(nw) nw.onclick=()=>{ $('#glVal').value=Math.floor(cur); verdict(); };
      $$('#sheetBody [data-gq]').forEach(b=>b.onclick=()=>{
        $('#glVal').value=b.dataset.gq; verdict(); });
    },
    onSave(){
      S.goal=clamp(parseInt($('#glVal').value)||0,0,100);
      const by=($('#glBy')&&$('#glBy').value)||'';
      S.goalBy=/^\d{4}-\d{2}-\d{2}$/.test(by)?by:'';
      save(); renderAll();
      toast(S.goal? (S.goal<=cur?'Holding at '+S.goal+'%.':'Goal set: '+S.goal+'%.')
                  : 'Goal cleared.');
    }});
}

  $('#attTop').innerHTML='<div class="pad"><div class="card" style="display:flex;gap:18px;align-items:center">'+
    ringHTML(gp,col,GT?null:'—')+
    '<div style="flex:1;min-width:0">'+
      '<div style="font-size:15px;font-weight:600;margin-bottom:3px">Overall</div>'+
      '<div style="font-size:13.5px;color:var(--label2);line-height:1.4">'+
        (GT? GP+' attended of '+GT+' classes' : 'No classes recorded yet')+'</div>'+

        '</div>'+
        '<div style="font-size:25px;font-weight:600;letter-spacing:-.045em;color:'+c+'" class="tnum">'+
          (A.t?pctFmt(p)+'%':'—')+'</div>'+
      '</div>'+
      '<div class="bar"><div class="fl" style="width:'+clamp(p,0,100)+'%;background:'+c+'"></div>'+
        '<div class="rq" style="left:'+S.thr+'%"></div></div>'+
      '<div style="font-size:13.5px;color:var(--label2);margin-top:10px;line-height:1.4">'+bunkLine(A.p,A.t)+'</div>'+
      (function(){
        if(!rem) return '';
        const k=rem[sub.id]||0, sl=slackFor(sub.id,k);
        if(!k) return '';

                : 'miss '+sl+' more and you still finish at '+S.thr+'%')+'</div>'+

function cmpChip(label,c,mkLabel){
  if(!c.t) return '';                       /* subject doesn't have this component — don't clutter the card */
  const mk=attMarks(c.p,c.t);
  const cls = mk===0?'no' : mk===5?'ok':'mid';
  return '<span class="pill '+cls+'">'+label+' '+c.p+'/'+c.t+' · '+mkLabel+' '+mk+'/5</span>';
}
function renderMonths(){
  const byM={};
  for(const k in S.marks){
    const v=S.marks[k]; if(v==='c') continue;
    const mo=k.slice(0,7);
    (byM[mo]||(byM[mo]={p:0,t:0}));
    byM[mo].t++; if(v==='p') byM[mo].p++;
  }
  const rows=Object.keys(byM).sort();
  if(!rows.length){
    $('#attMonths').innerHTML='<div class="gHead">Month by month</div><div class="pad"><div class="list">'+
      '<div class="row"><div class="rMain"><div class="rT" style="color:var(--label2);font-size:15px">Builds up as you mark classes</div>'+
      '<div class="rS">Numbers you type in "Fix the numbers" have no dates, so they can’t appear here — but they still count in the totals.</div></div></div></div></div>';
    return;
  }
  let TP=0,TT=0;
  let h='<div class="gHead">Month by month</div><div class="pad"><div class="list">';
  rows.forEach(mo=>{
    const o=byM[mo]; TP+=o.p; TT+=o.t;
    const p=pctOf(o.p,o.t);
    h+='<button class="row tap" data-mo="'+mo+'"><div class="rMain">'+
      '<div class="rT">'+new Date(mo+'-01T00:00:00').toLocaleDateString(undefined,{month:'long',year:'numeric'})+'</div>'+
      '<div class="rS">'+o.p+' present · '+(o.t-o.p)+' absent · '+o.t+' total</div></div>'+
      '<span class="pill '+(p>=S.thr?'ok':'no')+'">'+pctFmt(p)+'%</span>'+
      '<span class="chev">›</span></button>';
  });
  const tp=pctOf(TP,TT);
  h+='<div class="row"><div class="rMain"><div class="rT" style="font-weight:600">All marked classes</div>'+
    '<div class="rS">'+TP+' of '+TT+'</div></div>'+
    '<span class="pill '+(tp>=S.thr?'ok':'no')+'">'+pctFmt(tp)+'%</span></div>';
  $('#attMonths').innerHTML=h+'</div></div>';
  $$('#attMonths [data-mo]').forEach(b=>b.onclick=()=>sheetMonth(b.dataset.mo));
}

/* ══════════════ MONTH DETAIL ══════════════
   Everything that was marked in one month, grouped by day. Marks stay
   editable here so a mistake spotted in the breakdown can be fixed
   without hunting for the day in the timetable.                       */
function monthEntries(mo){
  const byDay={};
  for(const k in S.marks){
    if(k.slice(0,7)!==mo) continue;
    const p=k.split('|');
    const sub=subById(p[2]); if(!sub) continue;      /* subject since deleted */
    (byDay[p[0]]=byDay[p[0]]||[]).push({
      key:k, iso:p[0], kind:p[3]||'th', sub,
      mark:S.marks[k],
      slot:S.slots.find(s=>s.id===p[1])||null
    });
  }
  Object.keys(byDay).forEach(d=>byDay[d].sort((a,b)=>{
    const at=a.slot?t2m(a.slot.start):0, bt=b.slot?t2m(b.slot.start):0;
    return at-bt;
  }));
  return byDay;
}
function monthHTML(mo){
  const byDay=monthEntries(mo);
  const days=Object.keys(byDay).sort().reverse();      /* newest day first */
  const title=new Date(mo+'-01T00:00:00').toLocaleDateString(undefined,{month:'long',year:'numeric'});
  if(!days.length) return '<div class="empty"><div class="eE">📭</div>'+
    '<div class="eT">Nothing marked in '+esc(title)+'</div></div>';

  /* month totals — cancelled classes count towards neither side */
  let P=0,A=0,C=0; const perSub={};
  days.forEach(d=>byDay[d].forEach(e=>{
    if(e.mark==='p') P++; else if(e.mark==='a') A++; else C++;
    const s=perSub[e.sub.id]=perSub[e.sub.id]||{sub:e.sub,p:0,a:0};
    if(e.mark==='p') s.p++; else if(e.mark==='a') s.a++;
  }));
  const held=P+A, pct=pctOf(P,held);

  let h='<div class="pad" style="padding:0"><div class="card" style="margin-bottom:14px">'+
    '<div style="display:flex;align-items:baseline;gap:10px">'+
      '<div style="font-size:30px;font-weight:800;letter-spacing:-.03em;'+
        'color:'+(held? (pct>=S.thr?'var(--green)':'var(--red)') :'var(--label3)')+'" class="tnum">'+
        (held?pctFmt(pct)+'%':'—')+'</div>'+
      '<div style="font-size:13.5px;color:var(--label2)">'+P+' present · '+A+' absent'+
        (C?' · '+C+' cancelled':'')+'</div></div>'+
    '<div style="display:flex;gap:7px;flex-wrap:wrap;margin-top:12px">'+
      Object.keys(perSub).map(id=>{
        const s=perSub[id], t=s.p+s.a, q=pctOf(s.p,t);
        return '<span class="pill '+(!t?'':q>=S.thr?'ok':'no')+'">'+esc(s.sub.code)+' '+s.p+'/'+t+'</span>';
      }).join('')+
    '</div></div>';

  days.forEach(iso=>{
    const d=dateOf(iso);
    h+='<div class="gHead" style="padding-left:4px;padding-right:4px">'+
      d.toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'short'})+'</div>';
    byDay[iso].forEach(e=>{
      const sl=e.slot||{kind:e.kind,start:'',end:'',room:''};
      h+='<div class="cls '+scCls(e.sub)+'">'+
        '<div class="cTop">'+
          '<div class="cTime">'+(e.slot?fmtT(e.slot.start)+'<br>'+fmtT(e.slot.end):'—')+'</div>'+
          '<div class="cName">'+esc(e.sub.name)+kindTag(sl)+onlineTag(sl)+
            '<div class="cMeta">'+esc(e.sub.code)+
            (e.slot&&placeOf(e.slot)?' · '+esc(placeOf(e.slot)):'')+
            (e.slot?'':' · class since removed')+'</div></div>'+
        '</div>'+mkSegHTML(e.key)+'</div>';
    });
  });
  return h+'</div>';
}
/* ══════════════ "SHOULD I SKIP TODAY?" ══════════════ */
function sheetSkipToday(x){
  /* defensive: if this ever gets bound straight to onclick again, an Event
     would arrive here and silently render an empty sheet */
  if(!x||!x.rows) x=nextSkipDay();

  const col=SKIP_COLOUR[x.verdict];

  let body='<div class="card" style="margin-bottom:14px">'+
    '<div class="kicker">If you skip all '+x.count+' class'+(x.count===1?'':'es')+' '+esc(x.when)+'</div>'+
    '<div style="display:flex;align-items:baseline;gap:10px;margin-top:9px">'+
      '<span class="tnum" style="font-size:26px;font-weight:800;letter-spacing:-.03em;color:var(--label2)">'+
        (x.hasHistory?pctFmt(x.now)+'%':'—')+'</span>'+
      '<span style="font-size:19px;color:var(--label3)">→</span>'+

      '<span class="pill '+(x.verdict==='ok'?'ok':x.verdict==='tight'?'mid':'no')+
        '" style="margin-left:auto">'+SKIP_WORD[x.verdict]+'</span>'+
    '</div>'+
    '<div style="font-size:14px;color:var(--label2);margin-top:11px;line-height:1.45">'+
      esc(skipVerdictLine(x))+'</div></div>';

  body+='<div class="gHead" style="padding-left:4px">Subject by subject</div><div class="list">';
  x.rows.forEach(r=>{
    const rc = !r.had ? 'var(--label2)' : r.safe ? 'var(--green)' : 'var(--red)';
    let note;
    if(!r.had) note='No classes recorded yet';
    else if(r.safe) note='Stays above '+S.thr+'%';
    else if(!isFinite(r.recover)) note='Cannot be recovered at a 100% requirement';
    else note='Below '+S.thr+'% — '+r.recover+' in a row to recover';
    body+='<div class="row '+scCls(r.sub)+'">'+
      '<span class="ico" style="background:var(--sc);font-size:11px;font-weight:700">'+
        esc(r.sub.code.slice(0,3))+'</span>'+

      '<div class="rV tnum" style="color:'+rc+';font-weight:600">'+

  });
  body+='</div>';

  body+='<div style="height:18px"></div>'+

  openSheet({

    after(){
      $('#skDo').onclick=()=>{
        x.pending.forEach(sl=>S.marks[markKey(x.iso,sl)]='a');
        save(); closeSheet(); keepScroll(renderAll);

      };

/* ══════════════ ATTENDANCE APPEAL ══════════════
   End-of-semester: find every class you were marked absent for, work out
   how many need reversing to clear the threshold, and draft the message
   to the professor. Reversing an absence moves it to present — the total
   held is unchanged — so the maths is ceil(thr*total) - present.        */
function absencesFor(subId){
  const out=[];
  for(const k in S.marks){
    if(S.marks[k]!=='a') continue;
    const p=k.split('|');
    if(p[2]!==subId) continue;
    out.push({key:k, iso:p[0], kind:p[3]||'th',
              slot:S.slots.find(s=>s.id===p[1])||null});
  }
  return out.sort((a,b)=>a.iso.localeCompare(b.iso));
}
/* how many reversals it takes to reach the required percentage */
function reversalsNeeded(p,t){
  if(!t) return 0;
  if(pctOf(p,t)>=S.thr) return 0;
  return Math.max(0, Math.ceil(S.thr/100*t - p - 1e-9));
}
let appealSel={};                 /* key -> true, which absences are ticked */
function appealHTML(sub){
  const A=attFor(sub.id), abs=absencesFor(sub.id);
  const need=reversalsNeeded(A.p,A.t);
  const picked=abs.filter(a=>appealSel[a.key]);
  const after=pctOf(A.p+picked.length, A.t);

  let h='<div class="card" style="margin-bottom:14px">'+
    '<div style="font-size:17px;font-weight:700;letter-spacing:-.02em">'+esc(sub.name)+'</div>'+
    '<div style="display:flex;align-items:baseline;gap:9px;margin-top:8px">'+
      '<span class="tnum" style="font-size:26px;font-weight:800;color:'+
        (pctOf(A.p,A.t)>=S.thr?'var(--green)':'var(--red)')+'">'+pctFmt(pctOf(A.p,A.t))+'%</span>'+
      (picked.length? '<span style="font-size:18px;color:var(--label3)">→</span>'+
        '<span class="tnum" style="font-size:26px;font-weight:800;color:'+
        (after>=S.thr?'var(--green)':'var(--red)')+'">'+pctFmt(after)+'%</span>' : '')+
      '<span style="font-size:13px;color:var(--label2);margin-left:auto">'+A.p+'/'+A.t+'</span>'+
    '</div>'+
    '<div style="font-size:13.5px;color:var(--label2);margin-top:10px;line-height:1.45">'+
      (!abs.length ? 'No absences recorded for this subject — nothing to appeal.'
       : !need ? 'Already above '+S.thr+'%. Nothing needs reversing.'
       : 'You need <b style="color:var(--label)">'+need+'</b> of these '+abs.length+
         ' absence'+(abs.length===1?'':'s')+' reversed to reach '+S.thr+'%.'+
         (picked.length? ' You’ve picked <b style="color:var(--label)">'+picked.length+'</b>.' : ''))+
    '</div></div>';

  if(!abs.length) return h;

  h+='<div class="gHead" style="padding-left:4px">Pick the classes to appeal</div>'+
     '<div style="display:flex;gap:9px;margin-bottom:10px">'+
       '<button class="btn ghost sm" id="apAll">Select all</button>'+
       '<button class="btn ghost sm" id="apNone">Clear</button></div>'+
     '<div class="list">';
  abs.forEach(a=>{
    const on=!!appealSel[a.key], sl=a.slot||{kind:a.kind};
    h+='<button class="row tap" data-ap="'+esc(a.key)+'">'+
      '<span class="dlChk'+(on?' on':'')+'">✓</span>'+
      '<div class="rMain"><div class="rT">'+
        dateOf(a.iso).toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'})+
        kindTag(sl)+onlineTag(sl)+'</div>'+
      '<div class="rS">'+(a.slot? fmtT(a.slot.start)+'–'+fmtT(a.slot.end)+
        (placeOf(a.slot)?' · '+esc(placeOf(a.slot)):'') : 'class since removed')+'</div></div>'+
      '</button>';
  });
  h+='</div>';

  h+='<div class="gHead">Why were you away?</div><div class="list">'+
     '<label class="row"><input type="text" id="apReason" placeholder="medical leave, family emergency…" '+
       'value="'+esc(appealSel.__reason||'')+'" style="text-align:left"></label></div>'+
     '<div style="height:14px"></div>'+
     '<button class="btn sm" id="apMake">Write the message ('+picked.length+')</button>'+
     '<div class="gNote" style="text-align:center">Nothing is sent from the app — you get text to copy.</div>';
  return h;
}
function appealMessage(sub,picked,reason){
  const A=attFor(sub.id);
  const lines=picked.map(a=>{
    const d=dateOf(a.iso).toLocaleDateString(undefined,
      {weekday:'long',day:'numeric',month:'long',year:'numeric'});
    const when=a.slot? ' ('+fmtT(a.slot.start)+'–'+fmtT(a.slot.end)+')' : '';
    const kind=KIND_NAME[a.slot?kindOf(a.slot):a.kind];
    return '  • '+d+when+' — '+kind;
  }).join('\n');
  return 'Subject: Attendance rectification request — '+sub.name+' ('+sub.code+')\n\n'+
    'Respected Sir/Ma’am,\n\n'+
    'I hope you are well. I am writing to request a review of my attendance record for '+
    sub.name+'.\n\nI was marked absent for the following '+
    (picked.length===1?'class':picked.length+' classes')+':\n\n'+lines+'\n\n'+
    (reason? 'Reason: '+reason+'\n\n' : '')+
    'My attendance in this subject currently stands at '+pctFmt(pctOf(A.p,A.t))+'% ('+
    A.p+' of '+A.t+' classes). If you find the above in order, I would be grateful '+
    'if these could be marked as present.\n\n'+
    'I am happy to provide any supporting documents you may need. '+
    'Thank you for your time and consideration.\n\n'+
    'Respectfully,\n'+(S.name||'[your name]');
}
function sheetAppealMessage(sub,picked,reason){
  const msg=appealMessage(sub,picked,reason);
  openSheet({
    title:'Message', cancelLabel:'Done',
    body:'<div class="sheetIntro">Copy this and send it however you normally reach your professor.</div>'+
      '<div class="card" style="white-space:pre-wrap;font-size:14px;line-height:1.55;'+
        'font-family:var(--font);color:var(--label)">'+esc(msg)+'</div>'+
      '<div style="height:14px"></div>'+
      '<button class="btn sm" id="apCopy">Copy message</button>'+
      (S.name?'':'<div class="gNote" style="text-align:center">Add your name in Settings and it signs off properly.</div>'),
    after(){
      $('#apCopy').onclick=()=>{
        let done=false;
        try{
          if(navigator.clipboard&&navigator.clipboard.writeText){
            navigator.clipboard.writeText(msg); done=true;
          }
        }catch(e){}
        toast(done?'Copied.':'Select the text above to copy.');
      };
    }
  });
}
function sheetAppeal(sub){
  appealSel={};
  const bind=()=>{
    const refresh=()=>{
      appealSel.__reason=($('#apReason')&&$('#apReason').value)||appealSel.__reason||'';
      $('#sheetBody').innerHTML=appealHTML(sub); bind();
    };
    $$('#sheetBody [data-ap]').forEach(b=>b.onclick=()=>{
      const k=b.dataset.ap;
      if(appealSel[k]) delete appealSel[k]; else appealSel[k]=true;
      refresh();
    });
    const all=$('#apAll'), none=$('#apNone');
    if(all)  all.onclick =()=>{ absencesFor(sub.id).forEach(a=>appealSel[a.key]=true); refresh(); };
    if(none) none.onclick=()=>{ const r=appealSel.__reason; appealSel={__reason:r}; refresh(); };
    const mk=$('#apMake');
    if(mk) mk.onclick=()=>{
      const picked=absencesFor(sub.id).filter(a=>appealSel[a.key]);
      if(!picked.length){ toast('Pick at least one class first.'); return; }
      const reason=($('#apReason')&&$('#apReason').value.trim())||'';
      sheetAppealMessage(sub,picked,reason);
    };
  };
  openSheet({title:'Appeal · '+sub.code, body:appealHTML(sub), cancelLabel:'Close', after:bind});
}
function sheetAppealPick(){
  const withAbs=S.subs.map(s=>({sub:s,n:absencesFor(s.id).length,A:attFor(s.id)}))
                      .filter(x=>x.n>0)
                      .sort((a,b)=>pctOf(a.A.p,a.A.t)-pctOf(b.A.p,b.A.t));
  if(!withAbs.length){
    openSheet({title:'Attendance appeal', cancelLabel:'Done',
      body:'<div class="empty"><div class="eE">🎉</div><div class="eT">No absences on record</div>'+
        '<div class="eS">Nothing to appeal — every class you’ve marked is a present.</div></div>'});
    return;
  }
  let h='<div class="sheetIntro">Pick a subject to see every class you were marked absent for, '+
    'choose which ones to appeal, and get a message to send.</div><div class="list">';
  withAbs.forEach(x=>{
    const pct=pctOf(x.A.p,x.A.t), need=reversalsNeeded(x.A.p,x.A.t);
    h+='<button class="row tap '+scCls(x.sub)+'" data-apsub="'+x.sub.id+'">'+
      '<span class="ico" style="background:var(--sc);font-size:11px;font-weight:700">'+
        esc(x.sub.code.slice(0,3))+'</span>'+
      '<div class="rMain"><div class="rT">'+esc(x.sub.name)+'</div>'+
      '<div class="rS">'+x.n+' absence'+(x.n===1?'':'s')+
        (need? ' · '+need+' to reverse for '+S.thr+'%' : ' · already above '+S.thr+'%')+'</div></div>'+
      '<span class="pill '+(pct>=S.thr?'ok':'no')+'">'+pctFmt(pct)+'%</span>'+
      '<span class="chev">›</span></button>';
  });
  openSheet({title:'Attendance appeal', body:h+'</div>', cancelLabel:'Done',
    after(){ $$('#sheetBody [data-apsub]').forEach(b=>b.onclick=()=>sheetAppeal(subById(b.dataset.apsub))); }});

/* ══════════════ "WORTH GOING?" ══════════════ */

   The suggested options are combinations of whole campus blocks, which is
   most days but not all of them. When the day you actually want is "this
   one, that one, not that one", tick them. Same maths, your choice.       */
let pickSel=null, pickIso=null;
function pickHTML(iso){

function sheetPickDay(iso){
  iso=iso||todayISO();
  pickIso=iso;
  /* start from whatever you'd already planned, or the whole day */
  const live=liveSlots(iso), cur=planFor(iso);
  pickSel={};
  (cur || live.map(sl=>sl.id)).forEach(id=>{ pickSel[id]=true; });

  const bind=()=>{
    const refresh=()=>{ $('#sheetBody').innerHTML=pickHTML(iso); bind(); };
    $$('#sheetBody [data-pk]').forEach(b=>b.onclick=()=>{
      const id=b.dataset.pk;
      if(pickSel[id]) delete pickSel[id]; else pickSel[id]=true;
      refresh();
    });
    $$('#sheetBody [data-un]').forEach(b=>b.onclick=()=>{
      const sl=S.slots.find(x=>x.id===b.dataset.un); if(!sl) return;
      delete S.marks[markKey(iso,sl)];
      pickSel[sl.id]=true;               /* restored means you're going again */
      save(); renderAll(); refresh();
    });
    const a=$('#pkAll'), n=$('#pkNone');
    if(a) a.onclick=()=>{ liveSlots(iso).forEach(sl=>{ pickSel[sl.id]=true; }); refresh(); };
    if(n) n.onclick=()=>{ pickSel={}; refresh(); };
  };

  openSheet({
    title:'Pick your classes', body:pickHTML(iso), doneLabel:'Save plan', after:bind,
    onSave(){
      const live2=liveSlots(iso);
      const ids=live2.filter(sl=>pickSel[sl.id]).map(sl=>sl.id);
      const isAll = ids.length===live2.length;
      setPlan(iso, isAll?null:ids);
      renderAll();
      toast(isAll ? 'Planned: the full day.'
           : ids.length ? 'Plan saved — '+ids.length+' class'+(ids.length===1?'':'es')+'.'
           : 'Planned: not going.');
    }
  });
}

/* ══════════════ OFFLINE READINESS ══════════════
   A real check, not a badge. The file makes no network requests at all, so
   the only things that can actually stop it working offline are storage
   being blocked, or it being served from a URL the browser hasn't cached. */
function offlineReport(){
  let proto='';
  try{ proto=(location&&location.protocol)||''; }catch(e){}
  const local = proto==='file:' || proto==='';
  let storage='blocked', bytes=0;
  try{
    const probe='__eh_probe__';
    localStorage.setItem(probe,'1');
    if(localStorage.getItem(probe)==='1') storage='working';
    localStorage.removeItem(probe);
    bytes=(localStorage.getItem(KEY)||'').length;
  }catch(e){ storage='blocked'; }
  let online=null;
  try{ if(typeof navigator!=='undefined' && 'onLine' in navigator) online=!!navigator.onLine; }catch(e){}
  const standalone = (function(){
    try{ return !!(navigator.standalone ||
      (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches)); }
    catch(e){ return false; }
  })();
  /* Three real states, not a badge:
       blocked  — storage is off, nothing works properly at all
       hosted   — loaded from a URL. Every request the app makes is zero, but
                  the page itself still came off a server, and a browser is
                  free to drop its copy. Offline is likely, not guaranteed.
       local    — the file is on the device. This is the only unconditional yes. */
  /* hosted: is the worker actually in charge, or still settling? */
  let sw='none';
  try{
    if(!local && 'serviceWorker' in navigator)
      sw = navigator.serviceWorker.controller ? 'active' : 'pending';
  }catch(e){}
  const level = storage!=='working' ? 'blocked'
              : local               ? 'local'
              : sw==='active'       ? 'cached'
              : sw==='pending'      ? 'pending'
              : 'hosted';
  return {proto, local, storage, bytes, online, standalone, level, sw,
          ready: storage==='working'};
}

/* ══════════════ LEAVE ══════════════
   "I'm out 4th–15th — what does that cost me, and can I still recover?"
   Counts every class in the window that isn't already settled, then judges
   it against the runway exactly like a single-day skip.                  */
function absenceRange(fromISO,toISO){
  if(!fromISO||!toISO) return null;
  if(dateOf(toISO)<dateOf(fromISO)){ const t=fromISO; fromISO=toISO; toISO=t; }
  const bySub={}, byDay=[];
  let total=0, d=dateOf(fromISO);
  for(let i=0;i<400;i++){
    const iso=isoOf(d);
    if(dateOf(iso)>dateOf(toISO)) break;
    const hits=liveSlots(iso).filter(sl=>!S.marks[markKey(iso,sl)]);
    if(hits.length){
      byDay.push({iso,d:dateOf(iso),slots:hits});
      hits.forEach(sl=>{ bySub[sl.subId]=(bySub[sl.subId]||0)+1; total++; });
    }
    d=addDays(d,1);
  }
  const rem=remainingBySub(todayISO());
  const rows=Object.keys(bySub).map(id=>{
    const A=attFor(id), n=bySub[id];
    const now=pctOf(A.p,A.t), after=pctOf(A.p,A.t+n);
    const rw=runwayVerdict(id, rem?rem[id]||0:null, n);
    return {sub:subById(id), n, now, after, had:A.t, rw};
  }).sort((a,b)=>RUNWAY_RANK[b.rw.level]-RUNWAY_RANK[a.rw.level] || a.after-b.after);
  const worst=rows.reduce((w,r)=>Math.max(w,RUNWAY_RANK[r.rw.level]),0);
  const days=Math.round((dateOf(toISO)-dateOf(fromISO))/864e5)+1;
  /* the headline you actually came for: one number, before and after */
  let GP=0,GT=0;
  S.subs.forEach(sb=>{ const A=attFor(sb.id); GP+=A.p; GT+=A.t; });
  const overallNow=pctOf(GP,GT), overallAfter=pctOf(GP,GT+total);
  return {fromISO,toISO,days,total,byDay,rows,worst,
          overallNow, overallAfter, overallDrop:overallNow-overallAfter,
          overallHad:GT,
          verdict: worst>=2?'gone':worst===1?'tight':'ok',
          weeksLeft:termWeeksLeft()};
}
/* the longest leave you could take starting that day and still recover */
function longestSafeLeave(fromISO,cap){
  cap=cap||45;
  let best=0;
  for(let n=1;n<=cap;n++){
    const r=absenceRange(fromISO, isoOf(addDays(dateOf(fromISO),n-1)));
    if(!r || r.worst>=2) break;
    best=n;
  }
  return best;
}

/* ══════════════ THE APPLICATION ══════════════
   Any leave, not just medical: illness, a family matter, a wedding, travel,
   or something you'd rather just describe yourself. You supply the reason in
   your own words; this puts it in the shape a college office expects, with
   the dates and the class count already filled in.

   Deliberately formal whatever your tone setting is — the app can be as
   sarcastic as you like with you, but not in a letter to your HOD.        */
const LEAVE_KINDS=[
  {k:'med',  l:'Medical',        ph:'e.g. typhoid, dengue, a fracture',
   line:d=>'as I am suffering from '+d+' and have been advised rest by my doctor',
   bare:'owing to illness, for which I have been advised rest by my doctor',
   note:'I will submit my medical certificate on my return.'},
  {k:'fam',  l:'Family',         ph:'e.g. my father’s surgery',
   line:d=>'owing to '+d+', a family matter that requires my presence at home',
   bare:'owing to an urgent family matter that requires my presence at home', note:''},
  {k:'func', l:'Wedding/function', ph:'e.g. my sister’s wedding',
   line:d=>'as I have to attend '+d+', for which I will be out of station',
   bare:'as I have to attend a family function, for which I will be out of station',
   note:''},
  {k:'trav', l:'Travel',         ph:'e.g. a family trip to Kerala',
   line:d=>'as I will be travelling out of station for '+d,
   bare:'as I will be travelling out of station', note:''},
  {k:'oth',  l:'Other',          ph:'describe it in your own words',
   line:d=>'as '+d, bare:'owing to personal reasons', note:''}
];
function fmtLong(iso){
  return dateOf(iso).toLocaleDateString(undefined,
    {day:'numeric',month:'long',year:'numeric'});
}
function leaveApplication(from,to,kind,detail,addressee){
  const K=LEAVE_KINDS.find(x=>x.k===kind)||LEAVE_KINDS[0];
  const r=absenceRange(from,to);
  const d=(detail||'').trim().replace(/[.\s]+$/,'');
  const days=r?r.days:1;
  const who=(addressee||'').trim()||'The Head of Department';
  const me=(S.name||'').trim();
  const sameDay=from===to;

  const L=[];
  L.push('To,');
  L.push(who+',');
  if(S.college && S.college.trim()) L.push(S.college.trim()+',');
  L.push('');
  L.push('Subject: Application for leave '+(sameDay?'on ':'from ')+
         fmtLong(from)+(sameDay?'':' to '+fmtLong(to)));
  L.push('');
  L.push('Respected Sir/Ma’am,');
  L.push('');

  let intro='I am writing to request leave ';
  intro += sameDay ? 'on '+fmtLong(from) : 'from '+fmtLong(from)+' to '+fmtLong(to);
  intro += ' ('+days+' day'+(days===1?'':'s')+'), ';
  intro += (d ? K.line(d) : K.bare)+'.';
  const who_am_i = me
    ? 'I am '+me+(S.course&&S.course.trim()?', a student of '+S.course.trim():'')+
      (S.roll&&S.roll.trim()?' (Roll no. '+S.roll.trim()+')':'')+'. '
    : '';
  L.push(who_am_i+intro);
  L.push('');

  if(r && r.total)
    L.push('I understand this will mean missing '+r.total+' class'+
      (r.total===1?'':'es')+(r.rows.length>1?' across '+r.rows.length+' subjects':'')+
      '. I will cover the syllabus taught in my absence and submit any work due on time.');
  else
    L.push('I will cover any work taught in my absence and submit it on time.');
  if(K.note) L.push(K.note);
  L.push('');
  L.push('I request you to kindly grant me leave for the above period and to consider '+
         'the same while computing my attendance.');
  L.push('');
  L.push('Thanking you,');
  L.push('Yours sincerely,');
  if(me) L.push(me);
  if(S.course && S.course.trim())
    L.push(S.course.trim()+(S.roll&&S.roll.trim()?' · Roll no. '+S.roll.trim():''));
  else if(S.roll && S.roll.trim()) L.push('Roll no. '+S.roll.trim());
  L.push(fmtLong(todayISO()));
  return L.join('\n');
}

  const bind=()=>{
    const redraw=()=>{ $('#sheetBody').innerHTML=leaveAppHTML(from,to); bind(); };
    $$('#sheetBody [data-lk]').forEach(b=>b.onclick=()=>{ lvKind=b.dataset.lk; redraw(); });

    if(w) w.onchange=e=>{ lvTo=e.target.value; redraw(); };

const DL_BASE=['assignment','internal','exam','other'];
const dlTypes=()=>[...new Set([...DL_BASE,...S.cats,...S.dls.map(d=>d.type).filter(Boolean)])];
let dueFilter='open';

function whenHTML(d){
  if(d.done){
    const tag=leadTag(leadHours(d));
    return '<span class="when calm">'+(tag?esc(tag.t):'Done')+'</span>';
  }
  const n=daysTo(d.date);
  if(n<0)  return '<span class="when late">'+Math.abs(n)+'d late</span>';
  if(n===0)return '<span class="when late">Today</span>';
  if(n===1)return '<span class="when near">Tomorrow</span>';
  if(n<=6) return '<span class="when near">'+n+' days</span>';
  return '<span class="when calm">'+dateOf(d.date).toLocaleDateString(undefined,{day:'numeric',month:'short'})+'</span>';
}
function dueRowHTML(d){
  const sub=subById(d.subId);
  return '<div class="row dlRow'+(d.done?' done':'')+'" data-dl="'+d.id+'">'+
    '<button class="dlChk'+(d.done?' on':'')+'" data-tick="'+d.id+'">✓</button>'+
    '<button class="rMain tap" data-open="'+d.id+'" style="background:none;text-align:left;padding:0">'+
      '<div class="rT">'+esc(d.title)+'</div>'+
      '<div class="rS">'+(sub?'<span class="subChip '+scCls(sub)+'">'+esc(sub.code)+'</span> ':'')+
        esc(d.type||'other')+'</div></button>'+
    whenHTML(d)+'</div>';
}
function bindDueRows(root){
  (root||document).querySelectorAll('[data-tick]').forEach(b=>b.onclick=e=>{
    e.stopPropagation();
    const d=S.dls.find(x=>x.id===b.dataset.tick); if(!d) return;
    d.done=!d.done;
    if(d.done){ d.doneAt=Date.now(); const t=leadTag(leadHours(d));
      toast(t? T('Completed.','Done.',t.t+' — nice.',t.t+'.') : 'Done.');
    } else delete d.doneAt;
    save(); renderAll();
  });
  (root||document).querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{
    const d=S.dls.find(x=>x.id===b.dataset.open); if(d) sheetDeadline(d);
  });
}
function renderDue(){
  const f=[['open','To do'],['all','All'],['done','Done']];
  $('#dueFilter').innerHTML='<div class="seg">'+f.map(x=>
    '<button data-f="'+x[0]+'"'+(dueFilter===x[0]?' class="on"':'')+'>'+x[1]+'</button>').join('')+'</div>';
  $$('#dueFilter button').forEach(b=>b.onclick=()=>{ dueFilter=b.dataset.f; renderDue(); });

  let list=S.dls.slice();
  if(dueFilter==='open') list=list.filter(d=>!d.done);
  if(dueFilter==='done') list=list.filter(d=>d.done);
  list.sort((a,b)=>(a.done-b.done)||a.date.localeCompare(b.date));

  if(!list.length){
    $('#dueList').innerHTML='<div class="empty"><div class="eE">'+(dueFilter==='done'?'📦':'✅')+'</div>'+
      '<div class="eT">'+(dueFilter==='done'?'Nothing finished yet':
        T('No items','Nothing due','All clear','Nothing due. Suspicious.'))+'</div>'+
      '<div class="eS">'+(dueFilter==='done'?'Tick something off and it lands here.':
        'Tap + at the top to add an assignment, internal or exam.')+'</div>'+
      '<div style="height:16px"></div><button class="btn ghost sm" id="dueAdd" style="max-width:220px;margin:0 auto">Add a deadline</button></div>';
    $('#dueAdd').onclick=()=>sheetDeadline(null);
    renderProc(); return;
  }
  /* group */
  const groups=[['Overdue',d=>!d.done&&daysTo(d.date)<0],
                ['Today',  d=>!d.done&&daysTo(d.date)===0],
                ['This week',d=>!d.done&&daysTo(d.date)>0&&daysTo(d.date)<=7],
                ['Later',  d=>!d.done&&daysTo(d.date)>7],
                ['Done',   d=>d.done]];
  let h='';
  groups.forEach(([name,fn])=>{
    const g=list.filter(fn); if(!g.length) return;
    h+='<div class="gHead">'+name+' · '+g.length+'</div><div class="pad"><div class="list">'+
      g.map(dueRowHTML).join('')+'</div></div>';
  });
  $('#dueList').innerHTML=h;
  bindDueRows($('#dueList'));
  renderProc();
}
