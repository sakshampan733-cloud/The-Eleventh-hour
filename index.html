let appealSel={};
function sheetAppealPick(){
  const withAbs=S.subs.map(s=>({sub:s,n:absencesFor(s.id).length}))
    .filter(x=>x.n>0).sort((a,b)=>b.n-a.n);
  if(!withAbs.length) return openSheet({title:'Appeal',
    body:'<div class="empty"><div class="t">No absences on record</div>'+
      '<div class="s">Nothing to appeal.</div></div>'});
  openSheet({title:'Attendance appeal',
    body:'<div class="intro">Pick the subject you want to appeal for.</div>'+
      withAbs.map(x=>'<button class="item" data-ap="'+x.sub.id+'"><div class="grow">'+
        '<div class="lead">'+esc(x.sub.name)+'</div><div class="sub">'+x.n+
        ' absences on record</div></div><span class="chev">→</span></button>').join(''),
    after(){ onAll('#panelBody [data-ap]',n=>sheetAppeal(subById(n.dataset.ap))); }});
}
function sheetAppeal(sub){
  appealSel={};
  const draw=()=>{
    const abs=absencesFor(sub.id);
    const picked=abs.filter(a=>appealSel[a.key]);
    let b='<div class="intro">Tick the classes you have a reason for. The message writes itself '+
      'from what you pick.</div>'+
      '<div class="field-row"><span class="lab">Reason</span><span class="in">'+
      '<input type="text" id="apReason" placeholder="medical, family" value="'+
      esc(appealSel.__reason||'')+'"></span></div>';
    abs.forEach(a=>{
      const onq=!!appealSel[a.key];
      b+='<button class="item" data-k="'+a.key+'"><span class="time">'+fmtT(a.slot.start)+
        '</span><div class="grow"><div class="lead"'+(onq?'':' style="color:var(--ink-3)"')+'>'+
        dateOf(a.iso).toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'})+
        '</div><div class="sub">'+esc(sub.code)+'</div></div>'+
        '<span class="val cap">'+(onq?'included':'—')+'</span></button>';
    });
    b+='<div style="margin-top:26px">'+pill('Write the message','apMake','sm wide')+'</div>';
    el('panelBody').innerHTML=b;
    onAll('#panelBody [data-k]',n=>{
      const k=n.dataset.k;
      appealSel.__reason=(el('apReason')||{}).value||appealSel.__reason||'';
      if(appealSel[k]) delete appealSel[k]; else appealSel[k]=true; draw();
    });
    const r=el('apReason'); if(r) r.oninput=e=>appealSel.__reason=e.target.value;
    on('apMake',()=>{
      const p=absencesFor(sub.id).filter(a=>appealSel[a.key]);
      if(!p.length) return toast('Pick at least one class first.','bad');
      const msg=appealMessage(sub,p,(el('apReason')||{}).value||'');
      openSheet({title:'Message',
        body:'<div class="intro">Copy this and send it however you reach your professor.</div>'+
          '<div class="body" style="white-space:pre-wrap;color:var(--ink)">'+esc(msg)+'</div>'+
          '<div style="margin-top:24px">'+pill('Copy message','apCopy','sm wide')+'</div>',
        after(){ on('apCopy',()=>copy(msg)); }});
    });
  };
  openSheet({title:'Appeal · '+sub.code, body:'', after:draw});
}

/* ── boot ───────────────────────────────────────────────────────────────── */
const APP_VERSION='3.0';
applyTheme(); drawIcons();
if(!TABS.some(t=>t.id===S.tab) && S.tab!=='settings') S.tab='home';
try{ document.body.dataset.tab=S.tab; }catch(e){}
document.querySelectorAll('main section').forEach(s=>s.classList.toggle('on',s.id===S.tab));
{ const sec=document.getElementById(S.tab);
  if(sec){ sec.classList.add('enter');
           sec._enterT=setTimeout(()=>sec.classList.remove('enter'),1200); } }
renderTabs(); renderAll(); reveal(true);
el('panelCancel').onclick=closeSheet;
el('cmdOpen').onclick=cmdOpen;
el('cmdScrim').onclick=cmdClose;
el('cmdInput').oninput=()=>{ cmdSel=0; cmdDraw(); };
addEventListener('keydown',e=>{
  const k=e.key;
  if((e.metaKey||e.ctrlKey) && k.toLowerCase()==='k'){ e.preventDefault();
    cmdIsOpen()?cmdClose():cmdOpen(); return; }
  if(cmdIsOpen()){
    if(k==='Escape'){ e.preventDefault(); cmdClose(); }
    else if(k==='ArrowDown'){ e.preventDefault(); cmdSel=Math.min(cmdItems.length-1,cmdSel+1); cmdDraw(); }
    else if(k==='ArrowUp'){ e.preventDefault(); cmdSel=Math.max(0,cmdSel-1); cmdDraw(); }
    else if(k==='Enter'){ e.preventDefault(); cmdRun(cmdSel); }
    return;
  }
  const typing=/^(INPUT|TEXTAREA|SELECT)$/.test((e.target&&e.target.tagName)||'');
  if(typing) return;
  if(k==='Escape'){ if(el('panel').classList.contains('on')) closeSheet(); return; }
  /* the two surfaces, and the four views inside the second one */
  if(k==='1'){ showTab('home'); }
  else if(k==='2'){ showTab('term'); }
  else if(k==='/'){ e.preventDefault(); cmdOpen(); }
});
el('panelDone').onclick=()=>{ if(panelSave && panelSave()!==false) closeSheet(); };
el('scrim').onclick=closeSheet;
addEventListener('scroll',()=>{
  const t=el('top'); if(t) t.classList.toggle('solid',(window.scrollY||0)>10);
},{passive:true});
